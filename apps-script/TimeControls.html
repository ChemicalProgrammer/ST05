<script>
/* Shared, accessible time-value control. Store durations in seconds; only the view unit changes. */
window.STTimeControls=(function(){
  'use strict';
  var secondsByUnit={s:1,min:60,h:3600,d:86400,wk:604800};
  var labels={s:'Seconds',min:'Minutes',h:'Hours',d:'Days',wk:'Weeks'};
  var formatter=new Intl.NumberFormat(undefined,{maximumFractionDigits:3});
  var animations=new WeakMap(),inputChanges=new WeakMap(),menu=null,menuId=0,skipClick=null;
  function reducedMotion(){return window.matchMedia?.('(prefers-reduced-motion: reduce)').matches===true;}
  function animate(node,frames,duration){
    if(!node)return;
    animations.get(node)?.cancel();
    if(!node.animate||reducedMotion()||!node.isConnected)return;
    var animation=node.animate(frames,{duration:duration||180,easing:'cubic-bezier(.2,.8,.2,1)'});
    animations.set(node,animation);
    animation.onfinish=animation.oncancel=function(){if(animations.get(node)===animation)animations.delete(node);};
  }
  function width(node){return node?.getBoundingClientRect().width||0;}
  function outputChange(node,oldWidth){
    var value=node.querySelector('b'),newWidth=width(value);
    if(!oldWidth||!newWidth)return;
    var start={opacity:.55,transform:'translateY(1px)'},end={opacity:1,transform:'translateY(0)'};
    // Live counters retain their horizon reservation; only the deliberate unit
    // change fades. Generic outputs also ease their changing numeric width.
    if(node.dataset.variant!=='metric'){start.width=oldWidth+'px';end.width=newWidth+'px';}
    animate(value,[start,end]);
  }
  function prepareSelect(select){
    select.setAttribute('aria-haspopup','listbox');
    if(!select.hasAttribute('aria-expanded'))select.setAttribute('aria-expanded','false');
  }
  function number(value){
    if(!Number.isFinite(value))return '—';
    return formatter.format(Number(value.toPrecision(9)));
  }
  function unitSelect(unit,description){
    var select=document.createElement('select');
    select.className='st-time-unit';
    select.setAttribute('aria-label',description||'Select time unit');
    select.title=description||'Select time unit';
    Object.keys(secondsByUnit).forEach(function(key){
      var option=document.createElement('option');option.value=key;option.textContent=key;option.title=labels[key];select.append(option);
    });
    select.value=secondsByUnit[unit]?unit:'min';
    prepareSelect(select);
    return select;
  }
  function applyAppearance(wrapper,opts){
    opts=opts||{};
    var value=wrapper.querySelector('b'),unit=wrapper.querySelector('.st-time-unit');
    if(opts.variant)wrapper.dataset.variant=opts.variant;
    if(opts.className)opts.className.split(/\s+/).filter(Boolean).forEach(function(cls){wrapper.classList.add(cls);});
    if(value&&opts.valueClass)value.classList.add(opts.valueClass);
    if(unit&&opts.unitClass)unit.classList.add(opts.unitClass);
    if(opts.gap!==undefined)wrapper.style.gap=typeof opts.gap==='number'?opts.gap+'px':String(opts.gap);
    if(value&&opts.valueFontSize)value.style.fontSize=String(opts.valueFontSize);
    if(unit&&opts.unitFontSize)unit.style.fontSize=String(opts.unitFontSize);
    if(value&&opts.valueWeight)value.style.fontWeight=String(opts.valueWeight);
    if(unit&&opts.unitColor)unit.style.color=String(opts.unitColor);
    if(opts.variant==='metric'){
      // Reserve the counter's full run horizon before playback starts. A
      // changing number of decimal digits must not steal space from its label.
      var horizon=Number(opts.reserveSeconds);
      horizon=Number.isFinite(horizon)?Math.max(86400,horizon):86400;
      var places=Math.max(10,formatter.format(Math.ceil(horizon)).length+4);
      wrapper.style.setProperty('--st-time-value-width',places+'ch');
    }
  }
  function output(seconds,opts){
    opts=opts||{};
    var wrapper=document.createElement('span');
    wrapper.className='st-time-output time-output-value';
    var value=document.createElement('b'),unit=unitSelect(opts.unit||'min',opts.label||'Change displayed time unit');
    wrapper.dataset.seconds=String(seconds);
    wrapper.append(value,unit);
    applyAppearance(wrapper,opts);
    wrapper._stAppearance=[opts?.variant||'',opts?.className||'',opts?.valueClass||'',opts?.unitClass||'',
      opts?.gap??'',opts?.valueFontSize||'',opts?.unitFontSize||'',opts?.valueWeight||'',opts?.unitColor||'',opts?.reserveSeconds??''].join('|');
    function refresh(){
      var seconds=Number(wrapper.dataset.seconds);
      wrapper.dataset.unit=unit.value;
      value.textContent=Number.isFinite(seconds)?number(seconds/secondsByUnit[unit.value]):'—';
    }
    unit.addEventListener('change',function(){
      var scope=opts.scope||wrapper;
      var nodes=Array.from(scope.querySelectorAll('.st-time-output'));
      if(!nodes.includes(wrapper))nodes.unshift(wrapper);
      var previous=nodes.filter(function(node){return node.dataset.unit!==unit.value;})
        .map(function(node){var value=node.querySelector('b'),oldWidth=width(value);animations.get(value)?.cancel();return {node:node,width:oldWidth};});
      refresh();
      scope.querySelectorAll('.st-time-output').forEach(function(node){
        var otherUnit=node.querySelector('.st-time-unit');
        if(otherUnit){otherUnit.value=unit.value;node.dataset.unit=unit.value;var b=node.querySelector('b');
          if(b){var seconds=Number(node.dataset.seconds);b.textContent=Number.isFinite(seconds)?number(seconds/secondsByUnit[unit.value]):'—';}
        }
      });
      previous.forEach(function(entry){outputChange(entry.node,entry.width);});
    });
    refresh();
    return wrapper;
  }
  function setOutput(container,seconds,opts){
    if(!container)return;
    var current=container.querySelector('.st-time-output');
    if(!current){container.replaceChildren(output(seconds,opts));return;}
    var raw=String(seconds);
    var unchanged=current.dataset.seconds===raw;
    // Appearance options are normally constant for a mounted control.
    // Apply them only when the caller changes the requested style.
    var appearance=[opts?.variant||'',opts?.className||'',opts?.valueClass||'',opts?.unitClass||'',
      opts?.gap??'',opts?.valueFontSize||'',opts?.unitFontSize||'',opts?.valueWeight||'',opts?.unitColor||'',opts?.reserveSeconds??''].join('|');
    if(current._stAppearance!==appearance){
      applyAppearance(current,opts);
      current._stAppearance=appearance;
    }
    if(unchanged)return;
    current.dataset.seconds=raw;
    var unit=current.querySelector('.st-time-unit'),value=current.querySelector('b');
    if(unit&&value){
      var displayed=Number.isFinite(Number(seconds))?number(Number(seconds)/secondsByUnit[unit.value]):'—';
      if(value.textContent!==displayed)value.textContent=displayed;
    }
  }
  // Input widgets are different from outputs: selecting a unit never edits
  // the user's number. Only the model's seconds value is recalculated.
  var inputFactors={SECONDS:1,MINUTES:60,HOURS:3600,DAYS:86400,WEEKS:604800};
  function inputSeconds(value,unit){
    return Number(value)*(inputFactors[unit]||1);
  }
  function inputValue(seconds,unit){
    return Number(seconds)/(inputFactors[unit]||1);
  }
  // A hidden text mirror sizes the unit column intrinsically; the input fills
  // the rest. Keep native controls and values intact, including on restoration.
  function syncInput(wrapper){
    var input=wrapper.querySelector(':scope > input[type=number]');
    var select=wrapper.querySelector(':scope > select');
    if(!input||!select)return;
    prepareSelect(select);
    var mirror=wrapper.querySelector(':scope > .time-input-unit-measure');
    if(!mirror){
      mirror=document.createElement('span');mirror.className='time-input-unit-measure';
      mirror.setAttribute('aria-hidden','true');mirror.setAttribute('data-st-no-translate','');
      wrapper.append(mirror);
      wrapper.classList.add('time-value-control--fitted-unit');
    }
    var label=select.selectedOptions[0]?.label||'';
    if(mirror.textContent!==label){animations.get(wrapper)?.cancel();mirror.textContent=label;}
  }
  function syncInputs(root){
    root=root||document;
    if(root.matches?.('.time-value-control'))syncInput(root);
    root.querySelectorAll('.time-value-control > select').forEach(function(select){syncInput(select.parentElement);});
  }
  function unitControl(target){
    return target?.matches?.('.time-value-control > select,.st-time-output > select.st-time-unit')?target:null;
  }
  function translate(text){return window.STLanguage?.translate(text)??text;}
  function closeMenu(restoreFocus){
    if(!menu)return;
    var current=menu;menu=null;
    current.select.setAttribute('aria-expanded','false');
    current.select.removeAttribute('aria-controls');current.select.removeAttribute('aria-activedescendant');
    animations.get(current.node)?.cancel();
    current.node.remove();
    if(restoreFocus&&current.select.isConnected&&!current.select.disabled)current.select.focus({preventScroll:true});
  }
  function highlight(index){
    if(!menu)return;
    menu.index=index;
    menu.rows.forEach(function(row,i){row.classList.toggle('is-active',i===index);});
    var row=menu.rows[index];
    if(row){menu.select.setAttribute('aria-activedescendant',row.id);row.scrollIntoView?.({block:'nearest'});}
  }
  function moveHighlight(direction,edge){
    if(!menu)return;
    var count=menu.rows.length,index=edge==='start'?-1:edge==='end'?count:menu.index;
    for(var n=0;n<count;n++){
      index=(index+direction+count)%count;
      if(!menu.options[index].disabled){highlight(index);return;}
    }
  }
  function choose(index){
    if(!menu)return;
    var select=menu.select,option=menu.options[index];
    if(!option||option.disabled||select.disabled||!select.isConnected){closeMenu(false);return;}
    var changed=select.value!==option.value;
    closeMenu(true);
    if(changed){select.value=option.value;select.dispatchEvent(new Event('change',{bubbles:true}));}
  }
  function openMenu(select){
    if(select.disabled||!select.isConnected)return;
    closeMenu(false);prepareSelect(select);
    select.focus({preventScroll:true});
    var node=document.createElement('div');node.className='st-unit-menu';node.id='st-unit-menu-'+(++menuId);
    node.setAttribute('role','listbox');node.setAttribute('aria-label',select.getAttribute('aria-label')||translate('Unit'));
    node.setAttribute('data-st-no-translate','');
    var options=Array.from(select.options),rows=[];
    options.forEach(function(option,index){
      var row=document.createElement('div');row.className='st-unit-menu-option';row.id=node.id+'-'+index;
      row.setAttribute('role','option');row.setAttribute('aria-selected',String(option.selected));
      if(option.disabled)row.setAttribute('aria-disabled','true');
      // Las opciones presentan sólo la abreviatura; se conserva el selector accesible.
      var short=document.createElement('span'),check=document.createElement('span');
      short.className='st-unit-menu-abbreviation';short.textContent=option.label;
      check.className='st-unit-menu-check';check.textContent=option.selected?'✓':'';check.setAttribute('aria-hidden','true');
      row.append(short,check);
      row.addEventListener('pointerdown',function(event){event.preventDefault();});
      row.addEventListener('pointermove',function(){if(!option.disabled)highlight(index);});
      row.addEventListener('click',function(){choose(index);});
      node.append(row);rows.push(row);
    });
    if(!rows.length)return;
    menu={node:node,select:select,options:options,rows:rows,index:Math.max(0,select.selectedIndex)};
    (select.closest('dialog[open]')||document.body).append(node);
    // A top-layer popover also clears card overflow and modal stacking. Older
    // browsers use the same fixed-position menu inside the owning dialog.
    if(node.showPopover){node.setAttribute('popover','manual');try{node.showPopover();}catch(error){node.removeAttribute('popover');}}
    var anchor=select.getBoundingClientRect(),viewport=window.visualViewport;
    var left=viewport?.offsetLeft||0,top=viewport?.offsetTop||0;
    var availableWidth=viewport?.width||window.innerWidth,availableHeight=viewport?.height||window.innerHeight;
    var menuWidth=Math.min(Math.max(104,anchor.width||0),Math.max(1,availableWidth-16));
    node.style.width=menuWidth+'px';node.style.maxHeight=Math.max(1,availableHeight-16)+'px';
    var menuHeight=node.getBoundingClientRect().height||Math.min(options.length*36+12,availableHeight-16);
    node.style.left=Math.max(left+8,Math.min(anchor.right-menuWidth,left+availableWidth-menuWidth-8))+'px';
    node.style.top=Math.max(top+8,Math.min(anchor.bottom+6+menuHeight<=top+availableHeight-8?anchor.bottom+6:anchor.top-menuHeight-6,top+availableHeight-menuHeight-8))+'px';
    select.setAttribute('aria-expanded','true');select.setAttribute('aria-controls',node.id);
    highlight(menu.index);
    animate(node,[{opacity:0,transform:'translateY(-2px)'},{opacity:1,transform:'translateY(0)'}],120);
  }
  if(typeof document!=='undefined'){
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){syncInputs();},{once:true});
    else syncInputs();
    // Capture before application listeners restore/sync controls. This is the
    // only geometry read on unit inputs: ordinary live updates do not animate.
    document.addEventListener('change',function(event){
      var select=event.target;
      if(!select.matches?.('.time-value-control > select'))return;
      var wrapper=select.parentElement,mirror=wrapper.querySelector('.time-input-unit-measure');
      if(mirror&&mirror.textContent!==select.selectedOptions[0]?.label){
        if(!reducedMotion())inputChanges.set(select,{value:width(wrapper.querySelector('input')),unit:width(mirror)});
        animations.get(wrapper)?.cancel();
      }
    },true);
    document.addEventListener('change',function(event){
      var select=event.target;
      if(!select.matches?.('.time-value-control > select'))return;
      var wrapper=select.parentElement,previous=inputChanges.get(select);inputChanges.delete(select);
      syncInput(wrapper);
      if(previous){
        var next={value:width(wrapper.querySelector('input')),unit:width(wrapper.querySelector('.time-input-unit-measure'))};
        if(previous.value&&previous.unit&&next.value&&next.unit)animate(wrapper,[
          {gridTemplateColumns:previous.value+'px '+previous.unit+'px'},
          {gridTemplateColumns:next.value+'px '+next.unit+'px'}
        ]);
      }
    });
    document.addEventListener('pointerdown',function(event){
      if(event.button&&event.button!==0)return;
      if(menu?.node.contains(event.target))return;
      var select=unitControl(event.target);
      if(!select){closeMenu(false);return;}
      if(select.disabled){closeMenu(false);return;}
      event.preventDefault();select.focus({preventScroll:true});skipClick=select;
      if(menu?.select===select)closeMenu(false);else openMenu(select);
    },true);
    document.addEventListener('click',function(event){
      var select=unitControl(event.target);if(!select){skipClick=null;return;}
      event.preventDefault();
      if(skipClick===select){skipClick=null;return;}
      if(menu?.select===select)closeMenu(false);else openMenu(select);
    });
    document.addEventListener('keydown',function(event){
      var select=unitControl(event.target);if(!select)return;
      skipClick=null;
      if(select.disabled){if(menu?.select===select)closeMenu(false);return;}
      if(menu?.select===select){
        if(event.key==='Escape'){event.preventDefault();event.stopPropagation();closeMenu(true);}
        else if(event.key==='Tab')closeMenu(false);
        else if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();moveHighlight(event.key==='ArrowDown'?1:-1);}
        else if(event.key==='Home'||event.key==='End'){event.preventDefault();moveHighlight(event.key==='Home'?1:-1,event.key==='Home'?'start':'end');}
        else if(event.key==='Enter'||event.key===' '){event.preventDefault();choose(menu.index);}
        else if(event.key.length===1&&!event.ctrlKey&&!event.metaKey){
          event.preventDefault();var needle=event.key.toLocaleLowerCase();
          for(var i=1;i<=menu.rows.length;i++){
            var index=(menu.index+i)%menu.rows.length;
            var abbreviation=menu.options[index].label.toLocaleLowerCase();
            if(!menu.options[index].disabled&&abbreviation.startsWith(needle)){highlight(index);break;}
          }
        }
      }else if(['Enter',' ','ArrowDown','ArrowUp'].includes(event.key)&&!select.disabled){
        event.preventDefault();openMenu(select);
      }
    });
    document.addEventListener('pointercancel',function(){skipClick=null;closeMenu(false);});
    document.addEventListener('focusin',function(event){if(menu&&event.target!==menu.select&&!menu.node.contains(event.target))closeMenu(false);});
    document.addEventListener('scroll',function(event){if(menu&&!menu.node.contains(event.target))closeMenu(false);},true);
    window.addEventListener('resize',function(){closeMenu(false);});
    window.addEventListener('blur',function(){closeMenu(false);});
    window.addEventListener('st-language-change',function(){closeMenu(false);syncInputs();});
  }
  return {factors:secondsByUnit,inputFactors:inputFactors,inputSeconds:inputSeconds,
    inputValue:inputValue,syncInputs:syncInputs,output:output,setOutput:setOutput,unitSelect:unitSelect,format:number};
}());
</script>
