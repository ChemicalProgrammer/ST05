<style>
/* Shared header navigation; equipment presentation remains mode-specific. */
.app-shell.app-shell.case-open,.app-shell.app-shell.case-open.sidebar-collapsed { padding-left:0; }
#basic-section-row,#basic-navigation,#basic-case-actions,#basic-conveyor-layout { display:none; }
html[data-ui-mode=basic] .app-shell.case-open { padding-left:0; padding-right:0; }
#case-sidebar { display:none !important; }
/* Configuration and raw result JSON are advanced workspace tools. */
html:not([data-ui-mode=advance]) :is(#simulation-json-section,.raw-viewer:has(> #simulation-json-preview)) { display:none!important; }
/* The shared side panel still hosts the equipment inspector in both modes. */
html:not([data-ui-mode=advance]) :is(#toggle-gemini,#gemini-chat-view,#settings-tab-gemini,#settings-page-gemini) { display:none!important; }
html[data-ui-mode=basic] .app-shell.case-open.assistant-open { padding-right:0; }
.topbar { height:auto; min-height:var(--header-height); flex-wrap:wrap; padding-top:var(--space-3); padding-bottom:var(--space-3); }
#basic-section-row { display:flex; align-items:center; gap:var(--toolbar-gap); order:3; flex-basis:100%; min-width:0; }
#basic-navigation { display:flex; gap:var(--space-1); flex-wrap:wrap; flex:1; min-width:0; }
#basic-section-row > .header-case-actions { flex-shrink:0; margin-left:auto; }
#basic-case-actions { display:flex; align-items:center; }
/* Explanatory prose follows one rule in Basic and Advance. Subsection copy,
   live status and actionable errors remain part of their controls. */
html[data-ui-mode] :is(
  .chart-note,.eyebrow,.auth-note,.parameter-help,.format-zone-preview,
  .section-heading p,.editor-subheading p,.format-zone-heading p,
  .zone-caption,.zone-assumptions,.zone-audit-goals,
  .equipment-speed-chart-heading p,.simulation-analysis-heading p,
  .scenario-preview-context,
  #batch-dialog .dialog-body > p:first-child,
  #sheet-import-dialog .dialog-body > p:first-child,
  .settings-section > p,#editor-meta,#run-case-meta
):not(:is(.subsection-description,.subsection-playback-meta,
  .gemini-ai-policy-note,.format-guidance,[role=status],[role=alert],
  [aria-live],[data-error-notice],.error)) { display:none!important; }
html[data-ui-mode=basic] .notice,
html[data-ui-mode=basic] #status:not(.error),
html[data-equipment-layout=split] .equipment-filters { display:none!important; }
html[data-equipment-layout=split] #basic-conveyor-layout { display:block; }
html[data-equipment-layout=split] #basic-conveyor-panel { display:none; }
html[data-equipment-layout=split] .basic-machine { cursor:default; padding:var(--space-4); }
html[data-equipment-layout=split] .basic-machine .equipment-fields { display:block; }
html[data-equipment-layout=split] .basic-machine .equipment-grid { display:grid; }
html[data-equipment-layout=split][data-basic-view=conveyors] #basic-conveyor-layout { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,2fr); gap:var(--section-gap); align-items:start; }
html[data-equipment-layout=split][data-basic-view=conveyors] #basic-conveyor-panel { display:flex; flex-direction:column; min-width:0; border:var(--border-width) solid var(--line); border-radius:var(--radius-md); padding:var(--space-3); background:var(--surface); position:sticky; top:var(--space-4); }
html[data-equipment-layout=split] #basic-conveyor-panel { container-type:inline-size; }
html[data-equipment-layout=split] #basic-conveyor-panel #equipment-inspector { max-height:calc(100vh - var(--header-height) - var(--space-8)); }
html[data-equipment-layout=split] #basic-conveyor-panel h3 { margin:0 0 var(--space-3); }
html[data-ui-mode=basic][data-basic-view=vgraph] #results-body > :not(#line-performance),
html[data-ui-mode=basic][data-basic-view=vgraph] #line-performance > :not(#vgraph-profile) { display:none !important; }
html[data-ui-mode=basic][data-basic-view=vgraph] #line-performance { margin-top:0; border-top:0; }
html[data-equipment-layout=split][data-basic-view=conveyors] { scrollbar-gutter:stable; }
html[data-equipment-layout=split] #equipment-list .equipment-header .button-row { flex-wrap:nowrap; gap:var(--toolbar-gap); }
#equipment-list .equipment-header .icon-button { --icon-button-size:var(--size-28); }
/* Keep the setup controls on one compact row and use identical field tracks. */
.topbar { padding-top:var(--space-2); padding-bottom:var(--space-2); }
.case-open .user-chip { display:none; }
.case-open .breadcrumb { flex:1 1 var(--size-220); }
html[data-ui-mode=basic] #equipment-list { gap:var(--space-3); margin-top:0; }
html[data-equipment-layout=split] #basic-conveyor-layout { margin-top:var(--space-3); }
html[data-equipment-layout=split] .basic-machine { padding:var(--space-3); }
html[data-equipment-layout=split] .basic-machine .equipment-header { gap:var(--space-2); margin-bottom:var(--space-2); }
html[data-equipment-layout=split] .basic-machine .equipment-header strong { overflow-wrap:anywhere; min-width:0; }
html[data-equipment-layout=split] .basic-machine .equipment-grid { gap:var(--space-2); align-items:start; }
html[data-equipment-layout=split] .equipment-grid label { min-width:0; }
html[data-equipment-layout=split] .basic-machine .equipment-grid label:not(.st-checkbox-card) { grid-template-rows:minmax(var(--size-28),auto) var(--control-height); gap:var(--space-1); align-items:end; }
html[data-equipment-layout=split] .equipment-grid input:not([type=checkbox]),
html[data-equipment-layout=split] .equipment-grid select { height:var(--control-height); box-sizing:border-box; }
html[data-equipment-layout=split] #equipment-inspector label { padding-right:0; }
@media(max-width:760px){
  html[data-ui-mode=basic] #editor-panel > .section-heading { flex-wrap:wrap; }
  html[data-equipment-layout=split][data-basic-view=conveyors] #basic-conveyor-layout { grid-template-columns:1fr; }
  html[data-equipment-layout=split][data-basic-view=conveyors] #basic-conveyor-panel { position:static; }
  html[data-equipment-layout=split] #basic-conveyor-panel #equipment-inspector { max-height:none; }

}
@media(max-width:1100px){
 html[data-ui-mode=basic] .app-shell.case-open.assistant-open { padding-right:0; }
 html[data-ui-mode=basic] .gemini-panel { width:min(var(--assistant-width),calc(100% - var(--space-6))); }
}

#basic-efficiencies,#basic-start-simulation,.basic-card-data,.basic-conveyor-tabs,#basic-conveyor-summary { display:none; }
html[data-equipment-layout=split] .equipment-grid input,
html[data-ui-mode=basic] .reliability-controls input { width:100%; min-width:0; }

html[data-equipment-layout=split] .basic-machine .equipment-grid:not(.reliability-controls) > label:not(:has(> .equipment-type, > .equipment-name, > .equipment-rate, > .equipment-material-flow, > .equipment-internal-capacity, > .equipment-pacemaker)),

html[data-equipment-layout=split] .basic-machine .reliability-controls { grid-template-columns:1fr; gap:var(--space-3); }
html[data-equipment-layout=split] .basic-machine .reliability-controls { margin-block:var(--space-3) 0; }
html[data-equipment-layout=split] .basic-card-data { display:grid; gap:var(--space-3); margin-top:var(--space-3); }
html[data-equipment-layout=split] .basic-buffer { display:block; text-align:right; padding:var(--space-2); min-height:var(--control-height); box-sizing:border-box; border:var(--border-width) solid var(--line-strong); border-radius:var(--radius-sm); color:var(--accent); }
html[data-equipment-layout=split] .basic-availability { color:var(--accent); }
html[data-ui-mode=basic] #basic-efficiencies { display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3); }
html[data-ui-mode=basic] #basic-efficiencies > div { border:var(--border-width) solid var(--line); border-radius:var(--radius-md); padding:var(--space-3); flex-direction:column; align-items:start; }
html[data-ui-mode=basic][data-basic-view=conveyors] #basic-efficiencies { display:none; }
html[data-equipment-layout=split][data-basic-view=conveyors] #equipment-list { display:grid; grid-template-columns:minmax(0,1fr); }

html:is([data-ui-mode=basic],[data-equipment-layout=split]) .basic-metric { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); }
html[data-equipment-layout=split] .basic-conveyor-tabs { display:flex; justify-content:flex-end; margin-bottom:var(--space-3); }
html[data-equipment-layout=split] #basic-conveyor-summary {
 display:grid; grid-template-columns:minmax(0,1fr); gap:var(--space-3);
 padding:var(--space-1);
}
html[data-equipment-layout=split] #basic-conveyor-panel .equipment-grid:not(.reliability-controls) > label:not(:has(> .equipment-type, > .equipment-name, > .equipment-material-flow)),
html[data-equipment-layout=split] #basic-conveyor-panel .reliability-controls { display:none; }
html[data-equipment-layout=split] .basic-conveyor-validation { grid-column:2; grid-row:2/5; }
html[data-ui-mode=basic][data-basic-view=results] #line-performance { display:none; }
html[data-ui-mode=basic] #simulation-event-home #control-events { display:none !important; }
@media(max-width:760px){
 html[data-equipment-layout=split] .basic-conveyor-validation { grid-column:1; grid-row:auto; }
}

html[data-equipment-layout=split] .basic-conveyor-worksheet {
 display:grid; grid-template-columns:minmax(0,1fr); gap:var(--field-gap); align-items:start;
}

 margin-block-start:var(--field-gap);
}
html[data-equipment-layout=split] #basic-conveyor-panel #equipment-inspector .equipment-fields > .equipment-grid:not(.reliability-controls) {
 gap:var(--field-gap);align-items:end;
}
html[data-equipment-layout=split] #basic-conveyor-panel #equipment-inspector .equipment-grid > label:not(.st-checkbox-card) {
 margin:0;padding:0;gap:var(--space-2);min-width:0;
}
html[data-equipment-layout=split] :is(.basic-worksheet-group,.basic-conveyor-result-column) {
 display:grid; gap:var(--space-3); min-width:0; margin:0;
 padding:var(--space-3); border:var(--border-width) solid var(--line);
 border-radius:var(--radius-md); background:var(--surface);
}
html[data-equipment-layout=split] .basic-worksheet-group {
 grid-template-columns:minmax(0,1fr);gap:var(--field-gap);align-items:end;
}
html[data-equipment-layout=split] .basic-worksheet-group h4 { grid-column:1/-1; margin:0;align-self:start; }

 display:grid;grid-template-rows:auto var(--control-height);align-content:end;gap:var(--space-2);
 min-width:0;margin:0;padding:0;align-self:end;
}
html[data-equipment-layout=split] #basic-conveyor-panel .basic-worksheet-group > label > :is(input:not([type=checkbox]),select,output,.switchable-value) {
 width:100%;min-width:0;height:var(--control-height);min-height:var(--control-height);box-sizing:border-box;margin:0;
}
html[data-equipment-layout=split] #basic-conveyor-panel .basic-worksheet-group .switchable-value {align-items:center;}
html[data-equipment-layout=split] #basic-conveyor-panel .basic-worksheet-group .switchable-value > input[type=number] {
 width:0;flex:1 1 0;min-width:0;box-sizing:border-box;
}
html[data-equipment-layout=split] .basic-worksheet-group :is(input:not([type=checkbox]),select) {
 width:100%; min-width:0; min-height:var(--control-height);
}
html[data-equipment-layout=split] .basic-worksheet-group input[type=number] { text-align:right; font-variant-numeric:tabular-nums; }
html[data-equipment-layout=split] :is(.basic-worksheet-group output,.basic-worksheet-group .switchable-value > input.calculated-value,.basic-conveyor-result-column .basic-metric > strong) {
 display:flex; align-items:center; justify-content:flex-end; min-width:0; min-height:var(--control-height);
 padding:var(--space-2) var(--space-3); border:var(--border-width) solid var(--line);
 border-radius:var(--radius-sm); background:transparent; border-color:transparent; color:var(--ink); text-align:right;
 font-size:var(--font-input); font-weight:var(--weight-semibold); font-variant-numeric:tabular-nums; box-shadow:none;
}
html[data-equipment-layout=split] .basic-worksheet-group .switchable-value > input.calculated-value { display:block; }
@container (min-width:25rem) {
 html[data-equipment-layout=split] .basic-worksheet-group { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@container (min-width:35rem) {
 html[data-equipment-layout=split] #basic-conveyor-summary { grid-template-columns:repeat(2,minmax(0,1fr)); align-items:start; }
}
@container (min-width:55rem) {
 html[data-equipment-layout=split] .basic-conveyor-worksheet { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
html[data-equipment-layout=split] .basic-worksheet-group input.calculated-value { appearance:textfield; -moz-appearance:textfield; }
html[data-equipment-layout=split] .basic-worksheet-group input.calculated-value::-webkit-inner-spin-button,
html[data-equipment-layout=split] .basic-worksheet-group input.calculated-value::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
html[data-equipment-layout=split] #basic-conveyor-panel .format-zone-heading,
html[data-equipment-layout=split] #basic-conveyor-panel .format-zone-setup > .format-zone-grid { display:none !important; }
html[data-equipment-layout=split] .basic-conveyor-result-column .basic-metric {
 display:grid; grid-template-columns:minmax(0,1fr) minmax(0,9rem);
}
html[data-equipment-layout=split] .basic-conveyor-result-column :is(.basic-metric > span,.basic-population) {
 color:var(--muted); font-size:var(--font-secondary); font-weight:var(--weight-medium);
}
html[data-equipment-layout=split] .basic-conveyor-result-column .basic-metric > strong { overflow-wrap:anywhere; }
html[data-equipment-layout=split] .basic-conveyor-result-column .basic-metric[data-status=PASS] strong { color:var(--success); }
html[data-equipment-layout=split] .basic-conveyor-result-column .basic-metric[data-status=FAIL] strong { color:var(--danger); }
html[data-equipment-layout=split] .basic-population { display:grid; gap:var(--space-2); }
html[data-equipment-layout=split] .basic-population progress { width:100%; accent-color:var(--accent); }
/* Basic machine fields stay visible independently of card collapse state. */
html[data-equipment-layout=split] .basic-machine .reliability-controls { display:grid; }
html[data-equipment-layout=split] .basic-machine .reliability-controls input { height:var(--control-height); box-sizing:border-box; }
html[data-equipment-layout=split] .basic-machine .equipment-header { border-bottom:var(--border-width) solid var(--line); padding-bottom:var(--space-3); margin-bottom:var(--space-3); }
html[data-equipment-layout=split] .basic-machine .equipment-header strong { color:var(--accent); }
html[data-ui-mode=basic] #run-config,
html[data-ui-mode=basic] .live-equipment-controls,
html[data-ui-mode=basic] .live-equipment-columns > :last-child { display:none !important; }
html[data-ui-mode=basic] .live-equipment-columns,
html[data-ui-mode=basic] .live-equipment-card__row { grid-template-columns:minmax(0,1.15fr) minmax(0,.92fr) minmax(0,.65fr) minmax(0,2fr); }
html[data-ui-mode=basic] .live-equipment-columns > :nth-child(4) { display:none; }
html[data-ui-mode=basic] .live-speed-cell { grid-column:4; grid-row:auto; align-self:stretch; display:flex; flex-direction:column; justify-content:center; }
html[data-ui-mode=basic] .live-speed-cell .equipment-speed-sparkline { flex:none; height:var(--basic-spark-height); min-height:var(--basic-spark-height); max-height:var(--basic-spark-height); box-sizing:border-box; }
@media(max-width:1260px){
 html[data-ui-mode=basic] .live-equipment-card__row { grid-template-columns:repeat(2,minmax(0,1fr)); }
 html[data-ui-mode=basic] .live-equipment-flow,
 html[data-ui-mode=basic] .live-speed-cell { grid-column:1 / -1; grid-row:auto; }
}
@container(max-width:900px){
 html[data-ui-mode=basic] .live-equipment-columns { display:none; }
 html[data-ui-mode=basic] .live-equipment-card__row { grid-template-columns:repeat(2,minmax(0,1fr)); }
 html[data-ui-mode=basic] .live-equipment-flow,
 html[data-ui-mode=basic] .live-speed-cell { grid-column:1 / -1; grid-row:auto; }
}
@media(max-width:760px){html[data-ui-mode=basic] .live-equipment-card__row { grid-template-columns:1fr; }}
html[data-ui-mode=basic][data-basic-view=results] #batch-results,
html[data-ui-mode=basic][data-basic-view=results] #results-table,
html[data-ui-mode=basic][data-basic-view=results] #results-reference,
html[data-ui-mode=basic][data-basic-view=results] #results-history-group { display:none !important; }
html[data-ui-mode=basic] .scenario-change > details,
html[data-ui-mode=basic] .analysis-recommendation > .analysis-checks { display:none; }
html[data-equipment-layout=split] .basic-conveyor-heading { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); flex-wrap:wrap; margin-bottom:var(--space-3); }
html[data-equipment-layout=split] .basic-conveyor-heading h3 { margin:0 !important; flex:1; min-width:120px; }
html[data-equipment-layout=split] .basic-conveyor-heading .basic-conveyor-tabs { margin:0; flex-shrink:0; }
.switchable-value { display:flex; align-items:center; gap:var(--space-2); min-width:0; }
.switchable-value > input[type=number] { flex:1; min-width:0; }
.switchable-value > input[type=checkbox],html[data-equipment-layout=split] .basic-worksheet-group .switchable-value > input[type=checkbox] { width:16px; height:16px; min-height:16px; padding:0; flex:0 0 16px; }
.switchable-value > .calculated-value { background:transparent; border-color:transparent; text-align:right; }
.equipment-fields input.calculated-value {background:transparent;color:var(--ink);font-weight:var(--weight-semibold);box-shadow:none;appearance:textfield;cursor:default;}
.equipment-fields input.calculated-value::-webkit-inner-spin-button,.equipment-fields input.calculated-value::-webkit-outer-spin-button {-webkit-appearance:none;margin:0;}
.equipment-fields select[data-field-role=INACTIVE] {opacity:.65;}

html[data-ui-mode=advance][data-header-view=vgraph] #line-performance > :not(#vgraph-profile) { display:none; }
html[data-ui-mode=advance][data-header-view=results] #line-performance { display:none; }

/* Third conveyor inspector tab uses the existing field instances, not clones. */
html[data-equipment-layout=split] .equipment-fields > .dynamic-balancing-panel {display:none;}

.dynamic-balancing-panel .dynamic-balancing-grid label {min-width:0;display:flex;flex-direction:column;gap:var(--space-1);}
.dynamic-balancing-panel .dynamic-balancing-grid input {min-width:0;width:100%;}

html[data-ui-mode=basic] .advanced-scrap-field,.advanced-scrap-field[hidden]{display:none!important;}
