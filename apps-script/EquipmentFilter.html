<script>
window.STEquipmentFilter=(function(){
  var current='all',split=false;
  function canReorder(){return current!=='none';}
  function reorderMode(){return current;}
  function enabled(group){return current==='all'||current===group;}
  function apply(){
    // The export scope follows the section arrangement, not temporary card filters.
    [['export-equipment-evaluations','equipment'],['export-conveyor-evaluations','conveyors']].forEach(function(spec){
      var button=document.getElementById(spec[0]);if(!button)return;
      var hide=split&&current!==spec[1]&&current!=='all';
      button.hidden=hide;button.classList.toggle('hidden',hide);
    });
    var cards=Array.from(document.querySelectorAll('#equipment-list .equipment-card')),visible=0,selectionHidden=false;
    cards.forEach(function(card){
      var fields=card._fields||card,type=fields.querySelector('.equipment-type')?.value;
      STEquipmentInspector.refreshTitle(card);
      var show=enabled(type==='CONVEYOR'?'conveyors':'equipment');
      card.classList.toggle('hidden',!show);if(show)visible++;
      var handle=card.querySelector('.equipment-drag');handle.disabled=!show||!canReorder();
      handle.title=(canReorder()?__ST_TEXT__('client.drag_to_reorder_use_arrow_up_or_down_on_this_handle'):__ST_TEXT__('filter.reorder'));
      if(!show&&card.classList.contains('equipment-selected')){
        STEquipmentInspector.release();STEquipmentInspector.hide();selectionHidden=true;
      }
    });
    var empty=document.getElementById('equipment-filter-empty');empty.classList.toggle('hidden',!cards.length||visible>0);
    [['machines','equipment'],['conveyors','conveyors']].forEach(function(spec){
      var button=document.getElementById('toggle-editor-'+spec[0]);if(!button)return;
      var shown=enabled(spec[1]);button.setAttribute('aria-pressed',String(shown));
      button.title=(shown?'Hide ':'Show ')+spec[0];
    });
    if(selectionHidden)window.dispatchEvent(new Event('st:inspector'));
  }
  function set(value,separate){current=['all','equipment','conveyors','none'].includes(value)?value:'all';split=Boolean(separate);apply();}
  document.addEventListener('DOMContentLoaded',function(){
    [['machines','equipment'],['conveyors','conveyors']].forEach(function(spec){
      document.getElementById('toggle-editor-'+spec[0])?.addEventListener('click',function(){
        if(split)return;
        var machines=enabled('equipment'),conveyors=enabled('conveyors');
        if(spec[1]==='equipment')machines=!machines;else conveyors=!conveyors;
        set(machines?(conveyors?'all':'equipment'):(conveyors?'conveyors':'none'));
      });
    });
    document.addEventListener('change',function(event){if(event.target.matches('.equipment-type'))apply();});
  });
  return {apply:apply,set:set,canReorder:canReorder,reorderMode:reorderMode};
})();
</script>
