<script>
// Optional exploration budget overrides; confirmation uses a separate matched run.
window.ST_SCENARIO_SEARCH_LIMITS={parallelCandidates:0,wallClockBudget:false,reusePreviousWinner:false};
window.STScenarioExplorer=(function(){
  function unitLabel(unit){return window.STBasicMode?.unitLabel(unit)||unit||'units';}
  function quantity(value,unit){var strong=el('strong',value,'metric-value');if(unit)strong.append(el('span',unit,'metric-unit'));return strong;}
  // Evidence belongs to the simulation and is saved through the case autosave.

  var reliabilityDiscoveryCache=new Map(),flowScreenCache=new Map();

  } // Bounded LRU: exact metrics only, never replay data.
  function validMetrics(value,rounds,durationSeconds,unitOfFlow){

  function saveMeasurement(sim,key,value){

  }
  function doeEnabled(){var record=caseProvider?.();return record?record.metadata?.includeDOE===true:window.STPreferences?.read('scenarioDoe')==='yes';}
  function currentSearchSettings(){return STScenarioSearch.settings(caseProvider?.()?.metadata?.scenarioSearch);}

  function changed(simulation){window.dispatchEvent(new CustomEvent('st-whatif-change',{detail:{simulation:simulation}}));}

  function el(tag,text,cls){var e=document.createElement(tag);e.textContent=text||'';if(cls)e.className=cls;return e;}
  function button(text,fn){var b=el('button',text,'secondary');b.type='button';b.onclick=fn;return b;}
  function iconButton(text,icon,fn){var b=button('',fn);setIcon(b,text,icon);b.classList.add('icon-button');return b;}
  function setIcon(b,text,icon){b.innerHTML=STIcons.svg(icon);b.dataset.icon=icon;b.title=text;b.setAttribute('aria-label',text);}

  function config(sim){var r=Object.assign({durationSeconds:300,tickSeconds:.25,sampleEverySeconds:5,seed:1,commands:[],rounds:1},sim.dynamicConfig||{});if(r.durationMode==='SHIFTS')r.durationSeconds=(r.shiftHours||8)*(r.shiftCount||1)*3600;return r;}

      var records=[sim,...(caseProvider?.()?.simulations||[])];
      var matching=records.find(s=>s.results?.inputSignature===key&&s.results.replicationStatus?.state==='COMPLETE'&&s.results.summary&&s.results.durationSeconds===input.run.durationSeconds);

    }
    if(cached){rememberMetrics(key,cached);onProgress?.(1,rounds,rounds);return Object.assign({},cached,{cacheSource:cacheSource,warnings:evaluationWarnings(candidate,cached)});}
    var response=await SimulatorEngine.simulateBatch(input,{cancelled:cancelled,summaryOnly:true,progress:onProgress});
    if(!response.ok)throw Error(response.error?.message||JSON.stringify(response.errors||response));
    if(cancelled?.())throw Error('BATCH_CANCELLED');
    var value=metric(response.result);value.unitOfFlow=input.case.unitOfFlow||response.result.unitOfFlow||'units';
    if(!validMetrics(value,rounds,input.run.durationSeconds,input.case.unitOfFlow))throw Error('Incomplete simulation metrics; evaluation cannot be reused.');

    return Object.assign({},value,{cacheSource:'CALCULATED',warnings:evaluationWarnings(candidate,value)});
  }
  // Shared limit policy for ordinary coordinate search and DOE.
  function boundedTarget(change,raw,scale){
    if(!Number.isFinite(change.after))return {error:'TARGET_INVALID'};

      if(up?bound<baseline:bound>baseline)return {error:up?'LIMIT_MAX_BELOW_BASE':'LIMIT_MIN_ABOVE_BASE'};
    }
    return {after:up?Math.min(change.after,bound):Math.max(change.after,bound)};
  }
  function attach(host,project,create,simulation){
    var source=JSON.parse(JSON.stringify({id:simulation.id,equipment:simulation.equipment,dynamicConfig:simulation.dynamicConfig,unitOfFlow:simulation.results?.unitOfFlow||simulation.results?.replay?.unitOfFlow||simulation.unitOfFlow})),rows=[],generation=0,timer,baseline,baselineRun,last=null,searchCanFinish=false,finishRequested=false;
    var searchSettings=currentSearchSettings(),searchSettingsSignature=STScenarioSearch.settingsSignature(searchSettings),pendingSearchSettingsChange=false;
    function searchRun(phase,rounds){return STScenarioSearch.run(config(source),depth,phase,rounds,searchSettings);}
    function searchProfile(){return STScenarioSearch.profile(depth,searchSettings);}
    function searchLimits(){var profile=searchProfile(),limits=Object.assign({},profile,window.ST_SCENARIO_SEARCH_LIMITS);if(profile.hardCandidateLimit){limits.maxCandidates=Math.min(profile.maxCandidates,limits.maxCandidates);limits.hardCandidateLimit=true;}return limits;}
    source.whatIf=simulation.whatIf;source.results=simulation.results;
    var primaryTier=project.searchScope||project.tier,scopeOptions=!project.explore?[]:primaryTier==='HIGH'?['ZERO','MEDIUM']:primaryTier==='MEDIUM'?['ZERO']:[],categoryChanges=project.categoryChanges||{};
    if(!project.categoryChanges&&scopeOptions.length){(STScenarios.plan(source).candidates||[]).filter(p=>p.canApply).forEach(p=>{categoryChanges[p.tier]=(categoryChanges[p.tier]||[]).concat(p.changes);});categoryChanges[primaryTier]=project.changes;}
    var savedScope=simulation.whatIf?.capexInclusions?.[primaryTier]||{},inclusions=Object.fromEntries(scopeOptions.map(t=>[t,savedScope[t]===true||(primaryTier==='MEDIUM'&&t==='ZERO'&&savedScope[t]===undefined)]));
    if(scopeOptions.length){var seen=new Set();project=Object.assign({},project,{changes:[primaryTier,...scopeOptions.slice().reverse()].flatMap(t=>(categoryChanges[t]||[]).map(c=>Object.assign({},c,{originTier:t}))).filter(c=>{var key=c.equipmentId+':'+c.path;if(seen.has(key))return false;seen.add(key);return true;})});} // Reuse only completed results with exact provenance.
    var viewMode=document.documentElement.dataset.uiMode==='basic'?'basic':'advance',sourceSignature=STScenarios.signature(simulation),baseRecordKey=JSON.stringify([source.id,sourceSignature,project.id||project.kind,project.tier,project.searchScope||project.tier,!!project.explore,project.changes]),recordKey=JSON.stringify([baseRecordKey,viewMode,project.searchDerivedDOE?'HYBRID_SEARCH_V3':'PROPOSAL']);

      status.dataset.state='stale';resultNotice.textContent=notice;resultNotice.hidden=false;traceHistorical=true;
      return true;
    }
    function requireCompletedSource(){var readiness=sourceReadiness();if(readiness.ready){run.disabled=false;run.removeAttribute('data-source-blocked');setIcon(run,'Find best scenario','refresh');return true;}var text='Complete the numerical simulation to 100% with the current inputs before generating CAPEX scenarios.',notice=(window.STLanguage?.translate(text)||text)+' ('+readiness.reason+(readiness.differencePath?' · '+readiness.differencePath:'')+')';if(!preserveSavedOutcome(traceText('Saved analysis. Complete the current numerical simulation before running a new search.'))){status.textContent=notice;status.dataset.state='unavailable';}run.disabled=true;run.dataset.sourceBlocked=readiness.reason;run.title=notice;save.disabled=true;suggestFactors.disabled=true;return false;}
