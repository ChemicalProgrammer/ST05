  // System descriptions and engineering help from canonical ST_TEXT_RESOURCES.
  Object.assign(translations,{"A CLEARER VIEW OF YOUR LINE":"UNA VISIÓN MÁS CLARA DE TU LÍNEA","Unlock your line’s potential.":"Descubre el potencial de tu línea.","Simulate packaging lines, compare performance and explore improvement scenarios.":"Simula líneas de envasado, compara su desempeño y explora escenarios de mejora.","Keep me signed in on this browser":"Mantener la sesión iniciada en este navegador","Continue with your account":"Continuar con tu cuenta","Uses the account authorized for this app.":"Utiliza la cuenta autorizada para esta aplicación.","Case navigation":"Navegación de casos","Simulations":"Simulaciones","SIMULATIONS":"SIMULACIONES","Simulations and comparison":"Simulaciones y comparación","Selected simulation":"Simulación seleccionada","SELECTED SIMULATION":"SIMULACIÓN SELECCIONADA","Workspace actions":"Acciones del espacio de trabajo","Order defines material flow. Use alternating machine → conveyor → machine steps; every conveyor requires physical geometry.":"El orden define el flujo de material. Alterna máquina → transportador → máquina; cada transportador necesita geometría física.","Configure a valid physical line before running: machine → conveyor → machine, with geometry on every conveyor. Changes save automatically.":"Configura una línea física válida antes de ejecutar: máquina → transportador → máquina, con geometría en cada transportador. Los cambios se guardan automáticamente.","At 1×, one simulated second corresponds to one real second when calculation keeps pace. The engine defines the physical integration step; chart sampling controls chart points independently of live values. Every conveyor uses SimuLine physical geometry by default: L_act, L_p, package pitch, speed factor, runout, sensor delays, and insurance derive capacity, travel, normal photoeye pulses, Prime / Back-up control, recovery, and design audits. Abstract buffers are not used.":"A 1×, un segundo simulado corresponde a un segundo real cuando el cálculo mantiene el ritmo. El motor define el paso físico de integración; el muestreo de gráficas controla sus puntos de forma independiente de los valores en vivo. Cada transportador utiliza geometría física de SimuLine: L_act, L_p, paso del paquete, factor de velocidad, descarga residual, retardos de sensores y factor de seguridad para calcular capacidad, recorrido, pulsos de sensores, controles Prime / Back-up, recuperación y verificaciones de diseño. No se usan buffers abstractos.","Schedule a pause, planned stop, emergency stop, reset, run, manual, or automatic mode change in virtual time.":"Programa pausas, paradas planificadas o de emergencia, restablecimientos, arranques y cambios entre modo manual y automático en tiempo virtual.","Line OEE is final output divided by the maximum output of the selected critical machine across the same virtual duration. Quality is assumed 100% until rejects are modeled.":"El OEE de línea es la producción final dividida entre la producción máxima de la máquina crítica seleccionada durante la misma duración virtual. Se supone calidad del 100 % hasta que se modelen los rechazos.","Scenario controls apply at the displayed virtual second and deterministically recalculate the run. They are simulation controls only; they never command real equipment.":"Los controles de escenario se aplican en el segundo virtual mostrado y recalculan la ejecución de forma determinista. Son únicamente controles de simulación; nunca gobiernan equipos reales.","Evaluate the selected simulation and create supported scenarios by investment category.":"Evalúa la simulación seleccionada y crea escenarios compatibles según su categoría de inversión.","Review zero, medium and high CAPEX options. Evidence labels distinguish static design inputs from dynamic run results. Each action creates a separate simulation.":"Revisa las opciones de CAPEX cero, medio y alto. Las etiquetas de evidencia distinguen los datos de diseño estáticos de los resultados dinámicos. Cada acción crea una simulación independiente.","The browser engine executes the deterministic Case. Apps Script is responsible for identity and Drive persistence; Gemini is not used for calculation. Sensor positions in the demo are transparent synthetic assumptions, not a PLC or safety-control design.":"El motor del navegador ejecuta el caso determinista. Apps Script gestiona la identidad y el almacenamiento en Drive; Gemini no realiza cálculos. Las posiciones de sensores del demo son supuestos sintéticos explícitos, no constituyen un diseño PLC ni de seguridad.","Sending shares a compact analysis with Gemini. Conversations reset when changing simulation or case.":"El envío comparte un análisis compacto con Gemini. Las conversaciones se reinician al cambiar de simulación o caso.","Choose a Drive folder you can access. Cases and results are saved in this workspace.":"Elige una carpeta de Drive a la que tengas acceso. Los casos y resultados se guardan en ese espacio de trabajo.","Your API key is stored in your Apps Script user properties and used only by the server.":"Tu clave API se guarda en las propiedades de usuario de Apps Script y sólo la utiliza el servidor.","Read metadata in B1:B7 or legacy C1:C7 and equipment rows starting at A10. NA and N/A mean not applicable. Compare current and Sheet values, choose equipment and fields, then apply the selected changes. The active simulation saves automatically.":"Lee los metadatos de B1:B7 o C1:C7 en formatos antiguos y los equipos a partir de A10. NA y N/A significan no aplicable. Compara los valores actuales con los de la hoja, selecciona equipos y campos y aplica los cambios. La simulación activa se guarda automáticamente.","Clears this account's Drive connection, Gemini key and settings, and this browser's app preferences. Drive cases, results and index are retained. Keep your folder ID so you can reconnect.":"Elimina la conexión a Drive, la clave de Gemini y las preferencias de esta cuenta y del navegador. Los casos, resultados e índice almacenados en Drive se conservan. Guarda el ID de carpeta para reconectarte.","Close the current case before resetting. Drive cases, results and index are retained. Keep your folder ID so you can reconnect.":"Cierra el caso actual antes de restablecer. Se conservan los casos, resultados e índice de Drive. Guarda el ID de carpeta para reconectarte.","Reset the app? Your Drive folder ID, Gemini API key, account prompts and browser preferences will be cleared. Pending Settings edits will be discarded. Drive cases, results and index will remain. Keep your folder ID to reconnect. Other accounts are unaffected.":"¿Restablecer la aplicación? Se eliminarán el ID de carpeta de Drive, la clave API de Gemini, las instrucciones de tu cuenta y las preferencias del navegador. Se descartarán los cambios pendientes de Configuración. Los casos, resultados e índice permanecerán en Drive. Conserva el ID de carpeta para reconectarte. No afecta a otras cuentas.","Browser-local pilot: up to four factors, two levels, and at least three rounds per combination. Configure factors in What-If. Applied when Settings closes.":"Función experimental local del navegador: hasta cuatro factores, dos niveles y al menos tres rondas por combinación. Configura los factores en Qué pasaría si. Se aplica al cerrar Configuración.","Applies immediately to this browser and Settings. Other users keep their own mode.":"Se aplica inmediatamente a este navegador y a Configuración. Los demás usuarios conservan su propio modo.","This browser could not save the interface mode. Try again with browser storage enabled.":"El navegador no pudo guardar el modo de interfaz. Inténtalo de nuevo con el almacenamiento del navegador habilitado.","Changing the storage folder saves and closes the current case. Existing cases stay in their original folder.":"Al cambiar la carpeta de almacenamiento, se guarda y cierra el caso actual. Los casos existentes permanecen en su carpeta original.","Gemini chat will stop working until you add a new API key. Your cases and simulation results will remain available.":"El chat de Gemini dejará de funcionar hasta que agregues una nueva clave API. Tus casos y resultados seguirán disponibles.","Select the machine that sets the line reference rate. Only one machine can be selected; its physical equipment type stays unchanged.":"Selecciona la máquina que establece la velocidad de referencia de la línea. Sólo puede haber una seleccionada; su tipo físico no cambia.","Installed machine capacity. This is distinct from the normal line target and the estimated recovery overspeed. The current engine still processes at the configured nominal rate.":"Capacidad instalada de la máquina. Es distinta de la velocidad objetivo normal y de la sobrevelocidad de recuperación estimada. El motor sigue operando a la velocidad nominal configurada.","Design estimate only. Leave blank to use MTBF as the recovery window. A shorter time requires more overspeed; the engine does not apply this target automatically.":"Estimación exclusiva de diseño. Deja vacío para usar MTBF como ventana de recuperación. Un tiempo menor requiere más sobrevelocidad; el motor no aplica ese objetivo automáticamente.","Maximum speed and recovery time must be positive numbers when provided.":"La velocidad máxima y el tiempo de recuperación deben ser positivos cuando se especifican.","Enter a positive belt speed and package length, a conveyor long enough for one moving pitch, and an accumulated gap no greater than the moving gap.":"Ingresa una velocidad de banda y longitud de paquete positivas, una longitud de transportador suficiente para un paso en movimiento y una separación acumulada que no supere la separación en movimiento.","Automatic speed uses upstream discharge velocity and the speed factor. Manual speed uses the physical mm/s value below.":"La velocidad automática usa la velocidad de descarga aguas arriba y el factor de velocidad. La velocidad manual utiliza el valor físico en mm/s indicado abajo.","Physical belt velocity. It controls travel time and transfer capacity; the nominal conveyor BPM field is not an independent limit.":"Velocidad física de la banda. Determina el tiempo de transporte y la capacidad de transferencia; el campo BPM nominal del transportador no es un límite independiente.","Clear distance between moving packages. Leave blank to derive spacing from the discharge pitch and automatic speed factor. Moving pitch is product length plus this gap.":"Separación libre entre paquetes en movimiento. Deja vacío para calcularla con el paso de descarga y el factor de velocidad automático. El paso en movimiento es la longitud del producto más esta separación.","Clear distance between queued packages; default 0 mm means touching packages. It determines accumulated capacity and queue sensor thresholds. Must not exceed moving gap.":"Distancia libre entre paquetes acumulados; 0 mm significa que se tocan. Determina la capacidad acumulada y los umbrales de los sensores de cola. No debe superar la separación en movimiento.","Worksheet audit uses automatic design assumptions. Runtime speed, spacing and capacity are shown separately.":"La verificación de diseño de la hoja utiliza supuestos automáticos. La velocidad, separación y capacidad operativas se muestran por separado.","Productive capacity is output / (nominal rate × full duration). It can be compared with processing utilization in a deterministic cycle model; stateSeconds contains the separate elapsed fluid-model states.":"La capacidad productiva es producción / (velocidad nominal × duración total). Puede compararse con la utilización del proceso en un modelo determinista de ciclos; stateSeconds conserva por separado los tiempos de cada estado.","Starved and blocked columns count stopped flow. Partial losses are equivalent lost capacity during ticks with positive flow; they are not additional stopped time.":"Las columnas Sin alimentación y Bloqueado representan interrupciones del flujo. Las pérdidas parciales equivalen a capacidad perdida en intervalos con flujo positivo; no son tiempo detenido adicional.","Quality assumes 100% (no reject model). Loss and downtime totals are equipment-minutes; simultaneous losses are not line downtime.":"Se supone una calidad del 100 % (sin modelo de rechazos). Los totales de pérdidas y paradas se expresan en minutos-equipo; las pérdidas simultáneas no son necesariamente paradas de línea.","Line throughput = final equipment output ÷ complete run:":"Producción efectiva de línea = producción del último equipo ÷ duración completa:","Each machine's effective throughput = availability × run efficiency × configured processing speed. Starving and blocking reduce run efficiency. Rates use the case's equivalent flow unit; pack pattern is not an automatic conversion.":"La producción efectiva de cada máquina es disponibilidad × eficiencia en operación × velocidad de proceso configurada. La falta de alimentación y el bloqueo reducen la eficiencia en operación. Las velocidades usan la unidad de flujo equivalente del caso; el patrón de empaque no implica conversión automática.","The compared runs use different flow units. Convert them to a common unit before interpreting throughput and production differences.":"Las ejecuciones comparadas usan unidades de flujo diferentes. Convierte a una unidad común antes de interpretar las diferencias de producción y velocidad.","These proposals use round 1 as dynamic evidence. Replication averages are available in Results; proposed gains remain unverified.":"Estas propuestas usan la ronda 1 como evidencia dinámica. Los promedios de réplicas están disponibles en Resultados; las ganancias propuestas aún no están verificadas.","Events changed. The other rounds will be recalculated when round 1 playback finishes.":"Los eventos cambiaron. Las demás rondas se recalcularán al finalizar la reproducción de la ronda 1.","Events added during round 1 changed the result. Recalculating the other rounds with the final event schedule.":"Los eventos agregados durante la ronda 1 modificaron el resultado. Se están recalculando las otras rondas con el programa final de eventos.","Background rounds cancelled. Only the current round 1 result is available.":"Se cancelaron las rondas en segundo plano. Sólo está disponible el resultado actual de la ronda 1.","Round 1 is playing as it calculates. Other rounds are calculating in the background.":"La ronda 1 se reproduce mientras se calcula. Las demás rondas se calculan en segundo plano.","Round 1 keeps playback and live controls. Other rounds calculate metrics in the background using the same scheduled events and independent seeds.":"La ronda 1 conserva la reproducción y los controles en vivo. Las demás calculan indicadores en segundo plano con los mismos eventos programados y semillas independientes.","Live controls are available in round 1. Scheduled events apply to every round.":"Los controles en vivo están disponibles en la ronda 1. Los eventos programados se aplican a todas las rondas.","Choose 1–100 whole rounds, 1–3 shifts and 0.25–24 hours per shift in quarter-hour increments.":"Selecciona entre 1 y 100 rondas enteras, entre 1 y 3 turnos y entre 0.25 y 24 horas por turno en incrementos de un cuarto de hora.","Results show the selected average or individual round. Playback charts show an actual round; the representative round is closest to mean production.":"Resultados muestra el promedio seleccionado o una ronda individual. Las gráficas de reproducción muestran una ronda real; la representativa es la más cercana a la producción media.","Normal line target = min(configured processing rate, critical machine rate). Estimated overspeed = normal target + recoverable units / target recovery time. Recoverable units = min(normal target × MTTR, useful installed accumulation toward the critical machine). The default recovery window is MTBF; it is a planning assumption, not a measured recovery time. Missing geometry or enabled reliability leaves the estimate unavailable. The critical machine stays at normal speed. The curve is not forced into a V and is not applied by the engine. Actual desired inventory and protection during repeated stops still require dynamic validation. † target exceeds installed maximum.":"Velocidad normal objetivo = mínimo(velocidad configurada, velocidad de la máquina crítica). Sobrevelocidad estimada = objetivo normal + unidades recuperables / tiempo objetivo de recuperación. Unidades recuperables = mínimo(objetivo normal × MTTR, acumulación útil instalada hacia la máquina crítica). La ventana de recuperación predeterminada es MTBF: es un supuesto de diseño, no un tiempo medido. Sin geometría o confiabilidad habilitada la estimación no está disponible. La máquina crítica permanece a velocidad normal. La curva no se fuerza a una V ni se aplica por el motor. El inventario deseado real y la protección ante paradas repetidas aún requieren validación dinámica. † El objetivo excede el máximo instalado.","Normal line target and estimated recovery overspeed by machine in units per minute":"Velocidad normal objetivo y sobrevelocidad de recuperación estimada por máquina en unidades por minuto","Design speeds only. The current engine does not accelerate machines above their nominal speed after a stop; this profile does not certify recovery or critical machine protection.":"Sólo velocidades de diseño. El motor actual no acelera las máquinas por encima de la velocidad nominal tras una parada; este perfil no certifica recuperación ni protección de la máquina crítica.","No recovery overspeed is configured: maximum and normal speeds are equal or maximum speeds are missing. Imported maximum speed currently initializes normal speed. Recovery and V-Graph compliance are not evaluated.":"No hay sobrevelocidad de recuperación configurada: las velocidades máxima y normal son iguales o faltan velocidades máximas. La velocidad máxima importada inicializa actualmente la normal. No se evalúa la recuperación ni el cumplimiento del V-Graph.","The table's capacity estimate for machines other than the critical machine is max(normal speed, critical machine normal speed ÷ intrinsic availability). It does not calculate recovery overspeed: that requires desired and actual buffer inventory, available accumulation, and a recovery interval. The engine does not command overspeed. † estimate exceeds configured maximum; a missing maximum leaves feasibility unverified.":"La estimación de capacidad para las máquinas no críticas es el máximo entre la velocidad normal y la velocidad normal de la máquina crítica dividida entre la disponibilidad intrínseca. No calcula sobrevelocidad de recuperación: ésta requiere inventario acumulado deseado y real, acumulación disponible e intervalo de recuperación. El motor no ordena sobrevelocidad. † La estimación excede el máximo configurado; sin un máximo, la viabilidad no está verificada.","Replication statistics are compared separately. The standard result comparison below uses round 1. Compare batch means only with matching duration, round count and seed lists.":"Las estadísticas de réplicas se comparan por separado. La comparación estándar de resultados usa la ronda 1. Compara las medias únicamente con igual duración, cantidad de rondas y listas de semillas."});
  // Runtime controls and dynamic labels from simulation, equipment, results and formats.
  Object.assign(translations,{"Group name":"Nombre del grupo","External stops":"Paradas externas","Total pause time":"Tiempo total de pausas","Number of pauses":"Cantidad de pausas","Window start":"Inicio de la ventana","Window end":"Fin de la ventana","Total pause time unit":"Unidad del tiempo total de pausas","Window end must be later than window start.":"El fin de la ventana debe ser posterior al inicio.","Choose equipment, complete the fields, then click Preview.":"Selecciona los equipos, completa los campos y pulsa Vista previa.","Enter a valid window start and end.":"Ingresa un inicio y un fin válidos para la ventana.","Delete generated group":"Eliminar grupo generado","Delete all generated groups":"Eliminar todos los grupos generados","Delete group":"Eliminar grupo","Invalid scenario draft. Retry the proposal.":"El borrador de escenario no es válido. Vuelve a generar la propuesta.","Generated group":"Grupo generado","Total pause time must use 0.25-second increments and allow at least 0.25 seconds per pause.":"El tiempo total de pausas debe usar incrementos de 0.25 s y permitir al menos 0.25 s por pausa.","Not enough free time for this total and pause count. Expand the window, reduce the total or change the count. Existing stops are reserved.":"No hay tiempo libre suficiente para esta duración y cantidad de pausas. Amplía la ventana, reduce el total o cambia la cantidad. Se respetan las paradas existentes.","The event window ends at":"La ventana de eventos termina en","Calendar exclusions and line stops must leave positive production time.":"Las exclusiones de calendario y paradas de línea deben dejar un tiempo de producción positivo.","Event start unit":"Unidad de inicio del evento","Remove event":"Quitar evento","After stop":"Después de la parada","Resume":"Reanudar","Line stop":"Parada de línea","Destination format":"Formato de destino","Pause or stop Simulation 2D before starting the numerical simulation.":"Pausa o detén Simulation 2D antes de iniciar la s   Object.assign(translations,{"No supported changes were found with the available evidence. Review the engineering checks or run the simulation to add dynamic evidence.":"Con la evidencia disponible no se encontraron cambios compatibles. Revisa las verificaciones de ingeniería o ejecuta la simulación para agregar evidencia dinámica.","Review this field in the equipment configuration before creating the scenario.":"Revisa este campo en la configuración del equipo antes de crear el escenario.","In Line Setup, select this conveyor and change Conveyor speed factor (%). This changes belt velocity relative to upstream discharge and therefore package spacing. Verify the drive can achieve the proposed setting.":"En Configuración de línea, selecciona este transportador y cambia el factor de velocidad (%). Esto modifica la velocidad de banda respecto a la descarga aguas arriba y, por tanto, el espacio entre paquetes. Verifica que el variador pueda alcanzar el valor propuesto.","In Line Setup, change Back-up blocked delay. This controls how long the sensor must remain blocked before requesting an upstream stop; the setting is checked against normal package pulse duration.":"En Configuración de línea, cambia el retardo de bloqueo Back-up. Controla cuánto debe permanecer bloqueado el sensor antes de solicitar una parada aguas arriba; se compara con la duración normal de los pulsos de paquetes.","In Line Setup, change Back-up clear delay. This controls how long the sensor must remain clear before releasing the upstream stop; review it against normal inter-package gaps.":"En Configuración de línea, cambia el retardo de liberación Back-up. Controla cuánto debe permanecer libre el sensor antes de reanudar el equipo aguas arriba; revísalo frente a los espacios normales entre paquetes.","In Line Setup, change Installed Back-up position. The distance is measured from the upstream discharge. This represents relocating the sensor to reserve the required overflow length.":"En Configuración de línea, cambia la posición instalada de Back-up. La distancia se mide desde la descarga aguas arriba. Representa reubicar el sensor para reservar la longitud de desbordamiento necesaria.","In Line Setup, change Installed length (L_act). This represents a physical conveyor length change to support accumulation and recovery; verify layout space and feasibility.":"En Configuración de línea, cambia la longitud instalada (L_act). Representa un cambio físico del transportador para permitir acumulación y recuperación; verifica espacio disponible y viabilidad.","In Line Setup, change Prime reserve (L_p). Review the corresponding sensor location and downstream startup requirement before applying the value.":"En Configuración de línea, cambia la reserva Prime (L_p). Revisa la posición del sensor y los requisitos de arranque aguas abajo antes de aplicar el valor.","In Line Setup, change Downstream ramp-up time. Confirm the machine and its controls can reach full speed within this proposed time.":"En Configuración de línea, cambia el tiempo de aceleración aguas abajo. Confirma que la máquina y sus controles puedan alcanzar velocidad plena en el tiempo propuesto.","In the equipment process JSON, change upstream.startupTimeSeconds. Confirm the actual control sequence can support the proposed startup time.":"En el JSON de proceso del equipo, cambia upstream.startupTimeSeconds. Confirma que la secuencia de control real admita el tiempo de arranque propuesto.","Current evidence does not support an automatic change in this category.":"La evidencia actual no justifica un cambio automático en esta categoría.","Complete the physical line inputs before applying this scenario.":"Completa los datos físicos de la línea antes de aplicar este escenario.","This change would invalidate a design check. Resolve the related geometry constraints first.":"Este cambio invalidaría una verificación de diseño. Resuelve primero las restricciones geométricas relacionadas.","Create a separate simulation with the listed changes? The baseline and random seed are preserved. Run the new scenario to measure its effect.":"¿Crear una simulación independiente con los cambios indicados? Se conservan la línea base y la semilla aleatoria. Ejecuta el escenario nuevo para medir su efecto.","Scenario created and saved. Review the inputs and run it to evaluate the impact.":"Escenario creado y guardado. Revisa las entradas y ejecútalo para evaluar su impacto.","The source simulation changed. Generate a new proposal before applying it.":"La simulación de origen cambió. Genera una propuesta nueva antes de aplicarla.","These checks implement the supplied design brief where inputs exist; they do not certify handbook compliance. CAPEX levels describe intervention scale, not a cost estimate or financial return. Buffer coverage uses the adjacent upstream machine's MTTR for microstops up to 4 minutes. Unmodeled turn losses, filled-container diameter and PLC desired-state behavior are not assumed.":"Estas verificaciones aplican los criterios de diseño proporcionados cuando existen datos, pero no certifican el cumplimiento de manuales. Las categorías CAPEX describen la magnitud de la intervención, no una estimación de costos o rentabilidad. La cobertura del buffer utiliza el MTTR de la máquina adyacente aguas arriba para microparadas de hasta 4 minutos. No se suponen pérdidas por curvas no modeladas, diámetro de envases llenos ni comportamiento deseado de PLC.","Expected direction is a hypothesis. Numerical OEE, throughput and loss improvements require a new run and comparison.":"La dirección esperada es una hipótesis. Las mejoras en OEE, producción efectiva y pérdidas requieren una ejecución y comparación nuevas.","90° turns and filled-container diameter":"Curvas de 90° y diámetro del envase lleno","Not evaluated: required inputs or model support are missing":"No evaluado: faltan datos requeridos o compatibilidad del modelo","Illustrative values only. Replace them with verified equipment data. Copying does not change your equipment. Merge only the fields you need: replacing a whole object can remove existing data. For conveyors, the visible geometry controls take precedence over the same JSON fields.":"Valores únicamente ilustrativos. Sustitúyelos por datos verificados del equipo. Copiar no modifica el equipo. Combina sólo los campos necesarios: reemplazar un objeto completo puede eliminar datos existentes. En transportadores, los controles visibles de geometría tienen prioridad sobre los campos JSON equivalentes.","Select the example and press Ctrl/Cmd+C.":"Selecciona el ejemplo y pulsa Ctrl/Cmd+C.","Unique equipment identifier used by commands and saved results. Keep it stable and unique within the simulation.":"Identificador único del equipo usado en comandos y resultados guardados. Debe ser estable y único dentro de la simulación.","Equipment name displayed in the line, results and comparisons.":"Nombre del equipo mostrado en la línea, resultados y comparaciones.","Equipment category. Conveyor enables the physical belt and sensor settings; other categories represent processing machines.":"Categoría de equipo. Transportador habilita los ajustes físicos de banda y sensores; las demás categorías representan máquinas de proceso.","Nominal speed in BPM (bottles per minute), regardless of the case flow-unit label. The engine stores this value divided by 60. This changes the time basis only; it does not convert cases or pallets into bottles. Conveyor belt velocity is calculated separately from geometry and speed factor.":"Velocidad nominal en BPM (botellas por minuto), independientemente de la unidad de flujo del caso. El motor almacena ese valor dividido entre 60. Sólo cambia la base temporal; no convierte cajas ni tarimas en botellas. La velocidad de la banda se calcula por separado a partir de geometría y factor de velocidad.","Initial operating mode: AUTO follows line controls; MANUAL uses manual operation; PAUSE and STOP start the equipment paused or stopped.":"Modo de operación inicial: AUTO sigue los controles de línea; MANUAL permite operación manual; PAUSE y STOP inician el equipo pausado o detenido.","Optional equipment attributes as a JSON object. Use the example guide for supported fields; an empty object is allowed.":"Atributos opcionales del equipo en un objeto JSON. Consulta la guía de ejemplos para los campos compatibles; se permite un objeto vacío.","Failure model inputs as a JSON object. Reliability requires both positive MTBF and MTTR in minutes. Use measured plant values; an empty object adds no reliability profile.":"Entradas del modelo de fallas como objeto JSON. La confiabilidad requiere MTBF y MTTR positivos en minutos. Usa valores medidos en planta; un objeto vacío no agrega perfil de confiabilidad.","Structured process and engineering inputs. Visible conveyor controls take precedence over their JSON equivalents. Sheets import also fills these fields. See the example guide before editing.":"Datos estructurados de proceso e ingeniería. Los controles visibles de transportadores prevalecen sobre los campos JSON equivalentes. La importación de hojas también completa estos campos. Consulta la guía antes de editar.","Boolean: marks this equipment as critical for the line analysis.":"Booleano: marca el equipo como crítico para el análisis de línea.","Mean operating time between failures, in minutes. A positive plant input used to sample failure intervals with the run seed.":"Tiempo medio de operación entre fallas, en minutos. Valor positivo de planta empleado para muestrear intervalos de falla con la semilla de ejecución.","Mean repair time, in minutes. The current engine uses this as a fixed repair duration. Keep the measured baseline value.":"Tiempo medio de reparación, en minutos. El motor actual lo utiliza como duración de reparación fija. Conserva el valor base medido.","Configured maximum machine speed, in units per minute; used by engineering analysis. It does not replace the nominal rate field.":"Velocidad máxima configurada de la máquina, en unidades por minuto; utilizada para análisis de ingeniería. No reemplaza el campo de velocidad nominal.","Machine startup time, in seconds, used by the physical line calculations.":"Tiempo de arranque de máquina, en segundos, utilizado por el modelo físico de línea.","Center-to-center package pitch at the downstream machine infeed, in millimeters.":"Paso entre centros de paquetes en la alimentación de la máquina aguas abajo, en milímetros.","Ramp-up duration including the Prime delay, in seconds, used by the conveyor engineering calculations.":"Duración de rampa de aceleración incluido el retardo Prime, en segundos, utilizada en los cálculos de transportadores.","Messages are saved with this simulation. No case data is sent while Case context is unchecked.":"Los mensajes se guardan con esta simulación. No se envían datos del caso cuando Contexto del caso está desmarcado.","This conversation is temporary and is not saved. No case data is sent.":"Esta conversación es temporal y no se guarda. No se envían datos del caso.","Gemini returned no explanation. Ask it to explain the selected variables, assumptions and supporting evidence before evaluating these proposals.":"Gemini no proporcionó una explicación. Pídele que explique las variables seleccionadas, los supuestos y la evidencia antes de evaluar las propuestas.","Messages are saved with this simulation. Sending saves pending case changes and shares the selected simulation with Gemini.":"Los mensajes se guardan con esta simulación. El envío guarda los cambios pendientes del caso y comparte la simulación seleccionada con Gemini."," s elapsed":" s transcurridos","Compact context:":"Contexto compacto:"," equipment included. Replay samples, event logs and raw Sheet rows excluded.":" equipos incluidos. Se excluyen muestras de reproducción, registros de eventos y filas originales de hojas."," Older messages omitted: ":" Mensajes antiguos omitidos: ","Some proposed changes did not pass the model checks and cannot be applied. Request a revised proposal.":"Algunos cambios propuestos no superaron las verificaciones del modelo y no pueden aplicarse. Solicita una propuesta revisada.","Answer shortened for conversation storage.":"Respuesta abreviada para almacenamiento de conversación.","Gemini is temporarily unavailable (HTTP {status}). Please try again shortly.":"Gemini no está disponible temporalmente (HTTP {status}). Inténtalo de nuevo en breve.","Context uses the selected simulation, aggregate results and physical design checks.":"El contexto utiliza la simulación seleccionada, los resultados agregados y las verificaciones de diseño físico.","Equipment · ":"Equipos · ","Simulation metrics · ":"Indicadores de simulación · ","Changed inputs · ":"Entradas modificadas · "," changes · ":" cambios · "," equipment affected":" equipos afectados","No equipment input differences. Run settings are listed below.":"No hay diferencias en las entradas de equipos. Los ajustes de ejecución se muestran abajo."," vs. ":" frente a ","Configuration can be compared now. Run both simulations before interpreting result deltas; results are saved automatically.":"La configuración ya puede compararse. Ejecuta ambas simulaciones antes de interpretar las diferencias de resultados; éstos se guardan automáticamente.","Paired run: both used seed ":"Ejecución emparejada: ambas usaron la semilla "," and ":" y "," virtual seconds. Matching seed and duration improve comparability but do not guarantee identical failure events or isolate causality when equipment, commands or random-number consumption change.":" segundos virtuales. Usar la misma semilla y duración mejora la comparabilidad, pero no garantiza eventos de falla idénticos ni permite aislar causas cuando cambian equipos, comandos o consumo de números aleatorios.","Comparison caution: saved seed or virtual duration differs (":"Precaución al comparar: la semilla o duración virtual guardada difieren ("," s vs. ":" s frente a "," s). Configuration differences remain valid, but rerun both with the same seed and duration for a direct result comparison.":" s). Las diferencias de configuración siguen siendo válidas, pero vuelve a ejecutar ambas con igual semilla y duración para comparar directamente los resultados."});

  Object.assign(translations,{"Bottles or cases processed by this equipment. Physical conversion requires a selected product and matching input/output units; legacy cases retain their uniform flow model.":"Botellas o cajas procesadas por este equipo. La conversión física requiere un producto seleccionado y unidades de entrada/salida compatibles; los casos antiguos conservan su modelo de flujo uniforme.","Case loaded. Drive folder conversion could not finish; it will retry when you reopen or save the case.":"Caso cargado. No terminó la conversión de la carpeta Drive; se intentará de nuevo al reabrir o guardar.","Move Case \"":"Mover el caso «","\" to the Drive trash?":"» a la papelera de Drive?","Applied Sheet selection to ":"Selección de hoja aplicada a "," added, ":" agregados, "," updated. Saving automatically.":" actualizados. Guardando automáticamente."," Run again to refresh results.":" Ejecuta nuevamente para actualizar resultados."," · unsaved changes":" · cambios sin guardar"," · What-If: ":" · Qué pasaría si: ","ID: ":"ID: "," · Active: ":" · Activo: ","Imported from ":"Importado de ",". MTBF drives random failure intervals; MTTR is a fixed repair duration. Review the stored import assumptions before running.":". MTBF determina los intervalos aleatorios de falla; MTTR es un tiempo de reparación fijo. Revisa los supuestos de importación guardados antes de ejecutar.","Step ":"Paso ","Total installed conveyor length, measured from the upstream discharge toward the downstream infeed.":"Longitud total instalada del transportador, medida desde la descarga aguas arriba hasta la entrada aguas abajo.","Reserved downstream length between the Prime photocell and the downstream machine infeed.":"Longitud reservada aguas abajo entre la fotocélula Prime y la entrada de la máquina siguiente.","Physical package length in the direction of travel. It determines the photoeye occupied time.":"Longitud física del paquete en la dirección del movimiento. Determina el tiempo de ocupación de la fotocélula.","Centre-to-centre distance between packages leaving the upstream machine.":"Distancia entre centros de los paquetes que salen de la máquina aguas arriba.","Belt-speed increase relative to upstream package discharge velocity. It changes package spacing and population.":"Aumento de la velocidad de banda respecto a la velocidad de descarga aguas arriba. Modifica el espacio entre paquetes y la población.","Installed Back-up photocell position, measured from the upstream discharge. A sustained blocked signal requests the upstream stop.":"Posición instalada de la fotocélula Back-up, medida desde la descarga aguas arriba. Un bloqueo sostenido solicita detener la máquina aguas arriba.","Length that must be cleared after the upstream discharge before a stop fully takes effect.":"Longitud que debe desalojarse después de la descarga aguas arriba antes de que la parada surta efecto completo.","Additional reject/runout length that must be cleared during an upstream stop.":"Longitud adicional de rechazo/descarga residual que debe liberarse durante una parada aguas arriba.","Continuous Back-up blocked time required before the simulator requests the upstream stop. Normal package pulses do not count.":"Tiempo de bloqueo continuo de Back-up necesario antes de solicitar una parada aguas arriba. Los pulsos normales de paquetes no cuentan.","Continuous Back-up clear time required before the simulator releases the upstream stop. Normal product gaps reset this timer.":"Tiempo continuo libre de Back-up requerido antes de liberar la parada aguas arriba. Los espacios normales entre productos reinician el temporizador.","Extra package margin reserved in the required overflow calculation. It is a design margin, not randomly created material.":"Margen adicional de paquetes reservado en el cálculo de desbordamiento requerido. Es un margen de diseño, no material creado aleatoriamente.","Delay from the upstream stop request until its discharge response is complete.":"Retardo desde la solicitud de parada aguas arriba hasta completar su respuesta de descarga.","Packages that can still leave the upstream machine after the stop request.":"Paquetes que todavía pueden salir de la máquina aguas arriba después de la solicitud de parada.","Time for the downstream machine to ramp after Prime authorizes its start.":"Tiempo de aceleración de la máquina aguas abajo después de que Prime autoriza su arranque.","SimuLine preview becomes available when this conveyor sits between an upstream and downstream machine.":"La vista previa de SimuLine está disponible cuando el transportador está entre una máquina aguas arriba y otra aguas abajo.","normal clear gap":"separación normal libre","for equipment step":"para el paso de equipo","must contain a JSON object.":"debe contener un objeto JSON.","scenario edits not yet saved to Drive":"cambios de escenario aún no guardados en Drive","For ":"Para ","Simulation completed at its virtual safety ceiling. Playback is starting.":"La simulación terminó al alcanzar el límite de seguridad virtual. Comienza la reproducción.","physical accumulation":"acumulación física","units · Waiting":"unidades · Esperando","Product already at the downstream end of the conveyor and available to the next machine. Inventory equals In transit plus Waiting.":"Producto que ya está al final del transportador y disponible para la máquina siguiente. Inventario = En tránsito + Esperando.","Normal photoeye occupied time and clear gap derived from product length, pitch, and belt speed.":"Tiempo normal de ocupación y separación libre de la fotocélula, calculados con longitud y paso del producto y velocidad de banda.","Time one package normally blocks a photoeye at the calculated belt speed.":"Tiempo durante el cual un paquete normalmente bloquea la fotocélula a la velocidad de banda calculada.","Time the normal gap between packages leaves a photoeye clear.":"Tiempo que la separación normal entre paquetes deja libre una fotocélula.","Extra package margin included in the required overflow calculation; it is not material generated during the run.":"Margen adicional de paquetes incluido en el cálculo de desbordamiento requerido; no es material generado durante la ejecución.","All material on this physical conveyor: In transit plus Waiting.":"Todo el material en este transportador físico: En tránsito más Esperando.","Product moving between the upstream discharge and the downstream end of the conveyor.":"Producto que se mueve entre la descarga aguas arriba y el extremo aguas abajo del transportador.","Prime photocell signal. A product pass authorizes the downstream start; a blocked state means a queue has reached the sensor.":"Señal de fotocélula Prime. El paso de producto autoriza el arranque aguas abajo; un estado bloqueado indica que una cola llegó al sensor.","Back-up photocell signal. Only a continuously blocked signal starts the stop timer; normal product pulses do not request a stop.":"Señal de fotocélula Back-up. Sólo el bloqueo continuo inicia el temporizador de parada; los pulsos normales de producto no solicitan detener.","Installed usable length and effective product pitch used to calculate physical capacity.":"Longitud útil instalada y paso efectivo de producto empleados para calcular la capacidad física.","Nominal time for material to travel through the physical conveyor.":"Tiempo nominal de transporte del material a través del transportador físico.","Material that could not enter a full physical zone.":"Material que no pudo ingresar en una zona física llena.","Required overflow length, including runout, residual discharge, blocked-delay output, and insurance margin.":"Longitud de desbordamiento requerida, incluida descarga residual, producción durante el retardo de bloqueo y margen de seguridad.","Usable accumulation length after reserving Prime and required overflow space.":"Longitud útil de acumulación después de reservar Prime y el espacio de desbordamiento requerido.","Calculated recovery margin after Back-up clears. Positive values indicate a smoother modeled restart.":"Margen de recuperación calculado después de liberarse Back-up. Los valores positivos indican un reinicio modelado más suave.","Time the useful accumulation can continue feeding the downstream critical machine.":"Tiempo durante el cual la acumulación útil puede seguir alimentando la máquina crítica aguas abajo.","Time the useful accumulation can accept upstream output before the upstream machine must be stopped.":"Tiempo durante el cual la acumulación útil puede recibir producción aguas arriba antes de detener esa máquina.","Minimum downstream infeed conveyor speed with the worksheet 5% overspeed margin.":"Velocidad mínima del transportador de entrada aguas abajo con el margen de sobrevelocidad del 5 % de la hoja.","units · Controls upstream:":"unidades · Controla aguas arriba:","Starts downstream:":"Arranca aguas abajo:","Reset playback to an earlier virtual time before applying a scenario control.":"Restablece la reproducción a un tiempo virtual anterior antes de aplicar un control de escenario.","Apply at the displayed virtual second and recalculate this simulation scenario.":"Aplica en el segundo virtual mostrado y recalcula este escenario de simulación.","scheduled for":"programado para","at virtual":"en el tiempo virtual","s. The deterministic path was recalculated.":"s. Se recalculó la trayectoria determinista.","Machine speeds relative to reference: ":"Velocidades de máquinas respecto a la referencia: ","Normal · /min":"Normal · /min","Maximum · /min":"Máxima · /min","Capacity estimate · /min":"Capacidad estimada · /min","Full run":"Ejecución completa","OEE reference: ":"Referencia de OEE: ","Investigate ":"Investigar ","highest combined starving, blocking and failure time among machines. This is a loss indicator, not proof of the line bottleneck.":"mayor tiempo combinado sin alimentación, bloqueado y en falla entre las máquinas. Es un indicador de pérdidas, no una prueba del cuello de botella."," · Full run · ":" · Ejecución completa · "," s · Seed ":" s · Semilla ","Changes":"Cambios","equipment units":"unidades de equipo","Switch to ":"Cambiar a "," view":" vista"," of ":" de "," · Demo":" · Demo","not an object":"no es un objeto","CLEAR ":"DESPEJADO "});
  // Remaining canonical resource text and explicit identity mappings for units/IDs.
  Object.assign(translations,{"Hold a bottle to accumulate; drag away to remove; click for domino; double-click for robot. − / + speed; ← / → direction. Focus here: Space hold/release, Delete remove, R robot, D domino, Esc reset.":"Mantén presionada una botella para acumular; arrástrala afuera para quitarla; haz clic para efecto dominó o doble clic para el robot. − / + ajusta velocidad; ← / → cambia dirección. Con el foco aquí: Espacio mantiene/suelta, Supr elimina, R activa robot, D dominó y Esc restablece.","Spreadsheet created in Exports. Tabs: ":"Hoja creada en Exportaciones. Pestañas: ","SimuLine simulates packaging lines to analyze throughput, accumulation and equipment behavior, compare simulations, and explore improvement scenarios with Gemini.":"SimuLine simula líneas de envasado para analizar la producción efectiva, la acumulación y el comportamiento de los equipos, comparar simulaciones y explorar escenarios de mejora con Gemini.","The case list could not be refreshed. Cached cases remain available; use Refresh cases to retry.":"No se pudo actualizar la lista de casos. Los casos en caché siguen disponibles; pulsa Actualizar casos para reintentar.","Comparison exports include selected configurations, saved summaries, equipment metrics and replication statistics. Replay frames and event logs are excluded.":"Las exportaciones de comparación incluyen configuraciones seleccionadas, resúmenes guardados, indicadores de equipos y estadísticas de réplicas. Se excluyen cuadros de reproducción y registros de eventos.","What-If proposals use the selected simulation and its current results. Suggested gains remain unverified until the proposed simulation is run.":"Las propuestas Qué pasaría si usan la simulación seleccionada y sus resultados actuales. Las ganancias sugeridas no se verifican hasta ejecutar la simulación propuesta.","Import a configuration export or paste a simulation object with equipment and optional dynamicConfig. Only the active simulation changes. Case identity and other simulations are preserved. Apply clears previous results.":"Importa una configuración exportada o pega un objeto de simulación con equipment y dynamicConfig opcional. Sólo cambia la simulación activa; se conservan la identidad del caso y las demás simulaciones. Aplicar borra resultados anteriores."," · Accumulated capacity = floor(length / accumulated pitch): ":" · Capacidad acumulada = piso(longitud / paso acumulado): ","Includes the selected simulation inputs and settings. Results and replay are not included.":"Incluye las entradas y la configuración de la simulación seleccionada. No incluye resultados ni reproducción.","Aggregates and selected inputs only; replay, event logs, command schedules and raw imports are excluded. Coverage reports omissions. Time metrics are seconds unless their field name states otherwise; nominal rates are units per second. Throughput is final output divided by full duration, multiplied by 60. Equipment loss totals may overlap in clock time and are not line downtime. Quality is assumed 100%; scenarios are untested proposals, not guaranteed gains. MTBF/MTTR are fixed plant inputs. The character limit is not a guarantee of compatibility with every model context window.":"Sólo se incluyen agregados y entradas seleccionadas; se excluyen reproducción, eventos, programas de comandos e importaciones sin procesar. La cobertura informa las omisiones. Los indicadores de tiempo usan segundos salvo indicación contraria; las velocidades nominales usan unidades por segundo. La producción efectiva es la producción final dividida entre duración total, multiplicada por 60. Las pérdidas de equipos pueden superponerse temporalmente y no equivalen a paradas de línea. Se supone calidad del 100 %; los escenarios son propuestas no probadas, no ganancias garantizadas. MTBF/MTTR son entradas fijas de planta. El límite de caracteres no garantiza compatibilidad con todas las ventanas de contexto.","Throughput uses final equipment output over the complete run. Metric names specify seconds, counts, rates or percentages. Loss totals sum equipment time and can overlap; they are not elapsed line downtime. Quality is assumed 100%. The report includes configuration for interpretation, not replay or individual events.":"La producción efectiva usa la salida del último equipo durante toda la ejecución. Los nombres de indicadores especifican segundos, cantidades, velocidades o porcentajes. Los totales de pérdidas suman tiempos de equipos y pueden superponerse; no son tiempo de parada de línea. Se supone calidad del 100 %. El informe incluye configuración para interpretar resultados, no reproducción ni eventos individuales.","Allow pop-ups for this app, then export again. In the print dialog, select Save as PDF. You can also export the HTML report and print it from your browser.":"Permite las ventanas emergentes de esta aplicación y vuelve a exportar. En el diálogo de impresión, selecciona Guardar como PDF. También puedes exportar el informe HTML e imprimirlo desde el navegador.","Complete the required fields and correct invalid JSON before this change can be saved.":"Completa los campos obligatorios y corrige el JSON inválido antes de guardar este cambio.","Your changes have not overwritten the newer version. Download your draft before loading the version from Drive, then review the differences.":"Tus cambios no sobrescribieron la versión más reciente. Descarga el borrador antes de cargar la versión de Drive y revisa las diferencias.","Remove this equipment from the current simulation? Its results will be cleared.":"¿Quitar este equipo de la simulación actual? Se borrarán sus resultados.","Keep at least one simulation in the case. You can delete the entire case in Settings.":"Conserva al menos una simulación en el caso. Puedes eliminar el caso completo desde Configuración.","Advanced engine configuration. These values are populated by the forms and Sheet import. Most users do not need to edit JSON. Invalid JSON   "Gross equivalent production shortfall at the final output. Deficits during positive-flow intervals are summed against each format's reference before subtracting recovery. These are neither rejects nor a forecast of recoverable production.": "Pérdida bruta de producción equivalente en la salida final. Se suman los déficits con flujo positivo respecto a la referencia de cada formato, antes de descontar la recuperación. No son rechazos ni una predicción de producción recuperable.",
  "100 × equivalent quantity not produced / ideal production over the full simulated duration. Ideal production uses the reference and duration of each format. This is gross loss; full stops are excluded.": "100 × cantidad equivalente no producida / producción ideal de toda la duración simulada. La producción ideal considera la referencia y duración de cada formato. Es pérdida bruta; excluye paradas completas.",
  "Efficiency percentage points lost: 100 × equivalent quantity not produced / simulated ideal production. For example, a loss of 5 pp reduces efficiency from 80% to 75%, with all other components unchanged. It is not a relative 5% reduction or automatically an AU loss.": "Puntos porcentuales de eficiencia perdidos: 100 × cantidad equivalente no producida / producción ideal simulada. Ejemplo: perder 5 pp llevaría una eficiencia del 80 % al 75 %, manteniendo los demás componentes constantes. No es una reducción relativa del 5 % ni automáticamente una pérdida de AU.",
  "Gross line loss before subtracting above-reference recovery. Ideal production lost (%) and efficiency lost (pp) have the same numerical value because they share a denominator; do not add them. Full stops are accounted for separately. Equipment losses are not summed. The net balance is shown below. — indicates a missing valid reference or a result that must be recalculated.": "Pérdida bruta de la línea, antes de descontar la recuperación por encima de la referencia. El porcentaje de producción ideal perdida y los puntos porcentuales de eficiencia tienen el mismo valor numérico porque comparten denominador; no se suman. Las paradas completas se contabilizan aparte. No se suman las pérdidas de equipos. El balance neto se muestra en el desglose inferior. — significa que falta una referencia válida o que este resultado debe recalcularse.",
  "Line indicator measured at the final output: gross loss, recovery or net balance. Each row has its own explanation.": "Indicador de la línea medido en la salida final: pérdida bruta, recuperación o balance neto. Cada fila tiene su propia explicación.",
  "Equivalent minutes relative to each format's reference rate. These are not necessarily clock minutes. Full stops are excluded.": "Minutos equivalentes respecto a la velocidad de referencia de cada formato. No son necesariamente minutos de reloj. Se excluyen las paradas completas.",
  "Equivalent quantity lost or produced above the reference. This does not automatically represent rejected bottles or guaranteed additional production.": "Cantidad equivalente de producción perdida o producida por encima de la referencia. No representa automáticamente botellas rechazadas ni producción adicional garantizada.",
  "Effect relative to ideal production over the full simulated duration. Negative: loss; positive: recovery. Unit: percentage points (pp). Not automatically equivalent to AU.": "Efecto respecto a la producción ideal de toda la duración simulada. Negativo: pérdida; positivo: recuperación. Unidad: puntos porcentuales (pp). No equivale automáticamente a AU.",
  "Gross line rate loss sums only deficits during positive-output intervals below the format reference. It does not subtract later recovery and excludes full stops. It is not the sum of equipment losses.": "Pérdida bruta de velocidad de la línea: suma solo los déficits de los intervalos con salida positiva por debajo de la referencia del formato. No resta la recuperación posterior y excluye las paradas completas. No es la suma de pérdidas por equipo.",
  "Above-reference recovery sums excess output during intervals above the format reference. It may result from buffer discharge; it does not mean the cause of the loss was eliminated.": "Recuperación por encima de la referencia: suma el excedente de salida de los intervalos que superan la referencia del formato. Puede deberse a la descarga de acumuladores; no significa que se eliminó la causa de la pérdida.",
  "Net line rate balance = gross loss − recovery. Positive minutes or bottles indicate a net deficit; negative indicates a surplus. The efficiency column reverses the sign to show loss or gain. Example: 10 min of loss − 8 min of recovery = 2 net min.": "Balance neto de velocidad de la línea = pérdida bruta − recuperación. Positivo en minutos o botellas: déficit neto; negativo: excedente neto. En la columna de eficiencia el signo se invierte para mostrar pérdida o ganancia. Ejemplo: 10 min de pérdida − 8 min de recuperación = 2 min netos.",
  "The line table attributes the output deficit once. Partial starvation identifies the immediate mechanism and may originate upstream. Unassigned covers deficits that cannot be linked to an output category. Equipment counters are local and may overlap.": "La tabla de línea reparte el déficit de salida una sola vez. La falta parcial de producto identifica el mecanismo inmediato y puede tener su origen aguas arriba. Sin atribuir incluye el déficit que la salida no permite asociar a una categoría. Los contadores por equipo son locales y pueden solaparse.",
  "The line breakdown requires a continuous-engine run with the new counters.": "El desglose de línea requiere una corrida del motor continuo con los contadores nuevos.",
  "Equipment or conveyor whose counters are shown. The last row sums every listed equipment item, including conveyors.": "Equipo o transportador cuyos contadores se muestran. La última fila suma todos los equipos listados, incluidos los transportadores.",
  "Accumulated time with positive processed flow, in minutes. A partially productive interval counts in full; stops and waits without flow are excluded. This is not unique line operating time.": "Tiempo acumulado con flujo procesado positivo, en minutos. Un intervalo parcialmente productivo cuenta completo; se excluyen las paradas y las esperas sin flujo. No es tiempo único de operación de línea.",
  "Processed quantity converted to equivalent minutes at the equipment's own nominal rate for each format. This is not clock time, ramp duration or rejected product.": "Cantidad procesada convertida a minutos equivalentes a la velocidad nominal propia del equipo para cada formato. No es tiempo de reloj, duración de rampa ni producto rechazado.",
  "Net balance = operating time − equivalent productive time. Positive: deficit; negative: production above the equipment's own reference. The algebraic sum includes simultaneous times, may exceed simulated duration, and is not equivalent to line rate loss. — indicates unavailable data.": "Balance neto = tiempo de operación − tiempo productivo equivalente. Positivo: déficit; negativo: producción por encima de la referencia propia. La sumatoria es algebraica e incluye tiempos simultáneos: puede superar la duración simulada y no equivale al rate loss de línea. — significa dato no disponible.",
  "Equipment or conveyor where phases are recorded. Conveyor sensors may trigger a ramp or stop in an adjacent machine.": "Equipo o transportador donde se registran las fases. Los sensores de un transportador pueden activar una rampa o parada en una máquina vecina.",
  "Accumulated seconds in executed acceleration ramps. Excludes startup waiting and repair. A stop may interrupt a ramp. This is phase duration, not equivalent lost production time.": "Segundos acumulados en rampas de aceleración ejecutadas. Excluye espera de arranque y reparación. Una parada puede interrumpir la rampa. Es duración de fase, no tiempo equivalente de producción perdida.",
  "Bottle equivalents processed during ramps. These are not lost or rejected bottles. The same product can be counted at several machines; the sum is not unique line production.": "Botellas equivalentes procesadas durante las rampas. No son botellas perdidas ni rechazadas. El mismo producto puede contarse en varios equipos; su suma no es producción única de línea.",
  "Accumulated seconds responding to the accumulation signal and residual discharge before stopping. Not the total stop or repair time. Gradual deceleration is not modeled.": "Segundos acumulados de respuesta a la señal de acumulación y descarga residual antes de detenerse. No es el tiempo total de parada ni de reparación. No se modela desaceleración gradual.",
  "Bottle equivalents processed during stop response and residual discharge. These are not automatically losses or rejects. Counts across equipment may include the same product.": "Botellas equivalentes procesadas durante la respuesta de parada y descarga residual. No son automáticamente pérdidas o rechazos. Los conteos entre equipos pueden incluir el mismo producto.",
  "Number of executed startup ramps: initial, command, sensor or repair ramps when enabled. Interrupted ramps also count. Average views may show fractional values.": "Cantidad de rampas de arranque ejecutadas: iniciales, por comando, por sensor o por reparación si se habilitaron. Las rampas interrumpidas también cuentan. En vista promedio puede haber valores fraccionarios.",
  "Number of restart sequences requested after repairs. May be greater than zero with post-repair ramps disabled. Material or stop conditions may delay flow. Not equivalent to the number of executed ramps.": "Cantidad de secuencias de reinicio solicitadas al terminar una reparación. Puede ser mayor que cero con rampas tras reparación desactivadas. Las condiciones de material o parada pueden retrasar el flujo. No equivale al número de rampas ejecutadas.",
  "Includes saved 2D state, production and equipment times when available, layout and any run saved with a representative seed. Independent of numerical results.": "Incluye el estado guardado de 2D, producción y tiempos por equipo cuando estén disponibles, además del layout y cualquier corrida guardada con semilla representativa. Es independiente de los resultados numéricos.",
  "Sum of equipment-internal failure minutes from MTBF/MTTR. Includes simultaneous times. Click to view minutes and the percentage share by equipment.": "Suma de minutos en falla propia por MTBF/MTTR de todos los equipos. Incluye tiempos simultáneos. Pulsa para ver minutos y participación porcentual por equipo.",

  "Pérdida bruta de producción equivalente en la salida final. Se suman los déficits con flujo positivo respecto a la referencia de cada formato, antes de descontar la recuperación. No son rechazos ni una predicción de producción recuperable.": "Gross equivalent production shortfall at the final output. Deficits during positive-flow intervals are summed against each format's reference before subtracting recovery. These are neither rejects nor a forecast of recoverable production.",
  "100 × cantidad equivalente no producida / producción ideal de toda la duración simulada. La producción ideal considera la referencia y duración de cada formato. Es pérdida bruta; excluye paradas completas.": "100 × equivalent quantity not produced / ideal production over the full simulated duration. Ideal production uses the reference and duration of each format. This is gross loss; full stops are excluded.",
  "Puntos porcentuales de eficiencia perdidos: 100 × cantidad equivalente no producida / producción ideal simulada. Ejemplo: perder 5 pp llevaría una eficiencia del 80 % al 75 %, manteniendo los demás componentes constantes. No es una reducción relativa del 5 % ni automáticamente una pérdida de AU.": "Efficiency percentage points lost: 100 × equivalent quantity not produced / simulated ideal production. For example, a loss of 5 pp reduces efficiency from 80% to 75%, with all other components unchanged. It is not a relative 5% reduction or automatically an AU loss.",
  "Pérdida bruta de la línea, antes de descontar la recuperación por encima de la referencia. El porcentaje de producción ideal perdida y los puntos porcentuales de eficiencia tienen el mismo valor numérico porque comparten denominador; no se suman. Las paradas completas se contabilizan aparte. No se suman las pérdidas de equipos. El balance neto se muestra en el desglose inferior. — significa que falta una referencia válida o que este resultado debe recalcularse.": "Gross line loss before subtracting above-reference recovery. Ideal production lost (%) and efficiency lost (pp) have the same numerical value because they share a denominator; do not add them. Full stops are accounted for separately. Equipment losses are not summed. The net balance is shown below. — indicates a missing valid reference or a result that must be recalculated.",
  "Indicador de la línea medido en la salida final: pérdida bruta, recuperación o balance neto. Cada fila tiene su propia explicación.": "Line indicator measured at the final output: gross loss, recovery or net balance. Each row has its own explanation.",
  "Minutos equivalentes respecto a la velocidad de referencia de cada formato. No son necesariamente minutos de reloj. Se excluyen las paradas completas.": "Equivalent minutes relative to each format's reference rate. These are not necessarily clock minutes. Full stops are excluded.",
  "Cantidad equivalente de producción perdida o producida por encima de la referencia. No representa automáticamente botellas rechazadas ni producción adicional garantizada.": "Equivalent quantity lost or produced above the reference. This does not automatically represent rejected bottles or guaranteed additional production.",
  "Efecto respecto a la producción ideal de toda la duración simulada. Negativo: pérdida; positivo: recuperación. Unidad: puntos porcentuales (pp). No equivale automáticamente a AU.": "Effect relative to ideal production over the full simulated duration. Negative: loss; positive: recovery. Unit: percentage points (pp). Not automatically equivalent to AU.",
  "Pérdida bruta de velocidad de la línea: suma solo los déficits de los intervalos con salida positiva por debajo de la referencia del formato. No resta la recuperación posterior y excluye las paradas completas. No es la suma de pérdidas por equipo.": "Gross line rate loss sums only deficits during positive-output intervals below the format reference. It does not subtract later recovery and excludes full stops. It is not the sum of equipment losses.",
  "Recuperación por encima de la referencia: suma el excedente de salida de los intervalos que superan la referencia del formato. Puede deberse a la descarga de acumuladores; no significa que se eliminó la causa de la pérdida.": "Above-reference recovery sums excess output during intervals above the format reference. It may result from buffer discharge; it does not mean the cause of the loss was eliminated.",
  "Balance neto de velocidad de la línea = pérdida bruta − recuperación. Positivo en minutos o botellas: déficit neto; negativo: excedente neto. En la columna de eficiencia el signo se invierte para mostrar pérdida o ganancia. Ejemplo: 10 min de pérdida − 8 min de recuperación = 2 min netos.": "Net line rate balance = gross loss − recovery. Positive minutes or bottles indicate a net deficit; negative indicates a surplus. The efficiency column reverses the sign to show loss or gain. Example: 10 min of loss − 8 min of recovery = 2 net min.",
  "La tabla de línea reparte el déficit de salida una sola vez. La falta parcial de producto identifica el mecanismo inmediato y puede tener su origen aguas arriba. Sin atribuir incluye el déficit que la salida no permite asociar a una categoría. Los contadores por equipo son locales y pueden solaparse.": "The line table attributes the output deficit once. Partial starvation identifies the immediate mechanism and may originate upstream. Unassigned covers deficits that cannot be linked to an output category. Equipment counters are local and may overlap.",
  "El desglose de línea requiere una corrida del motor continuo con los contadores nuevos.": "The line breakdown requires a continuous-engine run with the new counters.",
  "Equipo o transportador cuyos contadores se muestran. La última fila suma todos los equipos listados, incluidos los transportadores.": "Equipment or conveyor whose counters are shown. The last row sums every listed equipment item, including conveyors.",
  "Tiempo acumulado con flujo procesado positivo, en minutos. Un intervalo parcialmente productivo cuenta completo; se excluyen las paradas y las esperas sin flujo. No es tiempo único de operación de línea.": "Accumulated time with positive processed flow, in minutes. A partially productive interval counts in full; stops and waits without flow are excluded. This is not unique line operating time.",
  "Cantidad procesada convertida a minutos equivalentes a la velocidad nominal propia del equipo para cada formato. No es tiempo de reloj, duración de rampa ni producto rechazado.": "Processed quantity converted to equivalent minutes at the equipment's own nominal rate for each format. This is not clock time, ramp duration or rejected product.",
  "Balance neto = tiempo de operación − tiempo productivo equivalente. Positivo: déficit; negativo: producción por encima de la referencia propia. La sumatoria es algebraica e incluye tiempos simultáneos: puede superar la duración simulada y no equivale al rate loss de línea. — significa dato no disponible.": "Net balance = operating time − equivalent productive time. Positive: deficit; negative: production above the equipment's own reference. The algebraic sum includes simultaneous times, may exceed simulated duration, and is not equivalent to line rate loss. — indicates unavailable data.",
  "Equipo o transportador donde se registran las fases. Los sensores de un transportador pueden activar una rampa o parada en una máquina vecina.": "Equipment or conveyor where phases are recorded. Conveyor sensors may trigger a ramp or stop in an adjacent machine.",
  "Segundos acumulados en rampas de aceleración ejecutadas. Excluye espera de arranque y reparación. Una parada puede interrumpir la rampa. Es duración de fase, no tiempo equivalente de producción perdida.": "Accumulated seconds in executed acceleration ramps. Excludes startup waiting and repair. A stop may interrupt a ramp. This is phase duration, not equivalent lost production time.",
  "Botellas equivalentes procesadas durante las rampas. No son botellas perdidas ni rechazadas. El mismo producto puede contarse en varios equipos; su suma no es producción única de línea.": "Bottle equivalents processed during ramps. These are not lost or rejected bottles. The same product can be counted at several machines; the sum is not unique line production.",
  "Segundos acumulados de respuesta a la señal de acumulación y descarga residual antes de detenerse. No es el tiempo total de parada ni de reparación. No se modela desaceleración gradual.": "Accumulated seconds responding to the accumulation signal and residual discharge before stopping. Not the total stop or repair time. Gradual deceleration is not modeled.",
  "Botellas equivalentes procesadas durante la respuesta de parada y descarga residual. No son automáticamente pérdidas o rechazos. Los conteos entre equipos pueden incluir el mismo producto.": "Bottle equivalents processed during stop response and residual discharge. These are not automatically losses or rejects. Counts across equipment may include the same product.",
  "Cantidad de rampas de arranque ejecutadas: iniciales, por comando, por sensor o por reparación si se habilitaron. Las rampas interrumpidas también cuentan. En vista promedio puede haber valores fraccionarios.": "Number of executed startup ramps: initial, command, sensor or repair ramps when enabled. Interrupted ramps also count. Average views may show fractional values.",
  "Cantidad de secuencias de reinicio solicitadas al terminar una reparación. Puede ser mayor que cero con rampas tras reparación desactivadas. Las condiciones de material o parada pueden retrasar el flujo. No equivale al número de rampas ejecutadas.": "Number of restart sequences requested after repairs. May be greater than zero with post-repair ramps disabled. Material or stop conditions may delay flow. Not equivalent to the number of executed ramps.",
  "Incluye el estado guardado de 2D, producción y tiempos por equipo cuando estén disponibles, además del layout y cualquier corrida guardada con semilla representativa. Es independiente de los resultados numéricos.": "Includes saved 2D state, production and equipment times when available, layout and any run saved with a representative seed. Independent of numerical results.",
  "Suma de minutos en falla propia por MTBF/MTTR de todos los equipos. Incluye tiempos simultáneos. Pulsa para ver minutos y participación porcentual por equipo.": "Sum of equipment-internal failure minutes from MTBF/MTTR. Includes simultaneous times. Click to view minutes and the percentage share by equipment.",
  "Tiempo efectivo según la fórmula solicitada: Production Available Time − Unplanned Downtime de línea − Production Rate Losses (pérdida bruta de velocidad).": "Effective time according to the requested formula: Production Available Time − line Unplanned Downtime − Production Rate Losses (gross rate loss).",
