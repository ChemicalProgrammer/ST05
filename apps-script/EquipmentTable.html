  function makeProxy(original,card,fallback){

  function cellContent(cell,card,column){

  function actionButton(icon,label,fn){

  }

  function canMove(card){var handle=card.querySelector('.equipment-drag');return Boolean(handle&&!handle.disabled);}

  // One cancellable pointer gesture at a time. The row/resize handles use
  // capture for touch and mouse; losing capture, Escape or a view rebuild
  // cancels without committing a model change.
  function startGesture(event,handle,onMove,onEnd,onCancel){

  function reorder(card,target,layout){
    if(!target||card===target||!canMove(card)||!layout.cards.includes(target))return;

  }
  function bindRowDrag(symbol,row,card,layout){
    var label=tr('Drag to reorder; use Up/Down keys','Arrastra para reordenar; usa las flechas arriba/abajo');
    symbol.title=label;symbol.setAttribute('aria-label',label);
    symbol.addEventListener('keydown',e=>{
      if(symbol.disabled||!['ArrowUp','ArrowDown'].includes(e.key))return;

    });

      if(symbol.disabled)return;
      var start=e.clientY,from=layout.cards.indexOf(card),target=from,dragging=false;
      function clear(){

      }

    });

  function headingParts(text){
    // Labels have a trailing parenthesized unit, if any; keep it in the
    // dedicated second row rather than duplicating units in every cell.
    var match=text.match(/^(.*?)\s*\(([^()]*)\)\s*$/);
    return match?{name:match[1],unit:match[2]}:{name:text,unit:''};
  }
  function widthKey(layout,id){return (layout.conveyor?'conveyors':'equipment')+':'+id;}
  function clampWidth(width,min){return Math.max(min,Math.min(1000,Math.round(width)));}
  function measureText(value,element){
    // Browser typography, with a deterministic fallback for non-layout tests.
    var text=String(value??''),key=element.tagName+':'+element.className+':'+(element.type||'');
    var styles=measureText.styles||(measureText.styles=new Map()),style=styles.get(key);

  function sizing(layout,descriptor){
    var {id,head,unit,cells}=descriptor;
    var min=id==='name'?152:id==='evaluation'?76:44;
    var fit=Math.max(min,measureText(head.textContent,head)+24,measureText(unit.textContent,unit)+24);
    if(id==='delete')return {min,fit};
    cells.forEach(cell=>{
      var width=0;
      for(var control of cell.querySelectorAll('.equipment-table-control:not([hidden])')){
        if(control.type==='checkbox'){width+=20;continue;}
        var select=control.tagName==='SELECT',output=control.tagName==='OUTPUT',number=control.type==='number';
        var value=select?(control.selectedOptions?.[0]?.textContent||control.value):output?control.textContent:control.value;

  }
  function applyWidths(layout){

  function bindResize(descriptor,layout){
    var handle=descriptor.handle,label=tr('Resize column','Cambiar ancho de columna')+' · '+descriptor.head.textContent;

  }
  function appendColumn(layout,headRow,unitRow,colgroup,id,label,group){

  function groupHeader(row,label,count,identity=false){

  function renderTable(host,cards,conveyor,groups,showTitle){

    var scroller=node('div','equipment-table-scroll'),table=node('table','equipment-editor-table'),head=node('thead'),groupRow=node('tr','equipment-table-groups'),top=node('tr','equipment-table-labels'),bottom=node('tr','equipment-table-units');

    groups.forEach(g=>{
      var label=tr(g.en,g.es),cols=node('colgroup');
      groupHeader(groupRow,label,g.columns.length);

        params.push({column:c,descriptor});
      });

    });
    var deleteCols=node('colgroup');
    groupHeader(groupRow,'',1);
    var deletion=appendColumn(layout,top,bottom,deleteCols,'delete',tr('Delete','Eliminar'));
    table.append(deleteCols);
    head.append(groupRow,top,bottom);table.append(head);
    var body=node('tbody');
    cards.forEach(card=>{
      var row=node('tr');row.dataset.tableEquipmentId=card.dataset.equipmentId;layout.rows.push(row);
      var identity=node('td','equipment-table-identity'),wrap=node('div','equipment-table-name'),symbol=node('button','equipment-table-symbol');
      symbol.type='button';symbol.innerHTML=window.STIcons?.equipment(type(card))||'';bindRowDrag(symbol,row,card,layout);
      var original=source(card,'.equipment-name');wrap.append(symbol);
      if(original)wrap.append(makeProxy(original,card,tr('Name','Nombre')).proxy);
      else wrap.append(node('span','',card.dataset.equipmentId));
      identity.dataset.column='name';identity.append(wrap);row.append(identity);name.cells.push(identity);
      var status=node('td','equipment-table-center');status.dataset.column='evaluation';
      var verdict=evaluationCell(card,status);row.append(status);evaluation.cells.push(status);
      params.forEach(({column,descriptor})=>{var td=node('td');td.dataset.column=column.id;cellContent(td,card,column);row.append(td);descriptor.cells.push(td);});
      var last=node('td','equipment-table-center');last.dataset.column='delete';
      var remove=actionButton('trash',tr('Delete equipment','Eliminar equipo'),()=>card.querySelector('.remove-equipment')?.click());
      last.append(remove);row.append(last);deletion.cells.push(last);
      rowActions.push({card,verdict,symbol,remove,layout});body.append(row);
    });
    table.append(body);scroller.append(table);host.append(scroller);
  }
  function refresh(){
    if(!active||updating)return;
    var host=el('equipment-table-view'),list=el('equipment-list');if(!host||!list)return;
    updating=true;
    try{
      var cards=Array.from(list.querySelectorAll('.equipment-card:not(.hidden)'));
      var kinds=[cards.filter(c=>type(c)!=='CONVEYOR'),cards.filter(c=>type(c)==='CONVEYOR')];
      var groups=kinds.map((group,i)=>columnGroups(group,i===1));
      var next=JSON.stringify([document.documentElement.lang,cards.map(c=>[c.dataset.equipmentId,type(c)]),groups.map(gs=>gs.map(g=>g.columns.map(c=>c.id)))]);
      var rebuild=next!==signature||renderedCards.length!==cards.length||cards.some((c,i)=>renderedCards[i]!==c);
      if(rebuild){
        var scrolls=Array.from(host.querySelectorAll('.equipment-table-scroll')).map(n=>n.scrollLeft);
        var focused=document.activeElement,focusBinding=bindings.find(b=>b.proxy===focused),focusAction=rowActions.find(a=>a.symbol===focused);
        gesture?.cancel();
        signature=next;renderedCards=cards;bindings=[];rowActions=[];tableLayouts=[];host.replaceChildren();
        kinds.forEach((items,i)=>{if(items.length)renderTable(host,items,i===1,groups[i],!separate&&kinds.every(g=>g.length));});
        if(!cards.length&&!list.querySelector('.equipment-card'))host.append(node('p','empty',list.querySelector('.empty')?.textContent||tr('No equipment.','Sin equipos.')));
        host.querySelectorAll('.equipment-table-scroll').forEach((n,i)=>{n.scrollLeft=scrolls[i]||0;});
        if(focusBinding)bindings.find(b=>b.original===focusBinding.original)?.proxy.focus({preventScroll:true});
        if(focusAction)rowActions.find(a=>a.card===focusAction.card)?.symbol.focus({preventScroll:true});
      }
      bindings.forEach(syncControl);
      host.querySelectorAll('[data-column]').forEach(cell=>{if(cell._tableBindings)cell._tableMissing.hidden=cell._tableBindings.some(b=>applicable(b.original,b.card));});
      rowActions.forEach(syncActions);
      if(!gesture)tableLayouts.forEach(fitColumns);
    }finally{updating=false;}
  }
  function scheduleRefresh(){
    if(queued)return;queued=true;queueMicrotask(function(){queued=false;refresh();});
  }
  function select(mode){
    if(!current||!['cards','table'].includes(mode))return;
    labels[scope]=mode;window.STPreferences?.write('equipmentView.'+scope,mode);
    // Reuse the existing editor layout coordinator. View changes alone do
    // not invalidate results, mark the case dirty, or commit input values.
    window.STBasicMode?.sync(current);
  }
  function sync(state,view,split){
    current=state;section=view;separate=Boolean(split);scope=key(view,separate);
    var tools=el('equipment-view-tools'),host=el('equipment-table-view'),container=el('equipment-section');
    if(!tools||!host||!container)return;
    if(!initialized){
      initialized=true;
      el('equipment-view-cards').addEventListener('click',()=>select('cards'));
      el('equipment-view-table').addEventListener('click',()=>select('table'));
      window.addEventListener('st-language-change',()=>{sync(current,section,separate);scheduleRefresh();});
    }
    var allowed=Boolean(state?.activeCase&&state.uiView==='editor'&&['ADVANCE','ADVANCED'].includes(String(state.bootstrap?.uiMode||'').toUpperCase()));
    var next=allowed&&wantsTable(state,view,separate);
    tools.hidden=!allowed;
    tools.setAttribute('aria-label',tr('Equipment presentation','Vista de equipos'));
    for(var [id,on,en,es] of [['equipment-view-cards',!next,'Card view','Vista de tarjetas'],['equipment-view-table',next,'Table view','Vista de tablas']]){
      var b=el(id),label=tr(en,es);b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',label);b.title=label;
    }
    container.dataset.equipmentEditorView=next?'table':'cards';
    host.hidden=!next;
    if(next&&!active){
      // Combined layouts may have moved the fields into the side inspector.
      // Return them intact before hiding the original presentation.
      var selection=window.STEquipmentInspector?.release();window.STEquipmentInspector?.hide();
      if(selection)window.dispatchEvent(new Event('st:inspector'));
    }
    active=next;
    if(active)refresh();
    else{gesture?.cancel();host.replaceChildren();signature='';renderedCards=[];bindings=[];rowActions=[];tableLayouts=[];}
  }
  return {sync:sync,refresh:refresh,wantsTable:wantsTable};
})();
</script>
