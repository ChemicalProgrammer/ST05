<script>
window.STEquipmentInspector=(function(){
  var state,selected=null,opened=false,context='',helpSequence=0;
  function el(id){return document.getElementById(id);}
  function key(){return (state?.activeCase?.id||'')+':'+(state?.activeSimulationId||'');}
  function release(){
    var selection=selected?{id:selected.dataset.equipmentId,opened:opened,context:context}:null;
    if(selected){selected.appendChild(selected._fields);selected.classList.remove('equipment-selected');}
    selected=null;return selection;
  }
  function restore(selection){
    if(!selection||selection.context!==key()){opened=false;return;}
    var card=Array.from(document.querySelectorAll('#equipment-list .equipment-card')).find(function(c){return c.dataset.equipmentId===selection.id;});
    if(card){select(card,false);opened=selection.opened;}else opened=false;
  }
  function refreshTitle(card){
    var fields=card._fields;if(!fields)return;
    var control=fields.querySelector('.equipment-type'),type=control.value,header=card.querySelector('.equipment-header'),title=header.querySelector('strong');
    card.dataset.equipmentType=type;
    var symbol=header.querySelector('.equipment-card-symbol');
    if(!symbol){symbol=document.createElement('span');symbol.className='equipment-card-symbol';symbol.setAttribute('aria-hidden','true');header.prepend(symbol);}
    if(symbol.dataset.type!==type){symbol.innerHTML=STIcons.equipment(type);symbol.dataset.type=type;}
    if(window.STBasicMode?.isSplit()){title.textContent=fields.querySelector('.equipment-name').value;return;}
    var name=document.createElement('span');name.className='equipment-title-name';name.textContent=fields.querySelector('.equipment-name').value||card.dataset.equipmentId||'—';
    var meta=document.createElement('span');meta.className='equipment-title-meta';meta.textContent=' '+(control.selectedOptions[0]?.textContent||type);
    if(type!=='CONVEYOR'){var rate=fields.querySelector('.equipment-rate'),value=Number(rate.value);meta.textContent+=' · '+(rate.value&&Number.isFinite(value)?value.toLocaleString(undefined,{maximumFractionDigits:2}):'—')+__ST_TEXT__('client.bpm');}
    title.replaceChildren(name,meta);
  }
  function select(card,focus){
    if(window.STBasicMode?.inline(card))return;
    if(selected===card){opened=true;return;}
    var previous=selected,panel=el('equipment-inspector'),scroll=panel.scrollTop;
    // Keep field instances bound to their equipment. Swapping values between
    // cards also swaps context-dependent metadata incompletely (format and
    // reliability inputs), risking accidental edits to a different item.
    release();selected=card;context=key();opened=true;
    if(!card._helpReady){decorate(card);card._helpReady=true;}
    panel.appendChild(card._fields);card.classList.add('equipment-selected');
    window.dispatchEvent(new Event('st:inspector'));
    if(previous)panel.scrollTop=scroll;
    if(focus!==false)panel.querySelector('input,select,textarea')?.focus({preventScroll:true});
  }
  function sync(){
    if(context!==key()){release();opened=false;el('equipment-inspector').textContent='';}
    var visible=Boolean(opened&&selected&&state.activeCase&&state.uiView==='editor');
    return visible;
  }
  function init(current,dirty){
    state=current;
    ['input','change'].forEach(function(type){el('equipment-inspector').addEventListener(type,function(event){if(event.target.matches('input,select,textarea')){var fields=selected?._fields;if(fields){selected.querySelector('.equipment-header strong').textContent=fields.querySelector('.equipment-type').value+' · '+fields.querySelector('.equipment-name').value+(fields.querySelector('.equipment-type').value==='CONVEYOR'?'':' · '+Number(fields.querySelector('.equipment-rate').value)+__ST_TEXT__('client.bpm'));refreshTitle(selected);}dirty(event);}});});
  }
  var parameterHelp={
  "equipment-name": [

  ],
  "equipment-type": [
    "Physical machine function; determines the simulation model.",
    "Función física del equipo; determina su modelo de simulación."

  "equipment-rate": [

  ],
  "equipment-material-flow": [
    "Input → output units. A conveyor inherits the connected machines' flow.",
    "Unidades de entrada → salida. El conveyor hereda el flujo de las máquinas conectadas."
  ],
  "equipment-pacemaker": [
    "Reference machine for ideal line production and efficiency.",

  "equipment-internal-capacity": [

  "reliability-enabled": [

  "reliability-mode": [

  "reliability-mtbfMinutes": [

  "format-zone-package-length": [

  "format-zone-discharge-pitch": [

  "format-zone-discharge-velocity": [

  "format-zone-residual": [

  "format-zone-stop-response": [

    "Tras confirmar Back-up el bloqueo sostenido, la máquina anterior recibe la orden de paro. Stop Response va desde esa orden hasta finalizar la respuesta; puede continuar el flujo según inventario y capacidad. Los envases residuales son una cantidad aparte. Cero significa respuesta inmediata."

  "format-zone-infeed": [
    "Center-to-center spacing at downstream infeed (mm). Used with its native input rate.",
    "Separación centro a centro en entrada siguiente (mm). Se usa con su flujo nativo de entrada."
  ],
  "format-zone-downstream-ramp": [
    "Time to reach full downstream machine speed after restart (s).",
    "Tiempo para alcanzar velocidad plena de máquina siguiente tras rearranque (s)."
  ],
  "format-zone-discharge-runout": [
    "Installed segment between upstream machine exit and Coding/Overflow. Checked: enter length in mm (blank = 0). Unchecked: design transit seconds × local Discharge speed in mm/s. Used for overflow reserve and recovery, not an independent delay.",
    "Tramo instalado entre salida anterior y Coding/Overflow. Marcado: longitud en mm (vacío = 0). Desmarcado: segundos de tránsito de diseño × velocidad local Discharge en mm/s. Se usa para reserva Overflow y recuperación, no como retardo independiente."
  ],
  "format-zone-reject-runout": [
    "Installed Coding segment before Overflow. Checked: measured mm (blank = 0). Unchecked: design transit seconds × Coding speed in mm/s. Used in installed geometry and overflow/recovery analysis.",
    "Tramo Coding instalado antes de Overflow. Marcado: mm medidos (vacío = 0). Desmarcado: segundos de tránsito de diseño × velocidad Coding en mm/s. Se usa en geometría instalada y análisis de Overflow/recuperación."
  ],
  "format-zone-backup": [
    "Position of Back-up photoeye from conveyor entry (mm). Manual only for installed value; otherwise derived from LBA or required overflow.",

  "format-zone-speed-mode": [
    "Manual uses actual belt speed. Auto uses speed factors. Dynamic uses a specified Normal or Maximum speed and a percentage; available in Advance. Target Population/Overspeed is exclusive with Dynamic.",
    "Manual usa velocidad real de banda. Auto usa factores. Dynamic usa una velocidad Normal o Máxima y un porcentaje; disponible en Advance. Population/Overspeed objetivo es incompatible con Dynamic."
  ],
  "format-zone-belt-speed": [
    "Linear belt speed in m/min in all editor modes; internally converted to mm/s for travel, transfer capacity and sensor timing. Basic uses manual speed; Advance supports automatic/target speeds and dynamic Normal/Maximum reference.",

  ],
  "format-zone-discharge-runout-time": ["Design transit time across Discharge; multiplied by local speed to size installed length. Not Stop Response.","Tiempo de tránsito de diseño en Discharge; se multiplica por velocidad local para dimensionar el tramo. No es Stop Response."],
  "format-zone-reject-runout-time": ["Design transit time across Coding; multiplied by local Coding velocity to size installed length.","Tiempo de tránsito de diseño en Coding; se multiplica por su velocidad local para dimensionar el tramo."],
  "format-zone-accumulation-seconds": ["Full useful zone protection = floor(LBA / packed pitch) / native downstream rate in packages/s. Manual value is a declared reference, not a runtime capacity override.","Protección con zona útil llena = parte entera de LBA / pitch acumulado, dividida por flujo nativo aguas abajo en envases/s. Manual es referencia declarada, no cambia capacidad del motor."],
  "equipment-macrostop-scrap": ["Bottle loss when an applicable macro stop occurs; deducted by the machine model.","Pérdida de botellas por macroparo aplicable; descontada por el modelo del equipo."],
  "format-zone-moving-gap": [
    "Optional free space between moving packages (mm), not center-to-center pitch. Target modes calculate spacing.",
    "Separación libre opcional entre productos en movimiento (mm), no pitch centro a centro. Los modos objetivo calculan separación."
  ],
  "format-zone-accumulated-gap": [
    "Gap between accumulated packages (mm). Zero means contact; use measured nonzero spacing if applicable.",
    "Separación entre envases acumulados (mm). Cero significa contacto; usa separación medida no nula si aplica."
  ],
  "format-zone-population": [
    "Nominal occupied belt length (%), not initial inventory. Target sets belt speed; otherwise calculated from native flow and actual speed.",
    "Longitud ocupada nominal (%), no inventario inicial. Como objetivo fija velocidad; si no, se calcula con flujo nativo y velocidad real."
  ],
  "format-zone-speed-factor": [
    "Discharge belt speed increase relative to machine discharge (%). 0 means equal; 10 means 10% faster. Needed for actual Discharge or Auto factors.",
    "Incremento de velocidad Discharge respecto a descarga (%). 0 igual; 10, 10% más rápido. Aplica a Discharge real o Auto por factores."
  ],
  "format-zone-coding-factor": [
    "Coding belt speed increase relative to Discharge (%). Optional; blank defaults to 0 (equal speed).",
    "Incremento de Coding respecto a Discharge (%). Opcional; vacío usa 0 (misma velocidad)."
  ],
  "format-zone-acc-factor": [
    "Accumulation belt speed increase relative to Coding (%). In Auto: belt speed = Coding speed × (1 + factor/100); blank defaults to 0, not measured. Calculated when using direct belt speed or a target.",
    "Incremento de acumulación respecto a Coding (%). En Auto: velocidad banda = velocidad Coding × (1 + factor/100); vacío usa 0 como supuesto, no medición. Se calcula con velocidad directa u objetivo."
  ],
  "format-zone-blocked-delay": [
    "Continuous occupied Back-up time to confirm blockage (s). Compare with package passage; too short can cause false stops.",
    "Tiempo continuo ocupado de Back-up para confirmar bloqueo (s). Compara con paso del envase; demasiado corto causa posibles falsos paros."
  ],
  "format-zone-clear-delay": [
    "Continuous clear Back-up time before releasing upstream machine (s). Use PLC setting.",
    "Tiempo continuo libre de Back-up antes de liberar máquina anterior (s). Usa ajuste PLC."
  ],
  "format-zone-insurance": [
    "Optional additional native packages reserved for uncertainty during overflow. Blank defaults to zero.",
    "Envases adicionales opcionales como margen de incertidumbre en overflow. Vacío usa cero."
  ],
  "format-zone-overspeed": [
    "Percent speed margin over downstream infeed. Checked sets target; unchecked calculates actual margin. Distinct from minimum-speed recommendation margin.",
    "Margen porcentual respecto a velocidad de entrada siguiente. Activado fija objetivo; desactivado calcula margen real. Distinto del margen de velocidad mínima recomendada."
  ],
  "format-zone-lba-enabled": [
    "Use LBA as manual geometry source; Back-up is calculated.",
    "Usa LBA manual como fuente geométrica; Back-up es calculado."
  ],
  "format-zone-backup-enabled": [
    "Use installed Back-up as manual source; LBA is calculated.",
    "Usa Back-up instalado como fuente manual; LBA es calculado."
  ],
  "format-zone-population-enabled": [
    "Set target Population as speed source; exclusive with Overspeed.",
    "Fija Population objetivo como fuente de velocidad; excluye Overspeed."
  ],
  "format-zone-overspeed-enabled": [
    "Set target Overspeed as speed source; exclusive with Population.",
    "Fija Overspeed objetivo como fuente de velocidad; excluye Population."
  ]
};
  function localized(en,es){return document.documentElement.lang==='es'?es:en;}
  function columnHelp(control,id){
    var extra={
      'flow':['Material input/output units used for native package flow.','Unidades de entrada/salida para flujo nativo de envases.'],
      'stop-mode':['General or separate minor/major failure model.','Modelo de fallas generales o separadas menor/mayor.'],
      'dynamic-reference':['Whether entered speed is normal or maximum dynamic speed.','Si la velocidad introducida es normal o máxima dinámica.'],
      'dynamic-percent':['Ratio between normal and maximum speeds.','Relación entre velocidades normal y máxima.'],
      'dynamic-range':['Resolved normal and maximum speeds in m/min.','Velocidades normal y máxima resueltas en m/min.'],
      'low-reserve':['Lower queue reserve threshold in seconds.','Umbral inferior de reserva de cola en segundos.'],
      'high-reserve':['Upper queue reserve threshold in seconds.','Umbral superior de reserva de cola en segundos.'],
      'acceleration':['Time for belt acceleration.','Tiempo de aceleración de banda.'],
      'deceleration':['Time for belt deceleration.','Tiempo de desaceleración de banda.'],
      'confirmation':['Time a dynamic sensor condition must persist.','Tiempo que debe persistir la condición del sensor dinámico.'],
      'dwell':['Minimum time between dynamic speed changes.','Tiempo mínimo entre cambios de velocidad dinámica.']
    };
    var key=control?.dataset.parameterHelp||Array.from(control?.classList||[]).find(name=>parameterHelp[name]),entry=extra[id]||parameterHelp[key];
    return entry?localized(...entry):control?.dataset.baseParameterHelp||control?.title||'';
  }
  function refreshHelp(card){
    if(!card?._fields)return;
    card._fields.querySelectorAll('input,select,textarea').forEach(function(control){
      if(control.type==='hidden'||control.closest('[hidden][aria-hidden=true]'))return;
      var label=control.closest('label');if(!label)return;
      var key=control.dataset.parameterHelp||Array.from(control.classList).find(name=>parameterHelp[name]),entry=parameterHelp[key];
      if(control.dataset.baseParameterHelp===undefined)control.dataset.baseParameterHelp=control.title||label.title||'';
      var text=entry?localized(...entry):control.dataset.baseParameterHelp||localized('Configure this equipment parameter.','Configura este parámetro del equipo.');
      if(control.dataset.stopClass)text+=(localized(' Use 0/0 only if this category has no stops.',' Usa 0/0 solo si esta categoría no tiene paros.'));
      var role=control.dataset.fieldRole;
      if(role)text+='\n\n'+(role==='OUTPUT'?localized('Calculated output — read only. Not saved as a manual input.','Resultado calculado — solo lectura. No se guarda como dato manual.'):role==='INACTIVE'?localized('Not used in this mode; previous input is retained.','No se usa en este modo; se conserva el dato anterior.'):role==='OPTIONAL'?localized('Optional input — blank inherits the model default.','Entrada opcional — vacío hereda el valor del modelo.'):localized('Manual input in this mode.','Entrada manual en este modo.'));
      control.title=text;control.setAttribute('aria-description',text);
      if(control.type!=='checkbox'||!label.querySelector('input[type=number]'))label.title=text;
    });
  }
  function decorate(card){refreshHelp(card);}
  window.addEventListener('st-language-change',function(){document.querySelectorAll('#equipment-list .equipment-card').forEach(refreshHelp);});
  return {init:init,select:select,release:release,restore:restore,sync:sync,decorate:decorate,columnHelp:columnHelp,refreshHelp:refreshHelp,refreshTitle:refreshTitle,hide:function(){opened=false;},show:function(){if(selected)opened=true;},available:function(){return !!selected&&state?.uiView==='editor';},name:function(){return selected?selected._fields.querySelector('.equipment-name').value:'';}};
})();
</script>
