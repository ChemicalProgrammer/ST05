<script>
window.STSimulation2DEngine=(function(){
  const epsilon=1e-6;
  // Standalone test/replay harnesses use the exact same pure helpers.
  // Production uses the shared numerical implementation exposed by SimulatorEngine.
  function normalizeSeed(seed) {
    return Number.isInteger(seed) ? seed >>> 0 : 0;
  }
  function equipmentRandomSeed(seed,equipmentId,eventType) {
    const key=JSON.stringify([normalizeSeed(seed),String(equipmentId),String(eventType)]);

    for(let i=0;i<key.length;i++){hash^=key.charCodeAt(i);hash=Math.imul(hash,16777619);}
    return hash>>>0;

    return {state,value:((value^(value>>>14))>>>0)/4294967296};
  }

  // Dedicated repair episodes are independent of the bounded generic event log.
  // Times are virtual seconds. Observed failure time is exclusive state time;
  // an open repair interval can overlap calendar/command/E-stop conditions.
  function createFailureHistory(){
    return {schema:'ST_FAILURE_HISTORY_V1',complete:true,episodes:[]};
  }
  function startFailureEpisode(history,start,stopClass,repair,threshold,charged){

    history.episodes.push([start,null,stopClass,repair,Number.isFinite(threshold)?threshold:null,charged,0,null]);
  }

    if(row&&row[1]===null){row[1]=end;row[7]=reason;}
  }
  function chargeFailureEpisode(history,seconds){
    const row=history?.episodes.at(-1);
    if(row&&row[1]===null)row[6]+=seconds;
  }
  function snapshotFailureHistory(history){
    if(!history)return null;
    return {schema:history.schema,complete:history.complete,fields:[
      'startSecond','endSecond','stopClass','configuredRepairSeconds','sampledExposureSeconds',
      'cumulativeChargedSecondsAtStart','observedFailureSeconds','endReason'

  }
  function summarizeFailureOverlap(histories,elapsed){

    for(const history of histories)for(const row of history.episodes){
      count++;if(row[1]===null)open++;
      const start=Math.min(elapsed,Math.max(0,row[0])),end=Math.min(elapsed,row[1]??elapsed);

      episodes:count,openEpisodes:open,unionSeconds:tidy(union),overlapSeconds:tidy(overlap),
      summedEquipmentSeconds:tidy(sum),peakConcurrent:peak};
  }

  const reliability=window.SimulatorEngine?.reliabilitySupport||{
    equipmentRandomSeed,seededRandomStep,createFailureHistory,startFailureEpisode,closeFailureEpisode,
    chargeFailureEpisode,snapshotFailureHistory,summarizeFailureOverlap
  };
  const durationKey={
    Starting:'starting',Running:'running',Discharging:'running',Starved:'starving','Waiting for Prime':'starving',
    'Ramp up':'acceleration','Ramp down':'deceleration',Blocked:'blocked','Back-up stop':'backupStop',Failed:'failure',
    Paused:'paused',Stopped:'stopped','Emergency stop':'emergencyStop','Planned stop':'plannedStop'
  };
  // ST_EXCLUSIVE_STATES_V1: observe, never feed counters back into physics.
  function createStateAccounting(){
    return {schema:'ST_EXCLUSIVE_STATES_V1',stateSeconds:{},outputUnitsByState:{},
      accountedSeconds:0,outputUnits:0,productiveSeconds:0,productiveDesignOutputUnits:0,
      positiveOutputSeconds:0,productiveNoOutputSeconds:0,outputOutsideProductiveUnits:0,
      backupActive:false,backupEpisodes:0,observedBackupStops:0,episodeStopped:false,
      endedAfterObservedStop:0,endedWithoutObservedStop:0};

  function accountStateTick(ledger,state,seconds,output,designRate,machine,backupActive){
    if(!ledger)return;
    const flow=output-ledger.outputUnits;
    ledger.outputUnits=output;
    ledger.accountedSeconds+=seconds;
    ledger.stateSeconds[state]=(ledger.stateSeconds[state]||0)+seconds;
    if(flow>0){
      ledger.positiveOutputSeconds+=seconds;
      ledger.outputUnitsByState[state]=(ledger.outputUnitsByState[state]||0)+flow;
    }
    if(!machine)return;
    const productive=state==='RUNNING'||state==='RAMP_UP'||state==='RAMP_DOWN'||state==='STOP_RESPONSE'||state==='DISCHARGING';
    if(productive){
      ledger.productiveSeconds+=seconds;
      ledger.productiveDesignOutputUnits+=designRate*seconds;
      if(!(flow>0))ledger.productiveNoOutputSeconds+=seconds;
    }else if(flow>0)ledger.outputOutsideProductiveUnits+=flow;
    if(backupActive&&!ledger.backupActive){
      ledger.backupEpisodes++;ledger.episodeStopped=false;
    }
    if(backupActive&&state==='BACKUP_STOP'&&!ledger.episodeStopped){
      ledger.observedBackupStops++;ledger.episodeStopped=true;
    }
    if(!backupActive&&ledger.backupActive){
      if(ledger.episodeStopped)ledger.endedAfterObservedStop++;
      else ledger.endedWithoutObservedStop++;
      ledger.episodeStopped=false;
    }
    ledger.backupActive=backupActive;
  }
  function stateAccountingSnapshot(ledger,elapsed,output,designRate,machine,exposure,charged,detail=true){
    if(!ledger)return null;
    const tidy=value=>Number.isFinite(value)?Number(value.toFixed(6)):null;
    const states=ledger.stateSeconds,time=name=>states[name]||0;
    const ownDowntime=time('FAILURE')+time('MICRO_STOP');

      const availability=productive+ownDowntime>0?productive/(productive+ownDowntime):null;
      const runtimeEfficiency=ideal>0?output/ideal:null;
      const operationalEfficiency=availability!==null&&runtimeEfficiency!==null?availability*runtimeEfficiency:null;
      const weightedDesign=productive>0?ideal/productive:designRate;
      const intrinsicAvailability=elapsed>0?1-(ownDowntime+time('STOPPED')+time('EMERGENCY_STOP')+time('PLANNED_STOP'))/elapsed:null;
      const intrinsicOee=intrinsicAvailability!==null&&runtimeEfficiency!==null?intrinsicAvailability*runtimeEfficiency:null;
      // No reject stream. Keep above-design discrepancies visible, not capped.
      efficiency={availability:tidy(availability),runtimeEfficiency:tidy(runtimeEfficiency),
        operationalEfficiency:tidy(operationalEfficiency),throughput:tidy(operationalEfficiency===null?null:operationalEfficiency*weightedDesign),
        productionSpeed:tidy(productive>0?output/productive:null),designSpeed:tidy(weightedDesign),
        quality:1,intrinsicAvailability:tidy(intrinsicAvailability),intrinsicOee:tidy(intrinsicOee)};
    }
    const result={schema:ledger.schema,stateSeconds:Object.fromEntries(Object.entries(states).map(([k,v])=>[k,tidy(v)])),
      productiveSeconds:machine?tidy(productive):null,productiveDesignOutputUnits:machine?tidy(ideal):null,
      ownDowntimeSeconds:machine?tidy(ownDowntime):null,efficiency};
    if(detail){
      const byState=ledger.outputUnitsByState;
      Object.assign(result,{accountedSeconds:tidy(ledger.accountedSeconds),
        timeResidualSeconds:tidy(elapsed-Object.values(states).reduce((a,b)=>a+b,0)),
        outputUnitsByState:Object.fromEntries(Object.entries(byState).map(([k,v])=>[k,tidy(v)])),
        outputResidualUnits:tidy(output-Object.values(byState).reduce((a,b)=>a+b,0)),
        positiveOutputSeconds:tidy(ledger.positiveOutputSeconds),
        productiveNoOutputSeconds:machine?tidy(ledger.productiveNoOutputSeconds):null,
        outputOutsideProductiveUnits:machine?tidy(ledger.outputOutsideProductiveUnits):null,
        outputAboveDesignUnits:machine?tidy(Math.max(0,output-ideal)):null,
        exceedsDesignBeyondOnePackage:machine?output-ideal>1+1e-6:null,
        reliabilityExposureSeconds:machine?tidy(exposure):null,reliabilityChargedSeconds:machine?tidy(charged):null,
        backup:machine?{observedEpisodes:ledger.backupEpisodes,observedStops:ledger.observedBackupStops,
          endedAfterObservedStop:ledger.endedAfterObservedStop,endedWithoutObservedStop:ledger.endedWithoutObservedStop,
          open:ledger.backupActive,openReachedStop:ledger.backupActive&&ledger.episodeStopped}:null});
    }
    return result;
  }
  const canonicalState={
    Running:'RUNNING',Starting:'STARTING',Discharging:'DISCHARGING',Starved:'STARVED',
    'Waiting for Prime':'WAITING_FOR_PRIME','Ramp up':'RAMP_UP','Ramp down':'RAMP_DOWN',
    Blocked:'BLOCKED','Back-up stop':'BACKUP_STOP',Failed:'FAILURE',Paused:'PAUSED',
    Stopped:'STOPPED','Emergency stop':'EMERGENCY_STOP','Planned stop':'PLANNED_STOP',
    Empty:'EMPTY',Flowing:'FLOWING',Accumulating:'ACCUMULATING',Waiting:'IDLE'
  };
  function accountingSnapshot(item,elapsed=item.stateAccounting?.accountedSeconds,detail=true){
    return stateAccountingSnapshot(item.stateAccounting,elapsed,item.produced,item.designSpeedPerSecond??item.rate,
      item.kind==='machine',item.reliabilityExposureSeconds,item.reliabilityChargedSeconds,detail);
  }
  // Match LineSimulationEngine.resolvePhysicalZone: reserve is a whole
  // number of packages in the packed outlet queue, not a raw beam pulse.
  function primeThresholdUnits(belt){
    if(belt.prime==null)return null;
    const pitch=belt.packageLength+belt.packedGap;
    const capacity=Math.floor(belt.length/pitch);
    return Math.max(1,Math.min(capacity,Math.ceil((belt.length-belt.prime)/pitch)));
  }
  function create(definitions,seed=1,checkpoint,schedule={}){

        primeThresholdUnits:primeThresholdUnits(definition),primeQueueUnits:0,primeTriggerCount:0,
        backupOccupied:false,backupTriggerCount:0,backupClearCount:0,produced:0,state:'Empty',
        receivedUnits:0,overflowUnits:0,overflowEvents:0,blockedEntryAttempts:0,stateAccounting:createStateAccounting(),
        durations:{empty:0,flowing:0,accumulating:0},recentOutput:[],ratePerMinute:0}
      : {...definition,input:0,remaining:null,ready:false,started:0,produced:0,backupSince:null,residual:0,state:'Waiting',
        admittedInputUnits:0,stopDischargedUnits:0,residualDischargedUnits:0,dischargeOverflowUnits:0,stateAccounting:createStateAccounting(),
        residualAtTrigger:0,resident:[],residenceClock:0,positionClock:0,positionDue:[],intakeCredit:1,outletCredit:0,rampElapsed:0,activeRampSeconds:definition.primeRampSeconds??definition.rampSeconds??0,failureRemaining:0,failureCount:0,exposure:null,
        activeStartDelaySeconds:definition.startDelay??0,startCause:'INITIAL',repairRecoveryPending:false,
        reliabilityExposureSeconds:0,reliabilityChargedSeconds:0,
        restartRequests:{INITIAL:1},startingSecondsByCause:{},rampUpSecondsByCause:{},waitingForPrimeSeconds:0,
        awaitPrime:definitions[index-1]?.kind==='belt'&&definitions[index-1].prime!=null,
        failureRandomState:reliability.equipmentRandomSeed(seed,definition.id,'failure'),
        failureClassRandomState:reliability.equipmentRandomSeed(seed,definition.id,'failure-class'),
        failureTargetSeconds:null,failureHistory:reliability.createFailureHistory(),repairRestartIssued:false,
        durations:{starting:0,running:0,starving:0,acceleration:0,deceleration:0,blocked:0,backupStop:0,failure:0,paused:0,stopped:0,emergencyStop:0,plannedStop:0},
        recentOutput:[],ratePerMinute:0});

    const commands=schedule.commands||[],stops=schedule.stops||[];

    const options={failures:true,events:true,calendar:true};
    const running=item=>!item.emergency&&!['STOP','PAUSE'].includes(item.mode);
    const available=item=>running(item)&&!activeStop;
    function rearmPrime(item){
      const upstream=line[line.indexOf(item)-1];
      item.awaitPrime=upstream?.kind==='belt'&&upstream.prime!=null;
      if(item.awaitPrime)upstream.primeSeen=false;
    }

    // may override the restart profile after a completed Back-up stop.
    function restart(item,cause='COMMAND',delay=item.startDelay??0,ramp=item.rampSeconds??0){
      if(item.kind==='belt')return;
      rearmPrime(item);
      item.started=0;
      item.activeStartDelaySeconds=Math.max(0,delay);
      item.rampElapsed=0;
      item.activeRampSeconds=Math.max(0,ramp);
      item.startCause=cause;
      item.restartRequests[cause]=(item.restartRequests[cause]||0)+1;
    }
    function control(id,action){
      const item=byId.get(id);
      if(!item)return;
      const wasRunning=running(item);
      if(action==='EMERGENCY_STOP'){item.emergency=true;item.mode='STOP';}
      else if(action==='RESET'&&item.emergency){item.emergency=false;item.mode='STOP';}
      else if(!item.emergency&&['RUN','AUTO','MANUAL','STOP','PAUSE'].includes(action)){
        item.mode=action;
        if(!wasRunning&&running(item)&&!item.repairRecoveryPending)restart(item);
      }
      if(!running(item))item.state=haltState(item);
    }
    function haltState(item){
      if(item.emergency)return 'Emergency stop';
      if(activeStop)return 'Planned stop';
      if(item.mode==='PAUSE')return 'Paused';
      if(item.mode==='STOP')return 'Stopped';
      return 'Planned stop';
    }
    function configure(values){
      Object.assign(options,values);
      if(!options.failures)for(const item of line){
        if(item.failureRemaining>0){
          item.failureRemaining=0;
          reliability.closeFailureEpisode(item.failureHistory,time,'DISABLED');
          item.repairRecoveryPending=true;item.repairRestartIssued=false;
          if(item.state==='Failed')item.state='Waiting';
        }
      }
    }
    if(checkpoint&&Number.isFinite(checkpoint.time)&&checkpoint.time>=0&&checkpoint.line?.length===line.length){
      time=checkpoint.time;
      // Older checkpoints do not contain the input and loss counters needed
      // to reconstruct a lifetime balance. Do not report a fabricated zero.
      materialAccountingComplete=checkpoint.materialAccountingComplete===true;
      counterAccountingComplete=checkpoint.counterAccountingComplete===true&&checkpoint.line.every(item=>item.stateAccounting?.schema==='ST_EXCLUSIVE_STATES_V1');
      commandIndex=checkpoint.commandIndex??0;
      stopIndex=checkpoint.stopIndex??0;
      activeStop=stops[checkpoint.activeStopIndex]??null;
      line.forEach((item,index)=>{
        const saved=JSON.parse(JSON.stringify(checkpoint.line[index]));
        saved.durations={...item.durations,...saved.durations};
        Object.assign(item,saved);
        if(!counterAccountingComplete)item.stateAccounting=null;
        if(item.kind==='machine'&&saved.failureHistory?.schema!=='ST_FAILURE_HISTORY_V1')item.failureHistory=null;
      });
    }
    function snapshot(){
      return JSON.parse(JSON.stringify({time,commandIndex,stopIndex,materialAccountingComplete,counterAccountingComplete,activeStopIndex:activeStop?stops.indexOf(activeStop):-1,line:line.map((item,index)=>Object.fromEntries(
        Object.entries(item).filter(([key])=>!Object.hasOwn(definitions[index],key))
      ))}));
    }
    function hasPackedPair(belt,position=null){
      const packedPitch=belt.packageLength+belt.packedGap;
      if(packedPitch+epsilon>=belt.pitch)return false;
      return belt.items.some((item,index)=>{
        if(!index)return false;
        const ahead=belt.items[index-1];
        return ahead.x-item.x<=packedPitch+epsilon&&
          (position===null||position>=item.x&&position<=ahead.x);
      });
    }
    function moveBelt(belt,seconds,moving=true){
      belt.travelSeconds=(belt.travelSeconds||0)+(moving?seconds:0);
      const travel=moving?belt.speed*seconds:0;
      if(window.SimulatorEngine?.advancePackagePositions){
        window.SimulatorEngine.advancePackagePositions(belt.items,belt.length,belt.packageLength,belt.packageLength+belt.packedGap,moving?belt.speed:0,seconds);
      }else{

      const beam=position=>position!=null&&belt.items.some(item=>Math.abs(item.x-position)<=belt.packageLength/2+epsilon);

      belt.backupBeam=beam(belt.backup);

      // passing package, even one blocking Prime, is not a reserve.
      const packedPitch=belt.packageLength+belt.packedGap;

      while(queued<belt.items.length&&belt.items[queued].x>=end-queued*packedPitch-epsilon)queued++;

      // in the numerical discrete model; both engines use continuous clear.
      belt.backupOccupied=belt.backupBeam||belt.backup!=null&&hasPackedPair(belt,belt.backup);

        belt.backupElapsed=0;

        else belt.backupClearCount++;

    }

    // The released package is counted at the machine even if it is lost;
    // only accepted packages enter the conveyor's inventory.

        const hasSpace=!last||last.x-entry+epsilon>=downstream.pitch;

          downstream.blockedEntryAttempts++;

        // entry is free; no new space is created by stopping the belt.
        if(hasSpace){

          downstream.overflowUnits++;

        if(!available(downstream)||downstream.resident.length>=Math.floor(downstream.capacityBottles/downstream.inputBottleFactor)||
          downstream.failureRemaining>0||downstream.started<downstream.activeStartDelaySeconds||downstream.backupSince!==null)return false;

        downstream.admittedInputUnits++;

          Math.floor(downstream.capacityBottles/downstream.inputBottleFactor));

        if(!available(downstream)||downstream.input>=downstream.batch||downstream.ready||downstream.remaining!==null||downstream.backupSince!==null)return false;

    function random(machine,field){

      if(!available(machine)||!profiles.length||machine.exposure===null||machine.exposure>1e-8)return;
      const rate=profile=>profile.ratePerMinute??profile.rate;
      const total=profiles.reduce((sum,profile)=>sum+rate(profile),0);
