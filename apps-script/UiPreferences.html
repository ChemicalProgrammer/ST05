<script>
// Load before the application modules so a broken or incomplete deployment cannot hide errors.
window.STStartup=(function(){
  var active=true,timer,failure='';
  function ready(){active=false;clearTimeout(timer);}
  function displayFailure(){
    if(!failure)return;
    document.documentElement.classList.remove('restoring-session');
    var auth=document.getElementById('auth-panel'),app=document.getElementById('application');
    if(auth)auth.classList.remove('hidden');
    if(app)app.classList.add('hidden');
    var status=document.getElementById('auth-status'),button=document.getElementById('sign-in-button');
    if(status){status.dataset.state='error';status.textContent=failure;}
    if(button){button.disabled=false;button.textContent='Reload page';button.removeAttribute('aria-busy');}
  }
  function fail(error){
    if(!active)return;
    ready();
    failure='Workspace startup could not finish. '+String(error?.message||error||'Unknown startup error.').slice(0,400);
    displayFailure();
    window.dispatchEvent(new Event('st-startup-failure'));
  }
  function start(){
    active=true;failure='';clearTimeout(timer);
    timer=setTimeout(function(){fail('The connection did not respond within 45 seconds. Reload to retry.');},45000);
  }
  window.addEventListener('error',function(event){if(event.message)fail(event.error||event.message);});
  window.addEventListener('unhandledrejection',function(event){if(active)fail(event.reason);});
  document.addEventListener('DOMContentLoaded',displayFailure);
  document.addEventListener('click',function(event){
    if(failure&&event.target.closest?.('#sign-in-button')){
      event.preventDefault();event.stopImmediatePropagation();window.location.reload();
    }
  },true);
  start();
  return {start:start,ready:ready,fail:fail};
})();
// Browser preferences only. Google identity is ALWAYS verified by the server.
window.STPreferences = (function() {
  var key = 'st.ui.v1.',caseProvider,caseChanged,caseColorsChanged;
  function read(name) { try { return localStorage.getItem(key + name); } catch (_) { return null; } }
  function write(name, value) {
    try { if (value === null) localStorage.removeItem(key + name); else localStorage.setItem(key + name, value); return true; }
    catch (_) { return false; }
  }
  if (read('remember') === 'yes') document.documentElement.classList.add('restoring-session');
  var theme = read('theme') || STThemeResources.defaultTheme || 'auto', automaticTimer;
  function automaticThemeAt(date) {
    var schedule = STThemeResources.automaticTheme || {lightStartHour:7,darkStartHour:19};
    var hour = date.getHours();
    return hour >= schedule.lightStartHour && hour < schedule.darkStartHour ? 'light' : 'dark';
  }
  function scheduleAutomaticTheme() {
    clearTimeout(automaticTimer);
    if (theme !== 'auto') return;
    var now = new Date(), schedule = STThemeResources.automaticTheme || {lightStartHour:7,darkStartHour:19};
    var delays = [schedule.lightStartHour, schedule.darkStartHour].map(function(hour) {
      var boundary = new Date(now);boundary.setHours(hour,0,0,0);
      if (boundary <= now) boundary.setDate(boundary.getDate()+1);
      return boundary.getTime()-now.getTime();
    });
    automaticTimer = setTimeout(apply, Math.min.apply(null,delays)+50);
  }
  var colors=Object.keys(STThemeResources.palettes);
  var separateCaseColors=read('separateCaseColors')==='yes',caseColors=null,caseColorsOwner=null;
  function colorId(value){
    var id=STThemeResources.legacyAccents?.[value]||value;
    return colors.includes(id)?id:null;
  }
  function defaultColor(name){return colorId(name==='accent'?STThemeResources.defaultAccent:STThemeResources.defaultSecondary)||colors[0];}
  function storedColors(){return {accent:colorId(read('accent'))||defaultColor('accent'),secondaryAccent:colorId(read('secondaryAccent'))||defaultColor('secondaryAccent')};}
  var generalColors=storedColors();
  function savedCaseColors(record){
    var palette=record?.metadata?.caseAppearance;
    var accent=colorId(palette?.accent),secondaryAccent=colorId(palette?.secondaryAccent);
    return accent&&secondaryAccent?{accent:accent,secondaryAccent:secondaryAccent}:null;
  }
  function colorsEqual(a,b){return Boolean(a&&b&&a.accent===b.accent&&a.secondaryAccent===b.secondaryAccent);}
  function caseColorActive(){return separateCaseColors&&Boolean(caseProvider?.()?.id);}
  function currentColors(){
    return {...(caseColorActive()&&caseColorsOwner===caseProvider()?.id&&caseColors?caseColors:generalColors)};
  }
  function syncSeparateColorsCheckbox(){
    var checkbox=document.getElementById('settings-separate-case-colors');
    if(checkbox)checkbox.checked=separateCaseColors;
  }
  function renderColors(){
    var palette=currentColors(),root=document.documentElement;
    root.dataset.accent=palette.accent;root.dataset.secondaryAccent=palette.secondaryAccent;
    applyAccent();
    document.querySelectorAll('.accent-choice').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.accent===palette.accent));});
    window.dispatchEvent(new Event('st:theme'));
  }
  function loadCaseColors(){
    var record=caseProvider?.();
    caseColorsOwner=separateCaseColors&&record?record.id:null;
    caseColors=caseColorsOwner?(savedCaseColors(record)||{...generalColors}):null;
    syncSeparateColorsCheckbox();renderColors();
  }
  function caseColorsNeedSave(){
    return caseColorActive()&&!colorsEqual(currentColors(),savedCaseColors(caseProvider()));
  }
  function setSeparateCaseColors(enabled){
    enabled=enabled===true;
    if(enabled===separateCaseColors){syncSeparateColorsCheckbox();return true;}
    if(!write('separateCaseColors',enabled?'yes':null)){syncSeparateColorsCheckbox();return false;}
    separateCaseColors=enabled;
    loadCaseColors();
    // Enabling a case without stored colors makes its current palette saveable.
    // Disabling never changes the previously saved case metadata.
    if(caseColorsNeedSave())caseColorsChanged?.();
    window.dispatchEvent(new Event('st-case-colors-policy'));
    return true;
  }
  function setPaletteColor(name,value){
    value=colorId(value)||defaultColor(name);
    var before=currentColors(),saved=true;
    if(caseColorActive()){
      caseColorsOwner=caseProvider().id;caseColors={...before,[name]:value};
    }else{
      generalColors={...generalColors,[name]:value};saved=write(name,value);
    }
    renderColors();
    if(caseColorActive()&&!colorsEqual(before,currentColors()))caseColorsChanged?.();
    return saved;
  }
  // The draft contains only the palette IDs, never the theme or its preference.
  // When the option is disabled, preserve the previous metadata verbatim.
  function captureCaseColors(draft){
    if(draft&&caseColorActive()&&draft.id===caseProvider()?.id){
      draft.metadata={...(draft.metadata||{}),caseAppearance:currentColors()};
    }
    return draft;
  }
  function resolveInterfaceMode(fallback){var value=String(read('interfaceMode')||fallback||'MINIMAL').trim().toUpperCase();return ['ADVANCE','ADVANCED'].includes(value)?'ADVANCE':['BASIC','STANDARD','LEGACY_BASIC'].includes(value)?'BASIC':'MINIMAL';}
  function applyPalette(){
    document.querySelectorAll('.accent-choice').forEach(function(button){
      var entry=STThemeResources.palettes[button.dataset.accent];
      if(!entry)return;
      button.title=entry.name;button.setAttribute('aria-label',entry.name+' primary color');
      button.classList.remove('hidden');
    });
  }
  function setAccent(value){return setPaletteColor('accent',value);}
  function setSecondaryAccent(value){return setPaletteColor('secondaryAccent',value);}
  renderColors();
  function applyAccent(){var p=STThemeResources.palettes[document.documentElement.dataset.accent];if(!p)return;var c=p[document.documentElement.dataset.theme==='dark'?'dark':'light'],style=document.documentElement.style;Object.entries({'--accent':c.accent,'--accent-hover':c.accent,'--accent-soft':c.soft,'--selected':c.soft,'--selected-text':c.text||c.accent,'--on-accent':c.onAccent}).forEach(function(pair){style.setProperty(pair[0],pair[1]);});}
  function apply() {
    document.documentElement.dataset.theme = theme === 'auto' ? automaticThemeAt(new Date()) : theme;
    scheduleAutomaticTheme();
    applyAccent();window.dispatchEvent(new Event('st:theme'));
  }
  function setTheme(value) {
    theme = ['auto', 'light', 'dark'].indexOf(value) >= 0 ? value : 'auto';
    write('theme', theme); apply();
    document.querySelectorAll('[data-theme-picker]').forEach(function(select) { select.value = theme; });
  }
  function fontMode(){return document.documentElement.dataset.uiMode==='basic'?'basic':'advance';}
  function setFontScale(value,persist){value=Number(value);if(![80,90,100,110,125].includes(value))value=fontMode()==='basic'?110:100;if(persist!==false)write('fontScale.'+fontMode(),String(value));document.documentElement.style.fontSize=(16*value/100)+'px';var picker=document.getElementById('settings-font-scale');if(picker)picker.value=String(value);}
  function applyFontScale(){var value=read('fontScale.'+fontMode())||read('fontScale')||(fontMode()==='basic'?110:100);setFontScale(value,false);}
  applyFontScale();
  window.addEventListener('focus', apply);
  document.addEventListener('visibilitychange', function(){if(!document.hidden)apply();});
  apply();
  function caseOptions() {
    var saved=caseProvider?.()?.metadata?.consoleOptions||{};
    // El guardado de casos es exclusivamente manual. Ignorar políticas heredadas.
    return {equipmentLayout:saved.equipmentLayout==='combined'?'combined':'split',
      rateLossCategories:saved.rateLossCategories||{},showRealData:saved.showRealData!==false,
      seedPolicy:(saved.seedPolicy??read('seedPolicy'))==='FIXED'?'FIXED':'RANDOM'};
  }
  function setCaseOptions(value) {
    var record=caseProvider?.();if(!record)return false;
    record.metadata=record.metadata||{};
    value=Object.assign({},value,{equipmentLayout:value.equipmentLayout==='combined'?'combined':'split'});
    var previous=record.metadata.consoleOptions;
    if(JSON.stringify(previous)===JSON.stringify(value))return true;
    record.metadata.consoleOptions=Object.assign({},value);
    window.dispatchEvent(new Event('st-save-policy-change'));
    caseChanged?.();return true;
  }
  function initializeCaseOptions() {
    var record=caseProvider?.();if(!record)return;
    record.metadata=record.metadata||{};
    // Migrate browser defaults into the draft; persist on the next user save.
    if(!record.metadata.consoleOptions)record.metadata.consoleOptions=caseOptions();
    if(typeof record.metadata.includeDOE!=='boolean')record.metadata.includeDOE=read('scenarioDoe')==='yes';
  }
  document.addEventListener('DOMContentLoaded', function() {
    applyFontScale();
    document.getElementById('settings-font-scale')?.addEventListener('change',function(event){setFontScale(event.target.value);window.dispatchEvent(new Event('resize'));});
    var palette=document.getElementById('accent-palette');
    if(palette)colors.forEach(function(color){
      var button=document.createElement('button'),entry=STThemeResources.palettes[color];
      button.type='button';button.className='accent-choice theme-color-choice';button.dataset.accent=color;
      button.title=entry.name;button.setAttribute('aria-label',entry.name+' primary color');
      var swatch=document.createElement('span');swatch.className='theme-color-swatch';swatch.setAttribute('aria-hidden','true');
      swatch.style.background=entry.hex||entry.light.accent;swatch.style.color=entry.light.onAccent;swatch.innerHTML=STIcons.svg('check');
      var name=document.createElement('span');name.className='theme-color-name';name.textContent=entry.name;
      button.append(swatch,name);button.onclick=function(){setAccent(color);};palette.appendChild(button);
    });
    renderColors();
    var separate=document.getElementById('settings-separate-case-colors');
    if(separate){syncSeparateColorsCheckbox();separate.addEventListener('change',function(){var ok=setSeparateCaseColors(separate.checked),status=document.getElementById('appearance-status');if(status)status.textContent=ok?'':'Your browser could not save this appearance preference.';});}
    document.querySelectorAll('[data-theme-picker]').forEach(function(select) {
      select.value = theme;
      select.addEventListener('change', function() { setTheme(select.value); });
    });
  });
  function reset(){
    Object.keys(localStorage).filter(function(name){return name.indexOf(key)===0;}).forEach(function(name){localStorage.removeItem(name);});
    theme=STThemeResources.defaultTheme||'auto';document.documentElement.classList.remove('restoring-session');
    separateCaseColors=false;caseColors=null;caseColorsOwner=null;
    generalColors={accent:defaultColor('accent'),secondaryAccent:defaultColor('secondaryAccent')};
    write('accent',generalColors.accent);write('secondaryAccent',generalColors.secondaryAccent);
    setTheme(theme);renderColors();syncSeparateColorsCheckbox();
    window.STLanguage?.setLanguage('en');
  }
  return {reset:reset,caseOptions:caseOptions,setCaseOptions:setCaseOptions,initializeCaseOptions:initializeCaseOptions, connectCase:function(provider,changed,colorsChanged){caseProvider=provider;caseChanged=changed;caseColorsChanged=colorsChanged||changed;},read: read, write: write, setTheme: setTheme,setAccent:setAccent,setSecondaryAccent:setSecondaryAccent,currentColors:currentColors,separateCaseColors:function(){return separateCaseColors;},setSeparateCaseColors:setSeparateCaseColors,loadCaseColors:loadCaseColors,captureCaseColors:captureCaseColors,caseColorsNeedSave:caseColorsNeedSave,automaticThemeAt:automaticThemeAt,setFontScale:setFontScale,applyFontScale:applyFontScale, applyPalette:applyPalette,resolveInterfaceMode:resolveInterfaceMode };
})();
</script>
