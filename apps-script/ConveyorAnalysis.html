<dialog id="conveyor-analysis-dialog" aria-labelledby="conveyor-analysis-title">
  <header class="dialog-heading">
    <h2 id="conveyor-analysis-title">Conveyor Analysis Tool</h2>
    <button id="conveyor-analysis-close" type="button" class="ghost icon-button" data-icon="x" aria-label="Close conveyor analysis" title="Close conveyor analysis"></button>
  </header>
  <div id="conveyor-analysis-body" class="dialog-body"></div>
</dialog>
<style>
#conveyor-analysis-dialog { --dialog-width:min(72rem,calc(100vw - 24px)); width:min(72rem,calc(100vw - 24px)); max-height:calc(100dvh - 24px); box-sizing:border-box; }
#conveyor-analysis-dialog[open] { overflow:hidden; }
#conveyor-analysis-body { min-width:0; max-width:100%; overflow-y:auto; overflow-x:hidden; }
#conveyor-analysis-body > .st-subsection { min-width:0; max-width:100%; margin:0; padding:var(--subsection-padding); }
#conveyor-analysis-body .st-subsection > .fold-content { display:grid; gap:var(--space-3); min-width:0; }
#conveyor-analysis-body .table-scroll { min-width:0;max-width:100%;width:100%;overflow-x:auto;overflow-y:visible; }
/* A consistent column model prevents long parameters or diagnostic text
   from expanding the table. The wrapper scrolls only for genuinely wide
   multi-format tables; normal tables fit their subsection. */
#conveyor-analysis-body table {
  width:100%;min-width:0;table-layout:fixed;border-collapse:collapse;
}
#conveyor-analysis-body table[data-value-columns] { min-width:var(--worksheet-min-width,0px); }
#conveyor-analysis-body :is(td,th) {
  box-sizing:border-box;min-width:0;padding:var(--space-2) var(--space-3);
  overflow-wrap:anywhere;white-space:normal;vertical-align:middle;
}
#conveyor-analysis-body tbody th[scope=row]:not([colspan]) {
  text-align:start;white-space:normal;overflow-wrap:anywhere;word-break:normal;
}
#conveyor-analysis-body :is(thead th,tbody td):not(:first-child) {padding-inline:var(--space-2);}
#conveyor-analysis-body thead th {text-align:center;}
#conveyor-analysis-body thead th:first-child {text-align:start;}
#conveyor-analysis-body tbody td.numeric {text-align:end;font-variant-numeric:tabular-nums;white-space:normal;overflow-wrap:anywhere;}
#conveyor-analysis-body td.metric-unit {text-align:center;white-space:normal;overflow-wrap:anywhere;}
#conveyor-analysis-body :is(td,th)[colspan] {text-align:start;white-space:normal;}
#conveyor-analysis-body .conveyor-value-pending {cursor:help;text-decoration:underline dotted;text-underline-offset:.18em;color:var(--muted);}
#conveyor-analysis-body .conveyor-value-partial {cursor:help;text-decoration:underline dotted;text-underline-offset:.18em;}
#conveyor-analysis-body :is(.conveyor-value-pending,.conveyor-value-partial):focus-visible {outline:2px solid var(--accent);outline-offset:-2px;}
#conveyor-analysis-body .conveyor-analysis-format-note {margin:0;font-size:var(--font-secondary);overflow-wrap:anywhere;}
@media(max-width:600px){
  #conveyor-analysis-body :is(td,th) {padding:var(--space-2) var(--space-1);}
}
#conveyor-analysis-body { display:grid; grid-template-columns:minmax(0,1fr); align-content:start; gap:var(--subsection-gap,var(--space-4)); }
#conveyor-analysis-body .chart-note { margin:0; }
#conveyor-analysis-body .conveyor-analysis-verdict { display:inline-flex; align-items:center; padding:2px 8px; border-radius:999px; color:#fff; font-size:var(--font-secondary); white-space:nowrap; }
</style>
<script>
window.STConveyorAnalysis=(function(){
  const verdictColors={'PASS':'#216343','FAIL':'#a12b36','AT LIMIT':'#805200','NOT EVALUATED':'#4b5563'};
  const lengthHelp={
    discharge:'Longitud instalada desde la salida de la máquina aguas arriba hasta el inicio del tramo Coding. Si no hay Coding, mide hasta el inicio de Overflow.',
    coding:'Longitud instalada del tramo de codificación, desde el final de Discharge hasta el inicio de Overflow (Max Run-out Point). Captura 0 si no existe ese tramo.'
  };
  const recoveryHelp=[
    'Lrec es el margen de cola útil cuando la primera botella del rearranque alcanza la cola.',
    'Lrec > 0: todavía queda cola útil.',
    'Lrec = 0: la reserva se agota justo al llegar, sin margen para retrasos.',
    'Lrec < 0: la cola se agota antes. La magnitud indica cuántos mm de acumulación útil faltan.'
  ].join('\n');

  function close(){
    const dialog=document.getElementById('conveyor-analysis-dialog');
    if(dialog.open)dialog.close();
  }
  function bottlesPerFlowUnit(equipment,format){
    const unit=equipment?.processData?.flowUnits?.output??equipment?.unitOfFlow;
    if(String(unit).toUpperCase()!=='CASES')return 1;
    const packSize=format?window.SimulatorEngine.productPackSize(format):undefined;
    return Number.isFinite(packSize)&&packSize>0?packSize:NaN;
  }
  function resolveProfiles(equipment,format,formats=[]){
    const engine=window.SimulatorEngine;
    function resolve(profile){
      const lineFlow=engine.resolveLineFlowUnits?.(equipment,profile||{})||[];
      const models=profile?engine.applyProductProfile(equipment,profile):equipment.map((item,index)=>{
        const flow=lineFlow[index];
        if(item.type!=='CONVEYOR'||!flow)return item;
        if(flow.source==='CONFLICT')return {...item,processData:{...item.processData,transportFlowIssue:flow.reason}};
        if(flow.source==='INFERRED')return {...item,unitOfFlow:flow.output.toLowerCase(),processData:{...item.processData,transportFlowIssue:undefined,flowUnits:{input:flow.input,output:flow.output}}};
        return item;
      });
      const zones=models.map((item,index)=>item.type==='CONVEYOR'?engine.resolveProductConveyor(models,index):null);
      return {models,zones,format:profile};
    }
    const current=resolve(format);
    const designProfiles=formats.length?formats.map(candidate=>candidate.id===format?.id?current:resolve(candidate)):[current];
    return {...current,designProfiles};
  }
  function recommendedSpeed(profile){
    return profile?.infeedPitch>0?profile.infeedPitch**2/1000*(1+profile.overspeed/100):NaN;
  }
  function explainVerdict(status,recovery,profiles,geometry){
    if(status==='FAIL'){
      const deficit=(-recovery.value).toLocaleString(undefined,{maximumFractionDigits:2});
      return recovery.name+': Lrec es negativo. Faltan '+deficit+' mm de acumulación útil para cubrir el rearranque.';
    }
    if(status!=='NOT EVALUATED')return 'Lact vs L min';
    if(!profiles.length)return 'No hay formatos aplicables a este conveyor.';
    const reasons=[];
    for(const [label,value] of [
      ['Lact (longitud instalada)',geometry.lact],['Lp (reserva de Prime)',geometry.lp],
      ['Discharge actual',geometry.discharge],['Coding actual',geometry.coding]
    ]){
      if(!Number.isFinite(value))reasons.push('Falta '+label+'.');
    }
    for(const p of profiles){
      if(Number.isFinite(p.recovery)&&Number.isFinite(p.overflow))continue;
      const missing=[];
      for(const [label,value] of [
        ['velocidad del conveyor',p.speed],['longitud del envase',p.length],
        ['paso de descarga',p.dischargePitch],['paso de entrada',p.infeedPitch]
      ]){
        if(!(value>0))missing.push(label);
      }
      if(!Number.isFinite(p.firstPackage))missing.push('Time to First Package After Restart');
      if(p.blocked==null)missing.push('retardo de Back-up bloqueado');
      if(p.clear==null)missing.push('retardo de Back-up libre');
      if(p.residual==null)missing.push('envases descargados al paro');
      if(geometry.discharge>0&&!(p.dischargeSpeed>0))missing.push('velocidad del tramo Discharge');
      if(geometry.coding>0&&!(p.codingSpeed>0))missing.push('velocidad del tramo Coding');
      if(missing.length)reasons.push(p.name+': faltan datos válidos de '+missing.join(', ')+'.');
      if(p.population>=1)reasons.push(p.name+': la ocupación del conveyor es de 100 % o más. Overflow requiere espacio libre.');
      if(p.consumption>0&&p.speed<=p.consumption)reasons.push(p.name+': la velocidad del conveyor debe superar el consumo aguas abajo para calcular Lrec.');
    }
    return reasons.length?reasons.join('\n'):'No se pudo calcular Overflow o Lrec para todos los formatos aplicables.';
  }
  function calculate({zone,data,designProfiles,index}){
    const lact=data.geometry?.lactMm??zone.usableLengthMm;
    const lp=data.geometry?.lpPrimeMm??(lact-zone.primeSensorPositionMm);
    const prime=lact-lp;
    const discharge=data.geometry?.actualDischargeMm??data.accumulation?.dischargeRunoutLengthMm??zone.engineering?.input?.dischargeRunoutLengthMm;
    const coding=data.geometry?.actualCodingMm??data.accumulation?.rejectRunoutLengthMm??zone.engineering?.input?.rejectRunoutLengthMm;
    const runout=discharge+coding;
    const divide=(numerator,denominator)=>denominator>0?numerator/denominator:NaN;
    const segmentTime=(length,speed)=>length===0?0:divide(length,speed);
    const profiles=designProfiles.filter(({models})=>models[index].processData?.productApplies!==false)
      .map(({zones,models,format})=>{
        const belt=zones[index]||{};
        const {input={}}=belt.engineering||{};
        const upstream=models.find(item=>item.id===belt.upstreamControlEquipmentId)??models[index-1];
        const downstream=models.find(item=>item.id===belt.downstreamControlEquipmentId)??models[index+1];
        const length=input.packageLengthMm??belt.productLengthMm;
        const dischargePitch=input.upstreamDischargePitchMm??upstream?.processData?.upstream?.dischargePitchMm;
        const infeedPitch=input.downstreamInfeedPitchMm??models[index].processData?.downstream?.infeedPitchMm??downstream?.processData?.downstream?.infeedPitchMm;
        const speed=belt.conveyorSpeedMmPerSecond;
        // Legacy cases used the resolved conveyor speed as the discharge reference.
        const configuredDischargeVelocity=models[index].processData?.upstream?.dischargeVelocityMPerMinute;
        const dischargeVelocity=configuredDischargeVelocity>0?configuredDischargeVelocity:speed*.06;
        const dischargeMmPerSecond=dischargeVelocity>0?dischargeVelocity/.06:NaN;
        const rate=divide(dischargeMmPerSecond*60,dischargePitch);
        const highRate=divide(speed*60,infeedPitch);
        const packFactor=bottlesPerFlowUnit(models[index],format);
        const highSpeedBpm=highRate*packFactor;
        const dischargeBpm=rate*packFactor;
        const dischargeFactor=input.conveyorSpeedFactorPercent??data.speedAndSensors?.conveyorSpeedFactorVsDischargeVelocityPercent;
        const codingFactor=input.codingSpeedFactorPercent??data.speedAndSensors?.codingConveyorSpeedFactorVsPreviousConveyorPercent;
        const dischargeSpeed=dischargeMmPerSecond*(1+dischargeFactor/100);
        const codingSpeed=dischargeSpeed*(1+codingFactor/100);
        const firstPackage=models[index].processData?.accumulation?.restartToFirstPackageSeconds;
        const flow=rate*length/60,consumption=highRate*length/60;
        const population=divide(flow,speed);
        const blocked=input.blockedTimeDelaySeconds??belt.blockedTimeDelaySeconds;
        const clear=input.clearTimeDelaySeconds??belt.clearTimeDelaySeconds;
        const startup=input.upstreamStartupTimeSeconds??belt.upstreamRestartDelaySeconds??
          upstream?.startupDelaySeconds??upstream?.processData?.upstream?.startupTimeSeconds;
        const residual=input.bottlesDischargedAtStop??belt.bottlesDischargedAtStop;
        const insurance=input.insuranceFactorUnits??data.accumulation?.insuranceFactorUnits??0;
        const dischargeTime=segmentTime(discharge,dischargeSpeed),codingTime=segmentTime(coding,codingSpeed);
        const dischargePopulation=divide(flow,dischargeSpeed);
        const codingPopulation=divide(flow,codingSpeed);
        const duringDelay=blocked*rate/60;
        const inDischarge=discharge===0?0:divide(discharge*dischargePopulation,length);
        const inCoding=coding===0?0:divide(coding*codingPopulation,length);
        const total=duringDelay+residual+inDischarge+inCoding+insurance;
        const overflow=length>0&&population>=0?divide(total*length,1-population):NaN;
        return {name:format?.name||format?.id||'Current format',formatId:format?.id,length,rate,highRate,packFactor,highSpeedBpm,dischargePitch,infeedPitch,
          upstreamName:upstream?.name||upstream?.id,downstreamName:downstream?.name||downstream?.id,
          configuredDischargeVelocity,engineeringInput:input,upstreamRate:upstream?.nominalRatePerSecond,downstreamInputRate:downstream?.processData?.productInputRatePerSecond??downstream?.nominalRatePerSecond,speedMode:models[index].processData?.accumulation?.speedMode,
          targetPopulation:models[index].processData?.accumulation?.targetPopulationPercent,
          targetOverspeed:models[index].processData?.accumulation?.targetOverspeedPercent,
          speed,dischargeBpm,dischargeVelocity,dischargeSpeed,codingSpeed,dischargePopulation,codingPopulation,flow,consumption,population,blocked,clear,startup,firstPackage,residual,insurance,
          dischargeTime,codingTime,duringDelay,inDischarge,inCoding,total,overflow,
          ramp:input.downstreamRampUpSeconds??belt.downstreamRampUpSeconds,
          dischargeFactor,codingFactor,
          accumulationFactor:input.accumulationSpeedFactorPercent,overspeed:input.infeedOverspeedPercent??models[index].processData?.speedAndSensors?.overspeedVsInfeedScrewPercent??5};
      });
    function extreme(field,select){
      const valid=profiles.filter(profile=>Number.isFinite(profile[field]));
      const governing=valid.reduce((best,profile)=>!best||select(profile[field],best[field])?profile:best,null);
      return {value:governing?.[field],name:governing?.name,partial:valid.length<profiles.length};
    }
    const overflow=extreme('overflow',(a,b)=>a>b);
    const lbu=runout+overflow.value,lba=prime-lbu;
    for(const profile of profiles){
      const {speed,consumption,clear,firstPackage,dischargeTime,codingTime}=profile;
      const overflowTime=divide(overflow.value,speed);
      const arrival=clear+(firstPackage??NaN)+dischargeTime+codingTime+overflowTime;
      const consumed=consumption*arrival;
      const catchTime=divide(consumed,speed-consumption);
      Object.assign(profile,{overflowTime,arrival,consumed,catchTime,extraConsumed:consumption*catchTime,
        recovery:lba-consumed-consumption*catchTime,
        antiStarve:lba>=0&&consumption>0?lba/consumption:NaN,
        antiBlock:lba>=0&&profile.flow>0&&profile.population<1?lba*(1-profile.population)/profile.flow:NaN});
    }
    const recovery=extreme('recovery',(a,b)=>a<b);
    recovery.partial ||= overflow.partial;
    const margin=recovery.value;
    const minimumLength=Number.isFinite(margin)?lact-margin:undefined;
    const transportIssue=data.transportFlowIssue||designProfiles.find(({models})=>models[index]?.processData?.productApplies!==false&&models[index]?.processData?.transportFlowIssue)?.models[index].processData.transportFlowIssue;
    const status=transportIssue?'NOT EVALUATED':margin<-.000001?'FAIL':!Number.isFinite(margin)||recovery.partial?'NOT EVALUATED':margin>.000001?'PASS':'AT LIMIT';
    const point=margin>=0&&lba>=margin?prime-margin:NaN;
    const geometry={lact,lp,prime,discharge,coding,runout,overflow,lbu,lba,recovery,point,minimumLength,status};
    geometry.statusReason=transportIssue||explainVerdict(status,recovery,profiles,geometry);
    return {profiles,geometry,common:[
      ['D8','Discharge','mm',discharge,'Input'],
      ['E8','Coding','mm',coding,'Input'],
      ['F8','Overflow','mm',overflow.value,'=MAX(L58:N58)',overflow],
      ['K8','Lrec (min)','mm',recovery.value,'=MIN(L70:N70)',recovery],
      ['L8','Lp','mm',lp,'Input'],
      ['E11','Lbu','mm',lbu,'=D8+E8+F8',overflow],
      ['I11','Accumulation Zone (Lba)','mm',lba,'=I13-L8-E11 (croquis)',overflow],
      ['I13','Lact','mm',lact,'Input'],
      ['','Max Run-out point','mm',runout,'D8 + E8'],
      ['','Back-up Sensor (calculated)','mm',lbu,'E11',overflow],
      ['','Back-up Sensor (actual)','mm',zone.backupSensorPositionMm,'Operating position'],
      ['','Rec Pt.','mm',point,'I13 − L8 − K8',recovery],
      ['','Prime Sensor (calculated)','mm',prime,'I13 − L8'],
      ['','Prime Sensor (actual)','mm',zone.primeSensorPositionMm,'Operating position'],
      ['','L (min needed)','mm',minimumLength,'Lact − Lrec (minimum for recovery)',recovery]
    ]};
  }

  const rows=[
    ["Package Details",[
      [16,"Package Length","mm",'Input',p=>p.length]
    ]],
    ["Upstream Machine Details",[
      [19,"Upstream Machine Discharge Pitch","mm",'Input',p=>p.dischargePitch],
      [20,"Start-up Time","sec",'Input',p=>p.startup],
      [21,"Bottles Discharged at Stop","#",'Input',p=>p.residual],
      [22,"Nominal Speed","bpm",'Discharge velocity / discharge pitch × bottles per flow unit',p=>p.dischargeBpm],
      [23,"Package Velocity at Discharge of Upstream Machine","m/min",'Input',p=>p.dischargeVelocity],
      [24,"Machine Output Rate (m/min of containers back to back; 100% population)","m/min",'Native discharge rate × package length / 1000',p=>p.flow*.06]
    ]],
    ["Downstream Machine Details",[
      [27,"High Speed","bpm",'Infeed velocity / infeed pitch × bottles per flow unit',p=>p.highSpeedBpm],
      [28,"Downstream Machine - Infeed Pitch","mm",'Input',p=>p.infeedPitch],
      [29,"Ramp up Time to Full Speed (including prime sensor delay)","sec",'Input',p=>p.ramp],
      [30,"Machine Package Consumption Rate (m/min of containers back to back; 100% population)","m/min",'Native infeed rate × package length / 1000',p=>p.consumption*.06]
    ]],
    ["Conveyor Details - Speed Selection",[
      [33,"Conveyor Speed Factor vs Discharge Velocity of the Package Leaving the Upstream Machine","%",'Input',p=>p.dischargeFactor],
      [34,"Discharge Conveyor Speed","m/min",'=L23*(1+L33)',p=>p.dischargeSpeed*.06],
      [35,"Population of Packaging on the Conveyor","%",'=L$24/L34',p=>p.dischargePopulation*100],
      [36,"Coding Conveyor Speed Factor vs Previous Conveyor","%",'Input',p=>p.codingFactor],
      [37,"Coding Conveyor Speed","m/min",'=L34*(1+L36)',p=>p.codingSpeed*.06],
      [38,"Population of Packaging on the Conveyor","%",'=L24/L37',p=>p.codingPopulation*100],
      [39,"Conveyor Speed Factor vs Previous Conveyor (including overflow, accumulating, and prime sections)","%",'Input',p=>p.accumulationFactor],
      [40,"Conveyor Speed","m/min",'Input',p=>p.speed*.06],
      [41,"Population of Packaging on the Conveyor","%",'=L24/L40',p=>p.population*100]
    ]],
    ["Sensor Information",[
      "Back-up Sensor Operation - Blocked delay timer details",
      [45,"Time for Package to Pass Back up Sensor","sec",'=L16/1000/L40*60',p=>p.length/p.speed],
      [46,"Back Up Sensor Blocked Time Delay (time for sensor to acknowledge non moving packages)","sec",'Input',p=>p.blocked],
      "Back-up Sensor Operation - Clear delay timer details",
      [48,"Back Up Sensor Clear Time Delay (time for sensor to acknowledge no packages present)","sec",'Input',p=>p.clear]
    ]],
    ["Overflow Space Needed - Calculates conveyor length required to accomodate all packagess during a normal stop",[
      [51,"Packages Discharged as Back-up Sensor is blocked","Pkgs",'Blocked delay × native discharge rate / 60',p=>p.duringDelay],
      [52,"Packages Discharged After the Stop Signal from Runout and/or Deceleration","Pkgs",'=L21',p=>p.residual],
      [53,"Packages in Transit on Discharge Conveyor","Pkgs",'=$D$8*L35/L16',p=>p.inDischarge],
      [54,"Packages in Transit on Coding Conveyor","Pkgs",'=$E$8*L38/L16',p=>p.inCoding],
      [55,"\"Insurance Factor\" (possible extra packages discharged after stop)","Pkgs",'Input',p=>p.insurance],
      [56,"Subtotal of Packages in Transit on Conveyors (w/o overflow area)","Pkgs",'=SUM(L51:L55)',p=>p.total],
      [57,"Space Needed in Overflow Area for the \"Subtotal\" Packages","mm",'=L56*L16',p=>p.total*p.length],
      [58,"Length of Overflow Area Needed for Packages Discharged and in Transit.","mm",'=L57/(1-L41)',p=>p.overflow]
    ]],
    ["Calculating Recovery Position and Conveyor Length needed for smooth restart after downstream machine downtime (Lrec)",[
      [61,"Back Up Sensor Clear Time Delay (time for sensor to acknowledge no packages present)","sec",'=L48',p=>p.clear],
      [62,"Time for Upstream Machine to Make Packages in Process (time delay for first package to exit)","sec",'Input',p=>p.firstPackage],
      [63,"Time for Packages to Travel Across Discharge Conveyor","sec",'=$D$8/L$34/1000*60',p=>p.dischargeTime],
      [64,"Time for Packages to Travel Across Coding Conveyor","sec",'=$E$8/L37/1000*60',p=>p.codingTime],
      [65,"Time for Packages to Travel Across Maximum Length Overflow Area (all formats are considered)","sec",'=$F$8/L40/1000*60',p=>p.overflowTime],
      [66,"Total Time for First Package to Reach the Back up Sensor","sec",'=SUM(L61:L65)',p=>p.arrival],
      [67,"Reduction of queue in time for first bottle to reach back-up sensor","mm",'=L27*L16/60*L66 (reconstructed)',p=>p.consumed],
      [68,"Time from first bottle at backup sensor to first bottle reaching back of queue","sec",'=(L67/1000)/(L40-L30)*60',p=>p.catchTime],
      [69,"Reduction in queue from first bottle at back up sensor to first bottle reaching queue","mm",'=L30/60*L68*1000',p=>p.extraConsumed],
      [70,"Recovery Distance (position where first package catches the queue being consumed on start-up)","mm",'=$I$11-L69-L67',p=>p.recovery]
    ]],
    ["Calculating Conveyor Accumulation Time (Tacc)",[
      "Antistarve Accumulation (normally full) Critical machine is downstream",
      [73,"Accumulation available on Lba","min",'=$I$11*(1-L414)/L16/L27 (L414 treated as 0)',p=>p.antiStarve/60],
      [74,"Accumulation available on Lba","sec",'=L73*60',p=>p.antiStarve],
      "Antiblock Accumulation (normally empty) Critical machine is upstream",
      [75,"Accumulation available on Lba","min",'=$I$11*(1-L41)/L16/L22',p=>p.antiBlock/60],
      [76,"Accumulation available on Lba","sec",'=L75*60',p=>p.antiBlock]
    ]],
    ["Calculating Downstream Machine Infeed Conveyor Speed",[
      [79,"Overspeed of conveyor vs infeed screw (5% recommended)","%",'Input',p=>p.overspeed],
      [80,"Recommended (Minimum) Conveyor Speed","m/min",'=L28*L28/1000*(1+L79)',recommendedSpeed]
    ]]
  ];

  // Diagnostic graph mirrors the existing worksheet calculations. It never
  // supplies defaults, changes a result, or changes the engineering verdict.
  // IDs are the worksheet row references; display names let the user locate
  // the corresponding row even though the original cell column is hidden.
  const commonTraceKeys=['D8','E8','F8','K8','L8','E11','I11','I13','RUNOUT',
    'BACKUP_CALCULATED','BACKUP_ACTUAL','RECOVERY_POINT','PRIME_CALCULATED','PRIME_ACTUAL','MIN_LENGTH'];
  function createPendingTrace(worksheet,context={},language='en'){
    const es=language==='es',tr=(en,spanish)=>es?spanish:en,formatNumber=n=>new Intl.NumberFormat(es?'es-MX':'en-US',{maximumFractionDigits:3}).format(n);
    const translate=value=>window.STLanguage?.current?.()===language?window.STLanguage.translate(value):value;
    const g=worksheet.geometry,profiles=worksheet.profiles,nodes=new Map(),common=(key)=>'common:'+key,local=(i,key)=>i+':'+key;
    const finite=Number.isFinite,positive=v=>finite(v)&&v>0,nonnegative=v=>finite(v)&&v>=0;
    const dep=(key,test=finite,condition)=>({key,test,condition});
    const needPositive=key=>dep(key,positive,tr('must be greater than zero','debe ser mayor que cero'));
    const needNonnegative=key=>dep(key,nonnegative,tr('must be zero or greater','debe ser cero o mayor'));
    const below100=key=>dep(key,v=>finite(v)&&v>=0&&v<100,tr('must be below 100% and nonnegative','debe ser menor que 100% y no negativa'));
    const add=(key,label,value,dependencies=[],help='',partial=false)=>nodes.set(key,{key,label,value,dependencies,help,partial});
    for(const [index,entry] of worksheet.common.entries()){
      const [,label,,value,,source]=entry,key=commonTraceKeys[index];
      add(common(key),translate(label)+(entry[0]?' ('+entry[0]+')':''),value,[],'',Boolean(source?.partial));
    }
    const change=(key,dependencies,help)=>{const node=nodes.get(key);if(node){node.dependencies=dependencies||[];node.help=help||'';}};
    change(common('D8'),[],tr('Enter the installed Discharge length in Conveyors → Geometry. Enter 0 only if the section does not exist.','Captura Discharge actual en Conveyors → Geometry. Usa 0 solo si no existe el tramo.'));
    change(common('E8'),[],tr('Enter the installed Coding length in Conveyors → Geometry. Enter 0 only if the section does not exist.','Captura Coding actual en Conveyors → Geometry. Usa 0 solo si no existe el tramo.'));
    change(common('I13'),[],tr('Enter the installed total conveyor length (Lact) in Conveyors → Geometry.','Captura la longitud total instalada (Lact) en Conveyors → Geometry.'));
    change(common('L8'),[],tr('Enter Prime zone reserve (Lp), or provide the installed Prime position and Lact.','Captura la reserva Prime (Lp), o proporciona la posición instalada de Prime y Lact.'));
    change(common('RUNOUT'),[dep(common('D8')),dep(common('E8'))]);
    change(common('PRIME_CALCULATED'),[dep(common('I13')),dep(common('L8'))]);
    change(common('F8'),profiles.map((p,i)=>dep(local(i,'L58'))),tr('There are no applicable formats with a calculable overflow. Review Formats.','No hay formatos aplicables con overflow calculable. Revisa Formats.'));
    change(common('E11'),[dep(common('D8')),dep(common('E8')),dep(common('F8'))]);
    change(common('I11'),[dep(common('PRIME_CALCULATED')),dep(common('E11'))]);
    change(common('K8'),[dep(common('F8')),...profiles.map((p,i)=>dep(local(i,'L70')))],tr('No applicable format has a calculable recovery distance.','Ningún formato aplicable tiene una distancia de recuperación calculable.'));
    change(common('BACKUP_CALCULATED'),[dep(common('E11'))]);
    const zone=context.zone||{},acc=context.data?.accumulation||{},engineInput=zone.engineering?.input||{};
    const backupMissing=[];
    if(!finite(zone.backupSensorPositionMm)){
      if(finite(acc.manualLbaMm)){
        if(!finite(zone.primeSensorPositionMm))backupMissing.push(tr('Engine-resolved Prime position','Posición Prime resuelta por el motor'));
      }else{
        if(!positive(zone.productPitchMm)&&!(positive(zone.productLengthMm)&&nonnegative(zone.gapMm)))backupMissing.push(tr('Engine-resolved moving product pitch or package length plus gap','Pitch de transporte resuelto por el motor o longitud del envase más separación'));
        if(!positive(zone.conveyorSpeedMmPerSecond))backupMissing.push(tr('Engine-resolved conveyor speed','Velocidad del conveyor resuelta por el motor'));
        if(!positive(engineInput.upstreamNominalSpeedBpm)&&!positive(profiles[0]?.upstreamRate))backupMissing.push(tr('Upstream machine nominal rate','Velocidad nominal de la máquina anterior'));
      }
    }
    const backupHelp=tr('The operating Back-up position is not resolved by the engine. Check the installed Back-up override or manual LBA, if used.','El motor no resolvió la posición operativa de Back-up. Revisa Back-up instalado o LBA manual, si se utilizan.');
    change(common('BACKUP_ACTUAL'),[],backupHelp+(backupMissing.length?' '+tr('Unresolved engine inputs: ','Inputs pendientes del motor: ')+backupMissing.join('; ')+'.':' '+tr('Review the engine-resolved overflow geometry; the worksheet recommendation is a separate calculation.','Revisa la geometría de overflow resuelta por el motor; la recomendación de la hoja es un cálculo independiente.')));
    change(common('PRIME_ACTUAL'),[dep(common('PRIME_CALCULATED'))],tr('Check the installed Prime position or the engine-resolved geometry.','Revisa la posición Prime instalada o la geometría resuelta por el motor.'));
    change(common('RECOVERY_POINT'),[dep(common('PRIME_CALCULATED')),dep(common('K8')),dep(common('I11'))],
      finite(g.recovery.value)&&g.recovery.value<0?tr('No recovery point exists: Lrec is negative. This is a design failure, not a missing input.','No existe punto de recuperación: Lrec es negativo. Es una condición de diseño, no un dato faltante.'):
      finite(g.lba)&&finite(g.recovery.value)&&g.lba<g.recovery.value?tr('The calculated recovery point is outside the useful accumulation zone.','El punto de recuperación calculado queda fuera de la zona de acumulación útil.'):tr('Check whether the calculated recovery point is physically within the accumulation zone.','Verifica si el punto de recuperación calculado está dentro de la zona de acumulación.'));
    change(common('MIN_LENGTH'),[dep(common('I13')),dep(common('K8'))]);
    profiles.forEach((p,i)=>{
      const key=ref=>local(i,ref),pdep=ref=>dep(key(ref)),pos=ref=>needPositive(key(ref)),nonneg=ref=>needNonnegative(key(ref)),cd=ref=>dep(common(ref));
      const machine=(name,fallback)=>name||fallback;
      const upstream=machine(p.upstreamName,tr('upstream machine','máquina anterior')),downstream=machine(p.downstreamName,tr('downstream machine','máquina siguiente'));
      for(const [title,entries] of rows)for(const entry of entries){
        if(!Array.isArray(entry))continue;
        const [ref,label,,formula,read]=entry,k='L'+ref;
        const suffix=[35,38,41].includes(ref)?' · '+({35:'Discharge',38:'Coding',41:'Overflow'}[ref]):'';
        add(key(k),p.name+' · '+translate(label)+suffix+' ('+k+')',read(p));
      }
      const set=(ref,dependencies,help)=>change(key(ref),dependencies,help);
      const internal=(ref,label,value,deps,help)=>add(key(ref),p.name+' · '+label,value,deps,help);
      internal('PACK',tr('Bottles per case (Formats)','Botellas por caja (Formats)'),p.packFactor,[],tr('Set a positive bottles-per-case quantity for this format. Required for bottle-equivalent BPM on case conveyors.','Define una cantidad positiva de botellas por caja para este formato. Se requiere para convertir el flujo de cajas a BPM equivalentes.'));
      internal('NATIVE_OUT',tr('Native discharge rate (packages/min)','Flujo nativo de descarga (envases/min)'),p.rate,[pos('L23'),pos('L19')]);
      internal('NATIVE_IN',tr('Native infeed rate (packages/min)','Flujo nativo de entrada (envases/min)'),p.highRate,[pos('L40'),pos('L28')]);
      set('L16',[],tr('Enter Package Length for the transported bottle/case in Formats, or the conveyor package length.','Captura Package Length de la botella/caja transportada en Formats o en el conveyor.'));
      set('L19',[],tr('Check Upstream Machine Discharge Pitch on this conveyor or '+upstream+'. A positive distance between package centers is required.','Revisa Upstream Machine Discharge Pitch en este conveyor o '+upstream+'. Se requiere una distancia positiva entre centros.'));
      set('L20',[],tr('Enter Start-up Time on the conveyor or '+upstream+'. Zero is valid if there is no delay.','Captura Start-up Time en el conveyor o '+upstream+'. Cero es válido si no existe retardo.'));
      set('L21',[],tr('Enter Bottles/Packages Discharged at Stop for '+upstream+' or the conveyor. Zero is valid when confirmed.','Captura Bottles/Packages Discharged at Stop de '+upstream+' o del conveyor. Cero es válido si se confirma.'));
      set('L22',[pos('NATIVE_OUT'),pos('PACK')]);
      set('L23',[pos('L40')],tr('Enter Upstream Discharge Velocity (m/min) on the conveyor (AF), or resolve the conveyor speed used as its existing fallback.','Captura Upstream Discharge Velocity (m/min) del conveyor (AF), o resuelve la velocidad del conveyor que se utiliza como alternativa.'));
      set('L24',[pos('NATIVE_OUT'),pos('L16')]);
      set('L27',[pos('NATIVE_IN'),pos('PACK')]);
      set('L28',[],tr('Enter Downstream Machine Infeed Pitch on this conveyor or '+downstream+'.','Captura Downstream Machine Infeed Pitch en este conveyor o '+downstream+'.'));
      set('L29',[],tr('Enter Ramp up Time on the conveyor or '+downstream+'. Zero is valid for no ramp.','Captura Ramp up Time del conveyor o '+downstream+'. Cero es válido sin rampa.'));
      set('L30',[pos('NATIVE_IN'),pos('L16')]);
      set('L33',[],tr('Enter Conveyor Speed Factor vs Discharge Velocity in Speed & Sensors.','Captura Conveyor Speed Factor vs Discharge Velocity en Speed & Sensors.'));
      set('L34',[pos('L23'),pdep('L33')]);
      set('L35',[pdep('L24'),pos('L34')]);
      set('L36',[],tr('Enter Coding Conveyor Speed Factor vs Previous Conveyor in Speed & Sensors.','Captura Coding Conveyor Speed Factor vs Previous Conveyor en Speed & Sensors.'));
      set('L37',[pos('L34'),pdep('L36')]);
      set('L38',[pdep('L24'),pos('L37')]);
      set('L39',[],tr('Enter the accumulation conveyor speed factor in Speed & Sensors if used by the design.','Captura el factor de velocidad de acumulación en Speed & Sensors si el diseño lo utiliza.'));
      const speedHelp=p.speedMode==='MANUAL'?tr('Enter a positive actual Conveyor Speed in Speed & Sensors (m/min in the editor).','Captura una velocidad real positiva del conveyor en Speed & Sensors (m/min en el editor).'):
        p.targetPopulation!=null?tr('Check target Population (greater than 0 and at most 100%), package length and nominal speed of '+upstream+'.','Revisa Population objetivo (mayor que 0 y hasta 100%), longitud del envase y velocidad nominal de '+upstream+'.'):
        p.targetOverspeed!=null?tr('Check target Overspeed, infeed pitch and speed of '+downstream+'.','Revisa Overspeed objetivo, pitch de entrada y velocidad de '+downstream+'.'):
        tr('Check Conveyor Speed or AUTO calculation inputs: '+upstream+' nominal speed, discharge pitch and speed factors.','Revisa Conveyor Speed o los inputs de cálculo AUTO: velocidad nominal de '+upstream+', pitch de descarga y factores de velocidad.');
      // L23 may use L40 as its fallback; never point L40 back to L23.
      const missingSpeedInputs=[];
      if(!positive(p.speed)&&p.speedMode!=='MANUAL'){
        const inputs=p.engineeringInput||{};
        const missing=(value,label,test=positive)=>{if(!test(value))missingSpeedInputs.push(label);};
        if(p.targetPopulation!=null){
          missing(p.targetPopulation,tr('Target Population (0–100%, greater than zero)','Population objetivo (mayor que cero y hasta 100%)'),v=>positive(v)&&v<=100);
          missing(p.length,tr('Package Length (L16)','Package Length (L16)'));
          missing(inputs.upstreamNominalSpeedBpm??p.upstreamRate,tr('Nominal speed of ','Velocidad nominal de ')+upstream);
        }else if(p.targetOverspeed!=null){
          missing(p.targetOverspeed,tr('Target Overspeed','Overspeed objetivo'),nonnegative);
          missing(p.infeedPitch,tr('Infeed Pitch (L28)','Infeed Pitch (L28)'));
          missing(inputs.downstreamHighSpeedBpm??p.downstreamInputRate,tr('Input speed of ','Velocidad de entrada de ')+downstream);
        }else{
          missing(inputs.upstreamNominalSpeedBpm??p.upstreamRate,tr('Nominal speed of ','Velocidad nominal de ')+upstream);
          missing(p.dischargePitch,tr('Discharge Pitch (L19)','Discharge Pitch (L19)'));
          missing(p.dischargeFactor,tr('Discharge speed factor (L33)','Factor de velocidad Discharge (L33)'),finite);
          if(!finite(p.codingFactor)&&inputs.codingSpeedFactorPercent===undefined)missingSpeedInputs.push(tr('Coding speed factor (L36), if applicable','Factor de velocidad Coding (L36), si aplica'));
          if(!finite(p.accumulationFactor)&&inputs.accumulationSpeedFactorPercent===undefined)missingSpeedInputs.push(tr('Accumulation speed factor (L39), if applicable','Factor de velocidad Accumulation (L39), si aplica'));
        }
      }
      set('L40',[],speedHelp+(missingSpeedInputs.length?' '+tr('Unresolved inputs: ','Inputs pendientes: ')+missingSpeedInputs.join('; ')+'.':''));
      set('L41',[pdep('L24'),pos('L40')]);
      set('L45',[pos('L16'),pos('L40')]);
      set('L46',[],tr('Enter Back Up Sensor Blocked Time Delay in Speed & Sensors.','Captura Back Up Sensor Blocked Time Delay en Speed & Sensors.'));
      set('L48',[],tr('Enter Back Up Sensor Clear Time Delay in Speed & Sensors.','Captura Back Up Sensor Clear Time Delay en Speed & Sensors.'));
      set('L51',[nonneg('L46'),pos('NATIVE_OUT')]);
      set('L52',[nonneg('L21')]);
      set('L53',[cd('D8'),...(g.discharge===0?[]:[pdep('L35'),pos('L16')])]);
      set('L54',[cd('E8'),...(g.coding===0?[]:[pdep('L38'),pos('L16')])]);
      set('L55',[],tr('Enter Insurance Factor in Speed & Sensors if not resolved.','Captura Insurance Factor en Speed & Sensors si no se ha resuelto.'));
      set('L56',['L51','L52','L53','L54','L55'].map(pdep));
      set('L57',[pdep('L56'),pos('L16')]);
      set('L58',[pdep('L57'),below100(key('L41'))]);
      set('L61',[nonneg('L48')]);
      set('L62',[],tr('Enter Time to First Package After Restart (s) on the conveyor, in Upstream. It is a separate input from Start-up Time.','Captura Time to First Package After Restart (s) en el conveyor, sección Upstream. Es un input distinto de Start-up Time.'));
      set('L63',[cd('D8'),...(g.discharge===0?[]:[pos('L34')])]);
      set('L64',[cd('E8'),...(g.coding===0?[]:[pos('L37')])]);
      set('L65',[cd('F8'),pos('L40')]);
      set('L66',['L61','L62','L63','L64','L65'].map(pdep));
      set('L67',[pdep('L30'),pdep('L66')]);
      internal('CATCH_SPEED',tr('Recovery speed margin (Conveyor Speed − Machine Package Consumption Rate)','Margen de velocidad de recuperación (Conveyor Speed − Machine Package Consumption Rate)'),(p.speed-p.consumption)*.06,[pos('L40'),pdep('L30')],tr('Conveyor Speed must exceed Machine Package Consumption Rate; a first package cannot catch the queue otherwise.','Conveyor Speed debe superar Machine Package Consumption Rate; de lo contrario el primer envase no puede alcanzar la cola.'));
      set('L68',[pdep('L67'),pos('CATCH_SPEED')]);
      set('L69',[pdep('L30'),pdep('L68')]);
      set('L70',[cd('I11'),pdep('L69'),pdep('L67')]);
      set('L73',[needNonnegative(common('I11')),pos('L30')]);
      set('L74',[pdep('L73')]);
      set('L75',[needNonnegative(common('I11')),pos('L24'),below100(key('L41'))]);
      set('L76',[pdep('L75')]);
      set('L79',[],tr('Enter conveyor overspeed vs infeed screw in Speed & Sensors.','Captura Overspeed of conveyor vs infeed screw en Speed & Sensors.'));
      set('L80',[pos('L28'),pdep('L79')]);
    });
    function blocked(node){
      return node.dependencies.filter(d=>{const n=nodes.get(d.key);return !n||!d.test(n.value)||n.partial;});
    }
    function describe(ref,profileIndex=null){
      const node=nodes.get(profileIndex===null?common(ref):local(profileIndex,ref));
      if(!node||finite(node.value)&&!node.partial)return '';
      const immediate=blocked(node),roots=new Set(),visited=new Set();
      function follow(n){
        if(!n||visited.has(n.key))return;visited.add(n.key);
        const unmet=blocked(n);
        if(!unmet.length){
          roots.add(n.label+': '+(n.help||tr('Check this unresolved input or calculation.','Revisa este input o cálculo no resuelto.')));
          return;
        }
        for(const d of unmet){
          const child=nodes.get(d.key);
          if(!child)continue;
          if(finite(child.value)&&!d.test(child.value)){
            roots.add(child.label+' = '+formatNumber(child.value)+': '+(child.help||d.condition||tr('invalid for this formula','inválido para esta fórmula')));continue;
          }
          follow(child);
        }
        // L23 is an optional explicit input as well as a speed fallback.
        if(n.key.endsWith(':L23')&&n.help)roots.add(n.label+': '+n.help);
      }
      follow(node);
      const direct=immediate.map(d=>{
        const n=nodes.get(d.key);if(!n)return d.key;
        return n.label+(finite(n.value)?n.partial?' — '+tr('partial','parcial'):' = '+formatNumber(n.value)+(d.condition?' ('+d.condition+')':''):' — '+tr('Pending','Pendiente'));
      });
      const parts=[(node.partial&&finite(node.value)?tr('Partial result','Resultado parcial'):tr('Pending','Pendiente'))+' · '+node.label];
      if(direct.length)parts.push(tr('Missing dependencies:','Dependencias pendientes:')+'\n'+direct.map(x=>'• '+x).join('\n'));
      if(roots.size)parts.push(tr('Check:','Revisar:')+'\n'+[...roots].map(x=>'• '+x).join('\n'));
      return parts.join('\n\n');
    }
    return {describe,commonKeys:commonTraceKeys.slice()};
  }

  function open(name,context){
    if(!context)return;
    const dialog=document.getElementById('conveyor-analysis-dialog');
    const body=document.getElementById('conveyor-analysis-body');
    const number=new Intl.NumberFormat(undefined,{maximumFractionDigits:2});
    const valueText=value=>Number.isFinite(value)?number.format(value):'Pending';
    const worksheet=calculate(context);
    const trace=createPendingTrace(worksheet,context,document.documentElement.lang==='es'?'es':'en');
    body.replaceChildren();
    document.getElementById('conveyor-analysis-title').textContent='Conveyor Analysis Tool · '+name;
    function make(parent,tag,text){
      const element=document.createElement(tag);
      if(text!==undefined)element.textContent=text;
      parent.append(element);
      return element;
    }
    // Encabezados breves: la descripción completa de cada formato se muestra
    // fuera de la tabla, para no forzar anchuras de columnas innecesarias.
    function table(title,headers,verdict,profiles){
      const tools=[];
      if(verdict){
        const badge=document.createElement('span');
        badge.textContent=verdict.status;
        badge.className='conveyor-analysis-verdict st-status-pill';
        badge.style.backgroundColor=verdictColors[verdict.status];
        badge.title=verdict.statusReason;
        tools.push(badge);
      }
      const description=profiles?.length?(profiles.length===1
        ?'Format: '+profiles[0].name
        :profiles.map((profile,index)=>'Value '+(index+1)+': '+profile.name).join(' · ')):
        'Installed geometry and recovery margin across applicable formats.';
      const group=window.STSubsection.create({title,description,variant:'B',native:true,open:true,tools});
      body.append(group.section);
      const heading=group.title;
      heading.id='conveyor-analysis-section-'+body.children.length;
      const wrapper=make(group.body,'div');
      wrapper.className='table-scroll';
      const element=make(wrapper,'table');
      element.setAttribute('aria-labelledby',heading.id);
      // Explicit, content-adaptive columns: equal compact format columns;
      // the parameter column takes the remaining width and wraps normally.
      const count=headers.length-2;
      element.dataset.valueColumns=String(count);
      const colgroup=make(element,'colgroup');
      make(colgroup,'col').className='worksheet-parameter-col';
      const unitWidth=count>4?8:12,valueWidth=Math.min(22,(100-unitWidth-35)/count);
      for(let i=0;i<count;i++){const col=make(colgroup,'col');col.className='worksheet-value-col';col.style.width='min(7.5rem, '+valueWidth+'%)';}
      const unitCol=make(colgroup,'col');unitCol.className='worksheet-unit-col';unitCol.style.width='min(4.5rem, '+unitWidth+'%)';
      if(count>3)element.style.setProperty('--worksheet-min-width',(14+count*5+3.5)+'rem');
      const row=make(make(element,'thead'),'tr');
      headers.forEach((header,index)=>{
        const cell=make(row,'th',header);
        cell.scope='col';
        if(index>0&&index<headers.length-1)cell.className='numeric';
      });
      return make(element,'tbody');
    }
    function row(parent,ref,label){
      const element=make(parent,'tr');
      if(ref)element.dataset.cell=ref;
      if(ref==='K8'||ref==='L70')element.title=recoveryHelp;
      if(ref==='D8'||ref==='E8')element.title=lengthHelp[ref==='D8'?'discharge':'coding'];
      const heading=make(element,'th',label);heading.scope='row';
      if(ref)heading.title=ref+' · '+label;
      return element;
    }
    function renderValue(cell,value,tip,partial=false){
      cell.textContent=valueText(value)+(Number.isFinite(value)&&partial?' (partial)':'');
      if(!tip)return;
      cell.title=tip;cell.tabIndex=0;
      cell.setAttribute('aria-label',cell.textContent+' · '+tip);
      cell.classList.add(Number.isFinite(value)?'conveyor-value-partial':'conveyor-value-pending');
    }
    const common=table('Common Geometry',['Parameter','Value','Unit'],worksheet.geometry);
    worksheet.common.forEach(([ref,label,unit,value,,source],index)=>{
      const element=row(common,ref,label);
      const output=make(element,'td');
      output.className='numeric';
      make(element,'td',unit).className='metric-unit';
      renderValue(output,value,trace.describe(trace.commonKeys[index]),Boolean(source?.partial));
    });
    if(!worksheet.profiles.length)make(body,'p','No applicable formats.');
    for(const [title,entries] of worksheet.profiles.length?rows:[]){
      const formats=table(title,['Parameter',...worksheet.profiles.map((profile,index)=>
        worksheet.profiles.length===1?'Value':'Value '+(index+1)),'Unit'],null,worksheet.profiles);
      for(const entry of entries){
        if(typeof entry==='string'){
          const heading=make(make(formats,'tr'),'th',entry);
          heading.colSpan=worksheet.profiles.length+2;
          heading.scope='rowgroup';
          continue;
        }
        const [ref,label,unit,,read]=entry;
        const element=row(formats,'L'+ref,label);
        if(ref>=33&&ref<=41)element.dataset.zone=ref<=35?'discharge':ref<=38?'coding':'overflow';
        worksheet.profiles.forEach((profile,index)=>{
          const cell=make(element,'td');
          cell.className='numeric';
          renderValue(cell,read(profile),trace.describe('L'+ref,index));
        });
        make(element,'td',unit).className='metric-unit';
      }
    }
    const notes=window.STSubsection.create({title:'Calculation notes',description:'Input definitions and engineering assumptions.',variant:'B',native:true,open:true});
    body.append(notes.section);
    make(notes.body,'p','Time to First Package After Restart is configured on the conveyor card. Positions are measured from the conveyor entry.').className='chart-note';
    make(notes.body,'p','Upstream Discharge Velocity (AF) overrides the conveyor speed used as the default discharge reference. Overflow requires conveyor population below 100%.').className='chart-note';
    make(notes.body,'p','Accumulation Zone uses Lact − Lp − Lbu. Queue reduction and antistarve use the worksheet assumptions. L (min needed) is the installed length required for zero recovery margin, at the current worksheet settings.').className='chart-note';
    body.scrollTop=0;
    dialog.showModal();
  }
  document.getElementById('conveyor-analysis-close').addEventListener('click',close);
  function paintEvaluationButton(button,geometry){
    const status=geometry?.status||'NOT EVALUATED',es=document.documentElement.lang==='es';
    const text=es?({'PASS':'CUMPLE','FAIL':'NO CUMPLE','AT LIMIT':'AL LÍMITE','NOT EVALUATED':'NO EVALUADO'}[status]||status):status;
    button.textContent=text;button.dataset.evaluation=status;
    button.classList.toggle('is-pass',status==='PASS');button.classList.toggle('is-fail',status==='FAIL');button.classList.toggle('is-review',status==='AT LIMIT');
    button.title=(es?'Abrir análisis de conveyor':'Open conveyor analysis')+' · '+text+' · '+(geometry?.statusReason||(es?'Geometría o datos requeridos pendientes.':'Required geometry or inputs are pending.'));
    button.setAttribute('aria-label',button.title);
  }
  function createEvaluationButton(openAnalysis){
    const button=document.createElement('button');button.type='button';button.className='equipment-analysis-pill conveyor-editor-verdict st-status-pill';
    button.setAttribute('aria-haspopup','dialog');button.setAttribute('aria-controls','conveyor-analysis-dialog');
    button.addEventListener('click',event=>{event.stopPropagation();openAnalysis();});
    paintEvaluationButton(button,null);return button;
  }
  return {open,close,calculate,resolveProfiles,recommendedSpeed,verdictColors,lengthHelp,createEvaluationButton,paintEvaluationButton,createPendingTrace};
})();
</script>
