   The white copy belongs to the full-width colored layer, so the fill and

.analysis-recommendation .scenario-progress-capsule{position:relative;isolation:isolate;box-sizing:border-box;width:100%;height:var(--progress-capsule-height,1rem);min-height:var(--progress-capsule-height,1rem);min-width:0;flex-shrink:0;padding:0;border:0;border-radius:var(--radius-pill,999px);background:#f1f3f5;overflow:hidden;box-shadow:none!important;filter:none;text-shadow:none}
.scenario-progress-capsule > .scenario-progress-fill{position:absolute;inset:0;z-index:1;margin:0;background-color:var(--scenario-progress-color,#dc2626);background-image:none;box-shadow:none!important;filter:none;clip-path:inset(0 calc(100% - var(--scenario-progress,0%)) 0 0 round var(--radius-pill,999px));transition:clip-path var(--duration-fast,120ms) linear,background-color var(--duration-fast,120ms) linear;pointer-events:none}
.scenario-progress-capsule :is(.scenario-progress-text,.scenario-progress-text-fill){position:absolute;inset:0;display:flex;align-items:center;justify-content:center;margin:0;padding:0 var(--space-1);color:#000;background:transparent;font-size:var(--font-micro,.5625rem);font-weight:var(--weight-semibold,600);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1;pointer-events:none;text-shadow:none;box-shadow:none}
.scenario-progress-capsule .scenario-progress-text-fill{color:#fff}
.scenario-progress-capsule[hidden]{display:none!important}
.scenario-trace-step-details{box-sizing:border-box;overflow:hidden;padding:var(--space-1) var(--space-2) var(--space-2);border-top:1px solid var(--line);font-size:var(--font-caption);line-height:var(--leading-body,1.4)}
.scenario-trace-step-note{color:var(--muted);margin:0 0 var(--space-1);overflow-wrap:anywhere}
.scenario-trace-step-list{display:grid;gap:1px;list-style:none;margin:0;padding:0}
.scenario-trace-step-list>li{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2);min-width:0;margin:0;padding:0;color:var(--muted)}

<script>
// Optional exploration budget overrides; confirmation uses a separate matched run.
window.ST_SCENARIO_SEARCH_LIMITS={parallelCandidates:0,wallClockBudget:false,reusePreviousWinner:false};
window.STScenarioExplorer=(function(){
  var executionPolicy='ZERO_ONLY_PHYSICAL_V6';
  function zeroEngineReady(){return typeof window.STScenarioSearch?.settingsSignature==='function'&&typeof window.STScenarioSearch?.zeroAllowed==='function'&&typeof window.STScenarioSearch?.zeroOFAT==='function'&&JSON.parse(STScenarioSearch.settingsSignature({automaticBasic:true}))[0]==='SCENARIO_SEARCH_ZERO_OFAT_V6';}
  function zeroProject(project){return project?.tier==='ZERO'&&(project.searchScope||project.tier)==='ZERO';}
  function unitLabel(unit){return window.STBasicMode?.unitLabel(unit)||unit||'units';}
  function quantity(value,unit){var strong=el('strong',value,'metric-value');if(unit)strong.append(el('span',unit,'metric-unit'));return strong;}
  // Evidence belongs to the simulation and is saved through the case autosave.
  var activeHost=null,activeRecordKey=null,caseProvider,caseChanged,configurationSerial=0;
  var reliabilityDiscoveryCache=new Map(),flowScreenCache=new Map();
  var summaryCache=new Map(),summaryCacheLimit=128,summaryCacheBytes=0,summaryCacheMaxBytes=8*1024*1024,baselineCache=new Map();
  function rememberMetrics(key,value){
    if(summaryCache.has(key)){summaryCache.delete(key);summaryCacheBytes-=key.length*2;}
    if(key.length*2>summaryCacheMaxBytes)return;
    summaryCache.set(key,value);summaryCacheBytes+=key.length*2;
    while(summaryCache.size>summaryCacheLimit||summaryCacheBytes>summaryCacheMaxBytes){var oldest=summaryCache.keys().next().value;summaryCache.delete(oldest);summaryCacheBytes-=oldest.length*2;}
  } // Bounded LRU: exact metrics only, never replay data.
  function validMetrics(value,rounds,durationSeconds,unitOfFlow){
    if(value?.overflowEvidenceVersion!==2||!Number.isFinite(value.oee)||value.oee<0||!Number.isFinite(value.throughput)||value.throughput<0||value.unitOfFlow!==(unitOfFlow||'units')||!(value.durationSeconds>0)||durationSeconds!==undefined&&value.durationSeconds!==durationSeconds||!Array.isArray(value.roundMetrics)||value.roundMetrics.length!==rounds||new Set(value.roundMetrics.map(r=>r.seed)).size!==rounds)return false;
    if(!value.roundMetrics.every(r=>Number.isInteger(r.seed)&&Number.isFinite(r.oee)&&r.oee>=0&&Number.isFinite(r.throughput)&&r.throughput>=0&&r.durationSeconds===value.durationSeconds))return false;
    return ['oee','throughput'].every(key=>Math.abs(value[key]-value.roundMetrics.reduce((sum,r)=>sum+r[key],0)/rounds)<=1e-7*Math.max(1,Math.abs(value[key])));
  }
  function saveMeasurement(sim,key,value,silent){
    var live=(caseProvider?.()?.simulations||[]).find(s=>s.id===sim.id)||sim;
    live.whatIf=live.whatIf||{};
    var entries=(live.whatIf.measurements||[]).filter(e=>e.key!==key);entries.push({key:key,value:value});
    while(entries.length>16||JSON.stringify(entries).length>262144)entries.shift();
    live.whatIf.measurements=entries;sim.whatIf=live.whatIf;if(!silent)changed(live);
  }
  function doeEnabled(){var record=caseProvider?.();return record?record.metadata?.includeDOE===true:window.STPreferences?.read('scenarioDoe')==='yes';}
  function currentSearchSettings(automaticBasic){return STScenarioSearch.settings(Object.assign({},caseProvider?.()?.metadata?.scenarioSearch,automaticBasic?{automaticBasic:true}:{}));}
  function setDOE(enabled){var record=caseProvider?.();if(!record&&!STPreferences.write('scenarioDoe',enabled?'yes':'no'))return false;if(record){record.metadata=record.metadata||{};record.metadata.includeDOE=enabled;caseChanged?.();}window.dispatchEvent(new Event('st-doe-change'));return true;}
  // Compact Basic comparisons are presentation only. Use a real matched
  // pair (prefer the original horizon); do not project shorter-window gains
  // onto a different baseline or replace missing observations with zeros.
  function compactComparison(entry){
    if(!entry)return {baseline:null,candidate:null,verified:false};
    var original=entry.originalVerification,independent=entry.independentCheck;
    var pair=original?.baseline&&original?.candidate?original:independent?.baseline&&independent?.candidate?independent:entry;
    var verified=pair===original&&original?.passed===true;
    return {baseline:pair.baseline||null,candidate:pair.candidate||null,verified,
      durationSeconds:pair.durationSeconds??pair.baseline?.durationSeconds,rounds:pair.rounds??pair.baseline?.roundMetrics?.length,
      unitOfFlow:pair.unitOfFlow||pair.baseline?.unitOfFlow||entry.unitOfFlow};
  }
  function compactDifference(before,after){
    if(!Number.isFinite(before)||!Number.isFinite(after))return {delta:null,percent:null};
    var delta=after-before;
    return {delta,percent:before!==0?100*delta/Math.abs(before):null};
  }
  function compactInputRows(entry,changes,equipment){
    return (changes||[]).filter(c=>c.before!==c.after).map(c=>{
      var info=STWhatIf.changeInfo(c,equipment),group=entry?.phaseAudit?.ofat?.groups?.find(g=>g.id===c.equipmentId+':'+c.path);
      var derived=!Number.isFinite(c.before)&&Number.isFinite(group?.baselineEffective);
      var before=derived?group.baselineEffective:c.before,after=c.after,unit=c.unit||STScenarios.fields[c.path]?.[2]||'';
      return {name:info.equipment+' · '+info.parameter,before,after,unit,derived};
    });
  }
  function compactPerformanceRows(pair,rateUnit,countUnit){
    var base=pair.baseline||{},candidate=pair.candidate||{},physical=base.scenarioFidelity!=='FLUID_SCREEN_V1'&&candidate.scenarioFidelity!=='FLUID_SCREEN_V1';
    if(!pair.baseline)return [];
    var rows=[{name:'OEE',before:physical?base.oee:null,after:physical?candidate.oee:null,unit:'%',differenceUnit:'pp'},
      {name:'Throughput',before:base.throughput,after:candidate.throughput,unit:rateUnit}];
    if(Number.isFinite(base.overflowUnits)||Number.isFinite(candidate.overflowUnits))rows.push({name:'Overflow',before:base.overflowUnits,after:candidate.overflowUnits,unit:countUnit});
    return rows;
  }
  function savedEntries(simulation){return simulation.whatIf?.evaluations||[];}
  function changed(simulation){window.dispatchEvent(new CustomEvent('st-whatif-change',{detail:{simulation:simulation}}));}
  function displayedOutcome(entry){
    if(!entry)return null;
    if(entry.baseline&&entry.candidate||['NO_DEMONSTRATED_IMPROVEMENT','NO_PROMISING_CANDIDATE','SEARCH_BUDGET_REACHED'].includes(entry.status))return entry;
    return entry.lastResult||(entry.baseline||entry.candidate||entry.progressTrace?.steps?.length?entry:null);
  }
  function evidenceState(entry,simulation,signature=STScenarios.signature(simulation)){
    var outcome=displayedOutcome(entry);
    if(!outcome)return 'NONE';
    if(outcome.sourceSignature&&outcome.sourceSignature!==signature||outcome.sourceSimulationId&&outcome.sourceSimulationId!==simulation.id)return 'STALE';
    if(!outcome.sourceSignature||!outcome.sourceSimulationId)return 'UNVERIFIED';
    return 'CURRENT';
  }
  function evidenceWarning(state){
    var es=document.documentElement.lang==='es';
    if(state==='STALE')return {label:es?'Datos modificados':'Inputs changed',
      message:es?'Resultado histórico: los datos de entrada de la simulación base cambiaron. Se conserva la evaluación anterior, pero debes completar la simulación actual y volver a evaluar este escenario antes de utilizarlo.':'Historical result: the source simulation inputs changed. The previous evaluation is retained, but complete the current numerical simulation and evaluate this scenario again before using it.'};
    if(state==='UNVERIFIED')return {label:es?'Origen sin verificar':'Source unverified',
      message:es?'Resultado histórico: no se puede verificar que corresponda a la configuración actual. Vuelve a evaluar el escenario antes de utilizarlo.':'Historical result: compatibility with the current inputs cannot be verified. Evaluate this scenario again before using it.'};
    return null;
  }
  function evaluations(simulation){
    var signature=STScenarios.signature(simulation);
    // A current settings record can still contain an older displayed result.
    // Do not let that historical evidence pass the matching-source export filter.
    return JSON.parse(JSON.stringify(savedEntries(simulation).filter(r=>{
      var state=evidenceState(r,simulation,signature);
      return r.sourceSimulationId===simulation.id&&r.sourceSignature===signature&&state!=='STALE'&&state!=='UNVERIFIED';
    }).map(r=>{
      var entry=Object.assign({},r);
      if(entry.lastResult&&['STALE','UNVERIFIED'].includes(evidenceState(entry.lastResult,simulation,signature)))delete entry.lastResult;
      if(['RUNNING','VALIDATING'].includes(entry.status)&&entry.recordKey!==activeRecordKey)entry.status='INTERRUPTED';
      return entry;
    })));
  }

  function el(tag,text,cls){var e=document.createElement(tag);e.textContent=text||'';if(cls)e.className=cls;return e;}
  function button(text,fn){var b=el('button',text,'secondary');b.type='button';b.onclick=fn;return b;}
  function iconButton(text,icon,fn){var b=button('',fn);setIcon(b,text,icon);b.classList.add('icon-button');return b;}
  function setIcon(b,text,icon){b.innerHTML=STIcons.svg(icon);b.dataset.icon=icon;b.title=text;b.setAttribute('aria-label',text);}
  function metric(result){return {overflowEvidenceVersion:2,durationSeconds:result.durationSeconds,unitOfFlow:result.unitOfFlow||'units',overflowUnits:result.batch?.statistics?.totalOverflowUnits?.mean??result.summary.totalOverflowUnits??null,roundMetrics:result.batch?.rows?.map(row=>({seed:row.seed,durationSeconds:row.durationSeconds??result.durationSeconds,outputCount:row.summary.outputCount,oee:row.summary.lineOeePercent,throughput:row.summary.outputCount/(row.durationSeconds??result.durationSeconds)*60})),oee:result.batch?.statistics?.lineOeePercent?.mean??result.summary.lineOeePercent,throughput:result.batch?.statistics?.throughputPerMinute?.mean??result.summary.outputCount/result.durationSeconds*60};}
  function config(sim){var r=Object.assign({durationSeconds:300,tickSeconds:.25,sampleEverySeconds:5,seed:1,commands:[],rounds:1},sim.dynamicConfig||{});if(r.durationMode==='SHIFTS')r.durationSeconds=(r.shiftHours||8)*(r.shiftCount||1)*3600;return r;}
  function evaluationWarnings(candidate,value){var warnings=(candidate.scenarioWarnings||[]).slice();if(value.overflowUnits>1e-6)warnings.push({equipmentId:'LINE',rule:'SIMULATED_OVERFLOW',before:'No spill accepted as an approved recommendation',after:value.overflowUnits});return warnings;}
  async function evaluate(sim,changes,cancelled,seedOffset,runConfig,onProgress,silent,inputUnitOverride){
    if(!zeroEngineReady())throw Error('SCENARIO_ZERO_VERSION_MISMATCH');
    if(!changes.every(c=>STScenarioSearch.zeroAllowed(c,sim.equipment)))throw Error('SCENARIO_ZERO_FLOW_ONLY');
    if(runConfig?.scenarioFidelity==='FLUID_SCREEN_V1')throw Error('SCENARIO_ZERO_PHYSICAL_ONLY');
    if((runConfig||config(sim)).engineId==='DES_SIMPY_EXPERIMENTAL')throw Error('What-If is not validated for the experimental SimPy engine.');
    // Applying a trial does not require replay, previous DOE, or other history.
    var candidate=changes.length?STScenarios.apply(sim,changes,{previewOnly:true}):sim;
    var input={case:{id:sim.id||'scenario-preview',unitOfFlow:inputUnitOverride||sim.unitOfFlow,equipment:candidate.equipment},run:Object.assign({},runConfig||config(sim),seedOffset?{seed:(Number((runConfig||config(sim)).seed)+seedOffset)%2147483647}:{})};
    if(cancelled?.())throw Error('BATCH_CANCELLED');
