<script>
window.STEquipmentRoles=(function(){
  function readCapacity(fields,data){
    var input=fields.querySelector('.equipment-internal-capacity');
    if(!input.checkValidity())return false;
    data.equipment=data.equipment||{};
    var residence=fields.querySelector('.equipment-residence-time');
    if(residence){if(!residence.checkValidity())return false;if(residence.value==='')delete data.equipment.residenceTimeSeconds;else data.equipment.residenceTimeSeconds=Number(residence.value);}
    if(input.value==='')delete data.equipment.internalCapacityBottles;
    else data.equipment.internalCapacityBottles=Number(input.value);
    var occupancy=fields.querySelector('.equipment-occupancy-mode');
    if(occupancy)data.equipment.occupancyMode=occupancy.value==='POSITIONS'?'POSITIONS':'STORAGE';
    var scrap=fields.querySelector('.equipment-macrostop-scrap');
    if(scrap&&!(window.STBasicMode?.isBasicEditor?.()??window.STBasicMode?.isBasic())){
      if(!scrap.checkValidity()||!Number.isSafeInteger(Number(scrap.value))||Number(scrap.value)<0)return false;
      if(Number(scrap.value)>0)data.equipment.macroStopScrapBottles=Number(scrap.value);else delete data.equipment.macroStopScrapBottles;
    }
    return true;
  }
  function machineType(e){var types=['BLOWER','BLOWMOLDER','PUCKER','FILLER','CAPPER','FEEDER','DEPUCKER','SLEEVER','CASE_PACKER','PALLETIZER','CUSTOM'];return e.type==='PACEMAKER'?(types.includes(e.processData?.machineType)?e.processData.machineType:'CUSTOM'):e.type||'CUSTOM';}
  function attach(card,equipment){
    var fields=card._fields,grid=fields.querySelector('.equipment-grid');
    var selected=equipment.type==='PACEMAKER'||equipment.processData?.role==='PACEMAKER'||equipment.characteristics?.isPacemaker===true;
    [['pacemaker','checkbox',__ST_TEXT__('equipment.pacemaker')],['maximum-speed','number',__ST_TEXT__('equipment.maximum_speed')],['recovery-time','number',__ST_TEXT__('equipment.recovery_time')],['residence-time','number','Residence time (s)']].forEach(function(spec){
      var label=document.createElement('label'),input=document.createElement('input');label.className='machine-design-field'+(spec[0]==='pacemaker'?' equipment-critical-field checkbox-label st-checkbox-card':'');label.textContent=spec[2];label.title=spec[0]==='pacemaker'?__ST_TEXT__('equipment.pacemaker_help'):__ST_TEXT__('equipment.maximum_help');input.className='equipment-'+spec[0];input.type=spec[1];
      if(spec[1]==='number'){input.min=spec[0]==='residence-time'?'0':'0.000001';input.step='any';}
      if(spec[0]==='residence-time'){input.value=equipment.processData?.equipment?.residenceTimeSeconds??'';input.placeholder='0';label.title='Optional minimum time inside the machine. Capacity alone does not impose a residence time; nominal speed defines the processing cycle.';}
      if(spec[0]==='pacemaker'){input.checked=selected;input.addEventListener('change',function(){if(input.checked)document.querySelectorAll('.equipment-pacemaker').forEach(function(other){if(other!==input)other.checked=false;});});}
      if(spec[0]==='maximum-speed')input.value=equipment.processData?.equipment?.maximumSpeedBpm??'';
      if(spec[0]==='recovery-time'){input.value=equipment.processData?.equipment?.recoveryTimeSeconds??'';input.placeholder=__ST_TEXT__('equipment.recovery_default');label.title=__ST_TEXT__('equipment.recovery_help');}
      if(spec[0]==='pacemaker'){label.prepend(input);grid.prepend(label);}
      else{label.appendChild(input);grid.appendChild(label);}
    });
    var capacityLabel=document.createElement('label'),capacity=document.createElement('input');
    capacityLabel.className='machine-design-field';
    var capacityTitle=document.createTextNode('');capacityLabel.append(capacityTitle);
    function refreshCapacityUnit(){
      var unit=fields.querySelector('.equipment-input-unit')?.value||equipment.processData?.flowUnits?.input;
      capacityTitle.nodeValue='Internal capacity ('+(unit==='CASES'?'cases':'bottles')+')';
    }
    fields.querySelector('.equipment-unit')?.addEventListener('change',refreshCapacityUnit);
    refreshCapacityUnit();
    capacityLabel.title='Maximum incoming bottles or cases held inside the equipment. This limit does not impose a residence time.';
    capacity.type='number';capacity.className='equipment-internal-capacity';capacity.placeholder='30';
    capacity.min='1';capacity.step='1';capacity.value=equipment.processData?.equipment?.internalCapacityBottles??'';
    capacityLabel.append(capacity);grid.append(capacityLabel);
    var occupancyLabel=document.createElement('label'),occupancy=document.createElement('select');
    occupancyLabel.className='machine-design-field';
    occupancyLabel.append(document.createTextNode('Internal occupancy model'));
    occupancy.className='equipment-occupancy-mode';
    [['STORAGE','Storage capacity (variable fill)'],['POSITIONS','Physical positions (rotating pockets)']]
      .forEach(function(choice){var option=document.createElement('option');option.value=choice[0];option.textContent=choice[1];occupancy.append(option);});
    occupancy.value=equipment.processData?.equipment?.occupancyMode==='POSITIONS'?'POSITIONS':'STORAGE';
    occupancy.title='Storage is a volume ceiling. Physical positions use a finite rotating pocket count: at steady full feed the positions are occupied, and starvation leaves real empty pockets. The optional Residence time remains a separate minimum.';
    occupancyLabel.append(occupancy);grid.append(occupancyLabel);
    var scrapLabel=document.createElement('label'),scrap=document.createElement('input');
    scrapLabel.className='machine-design-field advanced-scrap-field';scrapLabel.textContent='Macrostop scrap (bottles/stop)';
    scrapLabel.title='Bottles rejected once per MAJOR or GENERAL repair event or individual STOP. Excludes MINOR, microstops, PAUSE and emergency stop. If inventory is insufficient, the rest is rejected from incoming product after repair. For case-fed machines, specify complete cases in bottle equivalents.';
    scrap.type='number';scrap.className='equipment-macrostop-scrap';scrap.min='0';scrap.step='1';scrap.required=true;
    scrap.value=equipment.processData?.equipment?.macroStopScrapBottles??0;
    scrapLabel.append(scrap);grid.append(scrapLabel);
    function refresh(){
      try{
        var data=JSON.parse(fields.querySelector('.equipment-process-data').value),characteristics=JSON.parse(fields.querySelector('.equipment-characteristics').value);
        fields.querySelector('.equipment-pacemaker').checked=data.role==='PACEMAKER'||characteristics.isPacemaker===true;
        fields.querySelector('.equipment-maximum-speed').value=data.equipment?.maximumSpeedBpm??'';
        fields.querySelector('.equipment-recovery-time').value=data.equipment?.recoveryTimeSeconds??'';
        capacity.value=data.equipment?.internalCapacityBottles??'';
        scrap.value=data.equipment?.macroStopScrapBottles??0;
        fields.querySelector('.equipment-residence-time').value=data.equipment?.residenceTimeSeconds??'';
        occupancy.value=data.equipment?.occupancyMode==='POSITIONS'?'POSITIONS':'STORAGE';
        refreshCapacityUnit();
      }catch(_){/* Validation handles incomplete JSON. */}
    }
    fields.querySelector('.equipment-process-data').addEventListener('change',refresh);
    fields.querySelector('.equipment-characteristics').addEventListener('change',refresh);
  }
  function read(card,characteristics,data,type){
    var fields=card._fields,pacemaker=type!=='CONVEYOR'&&fields.querySelector('.equipment-pacemaker').checked;
    characteristics.isPacemaker=pacemaker;
    data.role=type==='CONVEYOR'?'CONVEYOR':pacemaker?'PACEMAKER':(characteristics.criticalMachine||data.role==='CRITICAL_MACHINE')?'CRITICAL_MACHINE':'MACHINE';data.machineType=type;
    if(type==='CONVEYOR'&&data.equipment)delete data.equipment.macroStopScrapBottles;
    if(type!=='CONVEYOR'){
      if(!readCapacity(fields,data))return false;
      for(var spec of [['maximum-speed','maximumSpeedBpm'],['recovery-time','recoveryTimeSeconds'],['residence-time','residenceTimeSeconds']]){
        var input=fields.querySelector('.equipment-'+spec[0]);
        if(!input.checkValidity())return false;
        if(input.value==='')delete data.equipment[spec[1]];else data.equipment[spec[1]]=Number(input.value);
      }
    }
    return true;
  }
  return {attach:attach,read:read,readCapacity:readCapacity,machineType:machineType};
})();
</script>
