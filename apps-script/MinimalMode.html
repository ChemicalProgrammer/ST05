<script>
window.STMinimalMode=(function(){
  'use strict';
  var state,actions,initialized=false,importing=false,starting=false,searching=false,searchSaving=false,buildingCards=false,timer=null,stopRequested=false;
  var runStopRequested=false,runStopTask=null;
  var runStartedAt=null,searchStartedAt=null;
  var runProgress=0,searchProgress=0,searchCard=null,searchCompleted=0,searchTotal=1,tableKey='',resultKey='',scenarioOwner=null,scenarioResult=null,readinessCache=null,searchMessage='',lastOwner=null;
  var tiers=['ZERO'];
  var executionPolicy='ZERO_ONLY_PHYSICAL_V6';
  function zeroCard(card,simulationId){return !!card&&card.dataset?.motionKey===JSON.stringify([simulationId,'CAPEX','ZERO'])&&card.dataset?.capexExecutionPolicy===executionPolicy&&typeof card._runMinimalSearch==='function';}
  function el(id){return document.getElementById(id);}
  function node(tag,text,cls){var n=document.createElement(tag);if(text!=null)n.textContent=String(text);if(cls)n.className=cls;return n;}
  function tr(value){return window.STLanguage?.translate(value)||value;}
  function isMinimal(){return (state?.bootstrap?.uiMode||STPreferences.resolveInterfaceMode())==='MINIMAL';}
  function busy(){return isMinimal()&&(importing||starting||searching||searchSaving||!!actions?.locked?.());}
  function isSearching(){return isMinimal()&&searching;}
  function number(value,digits){return Number.isFinite(value)?value.toLocaleString(document.documentElement.lang==='es'?'es-MX':'en-US',{maximumFractionDigits:digits??2}):'—';}
  function show(id,visible){var element=el(id);if(['minimal-run-progress','minimal-search-progress','minimal-result-cards','minimal-optimization','minimal-scenario-cards'].includes(id)&&window.STMotion?.visibility)STMotion.visibility(element,visible);else element.hidden=!visible;}
  function headerProgress(){
    if(!initialized||!isMinimal()||!state.activeCase)return null;
    if(starting)return {fraction:runStopRequested||runProgress>=100?null:runProgress/100};
    if(searching)return {fraction:stopRequested?null:Math.min(.999,searchProgress/100)};
    if(searchSaving)return {fraction:null};
    return null;
  }
  function elapsedCalculationLabel(milliseconds){
    var seconds=Math.floor(Math.max(0,Number(milliseconds)||0)/1000);
    return [Math.floor(seconds/3600),Math.floor(seconds/60)%60,seconds%60].map(n=>String(n).padStart(2,'0')).join(':');
  }
  function progress(id,value){
    var holder=el(id),p=Math.max(0,Math.min(100,Number(value)||0));
    holder.querySelector('progress').value=p;
    var percentage=p.toFixed(1).replace(/\.0$/,'')+'%';
    var startedAt=id==='minimal-search-progress'?searchStartedAt:runStartedAt;
    holder.querySelector('output').textContent=percentage+' · '+elapsedCalculationLabel(startedAt===null?0:performance.now()-startedAt);
  }
  function owner(){return actions.simulation();}
  function ownerKey(){return state.activeCase&&owner()?state.activeCase.id+'|'+owner().id:null;}
  function result(){var sim=owner(),r=sim?.results;
    if(!r?.summary||r.replicationStatus?.state!=='COMPLETE'||sim.dynamicConfig?.machineDesignEnabled!==false||sim.dynamicConfig?.machineMaximumSpeedEnabled!==false)return null;
    // An archived result from the full machine model is not a Basic result.
    try{var run=JSON.parse(r.inputSignature).run;return run?.machineDesignEnabled===false&&run?.machineMaximumSpeedEnabled===false?r:null;}catch(_){return null;}
  }
  function reviewRequired(sim){
    var cards=Array.from(document.querySelectorAll('#equipment-list .equipment-card'));
    if(cards.length)return cards.some(c=>!(Number(c._fields?.querySelector('.equipment-rate')?.value)>0));
    return (sim?.equipment||[]).some(e=>!(Number.isFinite(e.nominalRatePerSecond)&&e.nominalRatePerSecond>0));
  }
  function metricValue(value,unit,digits){var n=node('strong',number(value,digits),'metric-value');if(Number.isFinite(value)&&unit)n.append(node('span',' '+unit,'metric-unit'));return n;}
  // Use the shared equipment table; only the original editor owns inputs.
  function syncTable(lock){
    var host=el('minimal-equipment-table-host');
    // The region and its native scrollbar must remain interactive during a run.
    // Lock only controls that can mutate the physical configuration.
    host.inert=false;window.STEquipmentTable?.setLocked?.(lock);
    if(lock)host.setAttribute('aria-busy','true');else host.removeAttribute('aria-busy');
  }
  var durationKey='';
  function readDuration(){
    try{return STRunOptions.durationSeconds();}catch(_){return NaN;}
  }
  function syncDuration(lock){
    var input=el('minimal-duration'),unit=el('minimal-duration-unit'),seconds=readDuration();
    input.disabled=unit.disabled=lock;
    var key=ownerKey()+'|'+seconds+'|'+unit.value;
    if(key!==durationKey&&Number.isFinite(seconds)){
      input.value=String(Number((seconds/(STTimeControls.inputFactors[unit.value]||3600)).toPrecision(12)));
      durationKey=key;
    }
  }
  function applyDuration(){
    if(busy())return false;
    var input=el('minimal-duration'),unit=el('minimal-duration-unit');
    if(!input.reportValidity())return false;
    var seconds=STTimeControls.inputSeconds(input.value,unit.value);
    if(!Number.isFinite(seconds)||seconds<=0||seconds>366*86400*5){actions.error({message:tr('Duration must be positive; end time must follow start time.')});return false;}
    if(Math.abs(seconds-readDuration())<1e-7)return true;
    // The compact control changes the existing run options, not a shadow
    // configuration. Existing saved non-fixed methods remain until edited.
    actions.setDuration(Number(input.value),unit.value);durationKey='';sync(state);return true;
  }
  // Mirror the canonical run input; the compact toolbar owns no independent run.
  var roundsKey='',selectedResult=null,roundView='average',roundViewKey='';
  function readRounds(){return Number(el('run-rounds').value);}
  function syncRounds(lock){
    var input=el('minimal-rounds'),rounds=readRounds(),key=ownerKey()+'|'+rounds;
    input.disabled=lock;
    if(key!==roundsKey&&Number.isInteger(rounds)&&rounds>=1&&rounds<=100){
      input.value=String(rounds);roundsKey=key;
    }
  }
  function applyRounds(){
    if(busy())return false;
    var input=el('minimal-rounds'),rounds=Number(input.value);
    if(!input.reportValidity())return false;
    if(!Number.isInteger(rounds)||rounds<1||rounds>100){
      actions.error({message:tr('Enter a whole number of rounds from 1 to 100.')});return false;
    }
    if(rounds===readRounds())return true;
    actions.setRounds(rounds);roundsKey='';sync(state);return true;
  }
  function expectedRounds(r){return r?.batch?.rounds??r?.replicationStatus?.rounds??r?.rounds??1;}
  function resultRoundRows(r){
    if(!r?.summary)return [];
    var count=expectedRounds(r),rows=r.batch?.rows;
    if(!Number.isInteger(count)||count<1||count>100)return [];
    if(!Array.isArray(rows)||!rows.length){
      return count===1?[{round:1,seed:r.seed,summary:r.summary,durationSeconds:r.durationSeconds}]:[];
    }
    // Use saved per-round measurements, even where compact results omit replay.
    // Never fabricate missing rounds from the first result or its statistics.
    if(rows.length!==count||rows.some(row=>!Number.isInteger(row?.round)||row.round<1||row.round>count||!row.summary)
      ||new Set(rows.map(row=>row.round)).size!==count)return [];
    return rows.slice().sort((a,b)=>a.round-b.round);
  }
  function representativeRound(r,rows){
    var number=r?.batch?.representativeRound;
    if(rows.some(row=>row.round===number))return number;
    if(rows.length===1)return rows[0].round;
    // Same ordering as SimulationBatch.closestRound: output, OEE, round number.
    if(!rows.length||rows.some(row=>!Number.isFinite(row.summary.outputCount)||!Number.isFinite(row.summary.lineOeePercent)))return null;
    var meanOutput=rows.reduce((sum,row)=>sum+row.summary.outputCount,0)/rows.length,
      meanOee=rows.reduce((sum,row)=>sum+row.summary.lineOeePercent,0)/rows.length;
    return rows.slice().sort((a,b)=>Math.abs(a.summary.outputCount-meanOutput)-Math.abs(b.summary.outputCount-meanOutput)
      ||Math.abs(a.summary.lineOeePercent-meanOee)-Math.abs(b.summary.lineOeePercent-meanOee)||a.round-b.round)[0].round;
  }
  function resetRoundView(){selectedResult=null;roundView='average';roundViewKey='';}
  function syncRoundView(r,lock){
    var select=el('minimal-round-view');
    if(selectedResult!==r){resetRoundView();selectedResult=r;}
    var rows=resultRoundRows(r),representative=representativeRound(r,rows);
    select.hidden=!rows.length;select.disabled=lock||!rows.length;
    if(!rows.length)return;
    var options=[['average',tr('Average of all rounds')+' ('+rows.length+')']];
    if(representative!==null)options.push(['representative',tr('Representative round')+' ('+representative+')']);
    rows.forEach(row=>options.push([String(row.round),tr('Round')+' '+row.round]));
    if(!options.some(pair=>pair[0]===roundView))roundView='average';
    var key=JSON.stringify(options);
    if(key!==roundViewKey){
      select.replaceChildren();
      options.forEach(pair=>{var option=node('option',pair[1]);option.value=pair[0];select.append(option);});
      roundViewKey=key;
    }
    select.value=roundView;
  }
  function resultValues(r,selection='average'){
    var unit=window.STFlowUnits?.labels(r.unitOfFlow||state.activeCase?.unitOfFlow)||{count:'units',rate:'units/min'};
    var rows=resultRoundRows(r),stats=r.batch?.statistics||{};
    function values(row){
      var s=row?.summary||{},duration=row?.durationSeconds??r.durationSeconds;
      return {oee:Number.isFinite(s.lineOeePercent)?s.lineOeePercent:null,
        throughput:duration>0&&Number.isFinite(s.outputCount)?s.outputCount/duration*60:null,
        output:Number.isFinite(s.outputCount)?s.outputCount:null};
    }
    if(selection!=='average'){
      var round=selection==='representative'?representativeRound(r,rows):Number(selection);
      var row=rows.find(item=>item.round===round);
      if(row)return {...values(row),unit};
    }
    if(expectedRounds(r)===1&&!r.batch)return {...values(r),unit};
    var measured=rows.map(values);
    function mean(key,stat){
      if(Number.isFinite(stats[stat]?.mean))return stats[stat].mean;
      return measured.length&&measured.every(row=>Number.isFinite(row[key]))
        ?measured.reduce((sum,row)=>sum+row[key],0)/measured.length:null;
    }
    return {unit,oee:mean('oee','lineOeePercent'),throughput:mean('throughput','throughputPerMinute'),output:mean('output','outputCount')};
  }
  function productionLabel(unit){return unit.count==='bottles'?'Bottles produced':'Production';}
  function renderResults(r){
    show('minimal-result-cards',!!r&&!starting&&!actions.locked());
    if(!r)return;
    var v=resultValues(r,roundView),theory=window.STBasicMode?.theoreticalEfficiency(owner()?.equipment),key=JSON.stringify([v,theory,roundView,document.documentElement.lang]);
    if(key===resultKey)return;resultKey=key;
    var grid=el('minimal-result-cards');grid.replaceChildren();
    [['Theoretical equipment efficiency',theory,'%',2],['Simulated efficiency',v.oee,'%',2],['Throughput',v.throughput,v.unit.rate,2],[productionLabel(v.unit),v.output,v.unit.count,roundView==='average'?2:0]].forEach(function(spec,i){
      var card=node('article',null,'metric-card metric-card--featured');
      if(i===0){card.title=tr('Theoretical efficiency = 100 × product of MTBF / (MTBF + MTTR).');card.tabIndex=0;}
      card.append(node('span',spec[0]),metricValue(spec[1],spec[2],spec[3]));grid.append(card);
    });
  }
  function sourceSignature(sim){try{return window.STScenarios?.signature(sim)||null;}catch(_){return null;}}
  // Discard only generated Zero CAPEX evaluations belonging to this simulation.
  // Keep configuration, other CAPEX archives and separately created simulations.
  function ownedZeroResult(entry,sim){return (entry.searchScope||entry.tier)==='ZERO'&&(!entry.sourceSimulationId||entry.sourceSimulationId===sim.id);}
  function discardZeroResults(sim){
    var entries=sim?.whatIf?.evaluations;
    if(Array.isArray(entries))sim.whatIf.evaluations=entries.filter(entry=>!ownedZeroResult(entry,sim));
  }
  function clearScenarios(){
    var grid=el('minimal-scenario-cards');grid.replaceChildren();show('minimal-scenario-cards',false);scenarioOwner=scenarioResult=null;
  }
  function scenarioCards(sim,r,build){
    var grid=el('minimal-scenario-cards');
    if(scenarioOwner!==sim||scenarioResult!==r){clearScenarios();scenarioOwner=sim;scenarioResult=r;}
    function mounted(){return Array.from(grid.querySelectorAll('.analysis-recommendation')).filter(c=>zeroCard(c,sim.id));}
    var cards=mounted();
    if(build&&!buildingCards&&cards.length!==tiers.length){
      buildingCards=true;
      try{actions.prepareSearch(grid);cards=mounted();}
      finally{buildingCards=false;}
    }
    return cards;
  }
  function sourceReadiness(sim,r){
    if(!sim||!r){readinessCache=null;return null;}
    // Physical edits invalidate the baseline; metadata and CAPEX writes do
    // not. Avoid serializing all equipment and replications on every poll.
    var inputs=[sim,r,sim.equipment,sim.dynamicConfig];
    if(!readinessCache||inputs.some((value,i)=>value!==readinessCache.inputs[i])){
      readinessCache={inputs:inputs,value:window.STScenarios?.readiness?.(sim)};
    }
    return readinessCache.value;
  }
  function renderScenarios(sim,r){
    if(stopRequested||!sim||!r||starting||actions.locked()){if(!searching&&(!sim||!r))clearScenarios();show('minimal-scenario-cards',false);return;}
    // Do not clone result cards or reconstruct candidates. The very same
    // Standard cards own the search, saved evidence, dialogs and actions.
    var grid=el('minimal-scenario-cards'),saved=sim.whatIf?.evaluations?.some(entry=>ownedZeroResult(entry,sim));
    var cards=[];
    try{cards=scenarioCards(sim,r,saved&&!searching&&!searchMessage&&sim.dynamicConfig?.engineId!=='DES_SIMPY_EXPERIMENTAL');}
    catch(error){searchMessage=error.message||'Evaluation failed';el('minimal-search-message').textContent=tr(searchMessage);show('minimal-search-message',true);}
    show('minimal-scenario-cards',cards.length>0);
  }
  function stopMonitor(){if(timer!==null){clearInterval(timer);timer=null;}}
  function monitor(){if(timer===null)timer=setInterval(function(){sync(state);if(!busy())stopMonitor();},180);}
  function updateSearchProgress(){
    if(!searching)return;
    var current=Number(searchCard?._minimalSearchProgress?.())||0;
    searchProgress=Math.max(searchProgress,Math.min(99.9,(searchCompleted+Math.min(current,99.9)/100)/searchTotal*100));
    progress('minimal-search-progress',searchProgress);
  }
  // The existing simulation management controls are shared with Standard
  // and Advance. Protect the source while a Basic simulation/search is active.
  function syncSimulationManagement(active,lock){
    ['simulation-selector','rename-simulation','clone-case','delete-simulation'].forEach(function(id){
      var control=el(id);if(!control)return;
      if(!active){
        if(control.dataset.minimalSimulationLock==='true'){control.disabled=false;delete control.dataset.minimalSimulationLock;}
        return;
      }
      control.disabled=lock||(id==='delete-simulation'&&(state.activeCase?.simulations?.length||0)<2);
      control.dataset.minimalSimulationLock='true';
    });
  }
  function sync(current){
    state=current;if(!initialized||state.restoringCaseView||state.restoringSimulation)return;
    var active=isMinimal()&&!!state.activeCase,sim=active?owner():null,k=active?ownerKey():null;
    var workspace=el('minimal-workspace'),becameVisible=active&&workspace.classList.contains('hidden');
    workspace.classList.toggle('hidden',!active);
    if(becameVisible)window.STEquipmentTable?.refresh();
    if(k!==lastOwner){lastOwner=k;durationKey=roundsKey=tableKey=resultKey='';resetRoundView();clearScenarios();readinessCache=null;searchMessage='';runProgress=0;searchProgress=0;}
    var lock=busy();
    syncSimulationManagement(active,lock||state.saving||!!window.STSimulation2D?.isRunning?.());
    document.querySelectorAll('#basic-case-actions button').forEach(function(b){if(lock&&!b.disabled){b.disabled=true;b.dataset.minimalLock='true';}else if(!lock&&b.dataset.minimalLock==='true'){b.disabled=false;delete b.dataset.minimalLock;}});
    if(!active){if(!busy()){stopMonitor();if(scenarioOwner)clearScenarios();}actions.activity?.();return;}
    syncTable(lock||state.saving);syncDuration(lock||state.saving);syncRounds(lock||state.saving);
    var sheetExport=el('minimal-export-equipment-sheet');if(sheetExport)sheetExport.disabled=lock||state.saving||sheetExport.dataset.busy==='true';
    var running=starting||actions.locked(),r=runStopRequested?null:result(),review=reviewRequired(sim);
    show('minimal-input-review',review||!!sim?.sourceImport?.simpleImportIssues?.length&&!r);
    show('minimal-run-progress',running&&!runStopRequested);
    if(running&&!runStopRequested){runProgress=Math.max(runProgress,Math.min(100,100*actions.progress()));progress('minimal-run-progress',runProgress);}
    var runButton=el('minimal-run');runButton.hidden=false;
    runButton.disabled=starting?runStopRequested:lock||state.saving||!sim;
    var priorRunLabel=runButton.textContent;runButton.textContent=tr(starting?(runStopRequested?'Stopping…':'Stop'):r?'Restart simulation':'Run simulation');
    if(priorRunLabel!==runButton.textContent)window.STMotion?.reveal(runButton);
    runButton.title=tr(starting?'Stop simulation':r?'Restart simulation':'Run simulation');
    syncRoundView(running?null:r,lock||state.saving);renderResults(r);
    var benchmark=el('minimal-ideal-benchmark');if(benchmark){benchmark.hidden=true;benchmark.disabled=true;}
    show('minimal-optimization',!!r&&!running);
    var readiness=sourceReadiness(sim,r);
    var canSearch=!!r&&!review&&readiness?.ready===true&&sim.dynamicConfig?.engineId!=='DES_SIMPY_EXPERIMENTAL';
    var searchButton=el('minimal-search'),saved=sim?.whatIf?.evaluations?.some(entry=>ownedZeroResult(entry,sim));
    searchButton.hidden=false;
    searchButton.disabled=searching?stopRequested:!canSearch||lock||running||state.saving;
    var priorSearchLabel=searchButton.textContent;searchButton.textContent=tr(searching?(stopRequested?'Stopping…':'Stop'):saved?'Restart search':'Find optimizations');
    if(priorSearchLabel!==searchButton.textContent)window.STMotion?.reveal(searchButton);
    searchButton.title=tr(searching?'Stop search':saved?'Restart search':'Find optimizations');
    show('minimal-search-progress',searching&&!stopRequested);
    if(searching&&!stopRequested)updateSearchProgress();
    var message=searchMessage||(!canSearch&&r?'Optimization is unavailable for this configuration.'+(readiness?.reason?' ('+readiness.reason+(readiness.differencePath?' · '+readiness.differencePath:'')+')':''):'');
    el('minimal-search-message').textContent=tr(message);show('minimal-search-message',!!message&&!searching&&!runStopRequested);
    renderScenarios(sim,r);
    if(lock)monitor();actions.activity?.();
  }
  function expandForAction(id){
    var button=el(id)?.querySelector('[data-subsection-toggle]');
    if(button&&button.getAttribute('aria-expanded')==='false')window.STSubsection?.userToggle(button,true);
  }
  function clearRunDisplay(){
    runStartedAt=null;runProgress=0;searchProgress=0;searchCompleted=0;searchMessage='';resultKey='';readinessCache=null;
    resetRoundView();el('minimal-result-cards').replaceChildren();show('minimal-result-cards',false);
    el('minimal-round-view').replaceChildren();show('minimal-round-view',false);
    progress('minimal-run-progress',0);progress('minimal-search-progress',0);clearScenarios();
    show('minimal-run-progress',false);show('minimal-search-progress',false);show('minimal-optimization',false);
  }
  function stopRun(){
    if(!starting||runStopRequested)return runStopTask;
    var sim=owner(),key=ownerKey();runStopRequested=true;clearRunDisplay();
    // Assign the task before cancellation resolves the run's first-result promise.
    runStopTask=Promise.resolve().then(async function(){
      await actions.stopRun();
      if(owner()!==sim||ownerKey()!==key)return;
      discardZeroResults(sim);actions.markReset();await actions.save();
    }).catch(function(error){actions.error(error);});
    sync(state);return runStopTask;
  }
  async function startRun(){
    if(busy()||!state.activeCase)return;
    var sim=owner();if(!sim)return;
    if(!applyDuration()||!applyRounds())return;
    // Let the canonical editor and physical engine validate corrected values.
    if((sim.equipment||[]).length<2){actions.error({message:tr('At least two equipment units are required for simulation.')});return;}
    starting=true;runStopRequested=false;runStopTask=null;runStartedAt=performance.now();runProgress=0;clearScenarios();searchMessage='';resultKey='';resetRoundView();
    el('run-calculation-mode').value='FAST';expandForAction('minimal-simulation');sync(state);
    try{await actions.run();}catch(error){if(!runStopRequested)actions.error(error);}finally{
      if(runStopTask)await runStopTask;
      starting=false;runStopRequested=false;runStopTask=null;runStartedAt=null;sync(state);
    }
  }
  // A terminal evaluated outcome is different from a blocked, cancelled or
  // failed call. In particular, an early return must never fill the global bar.
  function completedOutcome(outcome){
    return outcome?.started===true&&['IMPROVEMENT_REPRODUCED','ENGINEERING_REVIEW_REQUIRED','NO_DEMONSTRATED_IMPROVEMENT','NO_PROMISING_CANDIDATE','NO_ELIGIBLE_TARGETS','NOT_REPRODUCED','INFEASIBLE'].includes(outcome.status);
  }
  function stopSearch(){
    if(!searching||stopRequested)return;
    stopRequested=true;searchCard?._cancelMinimalSearch?.({discard:true});
    discardZeroResults(owner());searchProgress=0;searchCompleted=0;searchMessage='';
    progress('minimal-search-progress',0);clearScenarios();show('minimal-search-progress',false);sync(state);
  }
  async function startSearch(onlyCard){
    if(busy()||state.saving||!result()||!owner())return;
    var sim=owner(),r=result(),key=ownerKey(),signature=sourceSignature(sim),readiness=window.STScenarios?.readiness?.(sim);
    if(!readiness?.ready){searchMessage='Optimization is unavailable for this configuration.'+(readiness?.reason?' ('+readiness.reason+')':'');sync(state);return;}
    var cards;
    try{cards=scenarioCards(sim,r,true);}catch(error){searchMessage=error.message||'Evaluation failed';actions.error(error);sync(state);return;}
    // Fail closed on stale cards and mixed-version Apps Script deployments.
    if(window.STScenarioExplorer?.executionPolicy!==executionPolicy||cards.length!==1||!zeroCard(cards[0],sim.id)||(onlyCard&&onlyCard!==cards[0])){searchMessage=document.documentElement.lang==='es'?'Zero CAPEX V6 no está sincronizado. Actualiza la aplicación y recarga la página.':'Zero CAPEX V6 is not synchronized. Update the application and reload.';sync(state);return;}
    var work=[cards[0]];
    searching=true;searchStartedAt=performance.now();stopRequested=false;searchProgress=0;searchCompleted=0;searchTotal=work.length;searchMessage='';expandForAction('minimal-optimization');sync(state);
    var failures=[],evaluated=false;
    try{
      // Reset the complete requested queue before starting its first category.
      // The single-card refresh only resets that card.
      if(work.some(card=>typeof card._prepareMinimalRestart!=='function'))throw Error('CAPEX reset is unavailable.');
      for(var index=0;index<work.length;index++){
        if(!work[index]._prepareMinimalRestart({notify:index===work.length-1}))throw Error('CAPEX card could not be reset.');
        evaluated=true;
      }
      sync(state);
      for(var card of work){
        if(stopRequested)break;
        if(!zeroCard(card,sim.id))throw Error('SCENARIO_CAPEX_DISABLED');
        if(!isMinimal()||ownerKey()!==key||sourceSignature(sim)!==signature){failures.push('Source inputs changed.');break;}
        searchCard=card;
        var label=card.querySelector('.analysis-capex')?.textContent||'CAPEX';
        var outcome;
        try{outcome=await card._runMinimalSearch();}
        catch(error){outcome={started:false,reason:error.message||'Evaluation failed'};}
        evaluated=evaluated||outcome?.started===true;
        if(stopRequested)break; // Ignore even a late successful response after Stop.
        if(completedOutcome(outcome)){searchCompleted++;}
        else failures.push(label+': '+(outcome?.reason||outcome?.status||'Evaluation did not complete.'));
        searchCard=null;
        searchProgress=searchCompleted/searchTotal*100;
        progress('minimal-search-progress',searchProgress);
        sync(state);
        if(stopRequested)break;
      }
      if(!stopRequested&&failures.length)searchMessage=failures.join(' · ');
    }catch(error){if(!stopRequested){searchMessage=error.message||'Evaluation failed';actions.error(error);}}
    finally{
      var discarded=stopRequested,sameOwner=owner()===sim&&ownerKey()===key&&sourceSignature(sim)===signature;
      if(discarded&&sameOwner){discardZeroResults(sim);searchProgress=0;searchCompleted=0;searchMessage='';clearScenarios();progress('minimal-search-progress',0);actions.markReset();}
      searchSaving=(discarded||evaluated)&&sameOwner;
      searching=false;searchStartedAt=null;searchCard=null;stopRequested=false;sync(state);
    }
    // Let the real result cards paint before serializing evidence for Drive.
    if(searchSaving){
      try{
        await new Promise(resolve=>{
          if(document.visibilityState==='visible'&&typeof window.requestAnimationFrame==='function')window.requestAnimationFrame(()=>setTimeout(resolve,0));
          else setTimeout(resolve,0);
        });
        if(ownerKey()===key&&sourceSignature(sim)===signature)await actions.save();
      }catch(error){actions.error(error);}
      finally{searchSaving=false;sync(state);}
    }
  }
  function openImport(){
    if(importing||!isMinimal()||!state.bootstrap)return;
    el('minimal-import-link').value='';el('minimal-import-status').hidden=true;
    el('minimal-import-dialog').showModal();el('minimal-import-link').focus();
  }
  function init(current,callbacks){
    state=current;actions=callbacks;if(initialized)return;initialized=true;
    el('minimal-run').onclick=function(){return starting?stopRun():startRun();};el('minimal-search').onclick=function(){return searching?stopSearch():startSearch();};
    el('minimal-duration').onchange=applyDuration;el('minimal-duration-unit').onchange=applyDuration;
    el('minimal-rounds').onchange=applyRounds;
    el('minimal-round-view').onchange=function(){
      if(busy()||!result())return;
      roundView=this.value;syncRoundView(result(),false);renderResults(result());
    };
    var dialog=el('minimal-import-dialog'),link=el('minimal-import-link'),submit=el('minimal-import-submit'),close=el('minimal-import-close');
    close.onclick=function(){if(!importing)dialog.close();};
    dialog.addEventListener('cancel',e=>{if(importing)e.preventDefault();});
    dialog.addEventListener('close',()=>el('show-new-case')?.focus());
    el('minimal-import-form').onsubmit=function(event){
      event.preventDefault();if(importing||!link.value.trim())return;
      importing=true;link.disabled=submit.disabled=close.disabled=true;el('minimal-import-status').hidden=true;
      actions.importCase(link.value.trim(),function(response){
        importing=false;link.disabled=submit.disabled=close.disabled=false;
        if(response?.ok)dialog.close();
        else{el('minimal-import-status').textContent=tr(response?.format?'Incorrect format.':'Could not import case.');el('minimal-import-status').hidden=false;}
        sync(state);
      });
    };
    window.addEventListener('st-language-change',()=>{tableKey=resultKey='';sync(state);});
  }
  return {init:init,sync:sync,isMinimal:isMinimal,busy:busy,headerProgress:headerProgress,isSearching:isSearching,openImport:openImport,searchTier:startSearch,stopSearch:stopSearch};
})();
</script>
