<script>
// Advance presentation adapter. The original cards/inspector own the only
// model inputs and their event listeners. Table controls are DOM projections;
// never serialize them, assign a second equipment ID, or replace a draft.
window.STEquipmentTable=(function(){
  var current=null,section='equipment',separate=false,scope='equipment',active=false,initialized=false;
  var signature='',renderedCards=[],bindings=[],rowActions=[],updating=false,queued=false;
  var labels={},manualWidths=new Map(),collapsedGroups=new Map(),tableLayouts=[],gesture=null,rowSettlements=new WeakMap(),viewMotion=null,viewContext='';
  function el(id){return document.getElementById(id);}
  function tr(en,es){return document.documentElement.lang==='es'?es:en;}
  function node(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
  function key(view,split){return split?(view==='conveyors'?'conveyors':'equipment'):'combined';}
  function minimal(state){return state?.bootstrap?.uiMode==='MINIMAL';}
  function wantsTable(state,view,split){
    if(minimal(state))return Boolean(state?.activeCase);
    return Boolean(state?.activeCase&&state.uiView==='editor'&&
      ['ADVANCE','ADVANCED'].includes(String(state.bootstrap?.uiMode||'').toUpperCase())&&
      (labels[key(view,split)]||window.STPreferences?.read('equipmentView.'+key(view,split)))==='table');
  }
  function col(id,selector,en,es){return {id:id,selectors:Array.isArray(selector)?selector:[selector],en:en,es:es};}
  function group(en,es,columns){return {en:en,es:es,columns:columns};}
  var machineGeneral=group('General','General',[
    col('type','.equipment-type','Type','Tipo'),
    col('flow',['.equipment-material-flow','.equipment-transport-unit'],'Material flow','Flujo de material'),
    col('rate','.equipment-rate','Speed (bpm / cases/min)','Velocidad (bpm / cajas/min)'),
    col('maximum','.equipment-maximum-speed','Maximum speed (bpm / cases/min)','Velocidad máxima (bpm / cajas/min)'),
    col('critical','.equipment-pacemaker','Critical machine','Equipo crítico')]);
  var physical=group('Machine design','Diseño del equipo',[
    col('capacity','.equipment-internal-capacity','Internal capacity (input units)','Capacidad interna (unidades de entrada)'),
    col('occupancy','.equipment-occupancy-mode','Occupancy model','Modelo de ocupación'),
    col('residence','.equipment-residence-time','Residence (s)','Residencia (s)'),
    col('recovery','.equipment-recovery-time','Recovery (s)','Recuperación (s)'),
    col('scrap','.equipment-macrostop-scrap','Scrap (bottles/stop)','Scrap (botellas/paro)')]);
  function reliability(conveyor){return group('Reliability','Confiabilidad',[
    col('stop-mode','.reliability-controls select','Stop inputs','Tipo de paro'),
    col('mtbf','.reliability-mtbfMinutes','General MTBF (min)','MTBF general (min)'),
    col('mttr','.reliability-mttrMinutes','General MTTR (min)','MTTR general (min)'),
    col('minor-mtbf','[data-stop-class="minor"][data-parameter-help="reliability-mtbfMinutes"]','Minor MTBF (min)','MTBF menor (min)'),
    col('minor-mttr','[data-stop-class="minor"][data-parameter-help="reliability-mttrMinutes"]','Minor MTTR (min)','MTTR menor (min)'),
    col('major-mtbf','[data-stop-class="major"][data-parameter-help="reliability-mtbfMinutes"]','Major MTBF (min)','MTBF mayor (min)'),
    col('major-mttr','[data-stop-class="major"][data-parameter-help="reliability-mttrMinutes"]','Major MTTR (min)','MTTR mayor (min)')]);}
  function zone(id,en,es,manual){return col(id,manual?['.format-zone-'+id+'-enabled','.format-zone-'+id]:'.format-zone-'+id,en,es);}
  var conveyorGeneral=group('General','General',[col('type','.equipment-type','Type','Tipo'),col('flow',['.equipment-material-flow','.equipment-transport-unit'],'Material flow','Flujo de material')]);
  var geometry=group('Geometry','Geometría',[
    zone('lact','Lact (mm)','Lact (mm)'),zone('lp-prime','Lp (mm)','Lp (mm)'),zone('package-length','Package length (mm)','Longitud del envase (mm)'),
    zone('discharge-runout','Discharge (mm)','Descarga (mm)',true),zone('discharge-runout-time','Discharge design transit (s)','Tránsito de diseño Discharge (s)'),zone('reject-runout','Coding (mm)','Codificado (mm)',true),zone('reject-runout-time','Coding design transit (s)','Tránsito de diseño Coding (s)'),
    zone('backup','Back-up (mm)','Back-up (mm)',true),zone('lba','LBA (mm)','LBA (mm)',true),
    zone('accumulation-seconds','Accumulation (s)','Acumulación (s)',true)]);
  var upstream=group('Upstream','Equipo anterior',[
    zone('discharge-pitch','Discharge pitch (mm)','Pitch de descarga (mm)'),zone('discharge-velocity','Discharge velocity (m/min)','Vel. de descarga (m/min)',true),
    zone('startup','Startup (s)','Arranque (s)'),zone('restart-first-package','First package after restart (s)','Primer envase al rearrancar (s)'),
    zone('residual','Bottles at stop (pkgs)','Descarga al paro (unid.)'),zone('stop-response','Stop response (s)','Respuesta de paro (s)')]);
  var downstream=group('Downstream','Equipo siguiente',[
    zone('infeed','Infeed pitch (mm)','Pitch de entrada (mm)'),zone('downstream-ramp','Ramp up (s)','Rampa de arranque (s)')]);
  var speeds=group('Speed & sensors','Velocidad y sensores',[
    zone('speed-mode','Speed mode','Modo de velocidad'),zone('belt-speed','Belt speed (m/min)','Vel. de banda (m/min)'),
    zone('moving-gap','Moving gap (mm)','Separación en movimiento (mm)',true),zone('accumulated-gap','Accumulated gap (mm)','Separación acumulada (mm)'),
    zone('population','Population (%)','Población (%)',true),zone('overspeed','Overspeed (%)','Sobrevelocidad (%)',true),
    zone('speed-factor','Discharge factor (%)','Factor de descarga (%)'),zone('coding-factor','Coding factor (%)','Factor de codificado (%)'),
    zone('acc-factor','Accumulation factor (%)','Factor de acumulación (%)'),zone('blocked-delay','Block delay (s)','Retardo de bloqueo (s)'),
    zone('clear-delay','Clear delay (s)','Retardo de liberación (s)'),zone('insurance','Insurance factor (pkgs)','Factor de seguridad (unid.)')]);
  var dynamic=group('Dynamic balancing','Balanceo dinámico',[
    zone('dynamic-reference','Specified speed reference','Referencia de velocidad'),
    zone('dynamic-percent','Speed ratio (%)','Relación de velocidades (%)'),zone('dynamic-range','Speed range (m/min)','Rango de velocidad (m/min)'),
    col('low-reserve','[data-balancing-field="lowReserveSeconds"]','Low reserve (s)','Reserva baja (s)'),
    col('high-reserve','[data-balancing-field="highReserveSeconds"]','High reserve (s)','Reserva alta (s)'),
    col('acceleration','[data-balancing-field="accelerationSeconds"]','Acceleration (s)','Aceleración (s)'),
    col('deceleration','[data-balancing-field="decelerationSeconds"]','Deceleration (s)','Desaceleración (s)'),
    col('confirmation','[data-balancing-field="confirmSeconds"]','Sensor confirmation (s)','Confirmación del sensor (s)'),
    col('dwell','[data-balancing-field="minDwellSeconds"]','Minimum dwell (s)','Permanencia mínima (s)')]);
  function source(card,selector){return card._fields?.querySelector(selector)||null;}
  function type(card){return source(card,'.equipment-type')?.value||card.dataset.equipmentType;}
  function applicable(control,card){
    if(!control||control.type==='hidden')return false;
    // Original fields can be in a hidden card or inspector by design; only
    // semantic per-field hiding (general/split, dynamic, type) matters here.
    for(var p=control;p&&p!==card._fields;p=p.parentElement){
      if(p.hidden||p.classList.contains('hidden'))return false;
    }
    return true;
  }
  function columnGroups(cards,conveyor){
    var groups=conveyor?[conveyorGeneral,geometry,upstream,downstream,speeds,dynamic]:[machineGeneral,physical,reliability(false)];
    return groups.map(g=>({...g,columns:g.columns.filter(c=>cards.some(card=>c.selectors.some(s=>applicable(source(card,s),card))))})).filter(g=>g.columns.length);
  }
  // Combine the same column definitions without duplicating type/reliability
  // columns. Machine-only and conveyor-only cells are explicitly inapplicable.
  function mixedGroups(cards){
    var general=group('General','General',[col('type','.equipment-type','Type','Tipo'),...machineGeneral.columns.slice(1).map(c=>({...c,kind:['rate','flow'].includes(c.id)?null:'machine'}))]);
    var groups=[general,
      ...[geometry,upstream,downstream,speeds,dynamic].map(g=>({...g,columns:g.columns.map(c=>({...c,kind:'conveyor'}))})),{...reliability(false),columns:reliability(false).columns.map(c=>({...c,kind:'machine'}))}];
    return groups.map(g=>({...g,columns:g.columns.filter(c=>cards.some(card=>columnApplies(c,card)&&c.selectors.some(sel=>applicable(source(card,sel),card))))})).filter(g=>g.columns.length);
  }
  function columnApplies(column,card){return !column.kind||(column.kind==='conveyor')===(type(card)==='CONVEYOR');}
  function captionFor(original,fallback){
    var label=original.closest('label');
    var caption=label?Array.from(label.childNodes).filter(n=>n.nodeType===3).map(n=>n.nodeValue).join(' ').trim():'';
    return caption||fallback;
  }
  function copyAttribute(original,proxy,name){
    var value=original.getAttribute(name);
    if(value===null)proxy.removeAttribute(name);else if(proxy.getAttribute(name)!==value)proxy.setAttribute(name,value);
  }
  function copyOptions(original,proxy){
    if(original.tagName!=='SELECT')return;
    var keys=Array.from(original.options).map(o=>[o.value,o.textContent,o.disabled,o.hidden]);
    var next=JSON.stringify(keys);
    if(proxy._optionsSignature===next)return;
    proxy.replaceChildren(...Array.from(original.options).map(o=>o.cloneNode(true)));
    proxy._optionsSignature=next;
  }
  function writeThrough(original,proxy,event){
    event.stopPropagation();
    if(!original.isConnected||original.disabled||original.readOnly)return false;
    if(original.type==='checkbox')original.checked=proxy.checked;else original.value=proxy.value;
    original.dispatchEvent(new Event(event.type,{bubbles:true}));
    return true;
  }
  function syncControl(binding){
    var {original,proxy,card,fallback}=binding;
    var visible=applicable(original,card);
    proxy.hidden=!visible;
    if(!visible)return false;
    if(original.tagName==='OUTPUT'){
      if(proxy.textContent!==original.textContent)proxy.textContent=original.textContent;
    }else{
      copyOptions(original,proxy);
      if(original.type==='checkbox')proxy.checked=original.checked;
      else {var displayed=original.type==='number'&&original.readOnly&&original.value!==''&&Number.isFinite(Number(original.value))?Number(original.value).toFixed(2):original.value;if(proxy.value!==displayed)proxy.value=displayed;}
      proxy.disabled=original.disabled;
      if('readOnly' in proxy)proxy.readOnly=Boolean(original.readOnly);
      // Hidden source fields keep their own constraint validation. Do not
      // attach a second named/required form field or invent a model value.
      ['min','max','step','maxlength','placeholder','aria-invalid','aria-readonly'].forEach(n=>copyAttribute(original,proxy,n));
      if(original.validity?.valid===false)proxy.setAttribute('aria-invalid','true');
      proxy.classList.toggle('equipment-table-calculated',Boolean(original.readOnly)||original.dataset.fieldRole==='OUTPUT');
    }
    var label=captionFor(original,fallback),name=source(card,'.equipment-name')?.value||card.dataset.equipmentId||'';
    proxy.setAttribute('aria-label',name+' · '+label);
    proxy.title=[label,original.title].filter(Boolean).join('\n');
    return true;
  }
  function makeProxy(original,card,fallback){
    var proxy=node(original.tagName.toLowerCase(),'equipment-table-control');
    if(original.tagName==='INPUT')proxy.type=original.type;
    if(original.type==='checkbox')proxy.classList.add('equipment-table-checkbox');
    if(original.tagName==='SELECT')proxy.classList.add('equipment-table-select');
    var binding={original,proxy,card,fallback};
    if(original.tagName!=='OUTPUT')for(var name of ['input','change'])proxy.addEventListener(name,function(event){
      writeThrough(original,proxy,event);
      refresh();
      scheduleRefresh();
    });
    bindings.push(binding);syncControl(binding);return binding;
  }
  function cellContent(cell,card,column){
    var cluster=node('div','equipment-table-cell-controls'),list=[];
    for(var s of (columnApplies(column,card)?column.selectors:[])){
      var original=source(card,s);if(!original)continue;
      var b=makeProxy(original,card,tr(column.en,column.es));list.push(b);cluster.append(b.proxy);
    }
    var missing=node('span','equipment-table-na','—');cell.append(cluster,missing);
    cell._tableBindings=list;cell._tableMissing=missing;
    missing.hidden=list.some(b=>applicable(b.original,card));
  }
  function actionButton(icon,label,fn){
    var b=node('button','secondary icon-button equipment-table-action');b.type='button';b.setAttribute('aria-label',label);b.title=label;
    window.STIcons?.button(b,icon);b.addEventListener('click',fn);return b;
  }
  function evaluationCell(card,cell){
    var verdict=node('button','secondary equipment-table-verdict');verdict.type='button';
    verdict.addEventListener('click',()=>{(type(card)==='CONVEYOR'?card._editorConveyorVerdict:card._equipmentReliabilityVerdict)?.click();});
    cell.append(verdict);return verdict;
  }
  function canMove(card){var handle=card.querySelector('.equipment-drag');return Boolean(handle&&!handle.disabled);}
  function syncActions(entry){
    var {card,verdict,symbol,remove}=entry,original=type(card)==='CONVEYOR'?card._editorConveyorVerdict:card._equipmentReliabilityVerdict;
    verdict.hidden=!original||original.hidden;
    if(original&&!original.hidden){
      var cls=original.className+' equipment-table-verdict';
      if(verdict.className!==cls)verdict.className=cls;
      if(verdict.innerHTML!==original.innerHTML)verdict.innerHTML=original.innerHTML;
      for(var attr of ['title','aria-label','aria-description','data-status','data-verdict','data-state','data-evaluation'])copyAttribute(original,verdict,attr);
      verdict.disabled=original.disabled;
    }
    symbol.disabled=!canMove(card)||entry.layout.cards.length<2;
    remove.disabled=Boolean(card.querySelector('.remove-equipment')?.disabled);
  }
  // One cancellable pointer gesture at a time. The row/resize handles use
  // capture for touch and mouse; losing capture, Escape or a view rebuild
  // cancels without committing a model change.
  function startGesture(event,handle,onMove,onEnd,onCancel){
    if(event.button!==0||gesture)return;
    event.preventDefault();
    var pointer=event.pointerId;
    function matches(e){return e.pointerId===pointer;}
    function cleanup(){
      window.removeEventListener('pointermove',move);
      window.removeEventListener('pointerup',end);
      window.removeEventListener('pointercancel',cancel);
      window.removeEventListener('keydown',escape);
      handle.removeEventListener('lostpointercapture',lost);
      gesture=null;
      if(handle.hasPointerCapture?.(pointer))handle.releasePointerCapture(pointer);
    }
    function move(e){if(matches(e))onMove(e);}
    function end(e){if(matches(e)){cleanup();onEnd(e);}}
    function cancel(e){if(!e||matches(e)){cleanup();onCancel?.();}}
    function escape(e){if(e.key==='Escape'){e.preventDefault();cancel();}}
    function lost(e){if(matches(e))cancel();}
    gesture={cancel:()=>cancel()};
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',end);
    window.addEventListener('pointercancel',cancel);
    window.addEventListener('keydown',escape);
    handle.addEventListener('lostpointercapture',lost);
    try{handle.setPointerCapture?.(pointer);}catch(_){/* Pointer may already be released. */}
  }
  function reorder(card,target,layout){
    if(!target||card===target||!canMove(card)||!layout.cards.includes(target))return;
    // The canonical editor owns topology, validation, autosave and order.
    card._moveTableRow?.(target,layout.conveyor===null?undefined:layout.conveyor?'conveyors':'equipment');
  }
  function rowShift(row,y){row.style.transform=y?'translateY('+y+'px)':'';}
  function stopRowSettlements(rows){
    rows.forEach(r=>{rowSettlements.get(r)?.cancel();rowSettlements.delete(r);});
  }
  function visibleRowPositions(layout){
    return new Map(layout.rows.map(r=>[r.dataset.tableEquipmentId,r.getBoundingClientRect().top]));
  }
  function reducedMotion(){return Boolean(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches);}
  function motionOptions(){
    var style=window.getComputedStyle?.(document.documentElement);
    return {duration:parseFloat(style?.getPropertyValue('--duration-normal'))||180,easing:style?.getPropertyValue('--ease').trim()||'ease-out'};
  }
  function settleRows(layout,before){
    if(!active||updating||reducedMotion())return;
    var {duration,easing}=motionOptions();
    stopRowSettlements(layout.rows);
    layout.rows.forEach(r=>{
      if(!r.isConnected||!r.animate||!before.has(r.dataset.tableEquipmentId))return;
      var delta=before.get(r.dataset.tableEquipmentId)-r.getBoundingClientRect().top;
      if(Math.abs(delta)<.5)return;
      rowSettlements.set(r,r.animate([{transform:'translateY('+delta+'px)'},{transform:'translateY(0px)'}],{duration,easing}));
    });
  }
  function bindRowDrag(symbol,row,card,layout){
    var label=tr('Drag to reorder; use Up/Down keys','Arrastra para reordenar; usa las flechas arriba/abajo');
    symbol.title=label;symbol.setAttribute('aria-label',label);
    symbol.addEventListener('keydown',e=>{
      if(symbol.disabled||!['ArrowUp','ArrowDown'].includes(e.key))return;
      e.preventDefault();
      reorder(card,layout.cards[layout.cards.indexOf(card)+(e.key==='ArrowUp'?-1:1)],layout);
    });
    symbol.addEventListener('pointerdown',e=>{
      if(symbol.disabled||e.button!==0||gesture)return;
      stopRowSettlements(layout.rows);
      // Keep the canonical row order and pointer capture intact. Only the
      // painted positions are changed until pointerup commits the reorder.
      var from=layout.cards.indexOf(card),target=from,dragging=false;
      var rects=layout.rows.map(r=>r.getBoundingClientRect()),origin=rects[from];
      var start=e.clientY,tableTop=layout.table.getBoundingClientRect().top;
      var grabOffset=start-origin.top,first=rects[0].top,last=rects.at(-1).bottom;
      var height=origin.height,lastX=e.clientX,lastY=e.clientY,frame=null;
      function clear(){
        if(frame!==null){window.cancelAnimationFrame?.(frame);frame=null;}
        layout.table.classList.remove('equipment-table-row-drag-active');
        layout.rows.forEach(r=>{r.classList.remove('equipment-table-dragging');rowShift(r,0);});
      }
      function previewOrder(next){
        if(target===next)return;
        target=next;
        // With zero border spacing, opening a gap for the dragged row means
        // shifting the crossed rows by its actual height, not a fixed pitch.
        layout.rows.forEach((r,i)=>{
          if(i===from)return;
          var offset=next>from&&i>from&&i<=next?-height:next<from&&i>=next&&i<from?height:0;
          rowShift(r,offset);
        });
      }
      function preview(){
        var delta=layout.table.getBoundingClientRect().top-tableTop;
        var bounds=layout.scroller.getBoundingClientRect();
        var valid=lastX>=bounds.left&&lastX<=bounds.right&&lastY>=first+delta-16&&lastY<=last+delta+16;
        var desired=lastY-grabOffset-delta,center=desired+height/2;
        var best=Infinity,next=from;
        if(valid)rects.forEach((rect,i)=>{
          var distance=Math.abs(center-(rect.top+rect.height/2));
          if(distance<best){best=distance;next=i;}
        });
        previewOrder(next);
        // Follow the pointer continuously without animating the held row.
        // Clamp it within the table body so it never covers the headers.
        rowShift(row,Math.max(first,Math.min(last-height,desired))-origin.top);
      }
      function edgeDirection(){
        if(lastY<48)return -1;
        if(lastY>window.innerHeight-48)return 1;
        return 0;
      }
      function scrollFrame(){
        frame=null;if(!dragging||!edgeDirection())return;
        var bounds=layout.scroller.getBoundingClientRect();
        if(lastX<bounds.left||lastX>bounds.right)return;
        var before=layout.table.getBoundingClientRect().top;
        window.scrollBy?.(0,edgeDirection()*12);
        preview();
        if(layout.table.getBoundingClientRect().top!==before)queueScroll();
      }
      function queueScroll(){
        if(frame===null&&edgeDirection()&&window.requestAnimationFrame)frame=window.requestAnimationFrame(scrollFrame);
      }
      function move(ev){
        lastX=ev.clientX;lastY=ev.clientY;
        if(!dragging&&Math.abs(lastY-start)<4)return;
        if(!dragging){
          dragging=true;layout.table.classList.add('equipment-table-row-drag-active');row.classList.add('equipment-table-dragging');
        }
        preview();queueScroll();
      }
      function finish(commit,ev){
        if(commit&&ev)move(ev);
        var before=dragging?visibleRowPositions(layout):null,destination=layout.cards[target];
        var changed=commit&&dragging&&target!==from&&canMove(card);
        clear();
        if(changed){
          // A single drop updates the real model. The layout may be rebuilt
          // by the editor, so settle the new rows from their last painted Y.
          reorder(card,destination,layout);
        }
        if(before){
          var nextLayout=tableLayouts.find(l=>l.conveyor===layout.conveyor&&l.cards.includes(card));
          if(nextLayout)settleRows(nextLayout,before);
        }
      }
      startGesture(e,symbol,move,ev=>finish(true,ev),()=>finish(false));
    });
  }
  function headingParts(text){
    // Labels have a trailing parenthesized unit, if any; keep it in the
    // dedicated second row rather than duplicating units in every cell.
    var match=text.match(/^(.*?)\s*\(([^()]*)\)\s*$/);
    return match?{name:match[1],unit:match[2]}:{name:text,unit:''};
  }
  function widthKey(layout,id){return (layout.conveyor===null?'mixed':layout.conveyor?'conveyors':'equipment')+':'+id;}
  function clampWidth(width,min){return Math.max(min,Math.min(1000,Math.round(width)));}
  function measureText(value,element){
    // Browser typography, with a deterministic fallback for non-layout tests.
    var text=String(value??''),key=element.tagName+':'+element.className+':'+(element.type||'');
    var styles=measureText.styles||(measureText.styles=new Map()),style=styles.get(key);
    if(!style){
      var computed=window.getComputedStyle?.(element);
      style={fontSize:computed?.fontSize,fontWeight:computed?.fontWeight,fontFamily:computed?.fontFamily};styles.set(key,style);
    }
    var fontSize=parseFloat(style.fontSize)||13;
    if(window.CanvasRenderingContext2D){
      try{
        var ctx=measureText.context||(measureText.context=document.createElement('canvas').getContext('2d'));
        if(ctx){ctx.font=(style?.fontWeight||'400')+' '+fontSize+'px '+(style?.fontFamily||'system-ui');return Math.ceil(ctx.measureText(text).width);}
      }catch(_){}
    }
    return Math.ceil(Array.from(text).length*fontSize*.56);
  }
  function sizing(layout,descriptor){
    var {id,head,unit,cells}=descriptor;
    if(descriptor.collapsed){var width=Math.max(44,measureText(descriptor.labelNode.textContent,descriptor.labelNode)+36);return {min:width,fit:width};}
    var min=id==='name'?152:id==='evaluation'?76:44;
    var fit=Math.max(min,measureText(head.textContent,head)+24,measureText(unit.textContent,unit)+24);
    if(id==='delete')return {min,fit};
    cells.forEach(cell=>{
      var width=0;
      for(var control of cell.querySelectorAll('.equipment-table-control:not([hidden])')){
        if(control.type==='checkbox'){width+=20;continue;}
        var select=control.tagName==='SELECT',output=control.tagName==='OUTPUT',number=control.type==='number';
        var value=select?(control.selectedOptions?.[0]?.textContent||control.value):output?control.textContent:control.value;
        var minimum=select?90:output?64:number?68:96;
        var content=Math.min(300,measureText(value,control)+(select?34: number?30:22));
        width+=Math.max(minimum,content)+4;
        min=Math.max(min,minimum+16+(cell.querySelector('.equipment-table-checkbox:not([hidden])')?24:0));
      }
      if(id==='name'){
        // Only the type icon and editable name occupy the identity cell.
        var chrome=28+4;
        width+=chrome;min=Math.max(min,96+chrome+20);
      }
      if(id==='evaluation'){
        var verdict=cell.querySelector('.equipment-table-verdict');
        if(verdict&&!verdict.hidden)width=Math.max(width,measureText(verdict.textContent,verdict)+30);
      }
      fit=Math.max(fit,width+16);
    });
    return {min,fit:Math.max(min,Math.min(340,fit))};
  }
