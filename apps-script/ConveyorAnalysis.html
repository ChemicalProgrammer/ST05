<dialog id="conveyor-analysis-dialog" aria-labelledby="conveyor-analysis-title">
  <header class="dialog-heading">
    <h2 id="conveyor-analysis-title">Conveyor Analysis Tool</h2>
    <div class="button-row conveyor-analysis-actions">
      <details id="conveyor-analysis-export-menu" class="export-menu">
        <summary class="secondary icon-button" data-icon="upload" aria-label="Export conveyor evaluations" title="Export conveyor evaluations" aria-expanded="false"></summary>
        <div>
          <button id="conveyor-analysis-export-one" class="ghost" type="button">This conveyor (JSON)</button>
          <button id="conveyor-analysis-export-all" class="ghost" type="button">All conveyors (JSON)</button>
        </div>
      </details>
      <button id="conveyor-analysis-close" type="button" class="ghost icon-button" data-icon="x" aria-label="Close conveyor analysis" title="Close conveyor analysis"></button>
    </div>
  </header>
  <div id="conveyor-analysis-body" class="dialog-body"></div>
</dialog>
<style>
#conveyor-analysis-dialog { --dialog-width:min(72rem,calc(100vw - 24px)); width:min(72rem,calc(100vw - 24px)); max-height:calc(100dvh - 24px); box-sizing:border-box; }
#conveyor-analysis-dialog[open] { overflow:hidden; }
#conveyor-analysis-dialog .conveyor-analysis-actions {margin:0;flex-shrink:0;flex-wrap:nowrap;align-items:center;}
#conveyor-analysis-dialog .conveyor-analysis-actions .export-menu {margin:0;}
#conveyor-analysis-dialog .conveyor-analysis-actions .export-menu > div {min-width:13rem;}
#conveyor-analysis-body .conveyor-value-diagnostic {cursor:help;text-decoration:underline dotted;text-underline-offset:.18em;}
#conveyor-analysis-body .conveyor-value-diagnostic:focus-visible {outline:2px solid var(--accent);outline-offset:-2px;}
#conveyor-analysis-body { min-width:0; max-width:100%; overflow-y:auto; overflow-x:hidden; }
#conveyor-analysis-body > .st-subsection { min-width:0; max-width:100%; margin:0; padding:var(--subsection-padding); }
#conveyor-analysis-body .st-subsection > .fold-content { display:grid; gap:var(--space-3); min-width:0; }
/* Closed native Subsection B has no empty content inset or interior divider. */
#conveyor-analysis-body > .st-subsection:not([open]) { padding-block-end:0; }
#conveyor-analysis-body > .st-subsection:not([open]) > .fold-content { display:none; }
#conveyor-analysis-body > .st-subsection:not([open]) > summary.st-subsection-header {
  border-block-end:0;
  border-radius:calc(var(--radius-md) - var(--border-width));
}
#conveyor-analysis-body .conveyor-value-not-applicable {color:var(--muted);cursor:help;}
#conveyor-analysis-body .table-scroll { min-width:0;max-width:100%;width:100%;overflow-x:auto;overflow-y:visible; }
/* A consistent column model prevents long parameters or diagnostic text
   from expanding the table. The wrapper scrolls only for genuinely wide
   multi-format tables; normal tables fit their subsection. */
#conveyor-analysis-body table {
  width:100%;min-width:0;table-layout:fixed;border-collapse:collapse;
}
#conveyor-analysis-body table[data-value-columns] { min-width:var(--worksheet-min-width,0px); }
#conveyor-analysis-body :is(td,th) {
  box-sizing:border-box;min-width:0;padding:var(--space-2) var(--space-3);
  overflow-wrap:anywhere;white-space:normal;vertical-align:middle;
}
#conveyor-analysis-body tbody th[scope=row]:not([colspan]) {
  text-align:start;white-space:normal;overflow-wrap:anywhere;word-break:normal;
}
#conveyor-analysis-body :is(thead th,tbody td):not(:first-child) {padding-inline:var(--space-2);}
#conveyor-analysis-body thead th {text-align:center;}
#conveyor-analysis-body thead th:first-child {text-align:start;}
#conveyor-analysis-body thead th.numeric,#conveyor-analysis-body tbody td.numeric {text-align:end;font-variant-numeric:tabular-nums;white-space:normal;overflow-wrap:anywhere;}
/* Unit cells are table cells, not inline KPI units (which use baseline alignment). */
#conveyor-analysis-body td.analysis-table-unit {display:table-cell;text-align:center;vertical-align:middle;line-height:inherit;font-weight:inherit;font-size:inherit;color:var(--unit-color);white-space:normal;overflow-wrap:anywhere;margin:0;}
#conveyor-analysis-body :is(td,th)[colspan] {text-align:start;white-space:normal;}
#conveyor-analysis-body .conveyor-value-pending {cursor:help;text-decoration:underline dotted;text-underline-offset:.18em;color:var(--muted);}
#conveyor-analysis-body .conveyor-value-partial {cursor:help;text-decoration:underline dotted;text-underline-offset:.18em;}
#conveyor-analysis-body :is(.conveyor-value-pending,.conveyor-value-partial):focus-visible {outline:2px solid var(--accent);outline-offset:-2px;}
#conveyor-analysis-body .conveyor-analysis-format-note {margin:0;font-size:var(--font-secondary);overflow-wrap:anywhere;}
@media(max-width:600px){
  #conveyor-analysis-body :is(td,th) {padding:var(--space-2) var(--space-1);}
}
#conveyor-analysis-body { display:grid; grid-template-columns:minmax(0,1fr); align-content:start; gap:var(--subsection-gap,var(--space-4)); }
#conveyor-analysis-body .chart-note { margin:0; }
#conveyor-analysis-body .first-package-analysis-input {display:flex;align-items:center;gap:var(--space-1);min-width:0;flex-wrap:wrap;justify-content:flex-end;}
#conveyor-analysis-body .first-package-analysis-input input {width:100%;min-width:0;text-align:end;font-variant-numeric:tabular-nums;}
#conveyor-analysis-body .first-package-analysis-input button {font-size:var(--font-secondary);}
#conveyor-analysis-body .first-package-analysis-input small {font-size:var(--font-secondary);color:var(--muted);text-align:start;overflow-wrap:anywhere;}
#conveyor-analysis-body .conveyor-analysis-verdict.st-status-pill { cursor:default;background:var(--stopped-soft);color:var(--muted); }
#conveyor-analysis-body .conveyor-analysis-verdict.is-pass { background:var(--success-soft);color:var(--success); }
#conveyor-analysis-body .conveyor-analysis-verdict.is-fail { background:var(--failure-soft);color:var(--danger); }
#conveyor-analysis-body .conveyor-analysis-verdict.is-review { background:var(--starved-soft);color:var(--warning); }
</style>
<script>
window.STConveyorAnalysis=(function(){
  // A theoretical 100% occupancy must not become a huge finite overflow
  // because of the floating-point m/min ↔ mm/s conversion.
  const populationTolerance=1e-12;
  const hasFreePopulation=p=>Number.isFinite(p)&&p>=0&&p<1-populationTolerance;
  const verdictColors={'PASS':'#216343','FAIL':'#a12b36','AT LIMIT':'#805200','NOT EVALUATED':'#4b5563'};
  const lengthHelp={
    discharge:'Longitud instalada desde la salida de la máquina aguas arriba hasta el inicio del tramo Coding. Si no hay Coding, mide hasta el inicio de Overflow.',
    coding:'Longitud instalada del tramo de codificación, desde el final de Discharge hasta el inicio de Overflow (Max Run-out Point). Captura 0 si no existe ese tramo.'
  };
  const recoveryHelp=[
    'Lrec es el margen de cola útil cuando la primera botella del rearranque alcanza la cola.',
    'Lrec > 0: todavía queda cola útil.',
    'Lrec = 0: la reserva se agota justo al llegar, sin margen para retrasos.',
    'Lrec < 0: la cola se agota antes. La magnitud indica cuántos mm de acumulación útil faltan.'
  ].join('\n');

  let currentExport=null;
  function close(){
    const dialog=document.getElementById('conveyor-analysis-dialog');
    const menu=document.getElementById('conveyor-analysis-export-menu');
    if(menu)menu.open=false;
    if(dialog.open)dialog.close();
    currentExport=null;
  }
  function bottlesPerFlowUnit(equipment,format){
    const unit=equipment?.processData?.flowUnits?.output??equipment?.unitOfFlow;
    if(String(unit).toUpperCase()!=='CASES')return 1;
    const packSize=format?window.SimulatorEngine.productPackSize(format):undefined;
    return Number.isFinite(packSize)&&packSize>0?packSize:NaN;
  }
  function resolveProfiles(equipment,format,formats=[]){
    const engine=window.SimulatorEngine;
    // Basic has no independent discharge-velocity input. Evaluate a detached
    // copy, retaining the measured override in the saved case for other modes.
    if(document.documentElement.dataset.workspaceMode==='MINIMAL')equipment=equipment.map(item=>{
      if(item.type!=='CONVEYOR'||!item.processData?.upstream)return item;
      const upstream={...item.processData.upstream};delete upstream.dischargeVelocityMPerMinute;
      return {...item,processData:{...item.processData,upstream}};
    });
    function resolve(profile){
      const lineFlow=engine.resolveLineFlowUnits?.(equipment,profile||{})||[];
      const models=profile?engine.applyProductProfile(equipment,profile):equipment.map((item,index)=>{
        const flow=lineFlow[index];
        if(item.type!=='CONVEYOR'||!flow)return item;
        if(flow.source==='CONFLICT')return {...item,processData:{...item.processData,transportFlowIssue:flow.reason}};
        if(flow.source==='INFERRED')return {...item,unitOfFlow:flow.output.toLowerCase(),processData:{...item.processData,transportFlowIssue:undefined,flowUnits:{input:flow.input,output:flow.output}}};
        return item;
      });
      const zones=models.map((item,index)=>item.type==='CONVEYOR'?engine.resolveProductConveyor(models,index):null);
      return {models,zones,format:profile};
    }
    const current=resolve(format);
    const designProfiles=formats.length?formats.map(candidate=>candidate.id===format?.id?current:resolve(candidate)):[current];
    return {...current,designProfiles,configuration:{equipment,activeFormat:format||null,formats}};
  }
  // Preserve the exact configuration used by the displayed worksheet.
  // Only conveyor engineering context is exported: no chat, observations,
  // account information or saved simulation histories are included.
  function worksheetContext(resolved,index,metadata={}){
    return {zone:resolved.zones[index]||{},data:resolved.models[index]?.processData||{},
      designProfiles:resolved.designProfiles||[],index,source:{
        metadata,configuration:resolved.configuration||null,
        activeProfile:{models:resolved.models,zones:resolved.zones,format:resolved.format||null},
        resolutionError:resolved.resolutionError||null
      }};
  }
  function conveyorItem(item){return item&&(item.type==='CONVEYOR'||item.processData?.role==='CONVEYOR');}
  function profilePopulationHelp(p,language='en'){
    const es=language==='es',tr=(a,b)=>es?b:a,num=v=>Number.isFinite(v)?new Intl.NumberFormat(es?'es-MX':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v):'—';
    const unit=p.transportUnit==='CASES'?(es?'cajas':'cases'):(es?'botellas':'bottles');
    const source=p.dischargeVelocitySource==='CONFIGURED_AF'?tr('Configured Upstream Discharge Velocity (AF)','Upstream Discharge Velocity configurada (AF)'):
      p.dischargeVelocitySource==='NOMINAL_RATE_AND_PITCH'?tr('Calculated from nominal machine rate × discharge pitch (AF not configured)','Calculada con flujo nominal de máquina × pitch de descarga (AF no configurado)'):tr('Unresolved discharge velocity','Velocidad de descarga no resuelta');
    const lines=[
      tr('Population = native upstream output rate × package length / conveyor speed. Rates are not inferred from belt speed.','Population = flujo nativo de salida × longitud del envase / velocidad del conveyor. El flujo no se deduce de la velocidad de banda.'),
      tr('Package length','Longitud del envase')+' = '+num(p.length)+' mm · '+tr('Discharge pitch','Pitch de descarga')+' = '+num(p.dischargePitch)+' mm',
      tr('Discharge velocity','Velocidad de descarga')+' = '+num(p.dischargeVelocity)+' m/min · '+source,
      tr('Packed output rate','Flujo contiguo de salida')+' = '+num(p.flow*.06)+' m/min · '+tr('Belt speed','Velocidad de banda')+' = '+num(p.speed*.06)+' m/min',
      tr('Native discharge rate','Flujo nativo de descarga')+': '+num(p.rate)+' '+unit+'/min',
      tr('Configured upstream machine rate','Velocidad nominal configurada de la máquina anterior')+': '+num(p.upstreamRate*60)+' '+unit+'/min',
      tr('Native downstream input rate','Flujo nativo de entrada aguas abajo')+': '+num(p.highRate)+' '+unit+'/min',
      tr('Theoretical downstream infeed velocity','Velocidad teórica de entrada aguas abajo')+': '+num(p.infeedVelocity)+' m/min',
      tr('Belt transport capacity at discharge pitch (not machine output)','Capacidad de banda al pitch de descarga (no es flujo de máquina)')+': '+num(p.beltCapacityAtDischargePitchPackagesPerMinute)+' '+unit+'/min',
      'Population = '+num(p.population*100)+'%'
    ];
    if(p.dischargeVelocitySource==='CONFIGURED_AF'&&Number.isFinite(p.nominalDischargeVelocity)&&Math.abs(p.dischargeVelocity-p.nominalDischargeVelocity)>1e-6)
      lines.push(tr('Configured AF differs from the theoretical discharge velocity of '+num(p.nominalDischargeVelocity)+' m/min. AF is used for local discharge velocity only; verify the measured speed and pitch if needed.','AF configurada difiere de la velocidad teórica de descarga de '+num(p.nominalDischargeVelocity)+' m/min. AF se utiliza solo como velocidad local de descarga; verifica la velocidad medida y el pitch si es necesario.'));
    if(Number.isFinite(p.population)&&p.population>=1-populationTolerance)lines.push(tr('Overflow requires population below 100%; the denominator 1 − population is zero or negative. This is a calculation condition, not a missing Overflow input.','Overflow requiere población menor que 100%; el denominador 1 − población es cero o negativo. Es una condición de cálculo, no un input Overflow faltante.'));
    return lines.join('\n');
  }
  function valueDiagnostic(worksheet,trace,ref,index){
    const p=worksheet.profiles[index],pending=trace.describe(ref,index);
    if(ref==='L41'||ref==='L23')return [pending,profilePopulationHelp(p,document.documentElement.lang==='es'?'es':'en')].filter(Boolean).join('\n\n');
    return pending;
  }
  function jsonRow(ref,label,unit,value,formula,diagnostic,partial=false){
    const finite=Number.isFinite(value);
    return {ref:ref||null,parameter:label,unit,value:finite?value:null,
      status:finite?(partial?'PARTIAL':'CALCULATED'):'PENDING',
      valueKind:finite?'FINITE':value===undefined||value===null?'MISSING':Number.isNaN(value)?'NAN':value===Infinity?'POSITIVE_INFINITY':value===-Infinity?'NEGATIVE_INFINITY':'UNRESOLVED',
      formula,diagnostic:diagnostic||null};
  }
  function relevantConfiguration(profile,index){
    if(!profile)return null;
    const {models=[],zones=[],format}=profile,zone=zones[index]||{};
    const upstream=models.find(item=>item?.id===zone.upstreamControlEquipmentId)||models[index-1]||null;
    const downstream=models.find(item=>item?.id===zone.downstreamControlEquipmentId)||models[index+1]||null;
    return {formatId:format?.id||null,formatName:format?.name||null,
      equipment:models[index]||null,upstream,downstream,zone};
  }
  function evaluationRecord(context,name,worksheet){
    worksheet=worksheet||calculate(context);
    const trace=createPendingTrace(worksheet,context,'en'),source=context.source||{};
    const active=source.activeProfile;
    const raw=source.configuration?.equipment?.[context.index];
    const model=active?.models?.[context.index]||raw||context.designProfiles?.[0]?.models?.[context.index];
    const configuration={index:context.index,equipment:raw||model||{name,processData:context.data},
      upstream:source.configuration?.equipment?.[context.index-1]||null,
      downstream:source.configuration?.equipment?.[context.index+1]||null,
      activeResolved:relevantConfiguration(active,context.index)||{zone:context.zone,processData:context.data},
      designProfiles:(context.designProfiles||[]).map(profile=>relevantConfiguration(profile,context.index))};
    return {equipmentId:model?.id||null,name:model?.name||name||'Conveyor',lineIndex:context.index,
      status:worksheet.geometry.status,statusReason:source.resolutionError||worksheet.geometry.statusReason,
      configuration,geometry:worksheet.geometry,
      sectionProgress:sectionProgress(worksheet,context).map(spec=>({section:spec.key,title:spec.title[0],...spec.progress})),
      common:worksheet.common.map(([ref,label,unit,value,formula,governing],i)=>({
        ...jsonRow(ref,label,unit,value,formula,[parameterHelp(trace.commonKeys[i],'en'),trace.describe(trace.commonKeys[i])].filter(Boolean).join('\n\n'),Boolean(governing?.partial)),
        governingFormat:governing?.name||null
      })),
      formats:worksheet.profiles.map((p,i)=>({
        id:p.formatId||null,name:p.name,transportUnit:p.transportUnit,
        populationDiagnostic:profilePopulationHelp(p,'en'),
        inputsAndIntermediateValues:p,
        sections:rows.map(([title,entries])=>({title,rows:entries.filter(Array.isArray).map(([ref,label,unit,formula,read])=>
          jsonRow('L'+ref,label,unit,read(p),formula,[parameterHelp('L'+ref,'en'),trace.describe('L'+ref,i),...(['L23','L41'].includes('L'+ref)?[profilePopulationHelp(p,'en')]:[])].filter(Boolean).join('\n\n')))}))
      }))};
  }
  // Older worksheet callers may supply the complete line as design profiles
  // rather than source.activeProfile. Only recover an identifiable profile;
  // never pretend an isolated conveyor represents the whole line.
  function fullLineExportContext(context){
    if(!context)return context;
    if(context.source?.activeProfile?.models?.some(conveyorItem))return context;
    const profiles=(context.designProfiles||[]).filter(p=>Array.isArray(p.models)&&Array.isArray(p.zones)&&conveyorItem(p.models[context.index]));
    const profile=profiles.find(p=>p.zones[context.index]===context.zone)||
      profiles.find(p=>p.models[context.index]?.processData===context.data)||
      (profiles.length===1?profiles[0]:null);
    if(!profile)return context;
    const source=context.source||{};
    return {...context,source:{...source,metadata:{...source.metadata,contextBasis:'DESIGN_PROFILE_MATCH'},
      activeProfile:{models:profile.models,zones:profile.zones,format:profile.format||null}}};
  }
  function canExportAll(context){
    return Boolean(fullLineExportContext(context)?.source?.activeProfile?.models?.some(conveyorItem));
  }
  function buildEvaluationExport(context,{scope='SINGLE',name,worksheet}={}){
    if(!context)throw Error('Conveyor evaluation context is unavailable.');
    if(scope==='ALL')context=fullLineExportContext(context);
    const source=context.source||{},active=source.activeProfile;
    if(scope==='ALL'&&!active?.models?.some(conveyorItem))throw Error('Full line configuration is unavailable. Open the evaluation from Equipment.');
    const indices=scope==='ALL'?active.models.flatMap((item,index)=>conveyorItem(item)?[index]:[]):[context.index];
    const evaluations=indices.map(index=>{
      if(index===context.index)return evaluationRecord(context,name,worksheet);
      const model=active.models[index];
      return evaluationRecord({zone:active.zones?.[index]||{},data:model.processData||{},designProfiles:context.designProfiles||[],index,source},model.name);
    });
    const statusCounts={PASS:0,FAIL:0,'AT LIMIT':0,'NOT EVALUATED':0};
    evaluations.forEach(e=>{statusCounts[e.status]=(statusCounts[e.status]||0)+1;});
    return {schema:'st-conveyor-analysis-v1',version:1,exportedAt:new Date().toISOString(),scope,
      calculationModel:'CONVEYOR_ANALYSIS_WORKSHEET',calculationRevision:'NATIVE_MACHINE_FLOW_V2',source:{...source.metadata,resolutionError:source.resolutionError||null},
      configuration:source.configuration||null,
      summary:{conveyors:evaluations.length,statusCounts},
      evaluations,
      notes:['Configuration is the current evaluation input, including unsaved editor changes when exported from Equipment.','Values are unrounded numeric results; unavailable/non-finite row values are null with an explicit status and diagnostic.','Worksheet design calculations and engine-resolved operating geometry are retained separately. A calculated sensor position is not an installed measurement.']};
  }
  function downloadEvaluation(context,options={}){
    const report=buildEvaluationExport(context,options);
    const clean=value=>String(value||'conveyor').normalize('NFKD').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,100)||'conveyor';
    const prefix=options.scope==='ALL'?'all-conveyors':clean(report.evaluations[0]?.name);
    const filename='conveyor-analysis-'+prefix+'.json';
    const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    return report;
  }

  function recommendedSpeed(profile){
    return profile?.infeedPitch>0&&profile.highRate>0&&Number.isFinite(profile.overspeed)
      ?profile.highRate*profile.infeedPitch/1000*(1+profile.overspeed/100):NaN;
  }
  function explainVerdict(status,recovery,profiles,geometry){
    if(status==='FAIL'){
      const deficit=(-recovery.value).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
      return recovery.name+': Lrec es negativo. Faltan '+deficit+' mm de acumulación útil para cubrir el rearranque.';
    }
    if(status!=='NOT EVALUATED')return 'Lact vs L min';
    if(!profiles.length)return 'No hay formatos aplicables a este conveyor.';
    const reasons=[];
    for(const [label,value] of [
      ['Lact (longitud instalada)',geometry.lact],['Lp (reserva de Prime)',geometry.lp],
      ['Discharge actual',geometry.discharge],['Coding actual',geometry.coding]
    ]){
      if(!Number.isFinite(value))reasons.push('Falta '+label+'.');
    }
    for(const p of profiles){
      if(Number.isFinite(p.recovery)&&Number.isFinite(p.overflow))continue;
      const missing=[];
      for(const [label,value] of [
        ['velocidad del conveyor',p.speed],['longitud del envase',p.length],
        ['paso de descarga',p.dischargePitch],['paso de entrada',p.infeedPitch],
        ['flujo nominal de la máquina anterior',p.rate],['flujo de entrada de la máquina siguiente',p.highRate]
      ]){
        if(!(value>0))missing.push(label);
      }
      if(!Number.isFinite(p.firstPackage))missing.push('Time to First Package After Restart');
      if(p.blocked==null)missing.push('retardo de Back-up bloqueado');
      if(p.clear==null)missing.push('retardo de Back-up libre');
      if(p.residual==null)missing.push('envases descargados al paro');
      if(geometry.discharge>0&&!(p.dischargeSpeed>0))missing.push('velocidad del tramo Discharge');
      if(geometry.coding>0&&!(p.codingSpeed>0))missing.push('velocidad del tramo Coding');
      if(missing.length)reasons.push(p.name+': faltan datos válidos de '+missing.join(', ')+'.');
      if(Number.isFinite(p.population)&&p.population>=1-populationTolerance)reasons.push(p.name+': la ocupación del conveyor es de 100 % o más. Overflow requiere espacio libre.\n'+profilePopulationHelp(p,'es'));
      if(p.consumption>0&&p.speed<=p.consumption)reasons.push(p.name+': la velocidad del conveyor debe superar el consumo aguas abajo para calcular Lrec.');
    }
    return reasons.length?reasons.join('\n'):'No se pudo calcular Overflow o Lrec para todos los formatos aplicables.';
  }
  function calculate({zone,data,designProfiles,index}){
    const lact=data.geometry?.lactMm??zone.usableLengthMm;
    const lp=data.geometry?.lpPrimeMm??(lact-zone.primeSensorPositionMm);
    const prime=lact-lp;
    const discharge=data.geometry?.actualDischargeMm??data.accumulation?.dischargeRunoutLengthMm??zone.engineering?.input?.dischargeRunoutLengthMm;
    const coding=data.geometry?.actualCodingMm??data.accumulation?.rejectRunoutLengthMm??zone.engineering?.input?.rejectRunoutLengthMm;
    const runout=discharge+coding;
    const divide=(numerator,denominator)=>denominator>0?numerator/denominator:NaN;
    const segmentTime=(length,speed)=>length===0?0:divide(length,speed);
    const profiles=designProfiles.filter(({models})=>models[index].processData?.productApplies!==false)
      .map(({zones,models,format})=>{
        const belt=zones[index]||{};
        const {input={}}=belt.engineering||{};
        const upstream=models.find(item=>item.id===belt.upstreamControlEquipmentId)??models[index-1];
        const downstream=models.find(item=>item.id===belt.downstreamControlEquipmentId)??models[index+1];
        const length=input.packageLengthMm??belt.productLengthMm;
        const dischargePitch=input.upstreamDischargePitchMm??upstream?.processData?.upstream?.dischargePitchMm;
        const infeedPitch=input.downstreamInfeedPitchMm??models[index].processData?.downstream?.infeedPitchMm??downstream?.processData?.downstream?.infeedPitchMm;
        const speed=belt.conveyorSpeedMmPerSecond;
        // Use the format-resolved machine rates, in native packages/min.
        // Belt transport capacity is not machine output or downstream demand.
        // The engineering adapter already resolves output and input rates,
        // including bottle-to-case conversion at a packing machine.

    function extreme(field,select){

    function blocked(node){
      return node.dependencies.filter(d=>{const n=nodes.get(d.key);return !n||!d.test(n.value)||n.partial;});
    }
    function describe(ref,profileIndex=null){
      const node=nodes.get(profileIndex===null?common(ref):local(profileIndex,ref));
      if(!node||finite(node.value)&&!node.partial)return '';
      const immediate=blocked(node),roots=new Set(),visited=new Set();
      function follow(n){
        if(!n||visited.has(n.key))return;visited.add(n.key);
        const unmet=blocked(n);
        if(!unmet.length){
          roots.add(n.label+': '+(n.help||tr('Check this unresolved input or calculation.','Revisa este input o cálculo no resuelto.')));
          return;
        }
        for(const d of unmet){
          const child=nodes.get(d.key);
          if(!child)continue;
          if(finite(child.value)&&!d.test(child.value)){
            roots.add(child.label+' = '+formatNumber(child.value)+': '+(child.help||d.condition||tr('invalid for this formula','inválido para esta fórmula')));continue;
          }
          follow(child);
        }
        // L23 can use an explicit measured AF or be derived from the machine.
      }
      follow(node);
      const direct=immediate.map(d=>{
        const n=nodes.get(d.key);if(!n)return d.key;
        return n.label+(finite(n.value)?n.partial?' — '+tr('partial','parcial'):' = '+formatNumber(n.value)+(d.condition?' ('+d.condition+')':''):' — '+tr('Pending','Pendiente'));
      });
      const parts=[(node.partial&&finite(node.value)?tr('Partial result','Resultado parcial'):tr('Pending','Pendiente'))+' · '+node.label];
      if(direct.length)parts.push(tr('Missing dependencies:','Dependencias pendientes:')+'\n'+direct.map(x=>'• '+x).join('\n'));
      if(roots.size)parts.push(tr('Check:','Revisar:')+'\n'+[...roots].map(x=>'• '+x).join('\n'));
      return parts.join('\n\n');
    }
    return {describe,commonKeys:commonTraceKeys.slice()};
  }

    {key:'recovery',title:['Recovery Position (Lrec)','Posición de recuperación (Lrec)'],description:['Restart travel times, queue consumption and the remaining useful accumulation margin.','Tiempos de tránsito al rearranque, consumo de cola y margen de acumulación útil restante.']},
    {key:'accumulation',title:['Conveyor Accumulation Time (Tacc)','Tiempo de acumulación (Tacc)'],description:['Estimated anti-starve and anti-block protection provided by the selected accumulation zone.','Protección estimada anti-starve y anti-block de la zona de acumulación seleccionada.']},
    {key:'infeed',title:['Recommended Downstream Infeed Speed','Velocidad recomendada de entrada'],description:['Minimum recommended belt speed from downstream input rate, infeed pitch and overspeed margin.','Velocidad mínima recomendada a partir del flujo de entrada siguiente, pitch y margen de sobrevelocidad.']}
  ];
  const commonSection={key:'geometry',title:['Common Geometry','Geometría común'],description:['Installed geometry, required overflow, selected sensor positions and recovery margin across applicable formats.','Geometría instalada, overflow requerido, posiciones de sensores seleccionadas y margen de recuperación entre formatos.']};
  const localized=(pair,language)=>pair[language==='es'?1:0];
  function notApplicableReason(worksheet,key,value,profile){
    if(Number.isFinite(value))return null;
    const g=worksheet.geometry;
    if(key==='RECOVERY_POINT'&&!g.recovery.partial&&Number.isFinite(g.recovery.value)&&g.recovery.value<0)
      return ['No recovery point exists because the available accumulation is insufficient; this is an evaluated failure, not missing data.','No existe punto de recuperación porque la acumulación disponible es insuficiente; es un fallo evaluado, no un dato faltante.'];
    // Do not demand data for absent runout zones when belt speed comes from
    // a direct input or a target rather than the cascade of zone factors.
    if(profile&&(['MANUAL','DYNAMIC'].includes(profile.speedMode)||profile.targetPopulation!=null||profile.targetOverspeed!=null)){
      const absentDischarge=g.discharge===0&&g.coding===0&&['L33','L34','L35'].includes(key);
      const absentCoding=g.coding===0&&['L36','L37','L38','L39'].includes(key);
      if(absentDischarge||absentCoding)return ['Not required: this runout segment is absent and the active speed source does not depend on its factor.','No requerido: este tramo no existe y la fuente de velocidad activa no depende de su factor.'];
    }
    return null;
  }
  function summarizeSectionValues(cells,emptyStatus='MISSING'){
    const applicable=cells.filter(cell=>!cell.notApplicable),resolved=applicable.filter(cell=>Number.isFinite(cell.value)&&!cell.partial).length;
    const partial=applicable.filter(cell=>Number.isFinite(cell.value)&&cell.partial).length;
    const unresolved=applicable.length-resolved-partial;
    return {status:!applicable.length?(cells.length?'NOT_APPLICABLE':emptyStatus):resolved===applicable.length?'COMPLETE':resolved+partial>0?'PENDING':'MISSING',
      total:applicable.length,resolved,partial,unresolved,notApplicable:cells.length-applicable.length,
      pending:applicable.filter(cell=>!Number.isFinite(cell.value)||cell.partial).map(cell=>({parameter:cell.label,format:cell.format||null,partial:Boolean(Number.isFinite(cell.value)&&cell.partial)}))};
  }
  function sectionProgress(worksheet,context={}){
    const profiles=worksheet.profiles;
    const geometryCells=worksheet.common.map(([,label,,value,,source],i)=>({
      key:commonTraceKeys[i],label,value,partial:Boolean(source?.partial),notApplicable:notApplicableReason(worksheet,commonTraceKeys[i],value)
    }));
    const noApplicable=Boolean(context.designProfiles?.length)&&context.designProfiles.every(p=>p.models?.[context.index]?.processData?.productApplies===false);
    const sections=rows.map(([title,entries],i)=>{
      const spec=analysisSections[i],cells=entries.filter(Array.isArray).flatMap(([ref,label,,,read])=>profiles.map(p=>{
        const value=read(p),key='L'+ref;
        return {key,label,format:p.name,value,notApplicable:notApplicableReason(worksheet,key,value,p)};
      }));
      return {...spec,progress:summarizeSectionValues(cells,noApplicable?'NOT_APPLICABLE':'MISSING')};
    });
    return [{...commonSection,progress:summarizeSectionValues(geometryCells)},...sections];
  }
  function createSectionStatus(progress,language){
    return window.STSubsection.createAnalysisStatus(progress,language,{
      emptyMessage:language==='es'?'No hay datos de formato resueltos en esta sección.':'No resolved format data for this section.'
    });
  }

  function syncExportActions(context){
    const menu=document.getElementById('conveyor-analysis-export-menu'),trigger=menu.querySelector('summary');
    const one=document.getElementById('conveyor-analysis-export-one'),all=document.getElementById('conveyor-analysis-export-all');
    const es=document.documentElement.lang==='es';
    trigger.title=es?'Exportar evaluaciones de conveyors':'Export conveyor evaluations';
    trigger.setAttribute('aria-label',trigger.title);
    one.textContent=es?'Este conveyor (JSON)':'This conveyor (JSON)';
    all.textContent=es?'Todos los conveyors (JSON)':'All conveyors (JSON)';
    all.disabled=!canExportAll(context);
    all.title=all.disabled?(es?'Abre la evaluación desde la configuración de la línea completa.':'Open the evaluation from the full line configuration.'):'';
  }
  // Temporary analysis edits do not change the source simulation or its startup delay.
  function withFirstPackageSeconds(context,seconds){
    if(seconds!==undefined&&(!Number.isFinite(seconds)||seconds<0))throw Error('Time to First Package After Restart must be zero or greater.');
    const index=context.index;
    function dataWith(data){const accumulation={...data?.accumulation};if(seconds===undefined)delete accumulation.restartToFirstPackageSeconds;else accumulation.restartToFirstPackageSeconds=seconds;return {...data,accumulation};}
    function modelsWith(models){return Array.isArray(models)?models.map((item,n)=>n===index?{...item,processData:dataWith(item.processData)}:item):models;}
    function profileWith(profile){return profile?{...profile,models:modelsWith(profile.models)}:profile;}
    const source=context.source,configuration=source?.configuration;
    return {...context,data:dataWith(context.data),designProfiles:(context.designProfiles||[]).map(profileWith),
      ...(source?{source:{...source,metadata:{...source.metadata,firstPackageAnalysisOverride:true},activeProfile:profileWith(source.activeProfile),
        configuration:configuration?{...configuration,equipment:modelsWith(configuration.equipment)}:configuration}}:{})};
  }
  function open(name,context,options={}){
    if(!context)return;
    const dialog=document.getElementById('conveyor-analysis-dialog');
    const body=document.getElementById('conveyor-analysis-body');
    const number=new Intl.NumberFormat(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
    const valueText=value=>Number.isFinite(value)?number.format(value):'Pending';
    const worksheet=calculate(context);
    const preserveView=dialog.open,scrollTop=body.scrollTop,folds=new Map(Array.from(body.querySelectorAll('[data-analysis-group]')).map(group=>[group.dataset.analysisGroup,group.open]));
    const origin=context.source?.metadata?.origin;
    const editable=typeof options.editFirstPackage==='function'||['NUMERICAL_SIMULATION','SIMULATION_2D'].includes(origin);
    const localOnly=typeof options.editFirstPackage!=='function';
    currentExport={name,context,worksheet};
    const menu=document.getElementById('conveyor-analysis-export-menu');
    menu.open=false;menu.querySelector('summary').setAttribute('aria-expanded','false');
    syncExportActions(context);
    const language=document.documentElement.lang==='es'?'es':'en';
    const trace=createPendingTrace(worksheet,context,language);
    const sections=sectionProgress(worksheet,context);
    body.replaceChildren();
    document.getElementById('conveyor-analysis-title').textContent='Conveyor Analysis Tool · '+name;
    function make(parent,tag,text){
      const element=document.createElement(tag);
      if(text!==undefined)element.textContent=text;
      parent.append(element);
      return element;
    }
    // Encabezados breves: la descripción completa de cada formato se muestra
    // fuera de la tabla, para no forzar anchuras de columnas innecesarias.
    function table(spec,headers,verdict,profiles){
      const tools=[];
      if(verdict){
        const badge=document.createElement('span');
        badge.textContent=verdict.status;
        badge.className='conveyor-analysis-verdict st-status-pill';
        badge.classList.toggle('is-pass',verdict.status==='PASS');
        badge.classList.toggle('is-fail',verdict.status==='FAIL');
        badge.classList.toggle('is-review',verdict.status==='AT LIMIT');
        badge.title=verdict.statusReason;
        tools.push(badge);
      }
      tools.push(createSectionStatus(spec.progress,language));
      const geometryModeLabels={AUTOMATIC:['Automatic design','Diseño automático'],MANUAL_LBA:['Manual LBA','LBA manual'],MANUAL_BACKUP:['Manual Back-up','Back-up manual']};
      const mode=geometryModeLabels[worksheet.geometry.geometryMode];
      const description=localized(spec.description,language)+(spec.key==='geometry'&&mode?' · '+localized(mode,language):'');
      const group=window.STSubsection.create({title:localized(spec.title,language),description,variant:'B',native:true,open:true,tools});
      group.section.dataset.analysisGroup=spec.key;
      if(preserveView&&folds.has(spec.key))group.section.open=folds.get(spec.key);
      group.section.dataset.completeness=spec.progress.status;
      body.append(group.section);
      const heading=group.title;
      heading.id='conveyor-analysis-section-'+body.children.length;
      const wrapper=make(group.body,'div');
      wrapper.className='table-scroll';
      const element=make(wrapper,'table');
      element.setAttribute('aria-labelledby',heading.id);
      // Explicit, content-adaptive columns: equal compact format columns;
      // the parameter column takes the remaining width and wraps normally.
      const count=headers.length-2;
      element.dataset.valueColumns=String(count);
      const colgroup=make(element,'colgroup');
      make(colgroup,'col').className='worksheet-parameter-col';
      const unitWidth=count>4?8:12,valueWidth=Math.min(22,(100-unitWidth-35)/count);
      for(let i=0;i<count;i++){const col=make(colgroup,'col');col.className='worksheet-value-col';col.style.width='min(7.5rem, '+valueWidth+'%)';}
      const unitCol=make(colgroup,'col');unitCol.className='worksheet-unit-col';unitCol.style.width='min(4.5rem, '+unitWidth+'%)';
      if(count>3)element.style.setProperty('--worksheet-min-width',(14+count*5+3.5)+'rem');
      const row=make(make(element,'thead'),'tr');
      headers.forEach((header,index)=>{
        const cell=make(row,'th',header);
        cell.scope='col';
        if(index>0&&index<headers.length-1){
          cell.className='numeric';
          const profile=profiles?.[index-1];
          // Keep format identity available for multi-format comparisons without a second header line.
          if(profile&&profiles.length>1)cell.title=profile.name;
        }
      });
      return make(element,'tbody');
    }
    function row(parent,ref,label,helpKey=ref){
      const element=make(parent,'tr');
      if(ref)element.dataset.cell=ref;
      const help=parameterHelp(helpKey);
      element.title=help;
      const heading=make(element,'th',label);heading.scope='row';heading.title=help;
      return element;
    }
    function renderValue(cell,value,tip,partial=false){
      cell.textContent=valueText(value)+(Number.isFinite(value)&&partial?' (partial)':'');
      if(!tip)return;
      cell.title=tip;cell.tabIndex=0;
      cell.setAttribute('aria-label',cell.textContent+' · '+tip);
      cell.classList.add(!Number.isFinite(value)?'conveyor-value-pending':partial?'conveyor-value-partial':'conveyor-value-diagnostic');
    }
    function renderFirstPackageInput(cell,profile){
      const es=language==='es',wrap=make(cell,'div');wrap.className='first-package-analysis-input';
      const input=make(wrap,'input');input.type='number';input.min='0';input.step='any';
      input.value=Number.isFinite(profile.firstPackage)?String(profile.firstPackage):'';
      input.placeholder=es?'Pendiente':'Pending';
      input.title=es?'Tiempo desde permiso de rearranque hasta salida del primer envase, incluido Startup Time. No es otro retardo de simulación.':'Time from restart permission to first package exit, including Startup Time. Not an extra simulation delay.';
      input.setAttribute('aria-label',es?'Tiempo hasta el primer envase tras rearranque (s)':'Time to First Package After Restart (s)');
      const apply=make(wrap,'button',es?'Aplicar':'Apply');apply.type='button';apply.className='ghost';
      const note=make(wrap,'small',localOnly?(es?'Solo este análisis; no modifica la corrida.':'Analysis only; does not change the run.'):(es?'Se guarda con el conveyor; aplica a todos los formatos.':'Saved with the conveyor; applies to all formats.'));
      function commit(){
        if(!input.checkValidity()){input.reportValidity();return;}
        const seconds=input.value===''?undefined:Number(input.value);
        if(seconds!==undefined&&(!Number.isFinite(seconds)||seconds<0))return;
        try{
          const nextContext=localOnly?withFirstPackageSeconds(context,seconds):options.editFirstPackage(seconds);
          if(!nextContext)throw Error('Conveyor evaluation context is unavailable.');
          open(name,nextContext,options);
        }catch(error){note.textContent=error.message;note.setAttribute('role','alert');}
      }
      apply.addEventListener('click',commit);
      input.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();commit();}});
    }
    function renderNotApplicable(cell,reason){
      cell.textContent=language==='es'?'No aplica':'N/A';
      cell.classList.add('conveyor-value-not-applicable');
      cell.title=localized(reason,language);cell.tabIndex=0;
      cell.setAttribute('aria-label',cell.textContent+' · '+cell.title);
    }
    const common=table(sections[0],['Parameter','Value','Unit'],worksheet.geometry);
    worksheet.common.forEach(([ref,label,unit,value,,source],index)=>{
      const element=row(common,ref,label,trace.commonKeys[index]);
      const output=make(element,'td');
      output.className='numeric';
      make(element,'td',unit).className='analysis-table-unit';
      const reason=notApplicableReason(worksheet,trace.commonKeys[index],value);
      if(reason)renderNotApplicable(output,reason);
      else renderValue(output,value,trace.describe(trace.commonKeys[index]),Boolean(source?.partial));
      if(!output.title)output.title=parameterHelp(trace.commonKeys[index]);
    });
    if(!worksheet.profiles.length){
      const excluded=sections[1].progress.status==='NOT_APPLICABLE';
      const note=make(body,'p',excluded?(language==='es'?'Ningún formato aplica a este conveyor.':'No format applies to this conveyor.'):(language==='es'?'No hay datos de formato resueltos para el análisis.':'No resolved format data for this analysis.'));
      note.className='chart-note';
    }
    for(const [sectionIndex,[title,entries]] of rows.entries()){
      const spec=sections[sectionIndex+1],columns=worksheet.profiles.length?worksheet.profiles:[null];
      const formats=table(spec,['Parameter',...columns.map((profile,index)=>
        columns.length===1?'Value':'Value '+(index+1)),'Unit'],null,worksheet.profiles);
      for(const entry of entries){
        if(typeof entry==='string'){
          const heading=make(make(formats,'tr'),'th',entry);
          heading.colSpan=columns.length+2;
          heading.scope='rowgroup';
          continue;
        }
        const [ref,label,unit,,read]=entry;
        const element=row(formats,'L'+ref,label);
        if(ref>=33&&ref<=41)element.dataset.zone=ref<=35?'discharge':ref<=38?'coding':'overflow';
        columns.forEach((profile,index)=>{
          const cell=make(element,'td');cell.className='numeric';
          if(!profile){
            if(spec.progress.status==='NOT_APPLICABLE')renderNotApplicable(cell,['No format applies to this conveyor.','Ningún formato aplica a este conveyor.']);
            else renderValue(cell,undefined,language==='es'?'No se resolvieron los datos de formato. Revisa equipos y formatos.':'Format data are unresolved. Review equipment and formats.');
          }else{
            const value=read(profile),reason=notApplicableReason(worksheet,'L'+ref,value,profile);
            if(reason)renderNotApplicable(cell,reason);
            else if(ref===62&&index===0&&editable)renderFirstPackageInput(cell,profile);
            else renderValue(cell,value,valueDiagnostic(worksheet,trace,'L'+ref,index));
          }
          if(!cell.title)cell.title=parameterHelp('L'+ref);
        });
        make(element,'td',unit).className='analysis-table-unit';
      }
    }
    body.scrollTop=preserveView?scrollTop:0;
    if(!dialog.open)dialog.showModal();
  }
  document.getElementById('conveyor-analysis-close').addEventListener('click',close);
  function exportCurrent(scope){
    if(!currentExport)return;
    const menu=document.getElementById('conveyor-analysis-export-menu');if(menu)menu.open=false;
    try{downloadEvaluation(currentExport.context,{scope,name:currentExport.name,worksheet:currentExport.worksheet});}
    catch(error){if(window.STDialog?.open)window.STDialog.open({message:error.message});else window.alert?.(error.message);}
  }
  document.getElementById('conveyor-analysis-export-one')?.addEventListener('click',()=>exportCurrent('SINGLE'));
  document.getElementById('conveyor-analysis-export-all')?.addEventListener('click',()=>exportCurrent('ALL'));
  document.getElementById('conveyor-analysis-dialog')?.addEventListener('close',()=>{currentExport=null;});
  window.addEventListener('st-language-change',()=>{if(currentExport)syncExportActions(currentExport.context);});
  function paintEvaluationButton(button,geometry){
    const status=geometry?.status||'NOT EVALUATED',es=document.documentElement.lang==='es';
    const text=es?({'PASS':'CUMPLE','FAIL':'NO CUMPLE','AT LIMIT':'AL LÍMITE','NOT EVALUATED':'NO EVALUADO'}[status]||status):status;
    button.textContent=text;button.dataset.evaluation=status;
    button.classList.toggle('is-pass',status==='PASS');button.classList.toggle('is-fail',status==='FAIL');button.classList.toggle('is-review',status==='AT LIMIT');
    button.title=(es?'Abrir análisis de conveyor':'Open conveyor analysis')+' · '+text+' · '+(geometry?.statusReason||(es?'Geometría o datos requeridos pendientes.':'Required geometry or inputs are pending.'));
    button.setAttribute('aria-label',button.title);
  }
  function createEvaluationButton(openAnalysis){
    const button=document.createElement('button');button.type='button';button.className='equipment-analysis-pill conveyor-editor-verdict st-status-pill';
    button.setAttribute('aria-haspopup','dialog');button.setAttribute('aria-controls','conveyor-analysis-dialog');
    button.addEventListener('click',event=>{event.stopPropagation();openAnalysis();});
    paintEvaluationButton(button,null);return button;
  }
  return {open,close,calculate,withFirstPackageSeconds,resolveProfiles,worksheetContext,recommendedSpeed,verdictColors,lengthHelp,createEvaluationButton,paintEvaluationButton,createPendingTrace,buildEvaluationExport,downloadEvaluation,profilePopulationHelp,parameterHelp,sectionProgress,summarizeSectionValues};
})();
</script>
