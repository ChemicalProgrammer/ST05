<style>

   keyboard semantics or persisted open/closed state. */

  #realdata-panel .real-data-registration-explorer details.real-data-explorer-entry::details-content {
    interpolate-size:allow-keywords;block-size:0;opacity:0;overflow:clip;

  }

    block-size:auto;opacity:1;
  }

  #realdata-panel .real-data-registration-explorer .real-data-explorer-entry > summary::before {transition:none;}

    #realdata-panel .real-data-registration-explorer details.real-data-explorer-entry::details-content {transition:none;}
  }

#realdata-panel .real-data-explorer-panel { border:var(--border-width) solid var(--line);border-radius:var(--radius-md);padding:var(--space-4);margin:0;min-width:0; }

  grid-template-columns:fit-content(32%) minmax(0,1fr);
}
#realdata-panel .real-data-comparison-nav {
  /* The longest label determines the intrinsic track width. Every tab
     stretches to that common width instead of stretching the sidebar. */
  display:grid;grid-template-columns:minmax(0,1fr);
  align-content:start;justify-items:stretch;gap:var(--space-1);min-width:0;
}
#realdata-panel .real-data-comparison-tab {
  width:auto;max-width:100%;min-width:0;justify-self:stretch;box-sizing:border-box;
  justify-content:flex-start;text-align:start;
  white-space:normal;line-height:var(--leading-tight);
  transition:background-color var(--duration-normal) var(--ease),
    color var(--duration-normal) var(--ease),box-shadow var(--duration-normal) var(--ease);

#realdata-panel .real-data-explorer-content {min-width:0;}

#realdata-panel .real-data-downtime-table { width:100%;min-width:1040px; }
#realdata-panel :is(.real-data-downtime-table,.real-data-equipment-table) :is(th[scope="row"],thead tr:first-child th:first-child) { position:sticky;inset-inline-start:0;background:var(--surface);z-index:1; }
