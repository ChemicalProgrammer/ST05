<script>
window.STInputComparison=(function(){
  function inputs(e){
    if(!e)return {};
    var p=e.processData||{},a=p.accumulation||{},g=p.geometry||{},u=p.upstream||{},d=p.downstream||{},s=p.speedAndSensors||{},r=e.noiseProfile?.reliability||{},values={};
    function add(label,value,scale){if(value!==undefined&&value!==null)values[label]=typeof value==='number'&&scale?value*scale:value;}
    add('Name',e.name);add('Type',e.type);add('Initial mode',e.initialMode||'AUTO');
    add('MTBF (min)',r.mtbfMinutes??p.equipment?.mtbfMinutes);add('MTTR (min)',r.mttrMinutes??p.equipment?.mttrMinutes);
    if(e.type!=='CONVEYOR'){
      var rate=window.STFlowUnits?.labels(e.unitOfFlow||p.flowUnits?.output).rate||'units/min';
      add('Speed ('+rate+')',e.nominalRatePerSecond,60);add('Maximum speed ('+rate+')',p.equipment?.maximumSpeedBpm);
      add('Critical machine',e.characteristics?.isPacemaker??e.characteristics?.criticalMachine??(e.type==='PACEMAKER'||p.role==='CRITICAL_MACHINE'));
      add('Startup delay (s)',e.startupDelaySeconds??u.startupTimeSeconds);add('Acceleration ramp (s)',e.restartRampUpSeconds??d.rampUpTimeSeconds);add('Infeed pitch (mm)',d.infeedPitchMm);
    }else{
      add('Total length (mm)',g.lactMm);add('Prime zone (mm)',g.lpPrimeMm);
      add('Discharge actual (mm)',g.actualDischargeMm??a.dischargeRunoutLengthMm);add('Coding actual (mm)',g.actualCodingMm??a.rejectRunoutLengthMm);
      add('Package length (mm)',u.packageLengthMm);add('Discharge pitch (mm)',u.dischargePitchMm);add('Startup time (s)',u.startupTimeSeconds);
      add('Bottles at stop',a.bottlesDischargedAtStop??u.bottlesDischargedAtStop);add('Infeed pitch (mm)',d.infeedPitchMm);add('Ramp up time (s)',a.downstreamRampUpSeconds??d.rampUpTimeSeconds);
      add('Target Population (%)',a.targetPopulationPercent??'Automatic');add('Target overspeed (%)',a.targetOverspeedPercent??'Automatic');add('Manual LBA (mm)',a.manualLbaMm??'Automatic');
      var target=a.targetPopulationPercent!=null||a.targetOverspeedPercent!=null,manual=!target&&a.speedMode==='MANUAL';
      add('Speed control',target?'Target':a.speedMode||'AUTO');if(manual)add('Belt speed (m/min)',a.conveyorSpeedMmPerSecond,.06);
      if(!target)add('Moving gap (mm)',a.movingGapMm);
      add('Accumulated gap (mm)',a.accumulatedGapMm);
      if(a.manualLbaMm==null)add('Back-up position (mm)',a.backupSensorPositionMm);
      add('Discharge factor (%)',a.conveyorSpeedFactorPercent??s.conveyorSpeedFactorVsDischargeVelocityPercent);
      add('Coding factor (%)',s.codingConveyorSpeedFactorVsPreviousConveyorPercent);add('Acc zone factor (%)',s.conveyorSpeedFactorVsPreviousConveyorPercent);
      add('Back-up block delay (s)',a.blockedTimeDelaySeconds??s.blockedTimeDelaySeconds);add('Back-up clear delay (s)',a.clearTimeDelaySeconds??s.clearTimeDelaySeconds);
      add('Insurance factor (pkgs)',a.insuranceFactorUnits??s.insuranceFactorUnits);add('Stop response (s)',a.upstreamStopResponseSeconds);
    }
    var micro=e.noiseProfile?.microStop||{};
    add('Microstop frequency (/min)',micro.probabilityPerMinute);add('Minimum microstop (s)',micro.minDurationSeconds);add('Maximum microstop (s)',micro.maxDurationSeconds);
    return values;
  }
  function display(value){return value==null?'—':typeof value==='boolean'?(value?'Yes':'No'):typeof value==='number'?Number(value.toFixed(6)).toLocaleString('en-US',{maximumFractionDigits:6}):String(value);}
  function changes(left,right){
    var before=new Map((left.equipment||[]).map(function(e){return [e.id,e];})),after=new Map((right.equipment||[]).map(function(e){return [e.id,e];})),rows=[],affected=new Set();
    new Set([...before.keys(),...after.keys()]).forEach(function(id){
      var a=before.get(id),b=after.get(id),name=a?.name||b?.name||id;
      if(!a||!b){rows.push([name,a?'Removed equipment':'Added equipment',a?.type||'—',b?.type||'—']);affected.add(id);return;}
      var x=inputs(a),y=inputs(b);new Set([...Object.keys(x),...Object.keys(y)]).forEach(function(key){
        if((x[key]??null)!==(y[key]??null)){rows.push([name,key,display(x[key]),display(y[key])]);affected.add(id);}
      });
    });return {rows:rows,affected:affected.size};
  }
  function run(config){
    config=config||{};var values={};
    [['engineId','Engine'],['durationMode','Duration mode'],['durationSeconds','Duration / ceiling (s)'],['rounds','Rounds'],['seed','Seed'],['sampleEverySeconds','Display interval (s)'],['shiftHours','Hours per shift'],['shiftCount','Shifts']].forEach(function(spec){if(config[spec[0]]!=null)values[spec[1]]=config[spec[0]];});
    if(config.commands?.length)values['Scheduled controls']=JSON.stringify(config.commands);
    return values;
  }
  return {inputs:inputs,changes:changes,run:run,display:display};
})();

window.STComparison=function(state,isFiniteNumber){
    function subsection(title,open){
      return STSubsection.create({title,open:Boolean(open),className:'comparison-section'});
    }
    function renderCaseComparison() {
      var a = (state.activeCase.simulations || []).find(function(sim) { return sim.id === document.getElementById('case-compare-a').value; });
      var b = (state.activeCase.simulations || []).find(function(sim) { return sim.id === document.getElementById('case-compare-b').value; });
      var target = document.getElementById('case-comparison-content'); target.textContent = '';
      STReports.bindComparison(state.activeCase,a,b);
      if (!a || !b || a.id === b.id) { const empty=document.createElement('p');empty.className='comparison-empty metric-card metric-card--status';empty.setAttribute('role','status');empty.textContent=__ST_TEXT__('comparison.select_two_different_simulations');target.append(empty);return; }
      STResults.compare(target,a,b);
      STResults.compareEquipmentOee(target,a,b);
      var basic=Boolean(window.STBasicMode?.isBasic());
      appendChangedInputs(target,a,b);
      appendComparisonSection(target,__ST_TEXT__('comparison.simulation_configuration'),STInputComparison.run(a.dynamicConfig),STInputComparison.run(b.dynamicConfig));
      if(basic)return;
      const additional=subsection('Additional result details',false);additional.section.classList.add('comparison-result-details');additional.body.classList.add('comparison-details-content');target.append(additional.section);target=additional.body;
      if(a.results?.batch||b.results?.batch){
        var note=document.createElement('p');note.className='notice';note.textContent=__ST_TEXT__('batch.compare_note');target.appendChild(note);
        appendComparisonSection(target,__ST_TEXT__('batch.title'),a.results?.batch?.statistics||{},b.results?.batch?.statistics||{});
        appendComparisonSection(target,__ST_TEXT__('batch.rounds'),{rounds:a.results?.batch?.rounds||1,seeds:a.results?.batch?.rows.map(function(r){return r.seed;})||[a.results?.seed]},{rounds:b.results?.batch?.rounds||1,seeds:b.results?.batch?.rows.map(function(r){return r.seed;})||[b.results?.seed]});
      }

      appendComparisonSection(target, __ST_TEXT__('comparison.simulation_results'), a.results?.summary || {}, b.results?.summary || {});
      appendComparisonSection(target, __ST_TEXT__('comparison.saved_result_metadata'), comparisonResultMetadata(a.results), comparisonResultMetadata(b.results));
      var equipmentIds = (a.equipment || []).map(function(item) { return item.id; });
      (b.equipment || []).forEach(function(item) { if (equipmentIds.indexOf(item.id) === -1) equipmentIds.push(item.id); });
      var metricA = a.results?.equipmentMetrics || {};
      var metricB = b.results?.equipmentMetrics || {};
      equipmentIds.forEach(function(equipmentId) {
        appendComparisonSection(target, __ST_TEXT__('comparison.simulation_metrics') + equipmentId, metricA[equipmentId] || {}, metricB[equipmentId] || {});
      });
    }

    function appendChangedInputs(target,a,b) {
      var comparison=STInputComparison.changes(a,b),changes=comparison.rows;
      const block=subsection(__ST_TEXT__('comparison.changed_inputs')+changes.length+__ST_TEXT__('comparison.changes')+comparison.affected+__ST_TEXT__('comparison.equipment_affected'),true),section=block.section;
      if(!changes.length){var message=document.createElement('p');message.className='chart-note';message.textContent=__ST_TEXT__('comparison.no_equipment_input_differences_run_settings_are_listed_below');block.body.appendChild(message);}
      else {
        var scroll=document.createElement('div');scroll.className='table-scroll';var table=document.createElement('table');table.innerHTML='<thead><tr><th>Equipment</th><th>Parameter</th><th>Baseline</th><th>Proposed</th></tr></thead><tbody></tbody>';
        changes.forEach(function(change){var tr=document.createElement('tr');change.forEach(function(v){var td=document.createElement('td');td.textContent=v;tr.appendChild(td);});table.querySelector('tbody').appendChild(tr);});scroll.appendChild(table);block.body.appendChild(scroll);
      }
      target.appendChild(section);
    }
    function hasSavedSimulationResult(result) {
      return Boolean(result && result.replay && result.summary &&
        isFiniteNumber(result.seed) && isFiniteNumber(result.durationSeconds));
    }

    function comparisonResultMetadata(result) {
      if (!hasSavedSimulationResult(result)) return {};
      return {
        seed: result.seed,
        durationSeconds: result.durationSeconds,
        completedAt: result.completedAt,
        replaySampleCount: Array.isArray(result.replay?.samples) ? result.replay.samples.length : undefined,
        eventCount: Array.isArray(result.replay?.events) ? result.replay.events.length : undefined
      };
    }

    function appendComparisonSection(target, title, left, right) {
      const block=subsection(title,title===__ST_TEXT__('comparison.scenario_provenance')||title===__ST_TEXT__('comparison.simulation_configuration')),section=block.section;
      var flatLeft = flattenComparisonValues(left); var flatRight = flattenComparisonValues(right);
      var keys = Array.from(new Set(Object.keys(flatLeft).concat(Object.keys(flatRight)))).sort();
      if (!keys.length) { const empty=document.createElement('p');empty.className='chart-note';empty.textContent=__ST_TEXT__('comparison.no_saved_values');block.body.append(empty);target.appendChild(section);return; }
      const scroll=document.createElement('div'),table=document.createElement('table');scroll.className='table-scroll';table.className='comparison-values-table';
      const head=table.createTHead().insertRow();['Parameter',__ST_TEXT__('view.baseline'),__ST_TEXT__('results.proposed')].forEach(text=>{const cell=document.createElement('th');cell.scope='col';cell.textContent=text;head.append(cell);});
      const body=table.createTBody();
      keys.forEach(function(key) {
        var leftValue = flatLeft[key]; var rightValue = flatRight[key];
        const row=body.insertRow();if(String(leftValue)!==String(rightValue))row.classList.add('comparison-changed');
        const label=document.createElement('th');label.scope='row';label.textContent=key;row.append(label);
        [leftValue,rightValue].forEach(value=>{const cell=row.insertCell();cell.textContent=formatComparisonValue(value);if(typeof value==='number')cell.className='numeric';});
      });
      scroll.append(table);block.body.append(scroll);
      target.appendChild(section);
    }

    function flattenComparisonValues(value, prefix, output) {
      var result = output || {}; var base = prefix || '';
      if (value === null || value === undefined || typeof value !== 'object' || Array.isArray(value)) { result[base || 'value'] = value; return result; }
      Object.keys(value).forEach(function(key) { var path = base ? base + '.' + key : key; var item = value[key]; if (item && typeof item === 'object' && !Array.isArray(item)) flattenComparisonValues(item, path, result); else result[path] = item; });
      return result;
    }

    function formatComparisonValue(value) { return value === undefined || value === null || value === '' ? '—' : Array.isArray(value) ? JSON.stringify(value) : STInputComparison.display(value); }


return {render:renderCaseComparison};
};
</script>
