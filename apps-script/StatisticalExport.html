<script>
/* Statistical data exchange: tabular CSV files in a single local ZIP.
   No external libraries, requests, changes to the case, or synthetic observations. */
window.STStatExport=(function(){
  'use strict';
  var capture=null;
  const version='ST_MINITAB_CSV_V1';
  const finite=x=>typeof x==='number'&&Number.isFinite(x);
  const arr=x=>Array.isArray(x)?x:[];
  const obj=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};
  const div=(a,b)=>finite(a)&&finite(b)&&b>0?a/b:null;
  const mul=(a,b)=>finite(a)?a*b:null;
  const delta=(a,b)=>finite(a)&&finite(b)&&a>=b?a-b:null;
  const scalar=x=>x===null||['number','string','boolean'].includes(typeof x);
  const diff=(a,b)=>finite(a)&&finite(b)?a-b:null;
  function flat(value,prefix='',out={}){
    for(const [key,val] of Object.entries(obj(value))){
      const path=prefix?prefix+'.'+key:key;
      if(scalar(val))out[path]=val;
      else if(val&&typeof val==='object'&&!Array.isArray(val))flat(val,path,out);
    }return out;
  }
  function leaves(value,path,visit){
    if(value===undefined)return;
    if(scalar(value)){visit(path,value);return;}
    if(Array.isArray(value)){value.forEach((v,i)=>leaves(v,path+'['+i+']',visit));return;}
    for(const [k,v] of Object.entries(obj(value)))leaves(v,path?path+'.'+k:k,visit);
  }
  function csvCell(value){
    if(value==null||typeof value==='number'&&!finite(value))return '';
    if(typeof value==='number')return String(value);
    if(typeof value==='boolean')return value?'1':'0';
    var text=String(value);
    // Safe when opened in a spreadsheet, too. Numeric values retain their type.
    if(/^[\s\u0000-\u001f]*[=+@-]|^[\t\r\n]/.test(text))text="'"+text;
    return '"'+text.replace(/"/g,'""')+'"';
  }
  function csv(table){
    return '\ufeff'+[table.columns.map(csvCell).join(','),...table.rows.map(r=>table.columns.map(c=>csvCell(r[c])).join(','))].join('\r\n')+'\r\n';
  }
  function canExport(simulation){
    const r=simulation?.results;
    return !!r?.summary&&!r.provisional&&(!r.replicationStatus?.state||r.replicationStatus.state==='COMPLETE');
  }
  function buildTables(simulation,activeCase={}){
    if(!canExport(simulation))throw Error('Complete the numerical simulation before exporting to Minitab.');
    const result=simulation.results, tables=new Map();

      const table={name,observation,notes,columns:[...columns],keys:new Set(columns),rows:[]};tables.set(name,table);return table;
    };
    const put=(name,row)=>{
      const table=tables.get(name);

      table.rows.push(row);
    };
    let provenance;try{provenance=JSON.parse(result.inputSignature||result.replay?.inputSignature||'null');}catch(_){}
    const exactInputs=Array.isArray(provenance?.equipment)&&provenance.run&&typeof provenance.run==='object';
    const eq=exactInputs?provenance.equipment:arr(simulation.equipment),run=exactInputs?provenance.run:obj(simulation.dynamicConfig);
    const names=new Map(arr(simulation.equipment).map(e=>[e.id,e.name]));
    const models=new Map(eq.map(e=>[e.id,e])), name=id=>models.get(id)?.name||names.get(id)||id||null;
    const unit=result.unitOfFlow||result.replay?.unitOfFlow||simulation.unitOfFlow||activeCase?.unitOfFlow||null;
    const id={Simulation_ID:simulation.id,Simulation:simulation.name};
    const eqId=e=>({Equipment_ID:e,Equipment:name(e),Equipment_type:models.get(e)?.type});
    const baseSeed=result.batch?.baseSeed??result.replay?.seed??result.seed;
    const batchRows=arr(result.batch?.rows);
    // A summary export may have a batch mean but no rows. The stored top-level
    // summary is the first trajectory, not n independent measurements.
    const rounds=batchRows.length?batchRows:finite(result.seed??result.replay?.seed)?[{
      round:1,seed:result.replay?.seed??result.seed,durationSeconds:result.durationSeconds,
      summary:result.summary,equipmentMetrics:result.equipmentMetrics,shifts:result.shifts,products:result.products,
      plantCalendar:result.plantCalendar,numerics:result.numerics}]:[];
    const expected=result.batch?.rounds??result.replicationStatus?.rounds??result.rounds??null;
    const actualRound=(row,i)=>row.round??i+1;
    const rowDuration=row=>row.durationSeconds??result.batch?.durationSeconds??result.durationSeconds;
    const roundInfo=(row,i)=>({...id,Round:actualRound(row,i),Seed:row.seed,Duration_s:rowDuration(row),Flow_unit:unit});
        const meta=create('01_metadata.csv','One exported simulation','Executed inputs from result signature when available. Current edited inputs are not silently substituted.');

    const config=create('02_run_inputs.csv','One configuration scalar','Run configuration as executed; array indices are paths. Units remain in native property names.',['Path','Value_numeric','Value_text']);

    const inputs=create('03_equipment_inputs.csv','One equipment unit','Executed inputs. Speeds are native output units/min; conveyor belt speed stays in mm/s.');

    const line=create('04_line_rounds.csv','One actual simulation round','Use for descriptive statistics across independent seeds. Does not duplicate the mean or create missing rounds.');
    const em=create('05_equipment_rounds.csv','One equipment per actual round','All recorded scalar equipment metrics; OEE and outputs use the reported native units.');

    const failures=create('07_failure_episodes.csv','One recorded failure episode','Exposure and wall-clock durations differ; MTTR is a configured duration. Review end reason and completeness before reliability analysis.',['Round','Seed','Equipment_ID','Equipment','Episode','History_complete','Repair_completed','startSecond','endSecond','stopClass','configuredRepairSeconds','sampledExposureSeconds','cumulativeChargedSecondsAtStart','observedFailureSeconds','endReason']);

      if(!matching)return;

      if(Object.keys(obj(recording.accumulationZoneMetrics)).length>Object.keys(obj(old.accumulationZoneMetrics)).length)combined.accumulationZoneMetrics=recording.accumulationZoneMetrics;
      histories.set(round,combined);
    }
    const first=result.replay||result;
    addReplay(first,1,first.seed??baseSeed);
    arr(result.batch?.replays).forEach((r,i)=>addReplay(r,r?.round??i+2,r?.seed));

    for(const [key,z] of Object.entries(obj(first.zoneDefinitions)))zoneMap.set(key,z);
    for(const [key,z] of Object.entries(obj(result.accumulationZoneMetrics)))zoneMap.set(key,{...zoneMap.get(key),...z});
    rounds.forEach((row,i)=>{
      const info=roundInfo(row,i),s=obj(row.summary),duration=info.Duration_s,round=info.Round,h=histories.get(round);
      put(line.name,{...info,Row_basis:batchRows.length?'ACTUAL_BATCH_ROW':'STORED_FIRST_ROUND',OEE_pct:s.lineOeePercent,Output_count:s.outputCount,Throughput_per_min:mul(div(s.outputCount,duration),60),...flat(s,'Summary'),...flat(row.numerics||result.numerics,'Numerics')});

      }
      const zs=Object.values(obj(round===1?result.accumulationZoneMetrics:h?.accumulationZoneMetrics));
      const seen=new Set();

        const zid=z.id||z.ownerEquipmentId;if(!zid||seen.has(zid))return;seen.add(zid);
        const d=zoneMap.get(zid),equipmentId=z.ownerEquipmentId||d?.ownerEquipmentId;
        put(zoneRounds.name,{...info,Zone_ID:zid,...eqId(equipmentId),Native_flow_unit:models.get(equipmentId)?.unitOfFlow||z.packageUnit,Record_basis:zs.includes(z)?'FULL_ZONE_METRICS':'ROUND_CONVEYOR_SUMMARY',...flat(z,'Zone')});
      });
      arr(row.shifts).forEach(shift=>put(shifts.name,{...info,...flat(shift)}));
      arr(row.products?.rows).forEach(p=>put(products.name,{...info,...flat(p)}));
      leaves(row.plantCalendar,'',(path,value)=>put(cal.name,{...info,Path:path,Value_numeric:finite(value)?value:null,Value_text:finite(value)?null:value}));
      const frames=arr(h?.samples).filter(s=>finite(s?.virtualSecond)).slice().sort((a,b)=>a.virtualSecond-b.virtualSecond);
      const coverage={...obj(round===1?result.detailCoverage:null),...obj(h?.detailCoverage)};
      for(const [kind,count] of [['TIME_SAMPLES',frames.length],['STATE_TRANSITIONS',arr(h?.stateTransitions).length],['EVENTS',arr(h?.events).length]])put(cover.name,{...info,Recording:kind,Recorded_rows:count,Available:count>0,...flat(coverage,'Coverage')});

        const time={...info,Sample:j+1,Time_s:t,Interval_s:dt,Product_ID:frame.productId,Crosses_product_change:prev&&prev.productId!=null&&frame.productId!=null?prev.productId!==frame.productId:null};
        put(lts.name,{...time,Cumulative_output:frame.outputCount,Interval_output:increment,Interval_throughput_per_min:mul(div(increment,dt),60),Cumulative_throughput_per_min:mul(div(frame.outputCount,t),60),Effective_runtime_s:frame.effectiveRuntimeSeconds,Runtime_loss_s:frame.runtimeLossSeconds,...flat(frame,'Sample')});
        arr(frame.equipment).forEach(m=>{
          const p=prevEquipment.get(m.id),elapsed=p&&t>p.time?t-p.time:null,out=m.outputCount??m.processedUnits,native=m.unitOfFlow||row.equipmentMetrics?.[m.id]?.unitOfFlow||models.get(m.id)?.unitOfFlow,inc=elapsed&&p.native===native?delta(out,p.output):null;
          put(ets.name,{...time,Interval_s:elapsed,...eqId(m.id),Native_flow_unit:native,State:m.availabilityState,Mode:m.mode,Cumulative_output:out,Interval_output:inc,Interval_throughput_per_min:mul(div(inc,elapsed),60),Recorded_actual_rate_per_min:mul(m.actualRatePerSecond,60),Recorded_mean_rate_per_min:mul(m.meanRatePerSecond,60),OEE_pct:m.oeePercent,...flat(m,'Sample')});
          prevEquipment.set(m.id,{time:t,output:out,native});
        });
        arr(frame.accumulationZones).forEach(z=>{
          const d=zoneMap.get(z.id),equipmentId=z.ownerEquipmentId||d?.ownerEquipmentId;
          put(zts.name,{...time,Zone_ID:z.id,...eqId(equipmentId),Native_flow_unit:z.packageUnit||models.get(equipmentId)?.unitOfFlow,Inventory_units:z.inventoryUnits,Fill_pct:z.fillPercent,Prime_state:z.prime?.state,Backup_state:z.backup?.state,...flat(z,'Sample')});

      arr(h?.stateTransitions).forEach(tr=>{

        else put(transitions.name,{...info,Time_s:tr?.atVirtualSecond??tr?.virtualSecond,...eqId(tr?.equipmentId),State:tr?.state,...flat(tr,'Transition')});
      });
      arr(h?.events).forEach((ev,j)=>put(events.name,{...info,Event_index:j+1,Time_s:ev.atVirtualSecond??ev.virtualSecond,Event_type:ev.type,Equipment_ID:ev.equipmentId,Zone_ID:ev.zoneId,...flat(ev,'Event')}));
    });
    for(const [scope,values] of [['LINE',result.batch?.statistics],['FAILURE_OVERLAP',result.batch?.failureOverlapStatistics]])for(const [key,value] of Object.entries(obj(values)))put(statistics.name,{Scope:scope,Metric:key,...flat(value)});
    for(const [equipmentId,values] of Object.entries(obj(result.batch?.equipmentStatistics)))for(const [key,value] of Object.entries(obj(values)))put(statistics.name,{Scope:'EQUIPMENT',...eqId(equipmentId),Metric:key,...flat(value)});
    const zones=create('19_conveyor_definitions.csv','One recorded zone definition','Recorded effective geometry and sensor positions. Do not interpret missing positions as zero.');

    const scenarioSummary=create('20_CAPEX_summary.csv','One saved CAPEX evaluation','One row per saved study; separate approximate screening, short confirmation, and original-run verification.');
    const exp=create('21_CAPEX_experiments.csv','One saved experiment/comparison','Means only; repeated records from different audit phases may describe reused calculations. Do not treat as independent experiments.');
    const er=create('22_CAPEX_rounds.csv','One seed per experiment and arm','Use comparison ID and arm to group. Same seed used by multiple alternatives is a block, not a new independent replicate.');

    const factorMap=create('25_DOE_factors.csv','One factor per saved design','A/B/C etc. are coded factor columns. For a package, -1 is unchanged and +1 applies all package changes.');
    const factorChanges=create('26_DOE_factor_changes.csv','One parameter in a DOE factor package','Shows actual values of coupled inputs; use DOE factor column as identifier.');

    const warnings=create('28_CAPEX_warnings.csv','One recorded engineering warning','Scenario review and experiment-specific warnings.');

    const refineCsv=create('32_Zero_refinement.csv','One refinement candidate per matched seed','Coordinates refined with the same DOE horizon; do not pool different windows.');
    const contrasts=create('30_DOE_seed_contrasts.csv','One factorial effect per complete independent seed block and response','High-minus-low orthogonal contrast on coded two-level combinations. Useful for one-sample tests across seeds; incomplete blocks omitted, no p-values calculated.');
    const evaluations=arr(simulation.whatIf?.evaluations);

    evaluations.forEach((ev,idx)=>{
      const study='S'+String(idx+1).padStart(3,'0'),tier=ev.tier||ev.searchScope,tag={Study_ID:study,CAPEX:tier,Evaluation_status:ev.status};
      const audit=obj(ev.phaseAudit),check=ev.independentCheck,original=ev.originalVerification,screen=ev.screening,discovery=ev.reliabilityTargetSearch,control=audit.controlDiagnosis,doe=ev.doe;
      let current=null;try{if(ev.sourceSignature&&window.STScenarios?.signature)current=ev.sourceSignature===window.STScenarios.signature(simulation);}catch(_){}
      put(scenarioSummary.name,{...tag,Updated_at:ev.updatedAt,Source_inputs_match:current,Policy:ev.searchSettingsSignature,Trial_count:ev.trials,Trial_history_omitted:ev.trialHistoryOmitted,Screening_fidelity:screen?.run?.scenarioFidelity||screen?.candidate?.scenarioFidelity,Screening_base_OEE:screen?.baseline?.oee,Screening_candidate_OEE:screen?.candidate?.oee,Confirmation_passed:check?.passed,Confirmation_base_OEE:check?.baseline?.oee,Confirmation_candidate_OEE:check?.candidate?.oee,Confirmation_gain_per_min:check?.delta?.throughputPerMinute,Original_passed:original?.passed,Original_base_OEE:original?.baseline?.oee,Original_candidate_OEE:original?.candidate?.oee,Original_base_throughput:original?.baseline?.throughput,Original_candidate_throughput:original?.candidate?.throughput,Original_gain_per_min:original?.delta?.throughputPerMinute,Original_duration_s:original?.durationSeconds,Analysis_only:ev.analysisOnly,Plant_validated:ev.plantValidated});
      let count=0;

          duration=c?.durationSeconds??b?.durationSeconds??run?.durationSeconds,flow=c?.unitOfFlow||b?.unitOfFlow||ev.unitOfFlow||unit;

        const validPair=b&&c&&((b.scenarioFidelity||fidelity)===(c.scenarioFidelity||fidelity)||(stage==='ORIGINAL_VERIFICATION'&&b.scenarioFidelity==='ORIGINAL_PHYSICAL_RUN'))&&b.durationSeconds===c.durationSeconds&&b.unitOfFlow===c.unitOfFlow&&arr(b.roundMetrics).length===arr(c.roundMetrics).length;
        if(validPair){const match=new Map(arr(b.roundMetrics).map(r=>[r.seed,r]));const cr=arr(c.roundMetrics);if(match.size===cr.length&&new Set(cr.map(r=>r.seed)).size===cr.length&&cr.every(r=>finite(r.seed)&&match.has(r.seed)&&r.durationSeconds===match.get(r.seed).durationSeconds))cr.forEach(r=>{const before=match.get(r.seed);put(pairs.name,{...tag,Comparison_ID:cid,Stage:stage,Fidelity:fidelity,Seed:r.seed,Duration_s:r.durationSeconds,Flow_unit:flow,Base_OEE_pct:before.oee,Candidate_OEE_pct:r.oee,Delta_OEE_pp:diff(r.oee,before.oee),Base_throughput:before.throughput,Candidate_throughput:r.throughput,Delta_throughput_per_min:diff(r.throughput,before.throughput)});});}
        arr(proposal).forEach(p=>put(changes.name,{...tag,Comparison_ID:cid,Stage:stage,...fields(p)}));
        arr(c?.warnings).forEach(w=>put(warnings.name,{...tag,Comparison_ID:cid,Stage:stage,...flat(w)}));
      }
