    return value;
  }
  const run = {...input.run};
  // Enabled/default reliability are equivalent; disabled reliability is not.
  if (run.reliabilityEnabled !== false) delete run.reliabilityEnabled;
  if(run.machineDesignEnabled!==false)delete run.machineDesignEnabled;
  if(run.machineMaximumSpeedEnabled!==false)delete run.machineMaximumSpeedEnabled;
  // PRECISE preserves the historical step. Explicitly choosing it must not
  // invalidate an otherwise identical completed simulation.
  if (run.numericalResolution === 'PRECISE') delete run.numericalResolution;
  if(run.dynamicLineBalancingEnabled!==true)delete run.dynamicLineBalancingEnabled;
  const dynamicMode=input.case.equipment.some(item=>item.processData?.accumulation?.speedMode==='DYNAMIC');
  const macroScrap=input.case.equipment.some(item=>item.processData?.equipment?.macroStopScrapBottles>0);
  return JSON.stringify(canonical({
    version: SIMULATION_PROVENANCE_VERSION+(dynamicMode?'/DLB:2':run.dynamicLineBalancingEnabled===true?'/DLB:1':'')+(macroScrap?'/SCRAP:3':''),
    unitOfFlow: input.case.unitOfFlow || 'units',
    equipment: input.case.equipment.map(item=>{
      const inactiveDynamic=item.processData?.dynamicLineBalancing&&item.processData?.accumulation?.speedMode!=='DYNAMIC'&&!(run.dynamicLineBalancingEnabled===true&&item.processData.dynamicLineBalancing.enabled===true);
      const zeroScrap=item.processData?.equipment?.macroStopScrapBottles===0;
      if(!inactiveDynamic&&!zeroScrap)return item;
      const processData={...item.processData};
      if(inactiveDynamic)delete processData.dynamicLineBalancing;
      if(zeroScrap){processData.equipment={...processData.equipment};delete processData.equipment.macroStopScrapBottles;}

    }),
    run: {
      durationSeconds: 300, tickSeconds: .25, sampleEverySeconds: 5,
      seed: 1, commands: [], rounds: 1, engineId: 'ST_CURRENT', ...run
    }
  }));
}



/** Design targets and observed flow. Recovery is an explicit planning estimate. */
function analyzeLinePerformance(equipment, result) {
  const machines = (equipment || []).filter(item => item.type !== 'CONVEYOR' && item.processData?.role !== 'CONVEYOR');
  const duration = Number(result?.durationSeconds) || 0;
  const referenceId = machines.find(item => item.type === 'PACEMAKER' || item.processData?.role === 'PACEMAKER' || item.characteristics?.isPacemaker)?.id ||
    machines.find(item => item.id === result?.summary?.lineOeePacemakerEquipmentId)?.id ||
    machines.find(item => item.type === 'FILLER')?.id || machines[0]?.id;
  const reference = machines.find(item => item.id === referenceId);
  const baselineBpm = Number(reference?.nominalRatePerSecond) * 60;
  const points = machines.map(item => {
    const configuredBpm = Number(item.nominalRatePerSecond) * 60;
    // The V-Graph shows configured machine speeds. Average production flow
    // is reported separately and must not flatten speeds to the pacemaker.
    const normalBpm = configuredBpm;
    const recovery = estimateRecoveryTarget(equipment || [], item, referenceId, normalBpm);
    const configuredMaximum = item.processData?.equipment?.maximumSpeedBpm;
    const maximumBpm = configuredMaximum === null || configuredMaximum === undefined || configuredMaximum === ''
      ? null : Number(configuredMaximum);
    const validMaximum = Number.isFinite(maximumBpm) && maximumBpm >= normalBpm && normalBpm > 0;
    const metrics = result?.equipmentMetrics?.[item.id];
    const output = Number(metrics?.outputCount);
    const stopped = Number(metrics?.stoppedSeconds);
    // Availability excludes line interactions; starvation and blocking therefore
    // reduce the operational-efficiency component of effective throughput.
    const availableSeconds = duration > 0 && Number.isFinite(stopped)
      ? Math.max(0, duration - stopped) : 0;
    const availability = duration > 0 && Number.isFinite(stopped) ? availableSeconds / duration : null;
    // Availability-only capacity estimate. Buffer recovery requires the actual
    // deviation from desired inventory and a recovery time, neither supplied here.
    // The pacemaker is the reference, not a machine to overspeed for recovery.
    const capacityEstimateBpm = item.id !== referenceId && baselineBpm > 0 && configuredBpm > 0 && availability > 0
      ? Math.max(configuredBpm, baselineBpm / availability) : null;
    const runtimeEfficiency = availableSeconds > 0 && Number.isFinite(output) && configuredBpm > 0
      ? output / (availableSeconds * configuredBpm / 60) : null;
    const observedBpm = duration > 0 && Number.isFinite(output) ? output * 60 / duration : null;
    return {
      id: item.id, name: item.name, isPacemaker: item.id === referenceId,
      normalBpm, configuredBpm, maximumBpm: validMaximum ? maximumBpm : null,
      ...recovery,
      recommendedPercent: recovery.recommendedBpm !== null && baselineBpm > 0 ? recovery.recommendedBpm / baselineBpm * 100 : null,
      recommendationExceedsMaximum: recovery.recommendedBpm !== null && validMaximum ? recovery.recommendedBpm > maximumBpm + 1e-9 : null,
      speedHeadroomPercent: validMaximum ? (maximumBpm / normalBpm - 1) * 100 : null,
      normalPercent: baselineBpm > 0 ? normalBpm / baselineBpm * 100 : null,
      maximumPercent: validMaximum && baselineBpm > 0 ? maximumBpm / baselineBpm * 100 : null,
      capacityEstimateBpm,
      capacityEstimateExceedsMaximum: capacityEstimateBpm !== null && validMaximum ? capacityEstimateBpm > maximumBpm + 1e-9 : null,
      availability, runtimeEfficiency, observedBpm,
      computedBpm: availability !== null && runtimeEfficiency !== null
        ? configuredBpm * availability * runtimeEfficiency : null,
      hasDynamicEvidence: observedBpm !== null
    };
  });
  const outletCount = Number(result?.summary?.outputCount);
  return {
    points, referenceId,
    unitOfFlow: result?.unitOfFlow || 'units',
    outletBpm: duration > 0 && Number.isFinite(outletCount) ? outletCount * 60 / duration : null,
    outputCount: Number.isFinite(outletCount) ? outletCount : null,
    durationSeconds: duration,
    hasSpeedHeadroom: points.some(point => point.speedHeadroomPercent > 0),
    hasCompleteMaxima: points.length > 0 && points.every(point => point.maximumBpm !== null),
    // The engine uses nominal speed for processing; maximum is design evidence,
    // not a simulated recovery-speed controller or a V-Graph certification.
    simulatesOverspeed: false
  };
}

function estimateRecoveryTarget(equipment, item, referenceId, normalBpm) {
  const empty = {recommendedBpm:null,recoveryUnits:null,recoveryTimeSeconds:null,recoveryBasis:'MISSING_DATA'};
  if (!(normalBpm > 0)) return empty;
  if (item.id === referenceId) return {...empty,recommendedBpm:normalBpm,recoveryUnits:0,recoveryBasis:'PACEMAKER'};
  const index = equipment.indexOf(item), referenceIndex = equipment.findIndex(e => e.id === referenceId);
  const towardReference = referenceIndex > index ? 1 : -1;
  const conveyorIndex = index + towardReference;
  const conveyor = equipment[conveyorIndex];
  if (!conveyor || conveyor.type !== 'CONVEYOR' && conveyor.processData?.role !== 'CONVEYOR')
    return {...empty,recommendedBpm:normalBpm,recoveryUnits:0,recoveryBasis:'NO_ACCUMULATION'};
  const definition = resolveAccumulationZoneDefinition(equipment, conveyorIndex).definition;
  const pitch = Number(definition?.accumulatedPitchMm);
  const usefulLength = definition?.engineering?.calculated?.usefulAccumulationLengthMm ?? definition?.usableLengthMm;
  if (!(pitch > 0) || !Number.isFinite(usefulLength) || usefulLength < 0) return empty;
  const bufferUnits = Math.floor(usefulLength / pitch);
  const reliability = item.noiseProfile?.reliability;
  // Disabled failures do not create an inferred outage, even if old MTTR values
  // are retained in processData. Missing data is not a zero-loss assumption.
  const mttr = Number(reliability?.mttrMinutes);
  const recoverySeconds = Number(item.processData?.equipment?.recoveryTimeSeconds ?? Number(reliability?.mtbfMinutes) * 60);
  if (!reliability || !Number.isFinite(mttr) || !(mttr > 0) || !Number.isFinite(recoverySeconds) || !(recoverySeconds > 0)) return empty;
  const recoveryUnits = Math.min(normalBpm * mttr, bufferUnits);
  return {
    recommendedBpm:normalBpm + recoveryUnits * 60 / recoverySeconds,
    recoveryUnits,recoveryTimeSeconds:recoverySeconds,
    recoveryBasis:item.processData?.equipment?.recoveryTimeSeconds != null ? 'EXPLICIT_RECOVERY_TIME' : 'MTBF_RECOVERY_WINDOW',
    bufferUnits,bufferCoversMeanStop:bufferUnits >= normalBpm * mttr
  };
}


// Capacity accounting and observed equipment time are distinct: time losses
// overlap across machines and must never be summed as causal global OEE loss.
// Use immutable run snapshots and time-weighted bottle equivalents across formats.
function formatCapacityCeiling(models,result,provenance){
  const rows=result.products?.rows,catalog=provenance?.run?.productCatalog;
  if(!rows?.length||!Array.isArray(catalog))return null;
  let ideal=0,capacity=0,duration=0;
  for(const row of rows){
    const product=catalog.find(p=>p.id===(row.formatId||row.productId));
    if(!product||!Number.isFinite(row.durationSeconds)||row.durationSeconds<0||!Number.isFinite(row.idealBottleOutput)||row.idealBottleOutput<0)return null;
    if(!row.durationSeconds)continue;
    const machines=applyProductProfile(models,product).filter(e=>e.type!=='CONVEYOR'&&e.processData?.role!=='CONVEYOR');
    const rates=machines.map(e=>e.nominalRatePerSecond*(productFlowUnit(e)==='CASES'?productPackSize(product):1));
    if(!rates.length||rates.some(r=>!Number.isFinite(r)||r<=0))return null;
    capacity+=Math.min(row.idealBottleOutput,Math.min(...rates)*row.durationSeconds);
    ideal+=row.idealBottleOutput;duration+=row.durationSeconds;
  }
  if(!(ideal>0)||Math.abs(duration-result.durationSeconds)>Math.max(.001,result.durationSeconds*1e-8))return null;
  return 100*capacity/ideal;
}

// A progress label alone is not completion evidence. Check the current model,
// requested replications, seed identities and terminal calendar/runtime exposure.
function scenarioSourceReadiness(simulation) {
  const result=simulation?.results;
  const fail=(reason,sourceStatus='UNAVAILABLE',extra={})=>({ready:false,reason,sourceStatus,...extra});
  if(!result?.summary)return fail('NO_RESULTS');
  if(result.provisional===true)return fail('INCOMPLETE_REPLICATIONS','INCOMPLETE');
  if(!(Number.isFinite(result.durationSeconds)&&result.durationSeconds>0))return fail('INVALID_RESULT_DURATION');
  if(result.replicationStatus?.state!=='COMPLETE')return fail('INCOMPLETE_REPLICATIONS','INCOMPLETE');
  if(!result.inputSignature)return fail('MISSING_INPUT_SIGNATURE');
  let provenance;try{provenance=JSON.parse(result.inputSignature);}catch(_){return fail('INVALID_INPUT_SIGNATURE');}
  if(!provenance||typeof provenance!=='object')return fail('INVALID_INPUT_SIGNATURE');

  // when the case's original generic input label is "units". Do not mistake
  // that output label for the input unit recorded in the signature.

  const metadata = scenarioStudyRecord(simulation?.whatIf?.methodology) ? simulation.whatIf.methodology : {};
  const check = evaluation?.independentCheck;
  const issues = scenarioStudySourceIssues(simulation, evaluation);
  const traceable = !issues.missingInputs.length && !issues.invalidInputs.length;
  const hypotheses = scenarioStudyHypotheses(simulation, evaluation, metadata);
  const pilots = hypotheses.filter(item => item.reportedPilot).map(item => ({ interventionId: item.id, ...item.reportedPilot }));
  const actualBase = scenarioStudyMetrics(check?.baseline), actualCandidate = scenarioStudyMetrics(check?.candidate);
  const validConfirmation = actualBase.throughput !== null && actualBase.throughput >= 0 && actualCandidate.throughput !== null &&
    actualCandidate.throughput >= actualBase.throughput && scenarioStudyNumber(check?.durationSeconds) > 0 &&
    Number.isInteger(check?.rounds) && check.rounds > 0 &&
    actualBase.oee !== null && actualBase.oee >= 0 && actualCandidate.oee !== null && actualCandidate.oee >= 0 &&
    actualCandidate.oee >= actualBase.oee - 1e-9;
  const stats = scenarioStudyPick(check?.statisticalEvidence, ['available', 'n', 'seedIds', 'confidenceLevel', 'metrics', 'reason']);
  const confirmationPlan = scenarioStudyConfirmationPlan(evaluation?.confirmationPlan);
  const rankingPlan=evaluation?.rankingPlan,finalistScreen=evaluation?.phaseAudit?.finalistScreening,ranking=evaluation?.phaseAudit?.ranking;
  const doe = evaluation?.doe;
  const fixedChanges = (Array.isArray(doe?.fixedChanges) ? doe.fixedChanges : []).slice(0, 64).map(change =>
    scenarioStudyPick(change, ['equipmentId', 'path', 'before', 'after', 'unit', 'external', 'analysisOnly', 'interventionType', 'replacementMaximumBpm', 'originTier', 'packageId', 'targetId', 'packagePaths']));
  const objective = scenarioStudyRecord(metadata.objective) ? scenarioStudyPick(metadata.objective, ['metric', 'target', 'unit', 'minimumPracticalGain', 'description']) : null;
  const objectiveMetric = objective?.metric === 'throughput' ? 'throughput' : objective?.metric === 'oee' ? 'oee' : null;
  const flowUnit = scenarioStudyFlowUnit(evaluation?.unitOfFlow || simulation?.unitOfFlow);
  const objectiveUnits = objectiveMetric === 'oee' ? ['%', 'percent'] : [flowUnit + '/min', ...(flowUnit === 'bottles' ? ['bpm'] : [])];
  const objectiveValid = objectiveMetric && scenarioStudyNumber(objective?.target) !== null && objective.target >= 0 &&
    (objectiveMetric !== 'oee' || objective.target <= 100) && objectiveUnits.includes(objective.unit) &&
    (objective.minimumPracticalGain === undefined || scenarioStudyNumber(objective.minimumPracticalGain) !== null && objective.minimumPracticalGain >= 0);
  const objectiveEvaluable = traceable && check?.passed === true && validConfirmation && objectiveValid && actualCandidate[objectiveMetric] !== null;
  const changes = scenarioStudyChanges(evaluation);
  const identity = scenarioStudyPackageIdentity(evaluation);
  const constraints = [
    'Observed equipment downtime and propagated starvation/blocking are not additive causal line losses.',
    'A simulated target does not establish the physical intervention, attainable reliability or supplier performance.',
    'DOE and independent confirmation support this model and evaluated package; they do not prove a global optimum or plant outcome.',
    'Minor/major stop classes require supplied data; general stops are not split by duration, and stop class does not establish root cause.',
    'CAPEX classification uses intervention type and scope; budget amounts and financial evaluation are outside the current technical study.',
    'Reported source references are not independently verified.'
  ];
  const confirmationStatus = !check ? 'NOT_EVALUATED' : !traceable ? 'UNTRACEABLE_EVIDENCE' : check.passed !== true ? 'NOT_REPRODUCED' :
    validConfirmation ? 'MODEL_REPRODUCED' : 'INVALID_OR_INCOMPLETE_CONFIRMATION';
  return {
    version: 1,
    analysisScope:{objective:'TECHNICAL_LINE_EFFICIENCY',capexClassificationBasis:'INTERVENTION_SCOPE',budgetAmountsUsed:false},
    source: {
      simulationId: scenarioStudyText(simulation?.id), sourceSimulationId: scenarioStudyText(evaluation?.sourceSimulationId),
      sourceSignature: scenarioStudyText(evaluation?.sourceSignature), status: traceable ? 'RECORDED' : 'INCOMPLETE_OR_MISMATCHED',
      signatureVerification: 'CALLER_MUST_VERIFY_CURRENT_SIGNATURE', missingInputs: issues.missingInputs, invalidInputs: issues.invalidInputs
    },
    evaluatedPackage: { ...identity, changeCount: changes.length, equipmentIds: [...new Set(changes.map(change => change?.equipmentId).filter(value => typeof value === 'string'))].slice(0, 64), scope: 'WHOLE_PACKAGE' },
    objective: { status: objective ? 'REPORTED' : 'NOT_DEFINED', reported: objective,
      assessment: objectiveEvaluable ? { status: 'MODEL_COMPARISON', achieved: actualCandidate[objectiveMetric], target: objective.target,
        targetMet: actualCandidate[objectiveMetric] >= objective.target,
        minimumPracticalGainMet: scenarioStudyNumber(objective.minimumPracticalGain) !== null && actualBase[objectiveMetric] !== null ? actualCandidate[objectiveMetric] - actualBase[objectiveMetric] >= objective.minimumPracticalGain : null } : { status: 'NOT_EVALUATED', reason: objective && !objectiveValid ? 'INVALID_OBJECTIVE_OR_UNIT' : 'OBJECTIVE_OR_CONFIRMATION_MISSING' } },
    baseline: { status: check?.baseline ? 'CONFIRMATION_BASELINE' : evaluation?.baseline ? 'SCREENING_BASELINE' : 'MISSING',
      metrics: check?.baseline ? actualBase : scenarioStudyMetrics(evaluation?.baseline), unitOfFlow: scenarioStudyFlowUnit(evaluation?.unitOfFlow || simulation?.unitOfFlow),
      run: scenarioStudyPick(check || evaluation?.run, ['durationSeconds', 'rounds', 'seed']) },
    diagnosis: {
      causalStatus: 'HYPOTHESES_ONLY',
      observedLosses: scenarioStudyPick(evaluation?.lossDiagnosis, ['status', 'reason', 'sourceStatus', 'provenance', 'referenceId', 'durationSeconds', 'durationBasis',
        'rounds', 'equipment', 'rankings', 'opportunities', 'stopDataQuality', 'attribution', 'interpretation']),
      capacity: scenarioStudyPick(evaluation?.capacityDiagnosis, ['reason', 'sourceStatus', 'referenceId', 'referenceBpm', 'minimumBpm', 'capacityCeilingPercent', 'limitingEquipment', 'achievedPercent', 'capacityGapPp', 'residualLossPp', 'accountingAvailable', 'interpretation']),
      reliabilitySensitivity: scenarioStudyPick(evaluation?.reliabilityTargetSearch, ['status', 'analysisOnly', 'classification', 'conditionalReliabilityGain', 'coverage', 'ranking', 'interpretation'])
    },
    hypotheses,
    evidence: {
      screening: { baseline: scenarioStudyMetrics(evaluation?.baseline), candidate: scenarioStudyMetrics(evaluation?.candidate), role: 'EXPLORATION_ONLY' },
      finalistSelection:{status:rankingPlan?'RECORDED':'NOT_RECORDED',role:'EXPLORATORY_SELECTION_NOT_CONFIRMATION',
        policy:scenarioStudyText(rankingPlan?.policy),staged:rankingPlan?.staged===true,reason:scenarioStudyText(rankingPlan?.reason),
        intermediateRun:scenarioStudyPick(finalistScreen?.run||rankingPlan?.screenRun,['durationSeconds','rounds','seed','engineId']),
        fullRun:scenarioStudyPick(ranking?.run||rankingPlan?.fullRun,['durationSeconds','rounds','seed','engineId']),
        candidatesScreened:Array.isArray(finalistScreen?.observations)?finalistScreen.observations.length:null,
        selected:scenarioStudyNumber(finalistScreen?.selected),omitted:scenarioStudyNumber(finalistScreen?.omitted),
        protectedReliabilityCandidates:scenarioStudyNumber(finalistScreen?.protectedReliabilityCandidates),
        fullHorizonFinalists:scenarioStudyNumber(ranking?.finalists)??scenarioStudyNumber(rankingPlan?.fullHorizonFinalists),
        shortScreenMayMissLateBenefits:rankingPlan?.staged===true,
        interpretation:scenarioStudyText(rankingPlan?.interpretation)||'Selection allocates simulation effort; only the full-horizon independent confirmation supports a reproduced improvement.'},
      experiment: {
        status: doe ? doe.analysis?.complete === true ? 'COMPLETE_DESIGN' : 'INCOMPLETE_DESIGN' : 'NOT_PERFORMED',
        type: scenarioStudyText(doe?.type || doe?.design?.type),
        factors: scenarioStudyCopy(doe?.factors || doe?.design?.factors || []),
        fixedChanges,
        effectScope: { conditionalOnFixedChanges: fixedChanges.length > 0,
          interpretation: 'Effects apply to the tested factor region conditional on these fixed changes and the saved baseline; they are not isolated causal shares or guarantees outside that region.' },
        combinations: scenarioStudyNumber(doe?.combinations) ?? (Array.isArray(doe?.observations) ? doe.observations.length : null),
        roundsPerCombination: scenarioStudyNumber(doe?.roundsPerCombination),
        run: doe ? scenarioStudyPick(doe.run || evaluation?.explorationRun, ['durationSeconds', 'durationMode', 'rounds', 'seed', 'engineId', 'sampleIntervalSeconds']) : {},
        observations: scenarioStudyDOEObservations(doe?.observations),
        observationsOmitted: Math.max(0, (Array.isArray(doe?.observations) ? doe.observations.length : 0) - 16),
        analysis: scenarioStudyPick(doe?.analysis, ['complete', 'reason', 'effects', 'interpretation']),
        anova: scenarioStudyPick(doe?.anova, ['complete', 'model', 'primaryInference', 'alpha', 'confidenceLevel', 'seedIds', 'replications', 'multiplicity', 'metrics', 'reason', 'interpretation']),
        replicationPlan: { status: metadata.replications ? 'REPORTED' : 'NOT_PROVIDED', reported: scenarioStudyPick(metadata.replications, ['minimum', 'maximum', 'confidenceLevel', 'relativePrecision', 'absolutePrecision']),
          actual: confirmationPlan ? { role: 'CONFIRMATION_NOT_DOE', source: 'evaluation.confirmationPlan', plan: confirmationPlan } : null }
      },
      confirmation: { status: confirmationStatus, reportedPassed: check?.passed === true,
        kind: scenarioStudyText(check?.confirmationKind || evaluation?.confirmationKind),
        baseline: actualBase, candidate: actualCandidate, run: scenarioStudyPick(check, ['durationSeconds', 'rounds', 'seed']),
        confirmationPlan,
        precision: scenarioStudyPick(check?.precision, ['targetHalfWidth', 'achievedHalfWidth', 'met', 'plannedRounds', 'requiredRounds', 'capped']),
        practicalThreshold: scenarioStudyNumber(check?.practicalThreshold), reason: scenarioStudyText(check?.reason),
        oeeGuard: scenarioStudyPick(check?.oeeGuard, ['observedMeanDelta', 'passed', 'statisticalNonInferiorityEstablished']),
        delta: { throughputPerMinute: actualBase.throughput !== null && actualCandidate.throughput !== null ? actualCandidate.throughput - actualBase.throughput : null,
          oeePercentagePoints: actualBase.oee !== null && actualCandidate.oee !== null ? actualCandidate.oee - actualBase.oee : null },
        statisticalEvidence: stats,
        interpretation: 'Independent simulation evidence; descriptive reproduction is distinct from statistical inference and plant validation.' }
    },
    feasibility: { status: 'REQUIRES_ENGINEERING_REVIEW', verified: false,
      exploratoryTargets: hypotheses.some(item => ['EXPLORATORY_SENSITIVITY','EXPLORATORY_REPLACEMENT'].includes(item.classification)),
      warnings: scenarioStudyCopy(evaluation?.warnings || []),
      reportedAcknowledgement: evaluation?.engineeringReviewAcknowledged === true,
      interpretation: 'Parameter checks or reported acknowledgement do not establish engineering feasibility, installation scope or target achievability.' },
    economics: {status:'NOT_EVALUATED',reason:'OUT_OF_SCOPE',scope:'TECHNICAL_SCENARIO_ANALYSIS',monetaryInputsRequired:false,
      usedForClassification:false,usedForRanking:false,missingInputs:[],invalidInputs:[],plantValidated:false,
      interpretation:'This study compares technical line performance and classifies the intervention scope. No budget amount is requested or used. Financial estimates require a separate explicit API call.'},
    plantValidation: { status: pilots.length ? 'REPORTED_NOT_VERIFIED' : 'NOT_EVALUATED', verified: false, reports: pilots },
    limitations: constraints
  };
}


function simulationWorkerMain(){
self.onmessage=async function(event){
    const task=event.data;
    try {
      let lastProgressAt=0;
      const response=await simulateLineAsync(task.input,{detail:task.detail,summaryOnly:task.summaryOnly,yieldBetweenChunks:false,onPartial:task.stream?result=>self.postMessage({type:'partial',id:task.id,result}):undefined,progress:(value,detail)=>{const now=Date.now();if(value===0||value===1||now-lastProgressAt>=50){lastProgressAt=now;self.postMessage({type:'progress',id:task.id,value,detail});}}});
      self.postMessage({type:'result',id:task.id,response});
    }catch(error){self.postMessage({type:'error',id:task.id,message:error.message});}
  };
self.postMessage({type:'ready'});
}

const simPyRuntime=createSimPyBrowserEngine(window,{"simpy/__init__.py":"\"\"\"\nThe ``simpy`` module aggregates SimPy's most used components into a single\nnamespace. This is purely for convenience. You can of course also access\neverything (and more!) via their actual submodules.\n\nThe following tables list all the available components in this module.\n\n{toc}\n\n\"\"\"\n\nfrom __future__ import annotations\n\nimport importlib.metadata\nfrom typing import Tuple, Type\n\nfrom simpy.core import Environment\nfrom simpy.events import AllOf, AnyOf, Event, Process, Timeout\nfrom simpy.exceptions import Interrupt, SimPyException\nfrom simpy.resources.container import Container\nfrom simpy.resources.resource import PreemptiveResource, PriorityResource, Resource\nfrom simpy.resources.store import FilterStore, PriorityItem, PriorityStore, Store\nfrom simpy.rt import RealtimeEnvironment\n\n__all__ = [\n    'AllOf',\n    'AnyOf',\n    'Container',\n    'Environment',\n    'Event',\n    'FilterStore',\n    'Interrupt',\n    'PreemptiveResource',\n    'PriorityItem',\n    'PriorityResource',\n    'PriorityStore',\n    'Process',\n    'RealtimeEnvironment',\n    'Resource',\n    'SimPyException',\n    'Store',\n    'Timeout',\n]\n\n\ndef _compile_toc(\n    entries: Tuple[Tuple[str, Tuple[Type, ...]], ...],\n    section_marker: str = '=',\n) -> str:\n    \"\"\"Compiles a list of sections with objects into sphinx formatted\n    autosummary directives.\"\"\"\n    toc = ''\n    for section, objs in entries:\n        toc += '\\n\\n'\n        toc += f'{section}\\n'\n        toc += f'{section_marker * len(section)}\\n\\n'\n        toc += '.. autosummary::\\n\\n'\n        for obj in objs:\n            toc += f'    ~{obj.__module__}.{obj.__name__}\\n'\n    return toc\n\n\n_toc = (\n    (\n        'Environments',\n        (\n            Environment,\n            RealtimeEnvironment,\n        ),\n    ),\n    (\n        'Events',\n        (\n            Event,\n            Timeout,\n            Process,\n            AllOf,\n            AnyOf,\n            Interrupt,\n        ),\n    ),\n    (\n        'Resources',\n        (\n            Resource,\n            PriorityResource,\n            PreemptiveResource,\n            Container,\n            Store,\n            PriorityItem,\n            PriorityStore,\n            FilterStore,\n        ),\n    ),\n    ('Exceptions', (SimPyException, Interrupt)),\n)\n\n# Use the _toc to keep the documentation and the implementation in sync.\nif __doc__:\n    __doc__ = __doc__.format(toc=_compile_toc(_toc))\n    assert set(__all__) == {obj.__name__ for _, objs in _toc for obj in objs}\n\ntry:\n    __version__ = importlib.metadata.version('simpy')\nexcept importlib.metadata.PackageNotFoundError:\n    # package is not installed\n    pass\n","simpy/core.py":"\"\"\"\nCore components for event-discrete simulation environments.\n\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom heapq import heappop, heappush\nfrom itertools import count\nfrom types import MethodType\nfrom typing import (\n    TYPE_CHECKING,\n    Any,\n    Generic,\n    Iterable,\n    List,\n    Optional,\n    Tuple,\n    Type,\n    TypeVar,\n    Union,\n)\n\nfrom simpy.events import (\n    NORMAL,\n    URGENT,\n    AllOf,\n    AnyOf,\n    Event,\n    EventPriority,\n    Process,\n    ProcessGenerator,\n    Timeout,\n)\n\nInfinity: float = float('inf')  #: Convenience alias for infinity\n\nT = TypeVar('T')\n\n\nclass BoundClass(Generic[T]):\n    \"\"\"Allows classes to behave like methods.\n\n    The ``__get__()`` descriptor is basically identical to\n    ``function.__get__()`` and binds the first argument of the ``cls`` to the\n    descriptor instance.\n\n    \"\"\"\n\n    def __init__(self, cls: Type[T]):\n        self.cls = cls\n\n    def __get__(\n        self,\n        instance: Optional[BoundClass],\n        owner: Optional[Type[BoundClass]] = None,\n    ) -> Union[Type[T], MethodType]:\n        if instance is None:\n            return self.cls\n        return MethodType(self.cls, instance)\n\n    @staticmethod\n    def bind_early(instance: object) -> None:\n        \"\"\"Bind all :class:`BoundClass` attributes of the *instance's* class\n        to the instance itself to increase performance.\"\"\"\n        for name, obj in instance.__class__.__dict__.items():\n            if type(obj) is BoundClass:\n                bound_class = getattr(instance, name)\n                setattr(instance, name, bound_class)\n\n\nclass EmptySchedule(Exception):\n    \"\"\"Thrown by an :class:`Environment` if there are no further events to be\n    processed.\"\"\"\n\n\nclass StopSimulation(Exception):\n    \"\"\"Indicates that the simulation should stop now.\"\"\"\n\n    @classmethod\n    def callback(cls, event: Event) -> None:\n        \"\"\"Used as callback in :meth:`Environment.run()` to stop the simulation\n        when the *until* event occurred.\"\"\"\n        if event.ok:\n            raise cls(event.value)\n        else:\n            raise event._value\n\n\nSimTime = Union[int, float]\n\n\nclass Environment:\n    \"\"\"Execution environment for an event-based simulation. The passing of time\n    is simulated by stepping from event to event.\n\n    You can provide an *initial_time* for the environment. By default, it\n    starts at ``0``.\n\n    This class also provides aliases for common event types, for example\n    :attr:`process`, :attr:`timeout` and :attr:`event`.\n\n    \"\"\"\n\n    def __init__(self, initial_time: SimTime = 0):\n        self._now = initial_time\n        self._queue: List[\n            Tuple[SimTime, EventPriority, int, Event]\n        ] = []  # The list of all currently scheduled events.\n        self._eid = count()  # Counter for event IDs\n        self._active_proc: Optional[Process] = None\n\n        # Bind all BoundClass instances to \"self\" to improve performance.\n        BoundClass.bind_early(self)\n\n    @property\n    def now(self) -> SimTime:\n        \"\"\"The current simulation time.\"\"\"\n        return self._now\n\n    @property\n    def active_process(self) -> Optional[Process]:\n        \"\"\"The currently active process of the environment.\"\"\"\n        return self._active_proc\n\n    if TYPE_CHECKING:\n        # This block is only evaluated when type checking with, e.g. Mypy.\n        # These are the effective types of the methods created with BoundClass\n        # magic and are thus a useful reference for SimPy users as well as for\n        # static type checking.\n\n        def process(self, generator: ProcessGenerator) -> Process:\n            \"\"\"Create a new :class:`~simpy.events.Process` instance for\n            *generator*.\"\"\"\n            return Process(self, generator)\n\n        def timeout(self, delay: SimTime = 0, value: Optional[Any] = None) -> Timeout:\n            \"\"\"Return a new :class:`~simpy.events.Timeout` event with a *delay*\n            and, optionally, a *value*.\"\"\"\n            return Timeout(self, delay, value)\n\n        def event(self) -> Event:\n            \"\"\"Return a new :class:`~simpy.events.Event` instance.\n\n            Yielding this event suspends a process until another process\n            triggers the event.\n            \"\"\"\n            return Event(self)\n\n        def all_of(self, events: Iterable[Event]) -> AllOf:\n            \"\"\"Return a :class:`~simpy.events.AllOf` condition for *events*.\"\"\"\n            return AllOf(self, events)\n\n        def any_of(self, events: Iterable[Event]) -> AnyOf:\n            \"\"\"Return a :class:`~simpy.events.AnyOf` condition for *events*.\"\"\"\n            return AnyOf(self, events)\n\n    else:\n        process = BoundClass(Process)\n        timeout = BoundClass(Timeout)\n        event = BoundClass(Event)\n        all_of = BoundClass(AllOf)\n        any_of = BoundClass(AnyOf)\n\n    def schedule(\n        self,\n        event: Event,\n        priority: EventPriority = NORMAL,\n        delay: SimTime = 0,\n    ) -> None:\n        \"\"\"Schedule an *event* with a given *priority* and a *delay*.\"\"\"\n        heappush(self._queue, (self._now + delay, priority, next(self._eid), event))\n\n    def peek(self) -> SimTime:\n        \"\"\"Get the time of the next scheduled event. Return\n        :data:`~simpy.core.Infinity` if there is no further event.\"\"\"\n        try:\n            return self._queue[0][0]\n        except IndexError:\n            return Infinity\n\n    def step(self) -> None:\n        \"\"\"Process the next event.\n\n        Raise an :exc:`EmptySchedule` if no further events are available.\n\n        \"\"\"\n        try:\n            self._now, _, _, event = heappop(self._queue)\n        except IndexError:\n            raise EmptySchedule from None\n\n        # Process callbacks of the event. Set the events callbacks to None\n        # immediately to prevent concurrent modifications.\n        callbacks, event.callbacks = event.callbacks, None  # type: ignore\n        try:\n            for callback in callbacks:\n                callback(event)\n        except StopSimulation:\n            # Reassociate any remaining callbacks with the event and reschedule\n            # the event to be processed when the simulation resumes.\n            event.callbacks = callbacks[callbacks.index(callback) + 1 :]\n            self.schedule(event, EventPriority(-1))\n            raise\n\n        if not event._ok and not hasattr(event, '_defused'):\n            # The event has failed and has not been defused. Crash the\n            # environment.\n            # Create a copy of the failure exception with a new traceback.\n            exc = type(event._value)(*event._value.args)\n            exc.__cause__ = event._value\n            raise exc\n\n    def run(self, until: Optional[Union[SimTime, Event]] = None) -> Optional[Any]:\n        \"\"\"Executes :meth:`step()` until the given criterion *until* is met.\n\n        - If it is ``None`` (which is the default), this method will return\n          when there are no further events to be processed.\n\n        - If it is an :class:`~simpy.events.Event`, the method will continue\n          stepping until this event has been triggered and will return its\n          value.  Raises a :exc:`RuntimeError` if there are no further events\n          to be processed and the *until* event was not triggered.\n\n        - If it is a number, the method will continue stepping\n          until the environment's time reaches *until*.\n\n        \"\"\"\n        if until is not None:\n            if not isinstance(until, Event):\n                # Assume that *until* is a number if it is not None and\n                # not an event.  Create a Timeout(until) in this case.\n                at: SimTime = until if isinstance(until, int) else float(until)\n\n                if at \u003c= self.now:\n                    raise ValueError(\n                        f'until ({at}) must be greater than the current simulation time'\n                    )\n\n                # Schedule the event before all regular timeouts.\n                until = Event(self)\n                until._ok = True\n                until._value = None\n                self.schedule(until, URGENT, at - self.now)\n\n            elif until.callbacks is None:\n                # Until event has already been processed.\n                return until.value\n\n            until.callbacks.append(StopSimulation.callback)\n\n        try:\n            while True:\n                self.step()\n        except StopSimulation as exc:\n            return exc.args[0]  # == until.value\n        except EmptySchedule:\n            if until is not None:\n                assert not until.triggered\n                raise RuntimeError(\n                    f'No scheduled events left but \"until\" event was not '\n                    f'triggered: {until}'\n                ) from None\n        return None\n","simpy/events.py":"\"\"\"\nThis module contains the basic event types used in SimPy.\n\nThe base class for all events is :class:`Event`. Though it can be directly\nused, there are several specialized subclasses of it.\n\n.. autosummary::\n\n    ~simpy.events.Event\n    ~simpy.events.Timeout\n    ~simpy.events.Process\n    ~simpy.events.AnyOf\n    ~simpy.events.AllOf\n\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import (\n    TYPE_CHECKING,\n    Any,\n    Callable,\n    Dict,\n    Generator,\n    Iterable,\n    Iterator,\n    List,\n    NewType,\n    Optional,\n    Tuple,\n    TypeVar,\n)\n\nfrom simpy.exceptions import Interrupt\n\nif TYPE_CHECKING:\n    from types import FrameType\n\n    from simpy.core import Environment, SimTime\n\nPENDING: object = object()\n\"\"\"Unique object to identify pending values of events.\"\"\"\n\nEventPriority = NewType('EventPriority', int)\n\nURGENT: EventPriority = EventPriority(0)\n\"\"\"Priority of interrupts and process initialization events.\"\"\"\nNORMAL: EventPriority = EventPriority(1)\n\"\"\"Default priority used by events.\"\"\"\n\n\nclass Event:\n    \"\"\"An event that may happen at some point in time.\n\n    An event\n\n    - may happen (:attr:`triggered` is ``False``),\n    - is going to happen (:attr:`triggered` is ``True``) or\n    - has happened (:attr:`processed` is ``True``).\n\n    Every event is bound to an environment *env* and is initially not\n    triggered. Events are scheduled for processing by the environment after\n    they are triggered by either :meth:`succeed`, :meth:`fail` or\n    :meth:`trigger`. These methods also set the *ok* flag and the *value* of\n    the event.\n\n    An event has a list of :attr:`callbacks`. A callback can be any callable.\n    Once an event gets processed, all callbacks will be invoked with the event\n    as the single argument. Callbacks can check if the event was successful by\n    examining *ok* and do further processing with the *value* it has produced.\n\n    Failed events are never silently ignored and will raise an exception upon\n    being processed. If a callback handles an exception, it must set\n    :attr:`defused` to ``True`` to prevent this.\n\n    This class also implements ``__and__()`` (``&``) and ``__or__()`` (``|``).\n    If you concatenate two events using one of these operators,\n    a :class:`Condition` event is generated that lets you wait for both or one\n    of them.\n\n    \"\"\"\n\n    _ok: bool\n    _defused: bool\n    _value: Any = PENDING\n\n    def __init__(self, env: Environment):\n        self.env = env\n        \"\"\"The :class:`~simpy.core.Environment` the event lives in.\"\"\"\n        self.callbacks: EventCallbacks = []\n        \"\"\"List of functions that are called when the event is processed.\"\"\"\n\n    def __repr__(self) -> str:\n        \"\"\"Return the description of the event (see :meth:`_desc`) with the id\n        of the event.\"\"\"\n        return f'\u003c{self._desc()} object at {id(self):#x}>'\n\n    def _desc(self) -> str:\n        \"\"\"Return a string *Event()*.\"\"\"\n        return f'{self.__class__.__name__}()'\n\n    @property\n    def triggered(self) -> bool:\n        \"\"\"Becomes ``True`` if the event has been triggered and its callbacks\n        are about to be invoked.\"\"\"\n        return self._value is not PENDING\n\n    @property\n    def processed(self) -> bool:\n        \"\"\"Becomes ``True`` if the event has been processed (e.g., its\n        callbacks have been invoked).\"\"\"\n        return self.callbacks is None\n\n    @property\n    def ok(self) -> bool:\n        \"\"\"Becomes ``True`` when the event has been triggered successfully.\n\n        A \"successful\" event is one triggered with :meth:`succeed()`.\n\n        :raises AttributeError: if accessed before the event is triggered.\n\n        \"\"\"\n        return self._ok\n\n    @property\n    def defused(self) -> bool:\n        \"\"\"Becomes ``True`` when the failed event's exception is \"defused\".\n\n        When an event fails (i.e. with :meth:`fail()`), the failed event's\n        `value` is an exception that will be re-raised when the\n        :class:`~simpy.core.Environment` processes the event (i.e. in\n        :meth:`~simpy.core.Environment.step()`).\n\n        It is also possible for the failed event's exception to be defused by\n        setting :attr:`defused` to ``True`` from an event callback. Doing so\n        prevents the event's exception from being re-raised when the event is\n        processed by the :class:`~simpy.core.Environment`.\n\n        \"\"\"\n        return hasattr(self, '_defused')\n\n    @defused.setter\n    def defused(self, value: bool) -> None:\n        self._defused = True\n\n    @property\n    def value(self) -> Optional[Any]:\n        \"\"\"The value of the event if it is available.\n\n        The value is available when the event has been triggered.\n\n        Raises :exc:`AttributeError` if the value is not yet available.\n\n        \"\"\"\n        if self._value is PENDING:\n            raise AttributeError(f'Value of {self} is not yet available')\n        return self._value\n\n    def trigger(self, event: Event) -> None:\n        \"\"\"Trigger the event with the state and value of the provided *event*.\n        Return *self* (this event instance).\n\n        This method can be used directly as a callback function to trigger\n        chain reactions.\n\n        \"\"\"\n        self._ok = event._ok\n        self._value = event._value\n        self.env.schedule(self)\n\n    def succeed(self, value: Optional[Any] = None) -> Event:\n        \"\"\"Set the event's value, mark it as successful and schedule it for\n        processing by the environment. Returns the event instance.\n\n        Raises :exc:`RuntimeError` if this event has already been triggered.\n\n        \"\"\"\n        if self._value is not PENDING:\n            raise RuntimeError(f'{self} has already been triggered')\n\n        self._ok = True\n        self._value = value\n        self.env.schedule(self)\n        return self\n\n    def fail(self, exception: Exception) -> Event:\n        \"\"\"Set *exception* as the events value, mark it as failed and schedule\n        it for processing by the environment. Returns the event instance.\n\n        Raises :exc:`TypeError` if *exception* is not an :exc:`Exception`.\n\n        Raises :exc:`RuntimeError` if this event has already been triggered.\n\n        \"\"\"\n        if self._value is not PENDING:\n            raise RuntimeError(f'{self} has already been triggered')\n        if not isinstance(exception, BaseException):\n            raise TypeError(f'{exception} is not an exception.')\n        self._ok = False\n        self._value = exception\n        self.env.schedule(self)\n        return self\n\n    def __and__(self, other: Event) -> Condition:\n        \"\"\"Return a :class:`~simpy.events.Condition` that will be triggered if\n        both, this event and *other*, have been processed.\"\"\"\n        return Condition(self.env, Condition.all_events, [self, other])\n\n    def __or__(self, other: Event) -> Condition:\n        \"\"\"Return a :class:`~simpy.events.Condition` that will be triggered if\n        either this event or *other* have been processed (or even both, if they\n        happened concurrently).\"\"\"\n        return Condition(self.env, Condition.any_events, [self, other])\n\n\nEventType = TypeVar('EventType', bound=Event)\nEventCallback = Callable[[EventType], None]\nEventCallbacks = List[EventCallback]\n\n\nclass Timeout(Event):\n    \"\"\"A :class:`~simpy.events.Event` that gets processed after a *delay* has\n    passed.\n\n    This event is automatically triggered when it is created.\n\n\n    \"\"\"\n\n    def __init__(\n        self,\n        env: Environment,\n        delay: SimTime,\n        value: Optional[Any] = None,\n    ):\n        if delay \u003c 0:\n            raise ValueError(f'Negative delay {delay}')\n        # NOTE: The following initialization code is inlined from\n        # Event.__init__() for performance reasons.\n        self.env = env\n        self.callbacks: EventCallbacks = []\n        self._value = value\n        self._delay = delay\n        self._ok = True\n        env.schedule(self, NORMAL, delay)\n\n    def _desc(self) -> str:\n        \"\"\"Return a string *Timeout(delay[, value=value])*.\"\"\"\n        value_str = '' if self._value is None else f', value={self.value}'\n        return f'{self.__class__.__name__}({self._delay}{value_str})'\n\n\nclass Initialize(Event):\n    \"\"\"Initializes a process. Only used internally by :class:`Process`.\n\n    This event is automatically triggered when it is created.\n\n    \"\"\"\n\n    def __init__(self, env: Environment, process: Process):\n        # NOTE: The following initialization code is inlined from\n        # Event.__init__() for performance reasons.\n        self.env = env\n        self.callbacks: EventCallbacks = [process._resume]\n        self._value: Any = None\n\n        # The initialization events needs to be scheduled as urgent so that it\n        # will be handled before interrupts. Otherwise, a process whose\n        # generator has not yet been started could be interrupted.\n        self._ok = True\n        env.schedule(self, URGENT)\n\n\nclass Interruption(Event):\n    \"\"\"Immediately schedules an :class:`~simpy.exceptions.Interrupt` exception\n    with the given *cause* to be thrown into *process*.\n\n    This event is automatically triggered when it is created.\n\n    \"\"\"\n\n    def __init__(self, process: Process, cause: Optional[Any]):\n        # NOTE: The following initialization code is inlined from\n        # Event.__init__() for performance reasons.\n        self.env = process.env\n        self.callbacks: EventCallbacks = [self._interrupt]\n        self._value = Interrupt(cause)\n        self._ok = False\n        self._defused = True\n\n        if process._value is not PENDING:\n            raise RuntimeError(f'{process} has terminated and cannot be interrupted.')\n\n        if process is self.env.active_process:\n            raise RuntimeError('A process is not allowed to interrupt itself.')\n\n        self.process = process\n        self.env.schedule(self, URGENT)\n\n    def _interrupt(self, event: Event) -> None:\n        # Ignore dead processes. Multiple concurrently scheduled interrupts\n        # cause this situation. If the process dies while handling the first\n        # one, the remaining interrupts must be ignored.\n        if self.process._value is not PENDING:\n            return\n\n        # A process never expects an interrupt and is always waiting for a\n        # target event. Remove the process from the callbacks of the target.\n        self.process._target.callbacks.remove(self.process._resume)\n\n        self.process._resume(self)\n\n\nProcessGenerator = Generator[Event, Any, Any]\n\n\nclass Process(Event):\n    \"\"\"Process an event yielding generator.\n\n    A generator (also known as a coroutine) can suspend its execution by\n    yielding an event. ``Process`` will take care of resuming the generator\n    with the value of that event once it has happened. The exception of failed\n    events is thrown into the generator.\n\n    ``Process`` itself is an event, too. It is triggered, once the generator\n    returns or raises an exception. The value of the process is the return\n    value of the generator or the exception, respectively.\n\n    Processes can be interrupted during their execution by :meth:`interrupt`.\n\n    \"\"\"\n\n    def __init__(self, env: Environment, generator: ProcessGenerator):\n        if not hasattr(generator, 'throw'):\n            # Implementation note: Python implementations differ in the\n            # generator types they provide. Cython adds its own generator type\n            # in addition to the CPython type, which renders a type check\n            # impractical. To work around this issue, we check for attribute\n            # name instead of type and optimistically assume that all objects\n            # with a ``throw`` attribute are generators.\n            # Remove this workaround if it causes issues in production!\n            raise ValueError(f'{generator} is not a generator.')\n\n        # NOTE: The following initialization code is inlined from\n        # Event.__init__() for performance reasons.\n        self.env = env\n        self.callbacks: EventCallbacks = []\n\n        self._generator = generator\n\n        # Schedule the start of the execution of the process.\n        self._target: Event = Initialize(env, self)\n\n    def _desc(self) -> str:\n        \"\"\"Return a string *Process(process_func_name)*.\"\"\"\n        return f'{self.__class__.__name__}({self.name})'\n\n    @property\n    def target(self) -> Event:\n        \"\"\"The event that the process is currently waiting for.\n\n        Returns ``None`` if the process is dead, or it is currently being\n        interrupted.\n\n        \"\"\"\n        return self._target\n\n    @property\n    def name(self) -> str:\n        \"\"\"Name of the function used to start the process.\"\"\"\n        return self._generator.__name__  # type: ignore\n\n    @property\n    def is_alive(self) -> bool:\n        \"\"\"``True`` until the process generator exits.\"\"\"\n        return self._value is PENDING\n\n    def interrupt(self, cause: Optional[Any] = None) -> None:\n        \"\"\"Interrupt this process optionally providing a *cause*.\n\n        A process cannot be interrupted if it already terminated. A process can\n        also not interrupt itself. Raise a :exc:`RuntimeError` in these\n        cases.\n\n        \"\"\"\n        Interruption(self, cause)\n\n    def _resume(self, event: Event) -> None:\n        \"\"\"Resumes the execution of the process with the value of *event*. If\n        the process generator exits, the process itself will get triggered with\n        the return value or the exception of the generator.\"\"\"\n        # Mark the current process as active.\n        self.env._active_proc = self\n\n        while True:\n            # Get next event from process\n            try:\n                if event._ok:\n                    event = self._generator.send(event._value)\n                else:\n                    # The process has no choice but to handle the failed event\n                    # (or fail itself).\n                    event._defused = True\n\n                    # Create an exclusive copy of the exception for this\n                    # process to prevent traceback modifications by other\n                    # processes.\n                    exc = type(event._value)(*event._value.args)\n                    exc.__cause__ = event._value\n                    event = self._generator.throw(exc)\n            except StopIteration as e:\n                # Process has terminated.\n                event = None  # type: ignore\n                self._ok = True\n                self._value = e.args[0] if len(e.args) else None\n                self.env.schedule(self)\n                break\n            except BaseException as e:\n                # Process has failed.\n                event = None  # type: ignore\n                self._ok = False\n                # Strip the frame of this function from the traceback as it\n                # does not add any useful information.\n                e.__traceback__ = e.__traceback__.tb_next  # type: ignore\n                self._value = e\n                self.env.schedule(self)\n                break\n\n            # Process returned another event to wait upon.\n            try:\n                # Be optimistic and blindly access the callbacks attribute.\n                if event.callbacks is not None:\n                    # The event has not yet been triggered. Register callback\n                    # to resume the process if that happens.\n                    event.callbacks.append(self._resume)\n                    break\n            except AttributeError:\n                # Our optimism didn't work out, figure out what went wrong and\n                # inform the user.\n                if hasattr(event, 'callbacks'):\n                    raise\n\n                msg = f'Invalid yield value \"{event}\"'\n                descr = _describe_frame(self._generator.gi_frame)  # type: ignore[attr-defined]\n                raise RuntimeError(f'\\n{descr}{msg}') from None\n\n        self._target = event\n        self.env._active_proc = None\n\n\nclass ConditionValue:\n    \"\"\"Result of a :class:`~simpy.events.Condition`. It supports convenient\n    dict-like access to the triggered events and their values. The events are\n    ordered by their occurrences in the condition.\"\"\"\n\n    def __init__(self) -> None:\n        self.events: List[Event] = []\n\n    def __getitem__(self, key: Event) -> Any:\n        if key not in self.events:\n            raise KeyError(str(key))\n\n        return key._value\n\n    def __contains__(self, key: Event) -> bool:\n        return key in self.events\n\n    def __eq__(self, other: object) -> bool:\n        if isinstance(other, ConditionValue):\n            return self.events == other.events\n        elif isinstance(other, dict):\n            return self.todict() == other\n        else:\n            return NotImplemented\n\n    __hash__ = None  # type: ignore[assignment]\n\n    def __repr__(self) -> str:\n        return f'\u003cConditionValue {self.todict()}>'\n\n    def __iter__(self) -> Iterator[Event]:\n        return self.keys()\n\n    def keys(self) -> Iterator[Event]:\n        return (event for event in self.events)\n\n    def values(self) -> Iterator[Any]:\n        return (event._value for event in self.events)\n\n    def items(self) -> Iterator[Tuple[Event, Any]]:\n        return ((event, event._value) for event in self.events)\n\n    def todict(self) -> Dict[Event, Any]:\n        return {event: event._value for event in self.events}\n\n\nclass Condition(Event):\n    \"\"\"An event that gets triggered once the condition function *evaluate*\n    returns ``True`` on the given list of *events*.\n\n    The value of the condition event is an instance of :class:`ConditionValue`\n    which allows convenient access to the input events and their values. The\n    :class:`ConditionValue` will only contain entries for those events that\n    occurred before the condition is processed.\n\n    If one of the events fails, the condition also fails and forwards the\n    exception of the failing event.\n\n    The *evaluate* function receives the list of target events and the number\n    of processed events in this list: ``evaluate(events, processed_count)``. If\n    it returns ``True``, the condition is triggered. The\n    :func:`Condition.all_events()` and :func:`Condition.any_events()` functions\n    are used to implement *and* (``&``) and *or* (``|``) for events.\n\n    Condition events can be nested.\n\n    \"\"\"\n\n    def __init__(\n        self,\n        env: Environment,\n        evaluate: Callable[[Tuple[Event, ...], int], bool],\n        events: Iterable[Event],\n    ):\n        super().__init__(env)\n        self._evaluate = evaluate\n        self._events = tuple(events)\n        self._count = 0\n\n        if not self._events:\n            # Immediately succeed if no events are provided.\n            self.succeed(ConditionValue())\n            return\n\n        # Check if events belong to the same environment.\n        for event in self._events:\n            if self.env != event.env:\n                raise ValueError(\n                    'It is not allowed to mix events from different environments'\n                )\n\n        # Check if the condition is met for each processed event. Attach\n        # _check() as a callback otherwise.\n        for event in self._events:\n            if event.callbacks is None:\n                self._check(event)\n            else:\n                event.callbacks.append(self._check)\n\n        # Register a callback which will build the value of this condition\n        # after it has been triggered.\n        assert isinstance(self.callbacks, list)\n        self.callbacks.append(self._build_value)\n\n    def _desc(self) -> str:\n        \"\"\"Return a string *Condition(evaluate, [events])*.\"\"\"\n        return f'{self.__class__.__name__}({self._evaluate.__name__}, {self._events})'\n\n    def _populate_value(self, value: ConditionValue) -> None:\n        \"\"\"Populate the *value* by recursively visiting all nested\n        conditions.\"\"\"\n\n        for event in self._events:\n            if isinstance(event, Condition):\n                event._populate_value(value)\n            elif event.callbacks is None:\n                value.events.append(event)\n\n    def _build_value(self, event: Event) -> None:\n        \"\"\"Build the value of this condition.\"\"\"\n        self._remove_check_callbacks()\n        if event._ok:\n            self._value = ConditionValue()\n            self._populate_value(self._value)\n\n    def _remove_check_callbacks(self) -> None:\n        \"\"\"Remove _check() callbacks from events recursively.\n\n        Once the condition has triggered, the condition's events no longer need\n        to have _check() callbacks. Removing the _check() callbacks is\n        important to break circular references between the condition and\n        untriggered events.\n\n        \"\"\"\n        for event in self._events:\n            if event.callbacks and self._check in event.callbacks:\n                event.callbacks.remove(self._check)\n            if isinstance(event, Condition):\n                event._remove_check_callbacks()\n\n    def _check(self, event: Event) -> None:\n        \"\"\"Check if the condition was already met and schedule the *event* if\n        so.\"\"\"\n        if self._value is not PENDING:\n            return\n\n        self._count += 1\n\n        if not event._ok:\n            # Abort if the event has failed.\n            event._defused = True\n            self.fail(event._value)\n        elif self._evaluate(self._events, self._count):\n            # The condition has been met. The _build_value() callback will\n            # populate the ConditionValue once this condition is processed.\n            self.succeed()\n\n    @staticmethod\n    def all_events(events: Tuple[Event, ...], count: int) -> bool:\n        \"\"\"An evaluation function that returns ``True`` if all *events* have\n        been triggered.\"\"\"\n        return len(events) == count\n\n    @staticmethod\n    def any_events(events: Tuple[Event, ...], count: int) -> bool:\n        \"\"\"An evaluation function that returns ``True`` if at least one of\n        *events* has been triggered.\"\"\"\n        return count > 0 or len(events) == 0\n\n\nclass AllOf(Condition):\n    \"\"\"A :class:`~simpy.events.Condition` event that is triggered if all of\n    a list of *events* have been successfully triggered. Fails immediately if\n    any of *events* failed.\n\n    \"\"\"\n\n    def __init__(self, env: Environment, events: Iterable[Event]):\n        super().__init__(env, Condition.all_events, events)\n\n\nclass AnyOf(Condition):\n    \"\"\"A :class:`~simpy.events.Condition` event that is triggered if any of\n    a list of *events* has been successfully triggered. Fails immediately if\n    any of *events* failed.\n\n    \"\"\"\n\n    def __init__(self, env: Environment, events: Iterable[Event]):\n        super().__init__(env, Condition.any_events, events)\n\n\ndef _describe_frame(frame: FrameType) -> str:\n    \"\"\"Print filename, line number and function name of a stack frame.\"\"\"\n    filename, name = frame.f_code.co_filename, frame.f_code.co_name\n    lineno = frame.f_lineno\n\n    with open(filename) as f:\n        for no, line in enumerate(f):\n            if no + 1 == lineno:\n                return (\n                    f'  File \"{filename}\", line {lineno}, in {name}\\n'\n                    f'    {line.strip()}\\n'\n                )\n        return f'  File \"{filename}\", line {lineno}, in {name}\\n'\n","simpy/exceptions.py":"\"\"\"\nSimPy specific exceptions.\n\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import Any, Optional\n\n\nclass SimPyException(Exception):\n    \"\"\"Base class for all SimPy specific exceptions.\"\"\"\n\n\nclass Interrupt(SimPyException):\n    \"\"\"Exception thrown into a process if it is interrupted (see\n    :func:`~simpy.events.Process.interrupt()`).\n\n    :attr:`cause` provides the reason for the interrupt, if any.\n\n    If a process is interrupted concurrently, all interrupts will be thrown\n    into the process in the same order as they occurred.\n\n\n    \"\"\"\n\n    def __init__(self, cause: Optional[Any]):\n        super().__init__(cause)\n\n    def __str__(self) -> str:\n        return f'{self.__class__.__name__}({self.cause!r})'\n\n    @property\n    def cause(self) -> Optional[Any]:\n        \"\"\"The cause of the interrupt or ``None`` if no cause was provided.\"\"\"\n        return self.args[0]\n","simpy/py.typed":"","simpy/rt.py":"\"\"\"Execution environment for events that synchronizes passing of time\nwith the real-time (aka *wall-clock time*).\n\n\"\"\"\n\nfrom time import monotonic, sleep\n\nfrom simpy.core import EmptySchedule, Environment, Infinity, SimTime\n\n\nclass RealtimeEnvironment(Environment):\n    \"\"\"Execution environment for an event-based simulation which is\n    synchronized with the real-time (also known as wall-clock time). A time\n    step will take *factor* seconds of real time (one second by default).\n    A step from ``0`` to ``3`` with a ``factor=0.5`` will, for example, take at\n    least\n    1.5 seconds.\n\n    The :meth:`step()` method will raise a :exc:`RuntimeError` if a time step\n    took too long to compute. This behaviour can be disabled by setting\n    *strict* to ``False``.\n\n    \"\"\"\n\n    def __init__(\n        self,\n        initial_time: SimTime = 0,\n        factor: float = 1.0,\n        strict: bool = True,\n    ):\n        Environment.__init__(self, initial_time)\n\n        self.env_start = initial_time\n        self.real_start = monotonic()\n        self._factor = factor\n        self._strict = strict\n\n    @property\n    def factor(self) -> float:\n        \"\"\"Scaling factor of the real-time.\"\"\"\n        return self._factor\n\n    @property\n    def strict(self) -> bool:\n        \"\"\"Running mode of the environment. :meth:`step()` will raise a\n        :exc:`RuntimeError` if this is set to ``True`` and the processing of\n        events takes too long.\"\"\"\n        return self._strict\n\n    def sync(self) -> None:\n        \"\"\"Synchronize the internal time with the current wall-clock time.\n\n        This can be useful to prevent :meth:`step()` from raising an error if\n        a lot of time passes between creating the RealtimeEnvironment and\n        calling :meth:`run()` or :meth:`step()`.\n\n        \"\"\"\n        self.real_start = monotonic()\n\n    def step(self) -> None:\n        \"\"\"Process the next event after enough real-time has passed for the\n        event to happen.\n\n        The delay is scaled according to the real-time :attr:`factor`. With\n        :attr:`strict` mode enabled, a :exc:`RuntimeError` will be raised, if\n        the event is processed too slowly.\n\n        \"\"\"\n        evt_time = self.peek()\n\n        if evt_time is Infinity:\n            raise EmptySchedule\n\n        real_time = self.real_start + (evt_time - self.env_start) * self.factor\n\n        if self.strict and monotonic() - real_time > self.factor:\n            # Events scheduled for time *t* may take just up to *t+1*\n            # for their computation, before an error is raised.\n            delta = monotonic() - real_time\n            raise RuntimeError(f'Simulation too slow for real time ({delta:.3f}s).')\n\n        # Sleep in a loop to fix inaccuracies of windows (see\n        #  for details) and to ignore\n        # interrupts.\n        while True:\n            delta = real_time - monotonic()\n            if delta \u003c= 0:\n                break\n            sleep(delta)\n\n        Environment.step(self)\n","simpy/util.py":"\"\"\"\nA collection of utility functions:\n\n.. autosummary::\n   start_delayed\n\n\"\"\"\n\nfrom typing import Generator\n\nfrom simpy.core import Environment, SimTime\nfrom simpy.events import Event, Process, ProcessGenerator\n\n\ndef start_delayed(\n    env: Environment, generator: ProcessGenerator, delay: SimTime\n) -> Process:\n    \"\"\"Return a helper process that starts another process for *generator*\n    after a certain *delay*.\n\n    :meth:`~simpy.core.Environment.process()` starts a process at the current\n    simulation time. This helper allows you to start a process after a delay of\n    *delay* simulation time units::\n\n        >>> from simpy import Environment\n        >>> from simpy.util import start_delayed\n        >>> def my_process(env, x):\n        ...     print(f'{env.now}, {x}')\n        ...     yield env.timeout(1)\n        ...\n        >>> env = Environment()\n        >>> proc = start_delayed(env, my_process(env, 3), 5)\n        >>> env.run()\n        5, 3\n\n    Raise a :exc:`ValueError` if ``delay \u003c= 0``.\n\n    \"\"\"\n    if delay \u003c= 0:\n        raise ValueError(f'delay(={delay}) must be > 0.')\n\n    def starter() -> Generator[Event, None, Process]:\n        yield env.timeout(delay)\n        proc = env.process(generator)\n        return proc\n\n    return env.process(starter())\n\n\ndef subscribe_at(event: Event) -> None:\n    \"\"\"Register at the *event* to receive an interrupt when it occurs.\n\n    The most common use case for this is to pass\n    a :class:`~simpy.events.Process` to get notified when it terminates.\n\n    Raise a :exc:`RuntimeError` if ``event`` has already occurred.\n\n    \"\"\"\n    env = event.env\n    assert env.active_process is not None\n    subscriber = env.active_process\n\n    def signaller(signaller: Event, receiver: Process) -> ProcessGenerator:\n        result = yield signaller\n        if receiver.is_alive:\n            receiver.interrupt((signaller, result))\n\n    if event.callbacks is not None:\n        env.process(signaller(event, subscriber))\n    else:\n        raise RuntimeError(f'{event} has already terminated.')\n","simpy/resources/__init__.py":"\"\"\"\nSimPy implements three types of resources that can be used to synchronize\nprocesses or to model congestion points:\n\n.. currentmodule:: simpy.resources\n\n.. autosummary::\n\n   resource\n   container\n   store\n\nThey are derived from the base classes defined in the\n:mod:`~simpy.resources.base` module. These classes are also meant to support\nthe implementation of custom resource types.\n\n\"\"\"\n","simpy/resources/base.py":"\"\"\"\nBase classes of for SimPy's shared resource types.\n\n:class:`BaseResource` defines the abstract base resource. It supports *get* and\n*put* requests, which return :class:`Put` and :class:`Get` events respectively.\nThese events are triggered once the request has been completed.\n\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import (\n    TYPE_CHECKING,\n    ClassVar,\n    ContextManager,\n    Generic,\n    MutableSequence,\n    Optional,\n    Type,\n    TypeVar,\n    Union,\n)\n\nfrom simpy.core import BoundClass, Environment\nfrom simpy.events import Event, Process\n\nif TYPE_CHECKING:\n    from types import TracebackType\n\nResourceType = TypeVar('ResourceType', bound='BaseResource')\n\n\nclass Put(Event, ContextManager['Put'], Generic[ResourceType]):\n    \"\"\"Generic event for requesting to put something into the *resource*.\n\n    This event (and all of its subclasses) can act as context manager and can\n    be used with the :keyword:`with` statement to automatically cancel the\n    request if an exception (like an :class:`simpy.exceptions.Interrupt` for\n    example) occurs:\n\n    .. code-block:: python\n\n        with res.put(item) as request:\n            yield request\n\n    \"\"\"\n\n    def __init__(self, resource: ResourceType):\n        super().__init__(resource._env)\n        self.resource = resource\n        self.proc: Optional[Process] = self.env.active_process\n\n        resource.put_queue.append(self)  # pyright: ignore\n        self.callbacks.append(resource._trigger_get)\n        resource._trigger_put(None)\n\n    def __enter__(self) -> Put:\n        return self\n\n    def __exit__(\n        self,\n        exc_type: Optional[Type[BaseException]],\n        exc_value: Optional[BaseException],\n        traceback: Optional[TracebackType],\n    ) -> Optional[bool]:\n        self.cancel()\n        return None\n\n    def cancel(self) -> None:\n        \"\"\"Cancel this put request.\n\n        This method has to be called if the put request must be aborted, for\n        example if a process needs to handle an exception like an\n        :class:`~simpy.exceptions.Interrupt`.\n\n        If the put request was created in a :keyword:`with` statement, this\n        method is called automatically.\n\n        \"\"\"\n        if not self.triggered:\n            self.resource.put_queue.remove(self)  # pyright: ignore\n\n\nclass Get(Event, ContextManager['Get'], Generic[ResourceType]):\n    \"\"\"Generic event for requesting to get something from the *resource*.\n\n    This event (and all of its subclasses) can act as context manager and can\n    be used with the :keyword:`with` statement to automatically cancel the\n    request if an exception (like an :class:`simpy.exceptions.Interrupt` for\n    example) occurs:\n\n    .. code-block:: python\n\n        with res.get() as request:\n            item = yield request\n\n    \"\"\"\n\n    def __init__(self, resource: ResourceType):\n        super().__init__(resource._env)\n        self.resource = resource\n        self.proc = self.env.active_process\n\n        resource.get_queue.append(self)  # pyright: ignore\n        self.callbacks.append(resource._trigger_put)\n        resource._trigger_get(None)\n\n    def __enter__(self) -> Get:\n        return self\n\n    def __exit__(\n        self,\n        exc_type: Optional[Type[BaseException]],\n        exc_value: Optional[BaseException],\n        traceback: Optional[TracebackType],\n    ) -> Optional[bool]:\n        self.cancel()\n        return None\n\n    def cancel(self) -> None:\n        \"\"\"Cancel this get request.\n\n        This method has to be called if the get request must be aborted, for\n        example if a process needs to handle an exception like an\n        :class:`~simpy.exceptions.Interrupt`.\n\n        If the get request was created in a :keyword:`with` statement, this\n        method is called automatically.\n\n        \"\"\"\n        if not self.triggered:\n            self.resource.get_queue.remove(self)  # pyright: ignore\n\n\nPutType = TypeVar('PutType', bound=Put)\nGetType = TypeVar('GetType', bound=Get)\n\n\nclass BaseResource(Generic[PutType, GetType]):\n    \"\"\"Abstract base class for a shared resource.\n\n    You can :meth:`put()` something into the resources or :meth:`get()`\n    something out of it. Both methods return an event that is triggered once\n    the operation is completed. If a :meth:`put()` request cannot complete\n    immediately (for example if the resource has reached a capacity limit) it\n    is enqueued in the :attr:`put_queue` for later processing. Likewise for\n    :meth:`get()` requests.\n\n    Subclasses can customize the resource by:\n\n    - providing custom :attr:`PutQueue` and :attr:`GetQueue` types,\n    - providing custom :class:`Put` respectively :class:`Get` events,\n    - and implementing the request processing behaviour through the methods\n      ``_do_get()`` and ``_do_put()``.\n\n    \"\"\"\n\n    PutQueue: ClassVar[Type[MutableSequence]] = list\n    \"\"\"The type to be used for the :attr:`put_queue`. It is a plain\n    :class:`list` by default. The type must support index access (e.g.\n    ``__getitem__()`` and ``__len__()``) as well as provide ``append()`` and\n    ``pop()`` operations.\"\"\"\n\n    GetQueue: ClassVar[Type[MutableSequence]] = list\n    \"\"\"The type to be used for the :attr:`get_queue`. It is a plain\n    :class:`list` by default. The type must support index access (e.g.\n    ``__getitem__()`` and ``__len__()``) as well as provide ``append()`` and\n    ``pop()`` operations.\"\"\"\n\n    def __init__(self, env: Environment, capacity: Union[float, int]):\n        self._env = env\n        self._capacity = capacity\n        self.put_queue: MutableSequence[PutType] = self.PutQueue()\n        \"\"\"Queue of pending *put* requests.\"\"\"\n        self.get_queue: MutableSequence[GetType] = self.GetQueue()\n        \"\"\"Queue of pending *get* requests.\"\"\"\n\n        # Bind event constructors as methods\n        BoundClass.bind_early(self)\n\n    @property\n    def capacity(self) -> Union[float, int]:\n        \"\"\"Maximum capacity of the resource.\"\"\"\n        return self._capacity\n\n    if TYPE_CHECKING:\n\n        def put(self) -> Put:\n            \"\"\"Request to put something into the resource and return a\n            :class:`Put` event, which gets triggered once the request\n            succeeds.\"\"\"\n            return Put(self)\n\n        def get(self) -> Get:\n            \"\"\"Request to get something from the resource and return a\n            :class:`Get` event, which gets triggered once the request\n            succeeds.\"\"\"\n            return Get(self)\n\n    else:\n        put = BoundClass(Put)\n        get = BoundClass(Get)\n\n    def _do_put(self, event: PutType) -> Optional[bool]:\n        \"\"\"Perform the *put* operation.\n\n        This method needs to be implemented by subclasses. If the conditions\n        for the put *event* are met, the method must trigger the event (e.g.\n        call :meth:`Event.succeed()` with an appropriate value).\n\n        This method is called by :meth:`_trigger_put` for every event in the\n        :attr:`put_queue`, as long as the return value does not evaluate\n        ``False``.\n        \"\"\"\n        raise NotImplementedError(self)\n\n    def _trigger_put(self, get_event: Optional[GetType]) -> None:\n        \"\"\"This method is called once a new put event has been created or a get\n        event has been processed.\n\n        The method iterates over all put events in the :attr:`put_queue` and\n        calls :meth:`_do_put` to check if the conditions for the event are met.\n        If :meth:`_do_put` returns ``False``, the iteration is stopped early.\n        \"\"\"\n\n        # Maintain queue invariant: All put requests must be untriggered.\n        # This code is not very pythonic because the queue interface should be\n        # simple (only append(), pop(), __getitem__() and __len__() are\n        # required).\n        idx = 0\n        while idx \u003c len(self.put_queue):\n            put_event = self.put_queue[idx]\n            proceed = self._do_put(put_event)\n            if not put_event.triggered:\n                idx += 1\n            elif self.put_queue.pop(idx) != put_event:\n                raise RuntimeError('Put queue invariant violated')\n\n            if not proceed:\n                break\n\n    def _do_get(self, event: GetType) -> Optional[bool]:\n        \"\"\"Perform the *get* operation.\n\n        This method needs to be implemented by subclasses. If the conditions\n        for the get *event* are met, the method must trigger the event (e.g.\n        call :meth:`Event.succeed()` with an appropriate value).\n\n        This method is called by :meth:`_trigger_get` for every event in the\n        :attr:`get_queue`, as long as the return value does not evaluate\n        ``False``.\n        \"\"\"\n        raise NotImplementedError(self)\n\n    def _trigger_get(self, put_event: Optional[PutType]) -> None:\n        \"\"\"Trigger get events.\n\n        This method is called once a new get event has been created or a put\n        event has been processed.\n\n        The method iterates over all get events in the :attr:`get_queue` and\n        calls :meth:`_do_get` to check if the conditions for the event are met.\n        If :meth:`_do_get` returns ``False``, the iteration is stopped early.\n        \"\"\"\n\n        # Maintain queue invariant: All get requests must be untriggered.\n        # This code is not very pythonic because the queue interface should be\n        # simple (only append(), pop(), __getitem__() and __len__() are\n        # required).\n        idx = 0\n        while idx \u003c len(self.get_queue):\n            get_event = self.get_queue[idx]\n            proceed = self._do_get(get_event)\n            if not get_event.triggered:\n                idx += 1\n            elif self.get_queue.pop(idx) != get_event:\n                raise RuntimeError('Get queue invariant violated')\n\n            if not proceed:\n                break\n","simpy/resources/container.py":"\"\"\"\nResource for sharing homogeneous matter between processes, either continuous\n(like water) or discrete (like apples).\n\nA :class:`Container` can be used to model the fuel tank of a gasoline station.\nTankers increase and refuelled cars decrease the amount of gas in the station's\nfuel tanks.\n\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import TYPE_CHECKING, Optional, Union\n\nfrom simpy.core import BoundClass, Environment\nfrom simpy.resources import base\n\nContainerAmount = Union[int, float]\n\n\nclass ContainerPut(base.Put):\n    \"\"\"Request to put *amount* of matter into the *container*. The request will\n    be triggered once there is enough space in the *container* available.\n\n    Raise a :exc:`ValueError` if ``amount \u003c= 0``.\n\n    \"\"\"\n\n    def __init__(self, container: Container, amount: ContainerAmount):\n        if amount \u003c= 0:\n            raise ValueError(f'amount(={amount}) must be > 0.')\n        self.amount = amount\n        \"\"\"The amount of matter to be put into the container.\"\"\"\n\n        super().__init
