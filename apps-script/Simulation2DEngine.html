<script>
window.STSimulation2DEngine=(function(){
  const epsilon=1e-6;
  const durationKey={
    Starting:'starting',Running:'running',Discharging:'running',Starved:'starving','Waiting for Prime':'starving',
    'Ramp up':'acceleration','Ramp down':'deceleration',Blocked:'blocked','Back-up stop':'backupStop',Failed:'failure',
    Paused:'paused',Stopped:'stopped','Emergency stop':'emergencyStop','Planned stop':'plannedStop'
  };
  // Match LineSimulationEngine.resolvePhysicalZone: reserve is a whole
  // number of packages in the packed outlet queue, not a raw beam pulse.
  function primeThresholdUnits(belt){
    if(belt.prime==null)return null;
    const pitch=belt.packageLength+belt.packedGap;
    const capacity=Math.floor(belt.length/pitch);
    return Math.max(1,Math.min(capacity,Math.ceil((belt.length-belt.prime)/pitch)));
  }
  function create(definitions,seed=1,checkpoint,schedule={}){
    const line=definitions.map((definition,index)=>definition.kind==='belt'
      ? {...definition,items:[],backupBlocked:false,backupElapsed:0,primeSeen:false,backupBeam:false,primeBeam:false,
        primeThresholdUnits:primeThresholdUnits(definition),primeQueueUnits:0,primeTriggerCount:0,
        backupOccupied:false,backupTriggerCount:0,backupClearCount:0,produced:0,state:'Empty',
        receivedUnits:0,overflowUnits:0,overflowEvents:0,blockedEntryAttempts:0,
        durations:{empty:0,flowing:0,accumulating:0},recentOutput:[],ratePerMinute:0}
      : {...definition,input:0,remaining:null,ready:false,started:0,produced:0,backupSince:null,residual:0,state:'Waiting',
        admittedInputUnits:0,stopDischargedUnits:0,residualDischargedUnits:0,dischargeOverflowUnits:0,
        residualAtTrigger:0,resident:[],residenceClock:0,positionClock:0,positionDue:[],intakeCredit:1,outletCredit:0,rampElapsed:0,activeRampSeconds:definition.primeRampSeconds??definition.rampSeconds??0,failureRemaining:0,failureCount:0,exposure:null,
        activeStartDelaySeconds:definition.startDelay??0,startCause:'INITIAL',repairRecoveryPending:false,
        reliabilityExposureSeconds:0,reliabilityChargedSeconds:0,
        restartRequests:{INITIAL:1},startingSecondsByCause:{},rampUpSecondsByCause:{},waitingForPrimeSeconds:0,
        awaitPrime:definitions[index-1]?.kind==='belt'&&definitions[index-1].prime!=null,
        randomState:(Math.trunc(seed)+Math.imul(index+1,2654435761))>>>0,
        durations:{starting:0,running:0,starving:0,acceleration:0,deceleration:0,blocked:0,backupStop:0,failure:0,paused:0,stopped:0,emergencyStop:0,plannedStop:0},
        recentOutput:[],ratePerMinute:0});
    let time=0,commandIndex=0,stopIndex=0,activeStop=null,materialAccountingComplete=true;
    const commands=schedule.commands||[],stops=schedule.stops||[];
    const byId=new Map(line.map(item=>[item.id,item]));
    const options={failures:true,events:true,calendar:true};
    const running=item=>!item.emergency&&!['STOP','PAUSE'].includes(item.mode);
    const available=item=>running(item)&&!activeStop;
    function rearmPrime(item){
      const upstream=line[line.indexOf(item)-1];
      item.awaitPrime=upstream?.kind==='belt'&&upstream.prime!=null;
      if(item.awaitPrime)upstream.primeSeen=false;
    }
    // Keep configured machine defaults immutable. The outgoing conveyor
    // may override the restart profile after a completed Back-up stop.
    function restart(item,cause='COMMAND',delay=item.startDelay??0,ramp=item.rampSeconds??0){
      if(item.kind==='belt')return;
      rearmPrime(item);
      item.started=0;
      item.activeStartDelaySeconds=Math.max(0,delay);
      item.rampElapsed=0;
      item.activeRampSeconds=Math.max(0,ramp);
      item.startCause=cause;
      item.restartRequests[cause]=(item.restartRequests[cause]||0)+1;
    }
    function control(id,action){
      const item=byId.get(id);
      if(!item)return;
      const wasRunning=running(item);
      if(action==='EMERGENCY_STOP'){item.emergency=true;item.mode='STOP';}
      else if(action==='RESET'&&item.emergency){item.emergency=false;item.mode='STOP';}
      else if(!item.emergency&&['RUN','AUTO','MANUAL','STOP','PAUSE'].includes(action)){
        item.mode=action;
        if(!wasRunning&&running(item))restart(item);
      }
      if(!running(item))item.state=haltState(item);
    }
    function haltState(item){
      if(item.emergency)return 'Emergency stop';
      if(item.mode==='PAUSE')return 'Paused';
      if(item.mode==='STOP')return 'Stopped';
      return 'Planned stop';
    }
    function configure(values){
      Object.assign(options,values);
      if(!options.failures)for(const item of line){
        if(item.failureRemaining>0){
          item.failureRemaining=0;
          if(item.state==='Failed')item.state='Waiting';
        }
      }
    }
    if(checkpoint&&Number.isFinite(checkpoint.time)&&checkpoint.time>=0&&checkpoint.line?.length===line.length){
      time=checkpoint.time;
      // Older checkpoints do not contain the input and loss counters needed
      // to reconstruct a lifetime balance. Do not report a fabricated zero.
      materialAccountingComplete=checkpoint.materialAccountingComplete===true;
      commandIndex=checkpoint.commandIndex??0;
      stopIndex=checkpoint.stopIndex??0;
      activeStop=stops[checkpoint.activeStopIndex]??null;
      line.forEach((item,index)=>{
        const saved=JSON.parse(JSON.stringify(checkpoint.line[index]));
        saved.durations={...item.durations,...saved.durations};
        Object.assign(item,saved);
      });
    }
    function snapshot(){
      return JSON.parse(JSON.stringify({time,commandIndex,stopIndex,materialAccountingComplete,activeStopIndex:activeStop?stops.indexOf(activeStop):-1,line:line.map((item,index)=>Object.fromEntries(
        Object.entries(item).filter(([key])=>!Object.hasOwn(definitions[index],key))
      ))}));
    }
    function hasPackedPair(belt,position=null){
      const packedPitch=belt.packageLength+belt.packedGap;
      if(packedPitch+epsilon>=belt.pitch)return false;
      return belt.items.some((item,index)=>{
        if(!index)return false;
        const ahead=belt.items[index-1];
        return ahead.x-item.x<=packedPitch+epsilon&&
          (position===null||position>=item.x&&position<=ahead.x);
      });
    }
    function moveBelt(belt,seconds,moving=true){
      belt.travelSeconds=(belt.travelSeconds||0)+(moving?seconds:0);
      const travel=moving?belt.speed*seconds:0;
      if(window.SimulatorEngine?.advancePackagePositions){
        window.SimulatorEngine.advancePackagePositions(belt.items,belt.length,belt.packageLength,belt.packageLength+belt.packedGap,moving?belt.speed:0,seconds);
      }else{
        // Standalone replay harnesses can load the 2D core without the browser engine bundle.
        let limit=belt.length-belt.packageLength/2;
        for(const item of belt.items){item.x=Math.min(limit,item.x+travel);limit=item.x-belt.packageLength-belt.packedGap;}
      }
      // Read both photoeyes after physical transport and before machine
      // handoffs, including while the belt is stopped. The numerical
      // discrete engine uses inclusive package edges (1e-6 mm).
      const beam=position=>position!=null&&belt.items.some(item=>Math.abs(item.x-position)<=belt.packageLength/2+epsilon);
      belt.primeBeam=beam(belt.prime);
      belt.backupBeam=beam(belt.backup);
      // The queue must be contiguous and anchored at the outlet. An isolated
      // passing package, even one blocking Prime, is not a reserve.
      const packedPitch=belt.packageLength+belt.packedGap;
      const end=belt.length-belt.packageLength/2;
      let queued=0;
      while(queued<belt.items.length&&belt.items[queued].x>=end-queued*packedPitch-epsilon)queued++;
      belt.primeQueueUnits=queued;
      // Physical Back-up is the raw beam OR the span between packed
      // neighbours. The configured release position is not a second beam
      // in the numerical discrete model; both engines use continuous clear.
      belt.backupOccupied=belt.backupBeam||belt.backup!=null&&hasPackedPair(belt,belt.backup);
      if(belt.backupOccupied===belt.backupBlocked){belt.backupElapsed=0;return;}
      belt.backupElapsed+=seconds;
      if(belt.backupElapsed+1e-8>=(belt.backupOccupied?(belt.blockDelay??0):(belt.clearDelay??0))){
        belt.backupBlocked=belt.backupOccupied;
        belt.backupElapsed=0;
        if(belt.backupBlocked)belt.backupTriggerCount++;
        else belt.backupClearCount++;
      }
    }
    // Normal output is retained when the receiving conveyor cannot accept
    // a package. After the response delay, a physical residual discharge
    // may spill, just like numerical addFlowToZone(..., allowOverflow).
    // The released package is counted at the machine even if it is lost;
    // only accepted packages enter the conveyor's inventory.
    function discharge(machine,downstream,residualDischarge=false){
      if(downstream?.kind==='belt'){
        const entry=downstream.packageLength/2;
        const last=downstream.items.at(-1);
        const hasSpace=!last||last.x-entry+epsilon>=downstream.pitch;
        if(!residualDischarge&&(!available(downstream)||!hasSpace)){
          downstream.blockedEntryAttempts++;
          return false;
        }
        // An unavoidable residual can enter a stopped belt if its physical
        // entry is free; no new space is created by stopping the belt.
        if(hasSpace){
          downstream.items.push({x:entry});
          downstream.receivedUnits++;
        }else{
          downstream.overflowUnits++;
          downstream.overflowEvents++;
          machine.dischargeOverflowUnits++;
        }
      }else if(downstream?.capacityBottles!=null){
        if(!available(downstream)||downstream.resident.length>=Math.floor(downstream.capacityBottles/downstream.inputBottleFactor)||
          downstream.failureRemaining>0||downstream.started<downstream.activeStartDelaySeconds||downstream.backupSince!==null)return false;
        downstream.resident.push(downstream.residenceClock+downstream.residenceSeconds);
        downstream.admittedInputUnits++;
        if(downstream.occupancyMode==='POSITIONS')downstream.positionDue.push(downstream.positionClock+
          Math.floor(downstream.capacityBottles/downstream.inputBottleFactor));
      }else if(downstream){
        if(!available(downstream)||downstream.input>=downstream.batch||downstream.ready||downstream.remaining!==null||downstream.backupSince!==null)return false;
        downstream.input++;
        downstream.admittedInputUnits++;
      }
      if(machine.capacityBottles!=null){
        machine.resident.splice(0,machine.batch);
        if(machine.occupancyMode==='POSITIONS')machine.positionDue.splice(0,machine.batch);
      }
      machine.ready=false;
      machine.input=0;
      machine.produced++;
      if(machine.backupSince!==null)machine.stopDischargedUnits++;
      if(residualDischarge)machine.residualDischargedUnits++;
      machine.recentOutput.push(time);
      return true;
    }
    function random(machine){
      machine.randomState=(Math.imul(machine.randomState,1664525)+1013904223)>>>0;
      return (machine.randomState+.5)/4294967296;
    }
    // Match the numerical engine's productive-state eligibility, rather
    // than treating retained material as proof of operation. Keep a separate
    // counter of time actually charged while the reliability process is on.
    function chargeReliability(machine,seconds){
      if(!['Running','Ramp up','Ramp down','Discharging'].includes(machine.state))return;
      machine.reliabilityExposureSeconds+=seconds;
      const profiles=machine.failures||[];
      if(!options.failures||!profiles.length)return;
      if(machine.exposure===null){
        const total=profiles.reduce((sum,profile)=>sum+profile.rate,0);
        if(!(total>0))return;
        machine.exposure=-Math.log(random(machine))/total;
      }
      machine.exposure-=seconds;
      machine.reliabilityChargedSeconds+=seconds;
    }
    function updateFailure(machine,seconds){
      if(machine.failureRemaining>0){
        machine.failureRemaining=Math.max(0,machine.failureRemaining-seconds);
        if(machine.failureRemaining===0){
          // Repair has no extra startup delay; post-repair ramps are opt-in.
          restart(machine,'REPAIR_COMPLETED',0,machine.rampAfterRepair?machine.rampSeconds??0:0);
          machine.repairRecoveryPending=true;
        }
        return true;
      }
      const profiles=machine.failures||[];
      // A threshold reached during a productive tick causes a failure at
      // the next tick boundary. Do not sample or consume time while parked.
      if(!profiles.length||machine.exposure===null||machine.exposure>0)return false;
      const total=profiles.reduce((sum,profile)=>sum+profile.rate,0);
      if(!(total>0))return false;
      let pick=random(machine)*total;
      const profile=profiles.find(item=>(pick-=item.rate)<=0)||profiles.at(-1);
      machine.failureRemaining=profile.repairSeconds;
      machine.failureCount++;
      machine.exposure=null;
      return true;
    }
    function primeReady(belt){
      if(belt?.kind!=='belt'||belt.prime==null)return true;
      return belt.primeQueueUnits>=belt.primeThresholdUnits;
    }
    function stepMachine(machine,upstream,downstream,seconds){
      if(options.failures&&updateFailure(machine,seconds)){machine.state='Failed';return;}
      if(downstream?.backupBlocked){
        if(machine.backupSince===null){
          machine.backupSince=time;
          // Legacy input name "bottlesDischargedAtStop" denotes native
          // packages (CAT L21/L52), including complete cases after packing.
          const configured=Math.max(0,Math.floor(downstream.residual??0));
          machine.residual=machine.capacityBottles==null?configured:
            Math.min(configured,Math.floor(machine.resident.length/machine.batch));
          machine.residualAtTrigger=machine.residual;
        }
      }else if(machine.backupSince!==null){
        // Do not restart after a short pulse that clears before the stop.
        // Once a stop or its last residual discharge occurred, a restart
        // is required. A pending repair recovery takes precedence.
        const completed=machine.backupStopped||(machine.residual<=0&&
          (machine.state==='Discharging'||machine.capacityBottles!=null&&machine.residualAtTrigger>0));
        machine.backupStopped=false;
        machine.backupSince=null;
        machine.residual=0;
        machine.residualAtTrigger=0;
        if(completed&&!machine.repairRecoveryPending)restart(machine,'BACKUP_CLEAR',
          downstream.upstreamRestartDelaySeconds??machine.startDelay??0,
          downstream.upstreamRestartRampUpSeconds??machine.rampSeconds??0);
      }
      const braking=machine.backupSince!==null&&time-machine.backupSince+epsilon>=downstream.responseDelay;
      if((machine.repairRecoveryPending&&machine.backupSince!==null)||(machine.residual<=0&&braking)){machine.state='Back-up stop';return;}
      if(machine.awaitPrime){
        // As in numerical triggerPrimeSensor, an active outgoing Back-up
        // inhibits Prime authorization even during the stop response.
        if(machine.backupSince!==null||!available(upstream)||!primeReady(upstream)){machine.state='Waiting for Prime';return;}
        machine.awaitPrime=false;
        if(upstream?.kind==='belt'&&upstream.prime!=null&&!upstream.primeSeen){
          upstream.primeSeen=true;
          upstream.primeTriggerCount++;
        }
      }
      machine.repairRecoveryPending=false;
      if(machine.started+epsilon<machine.activeStartDelaySeconds){
        machine.started=Math.min(machine.activeStartDelaySeconds,machine.started+seconds);machine.state='Starting';return;
      }
      const decelerating=machine.backupSince!==null&&!braking;
      const accelerating=!decelerating&&!braking&&machine.rampElapsed<machine.activeRampSeconds;
      const factor=decelerating?Math.max(0,1-(time-machine.backupSince)/downstream.responseDelay)
        :accelerating?Math.min(1,(machine.rampElapsed+seconds/2)/machine.activeRampSeconds):1;
      const motionState=decelerating?'Ramp down':accelerating?'Ramp up':braking?'Discharging':'Running';
      if(machine.capacityBottles!=null){
        stepResident(machine,upstream,downstream,seconds,factor,motionState,accelerating,machine.backupSince!==null);
        return;
      }
      if(machine.remaining!==null){
        if(accelerating)machine.rampElapsed+=seconds;
        machine.remaining-=seconds*factor;
        if(machine.remaining<=epsilon){machine.remaining=null;machine.ready=true;}
      }
      if(machine.ready){
        if(!discharge(machine,downstream,braking)){machine.state='Blocked';return;}
        if(braking)machine.residual=Math.max(0,machine.residual-1);
      }
      if(braking&&machine.input===0){machine.state='Back-up stop';return;}
      if(machine.remaining!==null){machine.state=motionState;return;}
      if(machine.input<machine.batch&&!braking){
        if(!upstream){machine.admittedInputUnits+=machine.batch-machine.input;machine.input=machine.batch;}
        if(upstream?.kind==='belt'&&available(upstream)){
          const first=upstream.items[0];
          if(first&&first.x+upstream.packageLength/2>=upstream.length-epsilon){
            upstream.items.shift();
            upstream.produced++;
            upstream.recentOutput.push(time);
            machine.input++;
            machine.admittedInputUnits++;
          }
        }
      }
      if(machine.input<machine.batch){machine.state=braking?'Back-up stop':'Starved';return;}
      machine.remaining=1/machine.rate;
      machine.state=motionState;
    }
    function stepResident(machine,upstream,downstream,seconds,factor,motionState,accelerating,stopping){
      machine.residenceClock+=seconds;
      const capacity=Math.floor(machine.capacityBottles/machine.inputBottleFactor);
      const work=seconds*factor*machine.rate;
      if(machine.occupancyMode==='POSITIONS')machine.positionClock+=work*machine.batch;
      const ready=machine.resident[machine.batch-1]<=machine.residenceClock+epsilon
        &&(machine.occupancyMode!=='POSITIONS'||machine.positionDue[machine.batch-1]<=machine.positionClock+epsilon);
      machine.outletCredit=machine.resident.length>=machine.batch?machine.outletCredit+work:0;
      const beforeOutput=machine.produced;let admitted=0;
      let blocked=false;
      if((!stopping||machine.residual>0)&&machine.outletCredit+epsilon>=1&&ready){
        if(discharge(machine,downstream,motionState==='Discharging')){
          machine.outletCredit=Math.max(0,machine.outletCredit-1);
          if(stopping)machine.residual=Math.max(0,machine.residual-1);
        }else blocked=true;
      }
      machine.outletCredit=Math.min(1,machine.outletCredit);
      if(!stopping&&(!upstream||upstream.kind==='belt'&&available(upstream))){
        machine.intakeCredit+=work*machine.batch;
        while(machine.intakeCredit+epsilon>=1&&machine.resident.length<capacity){
          if(upstream){
            const first=upstream.items[0];
            if(!first||first.x+upstream.packageLength/2<upstream.length-epsilon)break;
            upstream.items.shift();upstream.produced++;upstream.recentOutput.push(time);
          }
          machine.resident.push(machine.residenceClock+machine.residenceSeconds);
          machine.admittedInputUnits++;
          if(machine.occupancyMode==='POSITIONS')machine.positionDue.push(machine.positionClock+capacity);
          admitted++;
          machine.intakeCredit=Math.max(0,machine.intakeCredit-1);
        }
        machine.intakeCredit=Math.min(1,machine.intakeCredit);
      }
      if(accelerating&&!blocked)machine.rampElapsed+=seconds;
      machine.state=blocked?'Blocked':stopping&&!machine.resident.length&&motionState!=='Ramp down'?'Back-up stop':
        admitted>0||machine.produced>beforeOutput||machine.resident.some(due=>due>machine.residenceClock+epsilon)||ready&&machine.outletCredit>0||accelerating||motionState==='Ramp down'?motionState:
        'Starved';
    }
    return {line,snapshot,configure,control,get time(){return time;},get materialAccountingComplete(){return materialAccountingComplete;},step(seconds){
      while(commandIndex<commands.length&&commands[commandIndex].atVirtualSecond<=time+epsilon){
        const event=commands[commandIndex++];
        if(options.events)control(event.equipmentId,event.action);
      }
      while(stopIndex<stops.length&&stops[stopIndex].endSeconds<=time+epsilon)stopIndex++;
      const stop=stops[stopIndex];
      const nextStop=stop&&stop.startSeconds<=time+epsilon&&(stop.fromCalendar?options.calendar:options.events)?stop:null;
      if(activeStop&&activeStop!==nextStop){
        for(const item of line){
          if(item.kind!=='machine')continue;
          if(activeStop.restartPolicy==='RESTART')restart(item,'CALENDAR_RESTART');
          else rearmPrime(item);
        }
      }
      activeStop=nextStop;
      time+=seconds;
      line.forEach(item=>{if(item.kind==='belt')moveBelt(item,seconds,available(item));});
      for(let index=line.length-1;index>=0;index--){
        const item=line[index];
        if(item.kind!=='machine')continue;
        if(available(item))stepMachine(item,line[index-1],line[index+1],seconds);
        else item.state=haltState(item);
        const category=durationKey[item.state];
        if(category)item.durations[category]+=seconds;
        chargeReliability(item,seconds);
        // Prime waiting remains a subset of the historical starving counter.
        // Keep per-cause counters separately so no state time is counted twice.
        if(item.state==='Waiting for Prime')item.waitingForPrimeSeconds+=seconds;
        if(category==='starting'||category==='acceleration'){
          const byCause=category==='starting'?item.startingSecondsByCause:item.rampUpSecondsByCause;
          byCause[item.startCause]=(byCause[item.startCause]||0)+seconds;
        }
        if(item.state==='Back-up stop')item.backupStopped=true;
        const upstream=line[index-1];
        if(item.state==='Starved'&&!(item.resident?.length>0)&&upstream?.kind==='belt'&&upstream.prime!=null&&
          (!upstream.items[0]||upstream.items[0].x+upstream.packageLength/2<upstream.length-epsilon)){
          restart(item,'PRIME_RECOVERY',item.startDelay??0,item.primeRampSeconds??item.rampSeconds??0);
        }
      }
      for(const item of line){
        if(item.kind==='belt'&&!available(item)){item.travelSeconds??=0;item.state=haltState(item);}
        else if(item.kind==='belt'){
          const head=item.items[0];
          const accumulating=head&&(head.x+item.packageLength/2>=item.length-epsilon||hasPackedPair(item));
          const category=!head?'empty':accumulating?'accumulating':'flowing';
          item.state=!head?'Empty':accumulating?'Accumulating':'Flowing';
          item.durations[category]+=seconds;
        }
        while(item.recentOutput.length&&item.recentOutput[0]<=time-5)item.recentOutput.shift();
        item.ratePerMinute=item.recentOutput.length*60/Math.min(time,5);
      }
    }};
  }
  return {create};
})();
</script>
