  const machineHeight=540*sceneScale*machineScale,beltDepth=7.5*.75,beltInset=1.5*.75;
  let shiftHours=8,shiftOutput=[],limitSeconds=3600,save,signature,lastSave=0;
  let seed=1,key,viewKey,definitions=[],model=null,frame,previous=0,lag=0,playbackRateAtFrame=null,drag,validation='',runState='Ready',lastMetrics=-Infinity;

    if(executionStartedAt!==null){executionWallMs=executionElapsed();executionStartedAt=null;}

    if(executionStartedAt===null){executionWallMs=executionWallMs??0;executionStartedAt=performance.now();}
  }
  function executionClockLabel(ms){
    if(!Number.isFinite(ms))return '—';
    const seconds=Math.floor(Math.max(0,ms)/1000);

  }
  let productHeights={},machineTypes=new Map(),bottleStages=new Map(),conveyorDimensions=new Map();
  const dimensionRowHeight=32,dimensionLevels=3,dimensionOffset=126;
  let dimensionPointer=null;
  const verdictHitBoxes=[];
  const bottleStageNames=['Empty','Labeled','Filled','Filled + labeled'];
  function resolveBottleStages(line,types){
    const operations=new Map(line.filter(item=>item.kind!=='belt').map(item=>{
      const type=types.get(item.id),name=item.name||'';
      return [item.id,{
        fill:type==='FILLER'||/\b(?:filler|filling|llenadora|llenado)\b/i.test(name),
        label:type==='SLEEVER'||/\b(?:sleever|labeler|labeller|labeling|labelling|etiquetadora|etiquetado)\b/i.test(name),
        cap:type==='CAPPER'||/\b(?:capper|capping|tapadora|taponadora|roscadora)\b/i.test(name)
      }];
    }));
    const has=operation=>[...operations.values()].some(item=>item[operation]);
    const filling=has('fill'),labeling=has('label'),capping=has('cap');

    let stage=(labeling?0:1)|(filling?0:2)|(!capping&&!filling?4:0);

  }

  const defaultLayoutColors={equipmentAccent:'#516BB7',cases:'#b98c5d',caseLabel:'#4E8AC2',label:'#4E8AC2'};
  function validAppearance(value={}){

  }
  function openAppearance(){

    const original={...appearance},draft={...appearance},originalEquipmentView=machineStyle.value;appearance=draft;
    const dialog=document.createElement('dialog');dialog.id='simulation2d-appearance-dialog';dialog.className='theme-color-dialog simulation2d-appearance-dialog';
    dialog.setAttribute('aria-labelledby','simulation2d-appearance-title');
    const heading=document.createElement('header');heading.className='dialog-heading';
    const title=document.createElement('h2');title.id='simulation2d-appearance-title';title.textContent='Layout appearance';
    const close=document.createElement('button');close.type='button';close.className='ghost icon-button';close.setAttribute('aria-label','Close');close.innerHTML=window.STIcons.svg('x');heading.append(title,close);
    const body=document.createElement('div');body.className='dialog-body';
    const gallery=document.createElement('div');gallery.className='simulation2d-bottle-gallery';gallery.setAttribute('role','group');gallery.setAttribute('aria-label','Bottle shape');
    const casePreview=document.createElement('canvas');casePreview.width=160;casePreview.height=100;casePreview.className='simulation2d-case-preview';casePreview.setAttribute('role','img');casePreview.setAttribute('aria-label','Case color and marking preview');

  return {pause,capture,isRunning:()=>runState==='Running',refreshRunLocks:syncControls,
