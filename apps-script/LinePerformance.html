<script>
window.STLinePerformance = (function() {
  function units(unit){return window.STFlowUnits.labels(unit);}
  function el(tag, text) { var item = document.createElement(tag); if (text !== undefined) item.textContent = text; return item; }
  function value(n, digits) { return Number.isFinite(n) ? n.toLocaleString(undefined, {maximumFractionDigits: digits === undefined ? 1 : digits}) : '—'; }
  function svg(tag, attrs, text) {
    var item = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attrs).forEach(function(pair) { item.setAttribute(pair[0], String(pair[1])); });
    if (text !== undefined) item.textContent = text;
    return item;
  }
  function plot(target, points, rateUnit) {
    target.textContent = '';
    target._vgraphPoints=points;
    target._vgraphRateUnit=rateUnit;
    var valid = points.filter(function(p) { return Number.isFinite(p.normalBpm); });
    if (!valid.length) return;
    var all = valid.flatMap(function(p) { return [p.normalBpm, p.recommendedBpm].filter(Number.isFinite); });
    var minimum = Math.max(0, Math.floor((Math.min.apply(null, all) - 10) / 10) * 10);
    var maximum = Math.ceil((Math.max.apply(null, all) + 10) / 10) * 10;
    if (minimum === maximum) maximum += 10;
    // Fill the available viewport below the graph heading, rather than
    // pinning the drawing to the old 260px design height.
    var bounds=target.getBoundingClientRect();
    var viewportHeight=window.innerHeight||document.documentElement.clientHeight||700;
    var height=Math.max(360,Math.floor(viewportHeight-bounds.top-32));
    var width=Math.max(240,Math.floor(target.clientWidth||740));
    var chart = svg('svg', {viewBox:'0 0 '+width+' '+height, role:'img', 'aria-label':__ST_TEXT__('performance.chart_label'), preserveAspectRatio:'xMidYMid meet'});
    chart.style.minWidth='0';chart.style.width='100%';chart.style.height=height+'px';chart.style.display='block';
    var basic=document.documentElement.dataset.uiMode==='basic';
    var left=Math.min(100,width*.24),right=width-24,bottom=height-110,top=36;
    var spacing=(right-left)/Math.max(1,valid.length-1),compact=spacing<100;
    chart.style.fontSize=Math.max(11,Math.min(18,spacing/5))+'px';
    // SVG has no automatic text wrapping. Measure whole words and create
    // multiple lines rather than truncating equipment names with ellipses.
    var labelCanvas=document.createElement('canvas'),labelContext=labelCanvas.getContext?.('2d');
    function labelWidth(text,size){
      if(labelContext){labelContext.font=size+'px sans-serif';return labelContext.measureText(text).width;}
      return text.length*size*.58;
    }
    function wrapEquipmentName(name,available,size){
      var words=String(name||'').trim().split(/\s+/).filter(Boolean),lines=[''];
      words.forEach(function(word){
        var index=lines.length-1,combined=lines[index]?lines[index]+' '+word:word;
        if(labelWidth(combined,size)<=available||!lines[index])lines[index]=combined;
        else lines.push(word);
      });
      // Split uncommon single long words without dropping any characters.
      var split=[];
      lines.forEach(function(line){
        if(labelWidth(line,size)<=available){split.push(line);return;}
        var part='';
        Array.from(line).forEach(function(ch){
          if(part&&labelWidth(part+ch,size)>available){split.push(part);part='';}
          part+=ch;
        });
        if(part)split.push(part);
      });
      return split;
    }
    var x = function(i) { return left + (valid.length === 1 ? (right - left) / 2 : i * (right - left) / (valid.length - 1)); };
    var y = function(pct) { return bottom - (pct - minimum) / (maximum - minimum) * (bottom - top); };
    [minimum, (minimum + maximum) / 2, maximum].forEach(function(pct) {
      chart.appendChild(svg('line', {x1:left, x2:right, y1:y(pct), y2:y(pct), class:'vgraph-grid'}));
      chart.appendChild(svg('text', {x:left - 8, y:y(pct) + 4, class:'vgraph-label', 'text-anchor':'end'}, value(pct, 0) + ' '+rateUnit));
    });
    chart.appendChild(svg('polyline', {points:valid.map(function(p, i) { return x(i) + ',' + y(p.normalBpm); }).join(' '), class:'vgraph-normal'}));
    var segment = [];
    function flush() { if (segment.length > 1) chart.appendChild(svg('polyline', {points:segment.join(' '), class:'vgraph-recommended'})); segment = []; }
    valid.forEach(function(p, i) { if (Number.isFinite(p.recommendedBpm)) segment.push(x(i) + ',' + y(p.recommendedBpm)); else flush(); });
    flush();
    valid.forEach(function(p, i) {
      var normal=svg('circle', {cx:x(i), cy:y(p.normalBpm), r:5, class:'vgraph-normal-dot'});normal.appendChild(svg('title',{},p.name+' · '+__ST_TEXT__('performance.normal')+': '+value(p.normalBpm)+' '+p.displayRateUnit));chart.appendChild(normal);
      if (Number.isFinite(p.recommendedBpm)) {var recommended=svg('circle', {cx:x(i), cy:y(p.recommendedBpm), r:3, class:'vgraph-recommended-dot'});recommended.appendChild(svg('title',{},p.name+' · '+__ST_TEXT__('performance.recommended')+': '+value(p.recommendedBpm)+' '+p.displayRateUnit));chart.appendChild(recommended);}
      if(spacing>=45)chart.appendChild(svg('text',{x:x(i),y:y(p.normalBpm)+25,class:'vgraph-value vgraph-normal-value','text-anchor':'middle'},value(p.normalBpm)));
      if(Number.isFinite(p.recommendedBpm)&&spacing>=45)chart.appendChild(svg('text',{x:x(i),y:y(p.recommendedBpm)-15,class:'vgraph-value vgraph-recommended-value','text-anchor':'middle'},value(p.recommendedBpm)));
      var labelSize=Math.max(10,Math.min(15,spacing/11));
      var labelMaxWidth=Math.max(38,Math.min(spacing*.78,190));
      var labelX=Math.max(labelMaxWidth/2+4,Math.min(width-labelMaxWidth/2-4,x(i)));
      var nameLines=wrapEquipmentName(p.name,labelMaxWidth,labelSize);
      var label=svg('text',{x:labelX,y:bottom+28,class:'vgraph-label','text-anchor':'middle'});
      label.style.fontSize=labelSize+'px';
      nameLines.forEach(function(line,index){
        label.appendChild(svg('tspan',{x:labelX,dy:index===0?0:labelSize*1.13},line));
      });
      label.appendChild(svg('title',{},p.name));chart.appendChild(label);
      if (p.isPacemaker) chart.appendChild(svg('text', {x:x(i), y:height-24, class:'vgraph-reference', 'text-anchor':'middle'}, spacing<45?'★':__ST_TEXT__('performance.reference_short')));
    });
    target.appendChild(chart);
    if(!target._vgraphResize){target._vgraphWidth=target.clientWidth;target._vgraphHeight=height;target._vgraphResize=function(){var nextHeight=Math.max(360,Math.floor((window.innerHeight||700)-target.getBoundingClientRect().top-32));if(target.clientWidth!==target._vgraphWidth||Math.abs(nextHeight-target._vgraphHeight)>2){target._vgraphWidth=target.clientWidth;target._vgraphHeight=nextHeight;plot(target,target._vgraphPoints,target._vgraphRateUnit);}};window.addEventListener('resize',target._vgraphResize);if(window.ResizeObserver){target._vgraphObserver=new ResizeObserver(target._vgraphResize);target._vgraphObserver.observe(target);}}
  }
  function render(result, equipment) {
    if (!document.getElementById('line-performance')) return;
    if(result?.products){document.getElementById('vgraph-context').textContent='Product-specific speed recommendations are pending validation.';document.getElementById('vgraph-plot').replaceChildren();document.getElementById('performance-rows').replaceChildren();document.getElementById('vgraph-caveat').textContent='Use the per-product operating settings and conveyor geometry in Simulation → Configure products. Rates in bpm and cpm cannot be compared directly.';return;}
    var analysis = window.SimulatorEngine.analyzeLinePerformance(equipment, result);
    // The analysis already supplies per-minute values. Only their labels are
    // normalized here; each machine retains its own native output unit.
    var models=new Map((equipment||[]).map(function(model){return [model.id,model];}));
    var points=analysis.points.map(function(point){
      var model=models.get(point.id),unit=result?.equipmentMetrics?.[point.id]?.unitOfFlow
        ||model?.processData?.flowUnits?.output||model?.unitOfFlow||analysis.unitOfFlow;
      return Object.assign({},point,{displayRateUnit:units(unit).rate});
    });
    var rateUnits=Array.from(new Set(points.map(function(point){return point.displayRateUnit;})));
    var rateUnit=rateUnits.length===1?rateUnits[0]:units(analysis.unitOfFlow).rate;
    if(rateUnits.length>1)rateUnit=units('units').rate;
    document.getElementById('vgraph-context').textContent = __ST_TEXT__('performance.context') + (analysis.points.find(function(p) { return p.isPacemaker; })?.name || '—');
    plot(document.getElementById('vgraph-plot'), points,rateUnit);
    document.getElementById('vgraph-caveat').textContent = __ST_TEXT__('performance.recovery_method');
    var tbody = document.getElementById('performance-rows');
    tbody.textContent = '';
    var headings=tbody.closest('table')?.querySelectorAll('thead th');
    // Resource calls must use literal keys so Apps Script resolves them before
    // this module is sent to the browser; there is no client __ST_TEXT__ helper.
    [[1,__ST_TEXT__('performance.normal_bpm')],[2,__ST_TEXT__('performance.maximum_bpm')],
      [3,__ST_TEXT__('performance.recommended_bpm')],[7,__ST_TEXT__('performance.effective_bpm')]].forEach(function(pair){
      if(!headings?.[pair[0]])return;
      var label=el('span',pair[1].replace(/\s*·\s*\/min\s*$/,''));
      headings[pair[0]].replaceChildren(label,document.createTextNode(' · '+rateUnit));
    });
    points.forEach(function(point) {
      var row = el('tr');
      row.title=point.recoveryBasis+' · '+__ST_TEXT__('equipment.recovery_time')+': '+value(point.recoveryTimeSeconds);
      function rate(amount){return value(amount)+(rateUnits.length>1&&Number.isFinite(amount)?' '+point.displayRateUnit:'');}
      [point.name + (point.isPacemaker ? ' · ' + __ST_TEXT__('performance.reference_short') : ''),
        rate(point.normalBpm), rate(point.maximumBpm), rate(point.recommendedBpm)+(point.recommendationExceedsMaximum?' †':''), value(point.speedHeadroomPercent) + (point.speedHeadroomPercent === null ? '' : '%'),
        value(point.availability === null ? null : point.availability * 100) + (point.availability === null ? '' : '%'),
        value(point.runtimeEfficiency === null ? null : point.runtimeEfficiency * 100) + (point.runtimeEfficiency === null ? '' : '%'),
        rate(point.observedBpm)].forEach(function(cell, i) { var item = el('td', cell); if (i) item.className = 'numeric'; row.appendChild(item); });
      tbody.appendChild(row);
    });
    document.getElementById('throughput-method').textContent =
      __ST_TEXT__('performance.method') + ' ' + value(analysis.outputCount) + ' ' + units(analysis.unitOfFlow).count + ' ÷ ' +
      value(analysis.durationSeconds / 60, 3) + ' min = ' + value(analysis.outletBpm) + ' ' + units(analysis.unitOfFlow).rate + '. ' +
      __ST_TEXT__('performance.equipment_note');
    document.getElementById('throughput-method').classList.toggle('hidden',!result||Boolean(result.provisional));
  }
  return {render:render};
})();
</script>
