<style>
/* Componentes reutilizables. Editar variables en DesignTokens.html y
   documentar nuevos tipos en docs/34_UI_VISUAL_STANDARDS.md. */
/* ─── Tipos de tarjetas reutilizables de SimuLine ───
   No se cambia el valor ni la frecuencia de los resultados: CSS-only.
   El relieve aparece únicamente al pasar el puntero, sin will-change. */
.metric-card {min-width:0;border:var(--border-width) solid var(--line);border-radius:var(--radius-md);padding:var(--space-3);background:var(--surface);}
.metric-card--result,#simulation-playback-metrics > article.metric-card--result,#results-kpis .result-kpi,.result-loss-kpis .result-kpi {
  background:var(--surface-soft);border:var(--border-width) solid var(--line-strong);
  border-radius:var(--radius-md);padding:var(--space-3);min-width:0;
}
.metric-card--featured,html[data-ui-mode=basic] #basic-efficiencies > div {
  background:var(--surface-soft);border:var(--border-width) solid var(--line);
  border-top:4px solid var(--accent);border-radius:var(--radius-md);
  padding:var(--space-3);min-width:0;
}
.metric-card--featured > strong {display:block;font-size:var(--font-kpi);line-height:1.15;margin-top:var(--space-2);font-variant-numeric:tabular-nums;}
/* Escenarios conservan franjas propias según la categoría CAPEX. */
.metric-card--scenario {border-inline-start:var(--state-border-width) solid var(--accent);}
.scenario-tier-grid > .metric-card--scenario {border-inline-start-color:var(--muted);}
.scenario-tier-grid > .metric-card--scenario:has(.analysis-capex[data-tier=ZERO]) {border-inline-start-color:var(--capex-zero);}
.scenario-tier-grid > .metric-card--scenario:has(.analysis-capex[data-tier=MEDIUM]) {border-inline-start-color:var(--capex-medium);}
.scenario-tier-grid > .metric-card--scenario:has(.analysis-capex[data-tier=HIGH]) {border-inline-start-color:var(--capex-high);}
.metric-card--status {background:var(--surface-soft);}
/* El grid conserva las tarjetas de resultado compactas; sólo las eficiencias son destacadas. */
#simulation-playback-metrics > article > span {display:block;font-size:var(--font-secondary);color:var(--muted);}
#simulation-playback-metrics > article.metric-card--result > strong,
.metric-card--result > strong {
  display:block;font-size:var(--font-section);line-height:1.25;
  font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums;
  margin-block-start:var(--space-2);
}
/* Input and output use the same fixed-size unit slot, independent of the selected unit's text width. */
.time-value-control {gap:var(--time-unit-gap)!important;}
.time-value-control > input[type=number] {padding-inline-end:var(--space-1)!important;}
.time-value-control > select {flex:0 0 var(--time-unit-slot)!important;width:var(--time-unit-slot)!important;min-width:var(--time-unit-slot)!important;max-width:var(--time-unit-slot)!important;box-sizing:border-box;text-align:start!important;text-align-last:start!important;padding-inline:0!important;}
.st-time-output,.time-output-value {gap:var(--time-unit-gap)!important;align-items:baseline;}
:is(.st-time-output,.live-equipment-card .st-time-output[data-variant=metric]) > .st-time-unit {
  flex:0 0 var(--time-unit-slot)!important;width:var(--time-unit-slot)!important;
  min-width:var(--time-unit-slot)!important;max-width:var(--time-unit-slot)!important;
  box-sizing:border-box;text-align:start!important;text-align-last:start!important;
  padding:0!important;margin:0!important;height:auto!important;min-height:0!important;
  background:transparent!important;border:0!important;
}
/* STTimeControls.output inherits its parent card's value style, including nested b. */
.metric-card--result > strong .st-time-output,
.metric-card--result > strong .st-time-output b {font-size:inherit!important;font-weight:inherit!important;line-height:inherit!important;color:inherit;}
/* Value & Unit share one typographic scale and baseline in every reusable time control. */
.time-value-control > input[type=number],
.time-value-control > select {font-size:inherit!important;line-height:inherit!important;font-weight:inherit!important;}
.st-time-output > b,
.st-time-output > .st-time-unit {
  font-size:inherit!important;font-weight:inherit!important;line-height:inherit!important;
  vertical-align:baseline!important;
}
.metric-card--result > strong .st-time-output select {font-size:inherit!important;font-weight:inherit!important;line-height:inherit!important;color:var(--muted);vertical-align:baseline!important;}
@media(hover:hover) and (pointer:fine) {
  :is(.metric-card--result,.metric-card--featured,.metric-card--scenario,
       #simulation-playback-metrics > article,#results-kpis .result-kpi,
       .result-loss-kpis .result-kpi,.scenario-tier-grid > .analysis-recommendation) {
    transition:box-shadow 140ms ease,transform 140ms ease;
  }
  :is(.metric-card--result,.metric-card--featured,.metric-card--scenario,
       #simulation-playback-metrics > article,#results-kpis .result-kpi,
       .result-loss-kpis .result-kpi,.scenario-tier-grid > .analysis-recommendation):hover {
    box-shadow:0 5px 14px color-mix(in srgb,var(--ink) 11%,transparent);
    transform:translateY(-1px);
  }
}
@media(prefers-reduced-motion:reduce) {
  :is(.metric-card--result,.metric-card--featured,.metric-card--scenario,
       #simulation-playback-metrics > article,#results-kpis .result-kpi,
       .result-loss-kpis .result-kpi,.scenario-tier-grid > .analysis-recommendation) {
    transition:none!important;transform:none!important;
  }
}
/* Pestaña de navegación principal: nombre reutilizable sin alterar acciones. */
.app-section-tab {
  color:var(--muted);background:transparent;border-color:transparent;
}
.app-section-tab[aria-current=page] {
  color:var(--selected-text);background:var(--selected);
  border-bottom-color:var(--accent);
}
.app-section-tab:focus-visible {outline:var(--focus-width) solid var(--accent);outline-offset:2px;}
/* Barra de iconos: botones homogéneos en Header y menú Basic. */
:is(.topbar,#basic-case-actions) button.icon-button {
  width:var(--control-height);height:var(--control-height);
  min-width:var(--control-height);min-height:var(--control-height);
  flex-shrink:0;padding:0;border:var(--border-width) solid var(--line-strong);
  border-radius:var(--radius-md);background:var(--surface);box-shadow:none;
  color:var(--muted);
}
:is(.topbar,#basic-case-actions) button.icon-button:not(:disabled):hover {
  color:var(--accent);border-color:var(--accent);background:var(--surface-hover);
}
:is(.topbar,#basic-case-actions) button.icon-button:focus-visible {
  outline:var(--focus-width) solid var(--accent);outline-offset:2px;
}
.topbar #pin-header[aria-pressed=true],
.topbar #save-case.has-changes {background:var(--selected);color:var(--accent);}
/* Header global de errores: señal roja de alta prioridad en ambos temas,
   por encima de las reglas genéricas de botones del Header. */
#header-errors:not(.hidden) {position:relative;display:inline-flex;align-items:center;margin-inline:var(--space-1);}
#header-errors:not(.hidden) #header-error-button {
  background:var(--danger)!important;color:var(--page)!important;
  border:2px solid var(--danger)!important;
  box-shadow:0 0 0 2px var(--danger-soft)!important;
}
#header-errors:not(.hidden) #header-error-button:is(:hover,:focus-visible) {
  background:var(--danger)!important;color:var(--page)!important;
  border-color:var(--danger)!important;
  box-shadow:0 0 0 3px var(--danger-soft)!important;
}
#header-errors:not(.hidden) #header-error-button:focus-visible {
  outline:var(--focus-width) solid var(--danger)!important;outline-offset:4px;
}
#header-errors:not(.hidden)::after {
  content:attr(data-count);pointer-events:none;position:absolute;
  inset-block-start:-6px;inset-inline-end:-7px;z-index:1;
  display:grid;place-items:center;min-width:17px;height:17px;
  padding-inline:2px;border-radius:var(--radius-pill);
  color:var(--danger);background:var(--surface);border:1px solid var(--danger);
  font-size:var(--font-caption);font-weight:var(--weight-bold);
}
#whatif-subsection .simulation-analysis {margin:0;padding:0;border:0;background:transparent;}
#whatif-subsection .whatif-context {margin:0 0 var(--space-3);max-width:100%;}
#whatif-subsection .fold-heading .fold-tools {margin-inline-start:auto;}
/* Eficiencias de Simulation Playback: la variante tiene prioridad incluso
   frente a reglas antiguas de #basic-efficiencies en modos Basic y Advance. */
#simulation-playback-efficiencies #basic-efficiencies > .metric-card--featured,
#basic-run-options #basic-efficiencies > .metric-card--featured {
  display:flex;flex-direction:column;align-items:flex-start;
  gap:var(--space-2);min-width:0;
  background:var(--surface-soft);border:var(--border-width) solid var(--line);
  border-top:4px solid var(--accent)!important;border-radius:var(--radius-md);
  padding:var(--space-3);box-shadow:0 2px 7px color-mix(in srgb,var(--ink) 7%,transparent);
}
#simulation-playback-efficiencies #basic-efficiencies > .metric-card--featured > span,
#basic-run-options #basic-efficiencies > .metric-card--featured > span {
  color:var(--muted);font-size:var(--font-secondary);font-weight:var(--weight-medium);
}
#simulation-playback-efficiencies #basic-efficiencies > .metric-card--featured > strong,
#basic-run-options #basic-efficiencies > .metric-card--featured > strong {
  display:block;margin:0;font-size:var(--font-kpi);font-weight:var(--weight-semibold);
  line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;
}

</style>
