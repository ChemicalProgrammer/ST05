<dialog id="equipment-analysis-dialog" aria-labelledby="equipment-analysis-title">
  <header class="dialog-heading">
    <h2 id="equipment-analysis-title">Equipment Analysis Tool</h2>
    <div class="button-row equipment-analysis-actions">
      <details id="equipment-analysis-export-menu" class="export-menu">
        <summary class="secondary icon-button" data-icon="upload" aria-label="Export equipment evaluations" title="Export equipment evaluations" aria-expanded="false"></summary>
        <div>
          <button id="equipment-analysis-export-one" class="ghost" type="button">This equipment (JSON)</button>
          <button id="equipment-analysis-export-all" class="ghost" type="button">All equipment (JSON)</button>
        </div>
      </details>
      <button id="equipment-analysis-close" type="button" class="ghost icon-button" data-icon="x" aria-label="Close equipment analysis" title="Close equipment analysis"></button>
    </div>
  </header>
  <div id="equipment-analysis-body" class="dialog-body"></div>
</dialog>
<style>
/* The diagram's natural width defines the desktop dialog, not the tables. */
#equipment-analysis-dialog {
  --intervention-chart-width:735px;
  --dialog-width:calc(var(--intervention-chart-width) + 2 * var(--space-5) + 2 * var(--subsection-padding) + var(--space-6));
  width:min(var(--dialog-width),calc(100vw - var(--space-6)));
  max-height:calc(100dvh - var(--space-6));box-sizing:border-box;
}
#equipment-analysis-dialog .dialog-heading {gap:var(--space-3);}
#equipment-analysis-dialog .dialog-heading h2 {min-width:0;overflow-wrap:anywhere;}
#equipment-analysis-dialog .equipment-analysis-actions {margin:0;flex-shrink:0;flex-wrap:nowrap;align-items:center;}
#equipment-analysis-dialog .equipment-analysis-actions .export-menu {margin:0;}
#equipment-analysis-dialog .equipment-analysis-actions .export-menu > div {min-width:13rem;}
#equipment-analysis-dialog[open] { overflow:hidden; }
#equipment-analysis-body { min-width:0; overflow:auto; display:grid; grid-template-columns:minmax(0,1fr); align-content:start; gap:var(--subsection-gap,var(--space-4)); }
#equipment-analysis-body > .st-subsection { min-width:0; margin:0; padding:var(--subsection-padding); }
#equipment-analysis-body .st-subsection > .fold-content { display:grid; gap:var(--space-3); min-width:0; }
#equipment-analysis-body > .st-subsection:not([open]) {padding-block-end:0;}
#equipment-analysis-body > .st-subsection:not([open]) > .fold-content {display:none;}
#equipment-analysis-body > .st-subsection:not([open]) > summary.st-subsection-header {border-block-end:0;border-radius:calc(var(--radius-md) - var(--border-width));}
#equipment-analysis-body .chart-note { margin:0; }
/* Tables fill the subsection; shared column widths keep all tables aligned
   regardless of the length of their labels, values or conveyor names. */
#equipment-analysis-body .table-scroll {
  justify-self:stretch;width:100%;min-width:0;max-width:100%;
  box-sizing:border-box;overflow-x:auto;margin:0;
}
#equipment-analysis-body .intervention-chart-scroll { overflow-x:auto; min-width:0; }
#equipment-analysis-body .intervention-chart { display:block; width:100%; min-width:480px; max-width:var(--intervention-chart-width); height:auto; margin-inline:auto; font-family:inherit; color:var(--ink); }
#equipment-analysis-body .intervention-chart {
  --matrix-joint-fill:color-mix(in srgb,#e34c59 30%,var(--surface));
  --matrix-mttr-fill:color-mix(in srgb,#ef9836 29%,var(--surface));
  --matrix-mtbf-fill:color-mix(in srgb,#e4bf2d 29%,var(--surface));
  --matrix-keep-fill:color-mix(in srgb,#35b578 29%,var(--surface));
}
#equipment-analysis-body .intervention-chart text { fill:currentColor; }
#equipment-analysis-body .intervention-chart .zone-content {
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:100%;height:100%;box-sizing:border-box;gap:4px;text-align:center;
  color:var(--ink);pointer-events:none;
}
#equipment-analysis-body .intervention-chart .zone-title {
  display:flex;align-items:center;justify-content:center;gap:6px;
  max-width:100%;font-size:14px;font-weight:var(--weight-semibold);line-height:1.15;
  color:var(--ink);pointer-events:none;
}
#equipment-analysis-body .intervention-chart .zone-title .icon {
  width:16px;height:16px;flex:none;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
}
#equipment-analysis-body .intervention-chart .zone-detail {
  max-width:100%;font-size:11px;line-height:1.45;text-align:center;
}
#equipment-analysis-body .intervention-chart .axis-text { font-size:11px; }
#equipment-analysis-body .intervention-chart .axis-title { font-size:13px; font-weight:600; }
#equipment-analysis-body .intervention-chart .chart-grid { stroke:var(--line); stroke-width:1; opacity:.75; }
#equipment-analysis-body .intervention-chart .chart-boundary { stroke:var(--ink); stroke-width:1.3; opacity:.6; }
#equipment-analysis-body .intervention-chart .availability-line { stroke:var(--secondary-text,var(--ink)); stroke-width:2; stroke-dasharray:6 5; }
/* Vivid traffic-light colors for chart markers and their matching legends.
   Keep semantic text/badge colors elsewhere in the app unchanged. */
#equipment-analysis-body .matrix-status-pass { --matrix-point-color:#22c55e; }
#equipment-analysis-body .matrix-status-review { --matrix-point-color:#f97316; }
#equipment-analysis-body .matrix-status-fail { --matrix-point-color:#ef4444; }
#equipment-analysis-body .matrix-status-unknown { --matrix-point-color:var(--muted); }
#equipment-analysis-body .intervention-chart .equipment-point { fill:var(--matrix-point-color); stroke:var(--surface); stroke-width:1.5; opacity:.90; }
#equipment-analysis-body .intervention-chart .equipment-point[data-current-equipment=true] { opacity:1;stroke-width:2; }
#equipment-analysis-body .intervention-chart .equipment-point {cursor:default;}
#equipment-analysis-body .intervention-chart .equipment-point-ring { fill:none; stroke:var(--ink); stroke-width:1.5; pointer-events:none; }
#equipment-analysis-body .intervention-chart .equipment-point-label {
  font-size:12px;font-weight:var(--weight-semibold);stroke:var(--surface);stroke-width:3;
  paint-order:stroke fill;stroke-linejoin:round;pointer-events:none;
}
#equipment-analysis-body .intervention-keys {
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  align-items:start;gap:0;width:100%;min-width:0;
}
#equipment-analysis-body .intervention-key-column {display:grid;align-content:start;gap:var(--space-2);min-width:0;box-sizing:border-box;}
#equipment-analysis-body .intervention-key-column:first-child {padding-inline-end:var(--space-4);}
#equipment-analysis-body .intervention-key-heading {
  display:grid;grid-template-columns:24px minmax(0,1fr);align-items:center;
  gap:var(--space-2);font-size:var(--font-secondary);
  font-weight:var(--weight-semibold);color:var(--secondary-text,var(--ink));
}
#equipment-analysis-body .intervention-key-heading .icon {justify-self:center;width:var(--font-body);height:var(--font-body);}
#equipment-analysis-body :is(.intervention-legend,.intervention-equipment-key) {
  display:grid;align-content:start;gap:var(--space-1);list-style:none;
  margin:0;padding:0;min-width:0;font-size:var(--font-secondary);
}
#equipment-analysis-body .intervention-legend-item {
  display:grid;grid-template-columns:24px minmax(0,1fr);align-items:start;
  gap:var(--space-2);min-width:0;overflow-wrap:anywhere;line-height:1.5;
}
#equipment-analysis-body .intervention-legend-item > :first-child {justify-self:center;}
#equipment-analysis-body .intervention-legend-item .intervention-dot {margin-block-start:.28em;}
#equipment-analysis-body .intervention-legend-item .intervention-line {margin-block-start:.65em;}
@media (max-width:420px) {
  #equipment-analysis-body .intervention-key-column:first-child {padding-inline-end:var(--space-2);}
}
#equipment-analysis-body .intervention-dot { display:inline-block; width:10px; height:10px; background:var(--matrix-point-color,var(--muted)); border:1px solid var(--ink); border-radius:50%; flex:none; }
#equipment-analysis-body .intervention-dot.is-current {width:12px;height:12px;outline:1px solid var(--ink);outline-offset:2px;}
#equipment-analysis-body .intervention-dot.is-unplotted {background:transparent;border:1px dashed var(--muted);}
#equipment-analysis-body .intervention-equipment-key [data-current-equipment=true] {font-weight:var(--weight-semibold);}
#equipment-analysis-body .intervention-line { display:inline-block; width:24px; border-top:2px dashed var(--secondary-text,var(--ink)); flex:none; }
#equipment-analysis-body .intervention-current {
  margin:0;font-size:var(--font-body);font-weight:var(--weight-regular);
  line-height:var(--leading-body);color:var(--ink);overflow-wrap:anywhere;
}
#equipment-analysis-body table { width:100%; max-width:100%; table-layout:fixed; }
#equipment-analysis-body col.analysis-table-parameter-col {width:42%;}
#equipment-analysis-body col.analysis-table-value-col {width:46%;}
#equipment-analysis-body col.analysis-table-unit-col {width:12%;}
#equipment-analysis-body :is(td,th) {
  padding:var(--space-2);overflow-wrap:anywhere;vertical-align:middle;
}
#equipment-analysis-body tbody th[scope=row] {text-align:start;white-space:normal;}
#equipment-analysis-body thead th {white-space:normal;}
#equipment-analysis-body thead th:not(:first-child) { text-align:center; }
#equipment-analysis-body thead th:nth-child(2) {text-align:end;}
#equipment-analysis-body td.analysis-table-value {text-align:start;white-space:normal;overflow-wrap:anywhere;}
#equipment-analysis-body td.analysis-table-value.numeric { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
#equipment-analysis-body td.analysis-table-unit {
  display:table-cell;white-space:normal;overflow-wrap:anywhere;text-align:center;vertical-align:middle;
  line-height:inherit;font-size:inherit;font-weight:inherit;color:var(--unit-color);margin:0;
}
.equipment-analysis-pill.st-status-pill { position:static; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted); background:var(--stopped-soft); width:max-content; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.equipment-analysis-pill.st-status-pill.is-pass { background:var(--success-soft); color:var(--success); }
.equipment-analysis-pill.st-status-pill.is-fail { background:var(--failure-soft); color:var(--danger); }
.equipment-analysis-pill.st-status-pill.is-review { background:var(--starved-soft); color:var(--warning); }
.equipment-analysis-pill[hidden] { display:none!important; }
.equipment-analysis-pill:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
#equipment-analysis-body .equipment-analysis-pill { cursor:default; margin:0; vertical-align:middle; }
.live-equipment-card .numeric-equipment-header .equipment-analysis-pill { align-self:flex-start; }
.simulation2d-analysis-action.equipment-analysis-pill { position:absolute; width:max-content; max-width:none; overflow:visible; text-overflow:clip; }
</style>
<script>
window.STEquipmentAnalysis=(function(){
  'use strict';
  const dialog=document.getElementById('equipment-analysis-dialog'),body=document.getElementById('equipment-analysis-body');
  const es=()=>window.STLanguage?.current()==='es'||document.documentElement.lang==='es';
  const t=(en,spanish)=>es()?spanish:en;
  const statusText=status=>({
    'PASS':t('PASS','CUMPLE'),'FAIL':t('FAIL','NO CUMPLE'),'REVIEW':t('REVIEW','REVISAR'),
    'NOT EVALUATED':t('NOT EVALUATED','NO EVALUADO')
  })[status]||status;
  const actionText=action=>({
    KEEP_MONITOR:t('Keep / monitor','Conservar / monitorear'),
    IMPROVE_MTBF:t('Improve MTBF — reduce failure frequency','Mejorar MTBF — reducir frecuencia de fallas'),
    IMPROVE_MTTR:t('Improve MTTR — reduce repair duration','Mejorar MTTR — reducir tiempo de reparación'),
    JOINT_RELIABILITY_REVIEW:t('Review both MTBF and MTTR','Revisar MTBF y MTTR conjuntamente'),
    REBUILD_OR_REPLACE_REVIEW:t('Investigate rebuild or replacement','Investigar reconstrucción o reemplazo'),
    NOT_EVALUATED:t('Insufficient active reliability inputs','Sin datos activos suficientes de confiabilidad')
  })[action]||action;
  const reasonText=reason=>({
    NO_MODELED_FAILURES:t('No active MTBF/MTTR model is configured; this is not evidence of perfect reliability.','No hay un modelo MTBF/MTTR activo; esto no demuestra confiabilidad perfecta.'),
    INVALID_INPUTS:t('MTBF and MTTR require valid positive values or an explicitly inactive 0/0 class.','MTBF y MTTR requieren valores positivos válidos o una clase explícitamente inactiva 0/0.'),
    FAILURES_DISABLED:t('Reliability failures are disabled in this run.','Las fallas de confiabilidad están desactivadas en esta ejecución.'),
    CATEGORIES_DISABLED:t('All configured failure categories are disabled.','Todas las categorías de falla configuradas están desactivadas.'),
    NOT_APPLICABLE:t('Equipment does not apply to this format.','El equipo no aplica para este formato.'),
    CONVEYOR:t('Use Conveyor Analysis Tool.','Utiliza el análisis de conveyor.'),
    BELOW_TARGET:t('Inherent availability is below the screening target.','La disponibilidad inherente está por debajo de la meta de evaluación.'),
    PATTERN_REVIEW:t('Availability meets target, but frequency or duration merits review.','La disponibilidad cumple la meta, pero la frecuencia o duración requiere revisión.'),
    TARGET_MET:t('Configured reliability meets all screening targets.','La confiabilidad configurada cumple las metas de evaluación.')
  })[reason]||'';
  const severityText=severity=>({
    EXCELLENT:t('Excellent','Excelente'),VERY_GOOD:t('Very good','Muy buena'),GOOD:t('Good','Buena'),
    FAIR:t('Needs improvement','Mejorable'),POOR:t('Poor','Deficiente'),CRITICAL:t('Critical','Crítica'),SEVERE:t('Severe','Severa')
  })[severity]||'—';
  const classText=kind=>({GENERAL:t('General','General'),MINOR:t('Minor','Menor'),MAJOR:t('Major','Mayor')})[kind]||kind;
  const fmt=(v,d=2)=>Number.isFinite(v)?new Intl.NumberFormat(es()?'es-MX':'en-US',{maximumFractionDigits:d}).format(v):'—';
  const pct=v=>Number.isFinite(v)?v*100:null;
  const minutes=v=>Number.isFinite(v)?v/60:null;
  function paint(button,assessment){
    const status=assessment?.status||'NOT EVALUATED',label=statusText(status);
    const tip=t('Open equipment analysis','Abrir análisis de equipo')+' · '+label+' · '+actionText(assessment?.action||'NOT_EVALUATED')+(reasonText(assessment?.reason)?' · '+reasonText(assessment.reason):'');
    if(button.textContent!==label)button.textContent=label;
    if(button.title!==tip){button.title=tip;button.setAttribute('aria-label',tip);}
    button.classList.toggle('is-pass',status==='PASS');
    button.classList.toggle('is-fail',status==='FAIL');
    button.classList.toggle('is-review',status==='REVIEW');
    button.dataset.evaluation=status;
  }
  function createButton(open){
    const button=document.createElement('button');button.type='button';button.className='equipment-analysis-pill st-status-pill';
    button.setAttribute('aria-haspopup','dialog');button.setAttribute('aria-controls','equipment-analysis-dialog');
    button.addEventListener('click',event=>{event.stopPropagation();open();});
    paint(button,null);return button;
  }
  function assess(equipment,config){return window.STScenarios.equipmentReliability(equipment,config);}
  function make(parent,tag,text){
    const element=document.createElement(tag);if(text!==undefined)element.textContent=text;parent.append(element);return element;
  }
  function note(parent,text){make(parent,'p',text).className='chart-note';}
  const zeroReliabilityPair=p=>p?.mtbfMinutes===0&&p?.mttrMinutes===0;
  function reliabilityInactive(r,e){
    const rel=e?.noiseProfile?.reliability,split=e?.processData?.equipment?.stopInputs;
    return ['FAILURES_DISABLED','CATEGORIES_DISABLED','NOT_APPLICABLE','CONVEYOR'].includes(r.reason)||
      r.reason==='NO_MODELED_FAILURES'&&(split?zeroReliabilityPair(split.minor)&&zeroReliabilityPair(split.major):zeroReliabilityPair(rel));
  }
  // Share applicability between completeness and rendering. A missing audit
  // on an adjacent conveyor is missing evidence, not a physical absence.
  function bufferDirections(r,equipment,simulation){
    const line=simulation?.equipment||[],index=line.findIndex(item=>item.id===equipment?.id);
    const belt=item=>item?.type==='CONVEYOR'||item?.processData?.role==='CONVEYOR';
    return ['UPSTREAM','DOWNSTREAM'].map(direction=>{
      const coverage=r.bufferCoverage.find(c=>c.direction===direction);
      const auditedIds=coverage?.conveyorIds||[];
      const adjacent=index<0?null:line[index+(direction==='UPSTREAM'?-1:1)];
      const connectedIds=auditedIds.length?auditedIds:belt(adjacent)&&adjacent.id!=null?[adjacent.id]:[];
      return {direction,coverage,connectedIds,notApplicable:index>=0&&!belt(adjacent)&&!auditedIds.length};
    });
  }
  // Evaluate evidence completeness, not the reliability verdict. Default
  // screening thresholds and status strings are not evidence of a completed
  // analysis; zero measured counts and negative CAPEX effects are valid data.
  function sectionProgress(r,equipment,simulation){
    const summarize=window.STSubsection.summarizeAnalysisValues;
    const cell=(label,value,notApplicable=false)=>({label,value,notApplicable});
    const result=(cells,reason='',emptyStatus='MISSING')=>({...summarize(cells,emptyStatus),reason});
    const na=reason=>result([],reason,'NOT_APPLICABLE');
    const noData=reason=>result([],reason);
    const e=equipment||{},config=simulation?.dynamicConfig||simulation?.run||{};
    const rel=e.noiseProfile?.reliability,split=e.processData?.equipment?.stopInputs,categories=config.reliabilityCategories||{};
    const zero=zeroReliabilityPair,inactive=reliabilityInactive(r,e);
    const why=reasonText(r.reason);
    const rawPairs=split?[['MINOR',split.minor],['MAJOR',split.major]].filter(([kind])=>categories[kind.toLowerCase()]!==false):[['GENERAL',rel]];
    const rawCells=rawPairs.filter(([,pair])=>!zero(pair)).flatMap(([kind,pair])=>[
      cell(classText(kind)+' · MTBF',pair?.mtbfMinutes>0?pair.mtbfMinutes:null),
      cell(classText(kind)+' · MTTR',pair?.mttrMinutes>0?pair.mttrMinutes:null)
    ]);
    const validAssessment=r.status!=='NOT EVALUATED'&&r.mtbfMinutes>0&&r.mttrMinutes>0;
    const effective=[cell('MTBF',r.mtbfMinutes),cell('MTTR',r.mttrMinutes)];
    const matrix=inactive?na(why):validAssessment?result(effective):
      result([...rawCells,cell(t('Effective MTBF','MTBF efectivo'),null),cell(t('Effective MTTR','MTTR efectivo'),null)],why);
    const reliabilityCells=[...effective,
      cell(t('Inherent availability','Disponibilidad inherente'),r.availability),
      cell(t('Inherent unavailability','Indisponibilidad inherente'),r.unavailability),
      cell('MTBF / MTTR',r.ratio),
      cell(t('Failures per operating hour','Fallas por hora de operación'),r.failuresPerOperatingHour),
      cell(t('Expected failures per 24 h','Fallas esperadas por 24 h'),r.failuresPerDay),
      cell(t('Expected downtime per 24 h','Tiempo teórico de falla por 24 h'),r.downtimeMinutesPerDay)];
    const reliability=inactive?na(why):result(validAssessment?reliabilityCells:[...rawCells,...reliabilityCells],why);
    const p=r.thresholds||{};
    const targets=inactive?na(why):result([
      cell(t('Availability target','Meta de disponibilidad'),p.availabilityTarget),
      cell(t('Minimum MTBF reference','Referencia mínima MTBF'),p.mtbfTargetMinutes),
      cell(t('Maximum MTTR reference','Referencia máxima MTTR'),p.mttrTargetMinutes),
      cell(t('Required MTBF at current MTTR','MTBF requerido con MTTR actual'),r.requiredMtbfMinutes),
      cell(t('Maximum MTTR at current MTBF','MTTR máximo con MTBF actual'),r.requiredMttrMinutes),
      cell(t('Required MTBF improvement factor','Factor de incremento requerido de MTBF'),r.mtbfImprovementFactor),
      cell(t('Required MTTR reduction','Reducción requerida de MTTR'),r.mttrReductionPercent)
    ],validAssessment?'':t('Screening references are available, but improvement gaps require valid MTBF and MTTR.','Las referencias están disponibles, pero las brechas requieren MTBF y MTTR válidos.'));
    const classes=inactive?na(why):r.classes.length?result(r.classes.flatMap(c=>[
      cell(classText(c.kind)+' · MTBF',c.mtbfMinutes),cell(classText(c.kind)+' · MTTR',c.mttrMinutes),
      cell(classText(c.kind)+' · '+t('Event share','Proporción de eventos'),c.eventShare)
    ])):result([...rawCells,cell(t('Active failure class model','Modelo de categorías activas'),null)],why);
    const buffers=bufferDirections(r,e,simulation).flatMap(({direction,coverage:item,notApplicable})=>{
      const prefix=direction==='UPSTREAM'?t('Upstream','Aguas arriba'):t('Downstream','Aguas abajo');
      return [
        cell(prefix+' · '+t('Design coverage time','Tiempo de cobertura'),item?.seconds,notApplicable),
        cell(prefix+' · FCR',item?.ratio,notApplicable),
        ...(item?.classCoverage||[]).map(c=>cell(prefix+' · FCR '+classText(c.kind),c.ratio,notApplicable))
      ];
    });
    const buffer=inactive?na(why):result(buffers,t('Coverage requires a valid MTTR and resolved adjacent conveyor geometry. A direction with no connected conveyor is not applicable.','La cobertura requiere MTTR válido y geometría de conveyors adyacentes resuelta. Una dirección sin conveyor conectado no aplica.'));
    const c=r.capacity;
    const capacity=result([
      cell(t('Configured output rate','Velocidad configurada'),c?.configuredRatePerMinute),
      cell(t('Installed maximum rate','Velocidad máxima instalada')+' ('+t('optional','opcional')+')',c?.maximumRatePerMinute),
      cell(t('Line reference rate','Velocidad de referencia de línea'),c?.referenceRatePerMinute),
      cell(t('Availability-only output rate','Velocidad equivalente por disponibilidad'),c?.availabilityOnlyRatePerMinute,inactive),
      cell(t('Availability-only deficit vs reference','Déficit por disponibilidad vs referencia'),c?.availabilityOnlyDeficit,inactive)
    ],t('The maximum speed is optional. Availability-adjusted capacity requires active reliability and a comparable line reference.','La velocidad máxima es opcional. La capacidad ajustada requiere confiabilidad activa y una referencia de línea comparable.'));
    const o=r.observed;
    const observed=o?result([
      cell(t('Observed horizon','Horizonte observado'),o.durationSeconds),
      cell(t('Own failures','Fallas propias'),o.failureCount),
      cell(t('Own failure time','Tiempo en falla propia'),o.failureSeconds),
      cell(t('Own failure share of horizon','Porcentaje del horizonte en falla propia'),o.failurePercent),
      cell(t('Observed reliability exposure per failure','Exposición observada por falla'),o.observedExposurePerFailureMinutes,o.failureCount===0),
      cell(t('Observed fault time per failure','Tiempo observado en falla por evento'),o.observedFaultTimePerFailureMinutes,o.failureCount===0),
      cell(t('Micro-stop time','Tiempo de microparos'),o.microStopSeconds),
      cell(t('Starved time','Tiempo Starved'),o.starvedSeconds),
      cell(t('Blocked time','Tiempo Blocked'),o.blockedSeconds),
      cell(t('Waiting for Prime','Espera de Prime'),o.waitingForPrimeSeconds),
      cell(t('Back-up stop','Paro Back-up'),o.backupStopSeconds)
    ],t('Only reported observations count as evidence. Per-failure ratios are not applicable when no failures occurred.','Solo las observaciones registradas cuentan como evidencia. Las relaciones por falla no aplican cuando no hubo eventos.')):
      noData(t('Run a simulation or load a compatible completed result.','Ejecuta una simulación o carga un resultado terminado compatible.'));
    const x=r.counterfactual;
    const impact=x?result([
      cell(t('Conditional OEE gain without own failures','Ganancia condicional de OEE sin fallas propias'),x.deltaOeePp),
      cell(t('Conditional throughput gain','Ganancia condicional de throughput'),x.deltaThroughput),
      cell(t('Exploration duration','Duración de exploración'),x.run?.durationSeconds),
      cell(t('Replications','Réplicas'),x.run?.rounds)
    ],t('Completeness refers only to the displayed CAPEX experiment. Technical and economic feasibility still require independent validation.','La completitud se refiere solo al experimento CAPEX mostrado. La factibilidad técnica y económica aún requiere validación independiente.')):

  const matrixStatusClass=status=>({PASS:'matrix-status-pass',REVIEW:'matrix-status-review',FAIL:'matrix-status-fail'}[status]||'matrix-status-unknown');
  function matrixDataset(context){
    const {report,equipment,simulation}=context;
    const config=simulation.dynamicConfig||simulation.run||{};
    return (simulation.equipment||[]).filter(machine).map(e=>({
      id:e.id,name:e.name||e.id,isCurrent:e.id===equipment.id,

  function matrixTooltip(item){
    const r=item.report;
    if(!validMatrixPoint(r))return [item.name,statusText(r.status),reasonText(r.reason)].filter(Boolean).join(' · ');
    return item.name+' · '+statusText(r.status)+' · MTBF '+fmt(r.mtbfMinutes)+' min · MTTR '+fmt(r.mttrMinutes)+' min · Ai '+fmt(pct(r.availability))+'%';
  }
  // One logarithmic coordinate system for the entire line. Keep the screening
  // thresholds at the quadrant boundaries and expand for every valid machine.
  function matrixGeometry(report,dataset){
    const p=report.thresholds,valid=validMatrixPoint(report);
    const validReports=dataset.filter(item=>validMatrixPoint(item.report)).map(item=>item.report);
    const xSpan=validReports.reduce((span,r)=>Math.max(span,Math.ceil(Math.abs(Math.log10(r.mtbfMinutes)-Math.log10(p.mtbfTargetMinutes))+.2)),1);
    const ySpan=validReports.reduce((span,r)=>Math.max(span,Math.ceil(Math.abs(Math.log10(r.mttrMinutes)-Math.log10(p.mttrTargetMinutes))+.2)),1);
    const bounds={left:75,right:705,top:22,bottom:316};
    const {left,right,top,bottom}=bounds,midX=(left+right)/2,midY=(top+bottom)/2;
    const xMin=Math.log10(p.mtbfTargetMinutes)-xSpan,xMax=xMin+2*xSpan;
    const yMin=Math.log10(p.mttrTargetMinutes)-ySpan,yMax=yMin+2*ySpan;
    const x=log=>left+(log-xMin)/(xMax-xMin)*(right-left);
    const y=log=>bottom-(log-yMin)/(yMax-yMin)*(bottom-top);
    const logRatio=Math.log10((1-p.availabilityTarget)/p.availabilityTarget);
    const a=Math.max(xMin,yMin-logRatio),b=Math.min(xMax,yMax-logRatio);
    return {bounds,midX,midY,x,y,xMin,xMax,yMin,yMax,xSpan,ySpan,
      target:a<=b?{x1:x(a),y1:y(a+logRatio),x2:x(b),y2:y(b+logRatio)}:null,
      point:valid?{x:x(Math.log10(report.mtbfMinutes)),y:y(Math.log10(report.mttrMinutes))}:null};
  }

  function renderBufferCoverage(host,r,equipment,simulation){
    if(reliabilityInactive(r,equipment)){

      return;
    }
    const directions=bufferDirections(r,equipment,simulation);
    const conveyorNames=new Map((simulation?.equipment||[]).map(e=>[e.id,typeof e.name==='string'?e.name.trim():'']));
    for(const {direction,coverage:c,connectedIds,notApplicable} of directions){
      const upstream=direction==='UPSTREAM';
      const label=upstream?t('Upstream — anti-block','Aguas arriba — anti-block'):t('Downstream — anti-starve','Aguas abajo — anti-starve');
      if(notApplicable){

          t('No downstream conveyor connected.','No hay conveyor conectado aguas abajo.');
        note(host,label+' · '+t('Not applicable','No aplica')+': '+reason);
        continue;
      }
      const names=connectedIds.map(id=>conveyorNames.get(id)||t('Unnamed conveyor','Conveyor sin nombre')).join(', ');
      const classes=c?.classCoverage||[];
      const hasMetrics=[c?.seconds,c?.ratio,...classes.map(v=>v.ratio)].some(Number.isFinite);
      const missingReason=!(r.mttrMinutes>0)?t('Valid active MTBF and MTTR are required.','Se necesitan MTBF y MTTR activos y válidos.'):

          (names?' '+t('Connected conveyors','Conveyors conectados')+': '+names+'.':''));
        continue;

    const coverage=bufferDirections(r,e,simulation).map(({direction,coverage:c,connectedIds,notApplicable})=>{
      const excluded=inactive||notApplicable;
      return {direction,applicable:!excluded,status:excluded?'NOT_APPLICABLE':c?.status||'NOT EVALUATED',
        reason:inactive?r.reason:notApplicable?'NO_CONNECTED_CONVEYOR':c?.status==='PASS'||c?.status==='FAIL'?null:
          !(r.mttrMinutes>0)?'MISSING_ACTIVE_RELIABILITY_INPUTS':'UNRESOLVED_CONVEYOR_GEOMETRY',
        connectedConveyors:connectedIds.map(id=>({id,name:names.get(id)||null})),
        seconds:c?.seconds??null,ratio:c?.ratio??null,classCoverage:c?.classCoverage||[],basis:c?.basis??null};
    });
    return {equipmentId:e.id,name:e.name||null,type:e.type||null,status:r.status,reason:r.reason,
      interventionRegion:exportRegion(r),action:r.action,
      configuredInputs:{reliability:e.noiseProfile?.reliability??null,stopInputs:e.processData?.equipment?.stopInputs??null,
        nominalRatePerSecond:e.nominalRatePerSecond??null,maximumSpeedBpm:e.processData?.equipment?.maximumSpeedBpm??null,
        productApplies:e.processData?.productApplies??null},
      report:{...r,bufferCoverage:coverage},completeness:sectionProgress(r,e,simulation)};
  }
  function buildEvaluationExport(scope='SINGLE',context=current){
    if(!context)throw Error(t('Equipment evaluation context is unavailable.','El contexto de evaluación no está disponible.'));
    if(!['SINGLE','ALL'].includes(scope))throw Error('Invalid equipment export scope.');
    const {simulation,equipment,report,options,openedAt}=context;
    const selected=scope==='ALL'?(simulation.equipment||[]).filter(machine):[equipment];
    const evaluations=selected.map(e=>{
      if(e.id===equipment.id)return evaluationRecord(report,e,simulation);
      // Never copy the selected machine's observations or mix saved data into a live frame.
      const otherOptions={policy:options.policy,audits:options.audits,includeSavedEvidence:options.includeSavedEvidence};
      if(options.observationsByEquipmentId||own(options,'observed')){
        otherOptions.observed=own(options.observationsByEquipmentId,e.id)?options.observationsByEquipmentId[e.id]:null;
      }
      return evaluationRecord(window.STScenarios.equipmentAnalysis(simulation,e.id,otherOptions),e,simulation);
    });
    const statusCounts={PASS:0,REVIEW:0,FAIL:0,'NOT EVALUATED':0};
    evaluations.forEach(e=>{statusCounts[e.status]=(statusCounts[e.status]||0)+1;});
    const config=simulation.dynamicConfig||simulation.run||{};
    return copyJSON({schema:'st-equipment-analysis-v1',version:1,scope,exportedAt:new Date().toISOString(),contextOpenedAt:openedAt,
      calculationModel:'CONFIGURED_RELIABILITY_AND_LINE_EVIDENCE',
      source:{origin:options.origin||'EQUIPMENT_EDITOR',simulationId:simulation.id??null,simulationName:simulation.name??null,
        activeFormatId:config.initialFormatId??null,unitOfFlow:simulation.unitOfFlow??null,language:es()?'es':'en',
        reliabilityEnabled:config.reliabilityEnabled!==false,reliabilityCategories:config.reliabilityCategories??null},
      policy:{...report.thresholds,availabilityFormula:'MTBF / (MTBF + MTTR)',availabilityUnit:'fraction',timeUnit:'minutes',bufferTimeUnit:'seconds',
        verdictRules:{FAIL:'Inherent availability below target.',REVIEW:'Availability target met; frequency or repair-duration screening flags remain.',PASS:'Availability target met; no frequency or repair-duration screening flags.','NOT EVALUATED':'No applicable active valid reliability inputs.'}},
      summary:{equipment:evaluations.length,statusCounts},evaluations,
      notes:['Machine evaluations only; conveyors have their own analysis export.',
        'Numeric results are unrounded; unavailable or non-finite values are null or absent. Completeness is independent of technical PASS/FAIL.',
        'The intervention region uses effective MTBF and MTTR, not availability; long active failure classes can affect the recommended action.',
        'Configured reliability is theoretical, observations are separately identified by basis, and CAPEX evidence is not plant validation.',
        'Live evidence is captured per equipment at dialog opening; no extra simulation is launched by export.']});
  }
  function downloadEvaluation(scope,context=current){
    const report=buildEvaluationExport(scope,context);
    const clean=value=>String(value||'equipment').normalize('NFKD').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,100)||'equipment';
    const prefix=scope==='ALL'?'all-equipment':clean(report.evaluations[0]?.name);
    const url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download='equipment-analysis-'+prefix+'.json';document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    return report;
  }
  function closeExportMenu(){exportMenu.open=false;exportMenu.querySelector('summary').setAttribute('aria-expanded','false');}
  function exportCurrent(scope){
    closeExportMenu();
    if(!current)return;
    try{downloadEvaluation(scope);}
    catch(error){if(window.STDialog?.open)window.STDialog.open({message:error.message});else window.alert?.(error.message);}
  }
  let current=null;
  function close(){closeExportMenu();if(dialog.open)dialog.close();}
  function createEvaluationContext(simulation,equipmentId,options={}){
    if(!machine(simulation?.equipment?.find(x=>x.id===equipmentId)))throw Error(t('No equipment is available for evaluation.','No hay equipos disponibles para evaluar.'));
    // Freeze configured inputs and live evidence, without duplicating saved sample history.
    const source={...simulation,equipment:copyJSON(simulation.equipment),
      ...(simulation.dynamicConfig?{dynamicConfig:copyJSON(simulation.dynamicConfig)}:{}),
      ...(simulation.run?{run:copyJSON(simulation.run)}:{})};
    const snapshotOptions={...options};
    if(options.observationsByEquipmentId)snapshotOptions.observationsByEquipmentId=copyJSON(options.observationsByEquipmentId);
    if(options.observed!==undefined)snapshotOptions.observed=copyJSON(options.observed);
    if(options.audits)snapshotOptions.audits=copyJSON(options.audits);
    if(options.policy)snapshotOptions.policy=copyJSON(options.policy);
    const e=source.equipment.find(x=>x.id===equipmentId);
    const report=window.STScenarios.equipmentAnalysis(source,equipmentId,snapshotOptions);
    return {report,name:e.name||e.id,equipment:e,simulation:source,options:snapshotOptions,openedAt:new Date().toISOString()};
  }
  function buildLineEvaluation(simulation,options={}){
    const first=simulation?.equipment?.find(machine);
    if(!first)return {schema:'st-equipment-analysis-v1',scope:'ALL',status:'NOT_APPLICABLE',evaluations:[],summary:{equipment:0}};
    return buildEvaluationExport('ALL',createEvaluationContext(simulation,first.id,options));
  }
  function downloadLineEvaluation(simulation,options={}){
    const first=simulation?.equipment?.find(machine);
    if(!first)throw Error(t('There are no machines in this line.','No hay equipos en esta línea.'));
    // Export directly from the current editor draft without opening a modal
    // or replacing the snapshot of an already open analysis dialog.
    return downloadEvaluation('ALL',createEvaluationContext(simulation,first.id,options));
  }
  function open(simulation,equipmentId,options={}){
    if(!machine(simulation?.equipment?.find(x=>x.id===equipmentId)))return;
    closeExportMenu();
    foldStates=new Map();body.replaceChildren();current=createEvaluationContext(simulation,equipmentId,options);render();
    if(!dialog.open)dialog.showModal();
    body.scrollTop=0;
  }
  function render(){
    if(!current)return;
    const r=current.report,p=r.thresholds,o=r.observed;
    current.progress=sectionProgress(r,current.equipment,current.simulation);
    document.getElementById('equipment-analysis-title').textContent=t('Equipment Analysis Tool','Análisis de equipo')+' · '+current.name;
    const closeButton=document.getElementById('equipment-analysis-close');
    closeButton.title=t('Close equipment analysis','Cerrar análisis de equipo');closeButton.setAttribute('aria-label',closeButton.title);
    const exportTrigger=exportMenu.querySelector('summary');
    exportTrigger.title=t('Export equipment evaluations','Exportar evaluaciones de equipos');exportTrigger.setAttribute('aria-label',exportTrigger.title);
    exportOne.textContent=t('This equipment (JSON)','Este equipo (JSON)');
    exportAll.textContent=t('All equipment (JSON)','Todos los equipos (JSON)');
    for(const group of body.querySelectorAll('[data-analysis-group]'))foldStates.set(group.dataset.analysisGroup,group.open);
    body.replaceChildren();
    let host=section('matrix',t('Intervention diagnosis','Diagnóstico de intervención'),
      t('Compare line equipment by MTBF and MTTR; the selected machine is highlighted. No simulation required.','Compara los equipos de la línea mediante MTBF y MTTR; se resalta el equipo seleccionado. No requiere simulación.'),r.status);
    interventionMatrix(host,r);
    host=section('reliability',t('Reliability evaluation','Evaluación de confiabilidad'),
      t('Configured inputs and theoretical availability.','Datos configurados y disponibilidad teórica.'));
    note(host,reasonText(r.reason));
    table(host,[
      [t('Recommended investigation','Investigación recomendada'),actionText(r.action)],
      [t('Inherent availability','Disponibilidad inherente'),pct(r.availability),'%','Ai = MTBF / (MTBF + MTTR)'],
      [t('Inherent unavailability','Indisponibilidad inherente'),pct(r.unavailability),'%'],
      ['MTBF',r.mtbfMinutes,'min'],['MTTR',r.mttrMinutes,'min'],['MTBF / MTTR',r.ratio,'×'],
      [t('Availability severity','Nivel de disponibilidad'),severityText(r.severity)],
      [t('Failures per operating hour','Fallas por hora de operación'),r.failuresPerOperatingHour,'1/h'],
      [t('Expected failures per 24 h','Fallas esperadas por 24 h'),r.failuresPerDay,'1/day'],
      [t('Expected downtime per 24 h','Tiempo teórico de falla por 24 h'),r.downtimeMinutesPerDay,'min']
    ]);
    note(host,t('Configured reliability only; stable alternating operation, excluding calendar stops, flow losses and separate micro-stops. This is not measured plant availability.','Solo confiabilidad configurada; alternancia estable de operación y reparación, sin calendario, pérdidas de flujo ni microparos independientes. No es disponibilidad medida en planta.'));
    host=section('targets',t('Screening targets and improvement gap','Metas de evaluación y brecha de mejora'),t('Compare configured values with the engineering targets.','Compara los valores configurados con las metas de ingeniería.'));
    table(host,[
      [t('Availability target','Meta de disponibilidad'),pct(p.availabilityTarget),'%'],
      [t('Minimum MTBF reference','Referencia mínima MTBF'),p.mtbfTargetMinutes,'min'],
      [t('Maximum MTTR reference','Referencia máxima MTTR'),p.mttrTargetMinutes,'min'],
      [t('Required MTBF at current MTTR','MTBF requerido con MTTR actual'),r.requiredMtbfMinutes,'min'],
      [t('Maximum MTTR at current MTBF','MTTR máximo con MTBF actual'),r.requiredMttrMinutes,'min'],
      [t('Required MTBF improvement factor','Factor de incremento requerido de MTBF'),r.mtbfImprovementFactor,'×'],
      [t('Required MTTR reduction','Reducción requerida de MTTR'),r.mttrReductionPercent,'%']
    ]);
    note(host,t('Default engineering references: 95%, 60 min and 10 min. They are not manufacturer or replacement standards. Targets are not verified attainable values.','Referencias iniciales de ingeniería: 95%, 60 min y 10 min. No son normas de fabricante ni de reemplazo. Los objetivos no son valores cuya factibilidad esté validada.'));
    host=section('classes',t('Enabled failure classes','Categorías de falla activas'),t('Review the active general, minor and major failure inputs.','Revisa los datos activos de fallas generales, menores y mayores.'));
    if(r.classes.length){
      table(host,r.classes.flatMap(c=>[[classText(c.kind)+' · MTBF',c.mtbfMinutes,'min'],[classText(c.kind)+' · MTTR',c.mttrMinutes,'min'],[classText(c.kind)+' · '+t('Event share','Proporción de eventos'),pct(c.eventShare),'%']]));
      note(host,t('Effective MTBF uses the sum of class failure rates; effective MTTR is weighted by those rates. General stops are never reclassified by duration.','El MTBF efectivo utiliza la suma de tasas de falla; el MTTR efectivo se pondera por esas tasas. Las fallas generales no se reclasifican por duración.'));
    }else note(host,reasonText(r.reason)||t('No resolved active failure categories.','No hay categorías de falla activas resueltas.'));
    host=section('buffer',t('Buffer coverage — Failure Coverage Ratio','Cobertura de acumulación — Failure Coverage Ratio'),t('Estimate how long the connected conveyors can absorb a repair.','Estima cuánto tiempo los conveyors conectados pueden absorber una reparación.'));
    renderBufferCoverage(host,r,current.equipment,current.simulation);
    host=section('capacity',t('Capacity and line balance','Capacidad y balanceo de línea'),t('Compare installed speed and availability-adjusted capacity.','Compara la velocidad instalada y la capacidad ajustada por disponibilidad.'));
    if(r.capacity){
      const c=r.capacity,unit=c.unit==='BOTTLE_EQUIVALENTS'?t('bottle eq/min','bot eq/min'):c.unit.toLowerCase()+'/min';
      table(host,[[t('Configured output rate','Velocidad configurada'),c.configuredRatePerMinute,unit],
        [t('Installed maximum rate','Velocidad máxima instalada'),c.maximumRatePerMinute,unit],
        [t('Line reference rate','Velocidad de referencia de línea'),c.referenceRatePerMinute,unit],
        [t('Availability-only output rate','Velocidad equivalente por disponibilidad'),c.availabilityOnlyRatePerMinute,unit],
        [t('Availability-only deficit vs reference','Déficit por disponibilidad vs referencia'),c.availabilityOnlyDeficit,unit]]);
    }else note(host,t('Not evaluated: compatible speed and flow inputs are required.','No evaluado: se requieren velocidades y unidades de flujo compatibles.'));
    note(host,t('Static capacity screen; not simulated throughput. The reference is the pacemaker or model reference.','Evaluación estática de capacidad; no es throughput simulado. La referencia es el pacemaker o referencia del modelo.'));
    host=section('observed',t('Observed simulation losses','Pérdidas observadas de simulación'),t('Requires a current or compatible completed simulation.','Requiere una simulación actual o terminada compatible.'));
    if(o){
      const basis=({REPLICATION_MEAN:t('Mean per replication','Media por réplica'),COMPLETED_RUN:t('Completed numerical run','Simulación numérica terminada'),NUMERICAL_FRAME:t('Displayed numerical frame / single run','Frame numérico mostrado / una corrida'),SPATIAL_RUN:t('2D run','Corrida 2D')})[o.basis]||o.basis;
      table(host,[[t('Evidence basis','Base de evidencia'),basis],[t('Observed horizon','Horizonte observado'),minutes(o.durationSeconds),'min'],
        [t('Own failures','Fallas propias'),o.failureCount],[t('Own failure time','Tiempo en falla propia'),minutes(o.failureSeconds),'min'],
        [t('Own failure share of horizon','Porcentaje del horizonte en falla propia'),o.failurePercent,'%'],
        [t('Observed reliability exposure per failure','Exposición observada por falla'),o.observedExposurePerFailureMinutes,'min'],
        [t('Observed fault time per failure','Tiempo observado en falla por evento'),o.observedFaultTimePerFailureMinutes,'min'],
        [t('Micro-stop time','Tiempo de microparos'),minutes(o.microStopSeconds),'min'],
        [t('Starved time','Tiempo Starved'),minutes(o.starvedSeconds),'min'],
        [t('Blocked time','Tiempo Blocked'),minutes(o.blockedSeconds),'min'],
        [t('Waiting for Prime','Espera de Prime'),minutes(o.waitingForPrimeSeconds),'min'],
        [t('Back-up stop','Paro Back-up'),minutes(o.backupStopSeconds),'min']]);
      note(host,t('Event counts and elapsed fault time can include incomplete repairs. These are local, non-additive losses, not causal line OEE contributions.','El conteo y tiempo transcurrido pueden incluir reparaciones incompletas. Son pérdidas locales no aditivas; no representan contribuciones causales al OEE de línea.'));
    }else note(host,t('Not evaluated: run the current model or load a compatible completed simulation.','No evaluado: ejecuta el modelo actual o carga una simulación terminada compatible.'));
    host=section('impact',t('Line impact and intervention feasibility','Impacto en línea y factibilidad de intervención'),t('Requires matched CAPEX experiments and technical validation.','Requiere experimentos CAPEX pareados y validación técnica.'));
    if(r.counterfactual){
      const c=r.counterfactual;
      table(host,[[t('Conditional OEE gain without own failures','Ganancia condicional de OEE sin fallas propias'),c.deltaOeePp,'pp'],
        [t('Conditional throughput gain','Ganancia condicional de throughput'),c.deltaThroughput,(c.throughputUnit||'units')+'/min'],
        [t('Exploration duration','Duración de exploración'),minutes(c.run?.durationSeconds),'min'],[t('Replications','Réplicas'),c.run?.rounds]]);
      note(host,t('Saved matched CAPEX reliability exploration. Not independent confirmation or plant-validated gain. Individual gains are not additive.','Exploración CAPEX pareada de confiabilidad guardada. No es confirmación independiente ni ganancia validada en planta. Los impactos individuales no son aditivos.'));
    }else note(host,t('Line impact not evaluated: CAPEX reliability screening performs matched per-machine failure removal. This dialog launches no extra simulations.','Impacto en línea no evaluado: la exploración CAPEX de confiabilidad ejecuta experimentos pareados eliminando fallas de cada equipo. Este diálogo no inicia simulaciones adicionales.'));
    note(host,t('Replacement is not established by MTBF/MTTR. Compare achievable maintenance/retrofit and replacement targets, line impact, failure-mode history, obsolescence and lifecycle cost before a decision.','MTBF/MTTR no determinan un reemplazo. Antes de decidir, comparar metas alcanzables de mantenimiento, retrofit y reemplazo, impacto de línea, historial de causas, obsolescencia y costo de ciclo de vida.'));
  }
  document.getElementById('equipment-analysis-close').addEventListener('click',close);
  exportOne.addEventListener('click',()=>exportCurrent('SINGLE'));
  exportAll.addEventListener('click',()=>exportCurrent('ALL'));
  dialog.addEventListener('close',()=>{closeExportMenu();current=null;});
  window.addEventListener('st-language-change',()=>{if(dialog.open)render();});
  return {assess,paint,createButton,open,close,statusText,sectionProgress,buildEvaluationExport,downloadEvaluation,downloadLineEvaluation,buildLineEvaluation};
})();
</script>
