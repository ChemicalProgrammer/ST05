<style>

  .equipment-transport-unit {display:flex;align-items:center;min-height:var(--control-height);padding:0 var(--space-2);border:var(--border-width) solid var(--line);border-radius:var(--radius-sm);box-sizing:border-box;color:var(--ink);font-size:var(--font-input);background:var(--surface);}

  .model-boundary { font-size: var(--text-13); margin: var(--size-14) 0; }


.equipment-drag { cursor:grab; touch-action:none; }
#equipment-list .equipment-header .equipment-analysis-pill { flex:0 0 auto; max-width:9rem; }
#equipment-list .equipment-header .button-row { min-width:0; }
#equipment-list .equipment-header .equipment-analysis-pill[hidden] {display:none!important;}
/* Keep the name legible on compact split cards: tools wrap as a group only

html[data-equipment-layout=split] #equipment-list .equipment-card .equipment-header {flex-wrap:wrap;}
html[data-equipment-layout=split] #equipment-list .equipment-card .equipment-header strong {flex:1 1 6rem;}

 html[data-equipment-layout=combined] #equipment-list .equipment-card .equipment-header {display:flex;flex-wrap:wrap;}
 html[data-equipment-layout=combined] #equipment-list .equipment-card .equipment-header strong {flex:1 1 6rem;min-width:0;}
 html[data-equipment-layout=combined] #equipment-list .equipment-card .equipment-header .button-row {max-width:100%;margin-inline-start:auto;flex-wrap:wrap;justify-content:flex-end;}
}
.equipment-card { transition:background var(--duration-fast), opacity var(--duration-fast); }

.equipment-card .equipment-fields { display:none; }
.equipment-selected { border-color:var(--accent); background:var(--accent-soft); }

.parameter-help summary { cursor:help; color:var(--muted); list-style:none; }
.parameter-help p { display:none; position:absolute; right:0; top:var(--space-4); width:min(var(--size-260),70vw); padding:var(--space-3); background:var(--surface); color:var(--ink); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); z-index:var(--z-overlay); box-shadow:var(--shadow-dialog); font-size:var(--font-secondary); }
.parameter-help:hover p,.parameter-help:focus-within p,.parameter-help[open] p { display:block; }

#equipment-list:has(.equipment-dragging) { overflow-anchor:none; }
.equipment-card.equipment-dragging { position:relative; z-index:var(--z-header); transition:none; cursor:grabbing; box-shadow:var(--shadow-dialog); opacity:.85; will-change:transform; }
.equipment-card { cursor:pointer; }
.equipment-card:focus-visible { outline:var(--focus-width) solid var(--accent); outline-offset:var(--space-1); }

.equipment-filters { display:inline-flex; align-items:center; gap:var(--space-2); padding:0; margin:0; }

.equipment-fields > .equipment-grid > label { margin:0; }
.equipment-fields > .reliability-controls { margin-block:var(--space-3) 0; }
.equipment-grid > .equipment-critical-field { grid-column:1 / -1; min-height:var(--control-height); margin:0; }

.switchable-value > input[type=checkbox],html[data-ui-mode=basic] .basic-worksheet-group .switchable-value > input[type=checkbox] { width:16px; height:16px; min-height:16px; padding:0; flex:0 0 16px; }
.switchable-value > .calculated-value { background:var(--surface-soft); border-color:transparent; font-weight:var(--weight-semibold); text-align:right; }
