  // The theoretical KPI is the historical product of modeled machine

  // An absent failure model means no own modeled failures, not a plant claim.
  function theoreticalAvailability(e){

    if(!r)return 1;
    var bf=Number(r.mtbfMinutes),tr=Number(r.mttrMinutes);
    return Number.isFinite(bf)&&bf>0&&Number.isFinite(tr)&&tr>0?bf/(bf+tr):NaN;
  }

      metric(right,'Peak belt speed (m/min)',number(balancing.peakSpeedMmPerSecond*.06));
      metric(right,'Boost requests',number(balancing.boostRequests,0));
      metric(right,'Boost time (s)',number(balancing.boostSeconds));
      metric(right,'Speed ramp time (s)',number(balancing.rampSeconds));
    }
    right.title='Observed equivalent loss seconds per hour; concurrent upstream blocking and downstream starving count once in Conv Loss.';
    var dynamicTab=conveyorTabs.querySelector('[data-conveyor-view=balancing]');
    var dynamicAvailable=!basic()&&chosen?._fields?.querySelector('.format-zone-speed-mode')?.value==='DYNAMIC';
    if(dynamicTab)dynamicTab.hidden=!dynamicAvailable;
    if(conveyorView==='balancing'&&!dynamicAvailable)conveyorView='inputs';
    conveyorSummary.classList.toggle('hidden',conveyorView!=='results');
    Array.from(list.querySelectorAll('.equipment-card')).forEach(function(card){if(card._fields)card._fields.dataset.balancingView=String(card===chosen&&conveyorView==='balancing');});
    inspector.classList.toggle('hidden',state.uiView!=='editor'||state.basicView!=='conveyors'||conveyorView==='results');
    conveyorTabs.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.conveyorView===conveyorView));b.disabled=false;});
  }
  return {init:init,sync:sync,inline:inline,isBasic:basic,isBasicEditor:editorBasic,isSplit:split,theoreticalEfficiency:theoreticalEfficiency,unitLabel:function(unit){return unit||'units';},newType:function(){return split()&&state.basicView==='conveyors'?'CONVEYOR':null;}};
})();
</script>
