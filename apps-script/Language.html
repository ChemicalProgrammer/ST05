  var language=window.STPreferences?.read('language')==='es'?'es':'en';

  var attributeNames=['title','aria-label','placeholder','data-label','alt'];
  var skipSelector='script,style,noscript,svg,canvas,textarea,pre,code,[contenteditable],[data-st-no-translate],'+

  function normalize(value){return String(value==null?'':value);}
  function localized(value,target){
    var text=normalize(value),match=text.match(/^(\s*)([\s\S]*?)(\s*)$/);
    if(!match)return text;
    var key=match[2],valueResult=target==='es'
      ?Object.prototype.hasOwnProperty.call(translations,key)?translations[key]:key
      :Object.prototype.hasOwnProperty.call(englishOfSpanish,key)?englishOfSpanish[key]:key;
    return match[1]+valueResult+match[3];
  }
  function skipped(node){
    var parent=node.nodeType===3?node.parentElement:node;
    return !parent||!!parent.closest?.(skipSelector);
  }
  function updateText(node){
    if(!node||node.nodeType!==3||skipped(node))return;
    var raw=node.nodeValue||'',entry=originals.get(node);
    if(!entry||raw!==entry.en&&raw!==entry.es){
      entry={en:raw,es:localized(raw,'es')};
      if(Object.prototype.hasOwnProperty.call(englishOfSpanish,raw.trim())){
        entry.en=localized(raw,'en');entry.es=raw;
      }
      originals.set(node,entry);
    }
    var wanted=language==='es'?entry.es:entry.en;
    if(raw!==wanted)node.nodeValue=wanted;
  }
  function updateAttribute(node,name){
    if(!node?.hasAttribute?.(name)||skipped(node))return;
    var current=node.getAttribute(name),cache=attributes.get(node);
    if(!cache){cache={};attributes.set(node,cache);}
    var entry=cache[name];
    if(!entry||current!==entry.en&&current!==entry.es){
      entry={en:current,es:localized(current,'es')};
      if(Object.prototype.hasOwnProperty.call(englishOfSpanish,current.trim())){
        entry.en=localized(current,'en');entry.es=current;
      }
      cache[name]=entry;
    }
    var wanted=language==='es'?entry.es:entry.en;
    if(current!==wanted)node.setAttribute(name,wanted);
  }
  function applyTree(root){
    if(!root)return;
    if(root.nodeType===3){updateText(root);return;}
    if(root.nodeType!==1&&root.nodeType!==9&&root.nodeType!==11)return;
    if(root.nodeType===1&&skipped(root))return;
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    while(walker.nextNode())updateText(walker.currentNode);
    if(root.nodeType===1)attributeNames.forEach(function(name){updateAttribute(root,name);});
    if(root.querySelectorAll)root.querySelectorAll('[title],[aria-label],[placeholder],[data-label],[alt]').forEach(function(node){
      attributeNames.forEach(function(name){updateAttribute(node,name);});

      try{
        changes.forEach(function(change){
          if(change.type==='characterData')updateText(change.target);
          else if(change.type==='attributes')updateAttribute(change.target,change.attributeName);
          else change.addedNodes.forEach(applyTree);

      attributes:true,attributeFilter:attributeNames});

  function apply(){
    document.documentElement.lang=language;
    var wasObserving=!!observer;
    if(wasObserving)observer.disconnect();
    applying=true;
    try{applyTree(document.body);applyTree(document.head?.querySelector('title'));}
    finally{applying=false;}
    observe();
    var picker=document.getElementById('settings-language');
    if(picker)picker.value=language;
  }
  function setLanguage(value){
    var next=value==='es'?'es':'en';
    if(language!==next){language=next;window.STPreferences?.write('language',next);}
    apply();
    window.dispatchEvent(new CustomEvent('st-language-change',{detail:{language:next}}));
  }
  function init(){
    var picker=document.getElementById('settings-language');
    if(picker){
      picker.value=language;
      picker.addEventListener('change',function(){setLanguage(this.value);});
    }
    apply();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
  else init();
  return {current:function(){return language;},setLanguage:setLanguage,apply:apply,
