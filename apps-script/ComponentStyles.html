<style>
/* Solid accent buttons always use white text and white currentColor icons,
   including in dark mode and dialogs. Semantic soft, ghost, disabled and
   outline button styles retain their explicit foreground colors. */
button { --on-accent:#fff; }
/* Componentes reutilizables. Editar variables en DesignTokens.html y
   documentar nuevos tipos en docs/34_UI_VISUAL_STANDARDS.md. */
/* ─── Tipos de tarjetas reutilizables de SimuLine ───
   No se cambia el valor ni la frecuencia de los resultados: CSS-only.
   El relieve aparece únicamente al pasar el puntero, sin will-change. */
.metric-card {min-width:0;border:var(--border-width) solid var(--line);border-radius:var(--radius-md);padding:var(--space-3);background:var(--surface);}
.metric-card--result,#simulation-playback-metrics > article.metric-card--result {
  background:var(--surface-soft);border:var(--border-width) solid var(--line-strong);
  border-radius:var(--radius-md);padding:var(--space-3);min-width:0;
}
.metric-card--featured,html[data-ui-mode=basic] #basic-efficiencies > div {
  background:var(--surface-soft);border:var(--border-width) solid var(--line);
  border-top:4px solid var(--accent);border-radius:var(--radius-md);
  padding:var(--space-3);min-width:0;
}
.metric-card--featured > strong {display:block;font-size:var(--font-kpi);line-height:1.15;margin-top:var(--space-2);font-variant-numeric:tabular-nums;}
/* Escenarios conservan franjas propias según la categoría CAPEX. */
.metric-card--scenario {border-inline-start:var(--state-border-width) solid var(--accent);}
.scenario-tier-grid > .metric-card--scenario {border-inline-start-color:var(--muted);}
.scenario-tier-grid > .metric-card--scenario:has(.analysis-capex[data-tier=ZERO]) {border-inline-start-color:var(--capex-zero);}
.scenario-tier-grid > .metric-card--scenario:has(.analysis-capex[data-tier=MEDIUM]) {border-inline-start-color:var(--capex-medium);}
.scenario-tier-grid > .metric-card--scenario:has(.analysis-capex[data-tier=HIGH]) {border-inline-start-color:var(--capex-high);}
.metric-card--status {background:var(--surface-soft);}
/* El grid conserva las tarjetas de resultado compactas; sólo las eficiencias son destacadas. */
#simulation-playback-metrics > article > span {display:block;font-size:var(--font-secondary);color:var(--muted);}
#simulation-playback-metrics > article.metric-card--result > strong,
.metric-card--result > strong {
  display:block;font-size:var(--font-section);line-height:1.25;
  font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums;
  margin-block-start:var(--space-2);
}
/* Keep the number and its unit as separate, persistent nodes during playback.
   Count labels can be translated without rewriting or rounding the number. */
.metric-value {display:inline-flex;align-items:baseline;gap:var(--time-unit-gap);white-space:nowrap;}
:is(.metric-card--result,.metric-card--featured,.comparison-kpi-value) > .metric-value,
#simulation-playback-metrics .metric-card--result > .playback-metric-value {
  display:flex;align-items:baseline;gap:var(--time-unit-gap);white-space:nowrap;
}
.metric-value > .metric-number,
#simulation-playback-metrics .playback-metric-value > b {font:inherit;font-weight:var(--weight-semibold);color:var(--ink);}
#simulation-playback-metrics .playback-count-pair > b {color:var(--ink);}
#simulation-playback-metrics .playback-count-pair > .playback-metric-unit,
#simulation-playback-metrics .playback-metric-value > .playback-metric-unit {display:inline;color:var(--unit-color);font:inherit;}
/* A single input contract owns both selectable and fixed units. Typography
   belongs to the control, rather than the label or the surrounding section. */
.time-value-control {
  display:inline-grid;grid-template-columns:minmax(0,1fr) max-content;
  position:relative;align-items:center;min-width:0;width:100%;
  gap:var(--input-unit-gap);border:0;border-radius:0;background:transparent;
  overflow:visible;font-size:var(--font-input);font-weight:var(--weight-regular);
  line-height:var(--leading-tight);
}
.time-value-control > input[type=number] {
  grid-area:1 / 1 / 2 / 2;min-width:0;width:100%;margin:0;box-sizing:border-box;
  padding-inline:var(--space-2);padding-inline-end:var(--space-2);
  border:var(--border-width) solid var(--line-strong);border-radius:var(--radius-md);
  background:var(--surface);box-shadow:none;color:var(--ink);
  font-size:inherit!important;font-weight:inherit!important;line-height:inherit!important;
}
.time-value-control > select,
.time-value-control > .time-input-unit {
  grid-area:1 / 2 / 2 / 3;width:auto!important;min-width:0!important;max-width:none!important;
  box-sizing:border-box;text-align:start!important;text-align-last:start!important;
  padding:0!important;margin:0;border:0;border-radius:0;background:transparent;
  font-size:inherit!important;font-weight:inherit!important;line-height:inherit!important;
  color:var(--unit-color);vertical-align:baseline;
}
.time-value-control > select {height:var(--control-height);min-height:var(--control-height);}
/* Only the selected unit sets this column's width. The native select sits
   over an inaccessible text mirror, so its longest option cannot reserve
   empty space. The input takes all remaining width without resizing its card.
   Intrinsic text sizing also follows fonts and zoom without measuring pixels. */
.time-value-control > .time-input-unit-measure {
  grid-area:1 / 2 / 2 / 3;visibility:hidden;pointer-events:none;user-select:none;
  white-space:pre;font-size:inherit!important;font-weight:inherit!important;
  line-height:inherit!important;
}
.time-value-control--fitted-unit > select {
  position:absolute;inset:0;width:100%!important;
}
.time-value-control > input:disabled {background:var(--disabled-bg);color:var(--disabled);border-color:var(--line);}
.time-value-control > select:disabled,
.time-value-control:has(> input:disabled) > .time-input-unit {color:var(--disabled);cursor:not-allowed;}
.time-value-control:focus-within {outline:none;}
.time-value-control > input:focus-visible,
.time-value-control > select:focus-visible,
.st-time-unit:focus-visible {outline:var(--focus-width) solid var(--accent);outline-offset:1px;}
.st-time-unit,.time-value-control > select {
  appearance:none!important;-webkit-appearance:none!important;-moz-appearance:none!important;
  background-image:none!important;cursor:pointer;
}
.st-time-unit::-ms-expand,.time-value-control > select::-ms-expand {display:none;}
.time-value-control > select:not(:disabled):hover,.time-value-control > select:not(:disabled)[aria-expanded=true],
.st-time-output > select.st-time-unit:not(:disabled):hover,.st-time-output > select.st-time-unit:not(:disabled)[aria-expanded=true] {
  color:var(--accent);border-radius:var(--radius-sm);
  background:var(--accent-soft)!important;box-shadow:0 0 0 3px var(--accent-soft);
}
/* One accessible unit picker is shared by input and output controls. It is
   placed in the top layer (or owning dialog), never clipped by a metric card. */
.st-unit-menu {
  position:fixed;inset:auto;z-index:calc(var(--z-toast) + 1);display:block;
  box-sizing:border-box;margin:0;padding:var(--space-1);overflow:auto;
  border:var(--border-width) solid var(--line-strong);border-radius:var(--radius-md);
  background:var(--surface);color:var(--ink);box-shadow:var(--shadow-dialog);
  font-family:var(--font-ui);font-size:var(--font-input);font-weight:var(--weight-regular);
  line-height:var(--leading-tight);overscroll-behavior:contain;
}
.st-unit-menu::backdrop {background:transparent;pointer-events:none;}
.st-unit-menu-option {
  display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);
  min-height:var(--control-height);padding:var(--space-2) var(--space-3);
  border:0;border-radius:var(--radius-sm);cursor:pointer;
  color:var(--ink);background:transparent;user-select:none;
}
.st-unit-menu-option.is-active {background:var(--surface-hover);}
.st-unit-menu-option[aria-selected=true] {background:var(--accent);color:#fff;}
.st-unit-menu-option[aria-selected=true].is-active {outline:1px solid var(--line-strong);outline-offset:-1px;}
.st-unit-menu-option[aria-disabled=true] {color:var(--disabled);cursor:not-allowed;}
.st-unit-menu-abbreviation {font-weight:inherit;white-space:nowrap;}
.st-unit-menu-option[aria-selected=true] .st-unit-menu-abbreviation {font-weight:var(--weight-semibold);}
.st-unit-menu-check {text-align:center;font-weight:var(--weight-semibold);}
/* Read-only numbers use the enclosing result/table scale. The unit remains a
   native select, while fixed text uses the identical metric-unit contract. */
.st-time-output,.time-output-value {
  display:inline-flex!important;gap:var(--time-unit-gap)!important;
  align-items:baseline;white-space:nowrap;
}
.st-time-output > b {font-variant-numeric:tabular-nums;}
.st-time-output > .st-time-unit {color:var(--unit-color);}
.st-time-output:not([data-variant=metric]) > .st-time-unit {
  flex:0 0 var(--time-unit-slot)!important;width:var(--time-unit-slot)!important;
  min-width:var(--time-unit-slot)!important;max-width:var(--time-unit-slot)!important;
  box-sizing:border-box;text-align:start!important;text-align-last:start!important;
  padding:0!important;margin:0!important;height:auto!important;min-height:0!important;
  background:transparent!important;border:0!important;
}
/* STTimeControls.output inherits its parent card's value style, including nested b. */
.metric-card--result > strong .st-time-output,
.metric-card--result > strong .st-time-output b {font-size:inherit!important;font-weight:inherit!important;line-height:inherit!important;color:inherit;}
/* Value & Unit share one typographic scale and baseline in every reusable time control. */
.st-time-output > b,
.st-time-output > .st-time-unit {
  font-size:inherit!important;line-height:inherit!important;
  vertical-align:baseline!important;
}
.st-time-output:not([data-variant=metric]) > b,
.st-time-output:not([data-variant=metric]) > .st-time-unit {font-weight:inherit!important;}
/* All result-card units follow the established time-unit typography. Compact
   equipment-state counters below keep their separate, smaller unit style. */
.playback-metric-unit,
#simulation-playback-metrics .playback-metric-unit,
.metric-unit,
.metric-value > .metric-unit,
.metric-card--result > strong .st-time-output select {font-size:inherit!important;font-weight:inherit!important;line-height:inherit!important;color:var(--unit-color);vertical-align:baseline!important;}
/* One definition owns compact counters. The number's width is fixed for the
   run horizon, so variable decimals cannot wrap the neighbouring label.
   Native unit selects use the selected abbreviation's width (not their
   longest option or experimental field-sizing). Their text ends at the right
   edge, while the number uses exactly the same weight as Overview values. */
.live-equipment-card .st-time-output[data-variant=metric] {
  --st-time-unit-width:1.1ch;
  display:inline-flex!important;flex:0 0 auto;align-items:baseline;
  justify-content:flex-end;gap:2px!important;white-space:nowrap;
  font-size:var(--font-secondary);font-weight:var(--weight-semibold);
  font-variant-numeric:tabular-nums;line-height:1.2;vertical-align:baseline;
  min-height:0;height:auto;color:var(--ink);
}
.live-equipment-card .st-time-output[data-variant=metric][data-unit=min] {--st-time-unit-width:3.3ch;}
.live-equipment-card .st-time-output[data-variant=metric][data-unit=wk] {--st-time-unit-width:2.5ch;}
.live-equipment-card .st-time-output[data-variant=metric] > select.st-time-unit {
  flex:0 0 var(--st-time-unit-width);width:var(--st-time-unit-width);
  min-width:0;max-width:none;box-sizing:content-box;
  text-align:end;text-align-last:end;font-weight:var(--weight-regular);
  padding:0;margin:0;min-height:0;height:auto;border:0;background:transparent;
  box-shadow:none;color:var(--muted);appearance:none;-webkit-appearance:none;
  cursor:pointer;
}
.live-equipment-card .st-time-output[data-variant=metric] > b {
  display:block;flex:0 0 var(--st-time-value-width,10ch);
  inline-size:var(--st-time-value-width,10ch);min-inline-size:var(--st-time-value-width,10ch);
  font-weight:var(--weight-semibold);text-align:end;white-space:nowrap;
  margin:0;padding:0;color:var(--ink);
}
.live-equipment-card .st-time-output[data-variant=metric] > select.st-time-unit:hover {
  color:var(--accent);text-decoration:underline;
}
/* Equipment throughput follows the compact summary typography. Broad legacy
   span selectors must not turn its numeric value into a secondary label. */
.live-equipment-card .live-equipment-efficiency [data-efficiency=throughput] > .live-equipment-2d-number {
  font-size:inherit;line-height:inherit;font-weight:var(--weight-semibold);color:var(--ink);
}
.live-equipment-card .live-equipment-efficiency [data-efficiency=throughput] > .live-equipment-2d-unit {
  font-size:inherit;line-height:inherit;font-weight:var(--weight-regular);color:var(--unit-color);
}
/* Preserve the last numerical playback action even while its button is
   disabled during calculation or playback, as in the 2D toolbar. */
#simulation-playback .playback-toolbar .icon-button[aria-pressed=true],
#simulation-playback .playback-toolbar .icon-button[aria-pressed=true]:disabled {
  background:var(--accent)!important;border-color:var(--accent)!important;
  color:#fff!important;opacity:1!important;
}
#simulation-playback .playback-toolbar .icon-button[aria-pressed=true] svg {
  color:#fff!important;stroke:currentColor;opacity:1!important;
}
.live-equipment-card .numeric-equipment-header-kpis[hidden] {display:none!important;}
@media(hover:hover) and (pointer:fine) {
  :is(.metric-card--result,.metric-card--featured,.metric-card--scenario,
       #simulation-playback-metrics > article,#results-kpis .result-kpi,
       .result-loss-kpis .result-kpi,.scenario-tier-grid > .analysis-recommendation) {
    transition:box-shadow 140ms ease,transform 140ms ease;
  }
  :is(.metric-card--result,.metric-card--featured,.metric-card--scenario,
       #simulation-playback-metrics > article,#results-kpis .result-kpi,
       .result-loss-kpis .result-kpi,.scenario-tier-grid > .analysis-recommendation):hover {
    box-shadow:0 5px 14px color-mix(in srgb,var(--ink) 11%,transparent);
    transform:translateY(-1px);
  }
}
@media(prefers-reduced-motion:reduce) {
  :is(.metric-card--result,.metric-card--featured,.metric-card--scenario,
       #simulation-playback-metrics > article,#results-kpis .result-kpi,
       .result-loss-kpis .result-kpi,.scenario-tier-grid > .analysis-recommendation) {
    transition:none!important;transform:none!important;
  }
}
/* Pestaña de navegación principal: nombre reutilizable sin alterar acciones. */
.app-section-tab {
  color:var(--muted);background:transparent;border-color:transparent;
}
.app-section-tab[aria-current=page] {
  color:var(--selected-text);background:var(--selected);
  border-bottom-color:var(--accent);
}
.app-section-tab:focus-visible {outline:var(--focus-width) solid var(--accent);outline-offset:2px;}
/* Barra de iconos: botones homogéneos en Header y menú Basic. */
:is(.topbar,#basic-case-actions) button.icon-button {
  width:var(--control-height);height:var(--control-height);
  min-width:var(--control-height);min-height:var(--control-height);
  flex-shrink:0;padding:0;border:var(--border-width) solid var(--line-strong);
  border-radius:var(--radius-md);background:var(--surface);box-shadow:none;
  color:var(--muted);
}
:is(.topbar,#basic-case-actions) button.icon-button:not(:disabled):hover {
  color:var(--accent);border-color:var(--accent);background:var(--surface-hover);
}
:is(.topbar,#basic-case-actions) button.icon-button:focus-visible {
  outline:var(--focus-width) solid var(--accent);outline-offset:2px;
}
.topbar #pin-header[aria-pressed=true],
.topbar #save-case.has-changes {background:var(--selected);color:var(--accent);}
/* Header global de errores: señal roja de alta prioridad en ambos temas,
   por encima de las reglas genéricas de botones del Header. */
#header-errors:not(.hidden) {position:relative;display:inline-flex;align-items:center;margin-inline:var(--space-1);}
#header-errors:not(.hidden) #header-error-button {
  background:var(--danger)!important;color:#fff!important;
  border:2px solid var(--danger)!important;
  box-shadow:0 0 0 2px var(--danger-soft)!important;
}
#header-errors:not(.hidden) #header-error-button:is(:hover,:focus-visible) {
  background:var(--danger)!important;color:#fff!important;
  border-color:var(--danger)!important;
  box-shadow:0 0 0 3px var(--danger-soft)!important;
}
#header-errors:not(.hidden) #header-error-button:focus-visible {
  outline:var(--focus-width) solid var(--danger)!important;outline-offset:4px;
}
#header-errors:not(.hidden)::after {
  content:attr(data-count);pointer-events:none;position:absolute;

  padding-inline:2px;border-radius:var(--radius-pill);
  color:var(--danger);background:var(--surface);border:1px solid var(--danger);
  font-size:var(--font-caption);font-weight:var(--weight-bold);
}
#whatif-subsection .simulation-analysis {margin:0;padding:0;border:0;background:transparent;}
#whatif-subsection .whatif-context {margin:0 0 var(--space-3);max-width:100%;}
#whatif-subsection .fold-heading .fold-tools {margin-inline-start:auto;}
/* Eficiencias de Simulation Playback: la variante tiene prioridad incluso
   frente a reglas antiguas de #basic-efficiencies en modos Basic y Advance. */
#simulation-playback-efficiencies #basic-efficiencies > .metric-card--featured,
#basic-run-options #basic-efficiencies > .metric-card--featured {
  display:flex;flex-direction:column;align-items:flex-start;
  gap:var(--space-2);min-width:0;
  background:var(--surface-soft);border:var(--border-width) solid var(--line);
  border-top:4px solid var(--accent)!important;border-radius:var(--radius-md);
  padding:var(--space-3);box-shadow:0 2px 7px color-mix(in srgb,var(--ink) 7%,transparent);
}
#simulation-playback-efficiencies #basic-efficiencies > .metric-card--featured > span,
#basic-run-options #basic-efficiencies > .metric-card--featured > span {
  color:var(--muted);font-size:var(--font-secondary);font-weight:var(--weight-medium);
}
#simulation-playback-efficiencies #basic-efficiencies > .metric-card--featured > strong,
#basic-run-options #basic-efficiencies > .metric-card--featured > strong {
  display:block;margin:0;font-size:var(--font-kpi);font-weight:var(--weight-semibold);
  line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;
}

/* Casilla enmarcada / Checkbox card: aspecto reutilizado en Simulation, 2D y Settings.
   El label completo es el área clicable y preserva el estado del input original. */
label.st-checkbox-card {
  display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:var(--space-2);
  box-sizing:border-box;width:100%;min-width:0;min-height:var(--control-height);
  margin:0;padding:var(--space-2) var(--space-3);
  border:var(--border-width) solid var(--line);border-radius:var(--radius-md);
  background:var(--surface-soft);color:var(--ink);
  font-size:var(--font-secondary);font-weight:var(--weight-medium);line-height:var(--leading-body);
  white-space:normal;cursor:pointer;
}
label.st-checkbox-card > input[type=checkbox] {
  flex:0 0 auto;order:-1;margin:0;
}
label.st-checkbox-card.st-checkbox-card--compact { width:auto;max-width:100%;padding:var(--space-1) var(--space-2); }
label.st-checkbox-card:has(> input:disabled) { color:var(--disabled);cursor:not-allowed; }
label.st-checkbox-card:focus-within {

}
