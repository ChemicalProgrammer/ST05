<style>
/* Shared visual hierarchy for Advance and Basic. Mode scaling is applied once,
   to the root font size by STPreferences; layout can still vary by mode. */
:root { --section-gap:var(--space-4); --panel-padding:var(--space-5); --checkbox-size:16px; --table-row-height:42px; --table-cell-block:var(--space-2); --table-cell-inline:var(--space-3); --field-gap:var(--space-3); }
h1,h2,h3,h4 { color:var(--ink); font-weight:var(--weight-semibold); line-height:var(--leading-tight); text-transform:none; letter-spacing:normal; }
h1 { font-size:var(--font-page); }
h2,.dialog-heading h2 { font-size:var(--font-section); }
h3,h4,.equipment-header strong,.format-zone-heading strong,.basic-conveyor-heading h3,
.simulation-analysis-heading h3,.equipment-speed-chart-heading h3,
.analysis-finding h4,.analysis-recommendation h4,.analysis-no-action h4,
.comparison-section h3,#settings-dialog .settings-section h3 { font-size:var(--font-card); }
label,.field-label,.basic-control-heading { color:var(--ink); font-size:var(--font-body); font-weight:var(--weight-medium); line-height:var(--leading-body); }
.equipment-grid label,.format-zone-grid label,.reliability-controls label { font-size:var(--font-body); font-weight:var(--weight-medium); }
input,select,textarea { font-size:var(--font-input); font-weight:var(--weight-regular); }
input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]):not([type=file]),select { height:var(--control-height); min-height:var(--control-height); line-height:var(--leading-tight); padding-block:var(--space-1); margin-block:0; }
.field-grid,.equipment-grid,.format-zone-grid,.gemini-connection-grid,.color-rgb-grid { gap:var(--field-gap); align-items:end; }
.field-grid > label,.equipment-grid > label,.format-zone-grid > label { min-width:0; gap:var(--space-2); }
table tr { height:var(--table-row-height); }
table :is(th,td),.markdown-table :is(th,td),#sheet-import-preview :is(th,td),.scenario-metric-table :is(th,td),.scenario-results-dialog :is(th,td),.scenario-config-dialog .scenario-parameter-table :is(th,td) { padding:var(--table-cell-block) var(--table-cell-inline); vertical-align:middle; line-height:var(--leading-body); }
.comparison-row { min-height:var(--table-row-height); align-items:center; gap:var(--field-gap); padding:var(--table-cell-block) var(--table-cell-inline); }
.comparison-row span { padding:0; overflow-wrap:anywhere; }
.metrics-grid article { min-width:0; }
.metrics-grid strong { max-width:100%; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
#playback-status { min-width:0; overflow-wrap:anywhere; }
:is(#settings-dialog,#plant-calendar-dialog) .settings-color-table :is(th,td),:is(#settings-dialog,#plant-calendar-dialog) .settings-color-columns td { padding:var(--table-cell-block) var(--table-cell-inline); }
input[type=number],input[inputmode=numeric],input[inputmode=decimal] { text-align:right; font-variant-numeric:tabular-nums; }
/* Fixed dimensions override field-grid rules which also match checkboxes. */
input[type=checkbox] { width:var(--checkbox-size) !important; min-width:var(--checkbox-size) !important; max-width:var(--checkbox-size) !important; height:var(--checkbox-size) !important; min-height:var(--checkbox-size) !important; max-height:var(--checkbox-size) !important; padding:0 !important; margin:0; flex:0 0 var(--checkbox-size) !important; appearance:auto; accent-color:var(--accent); vertical-align:middle; }
label:has(> input[type=checkbox]) { display:flex; align-items:center; gap:var(--space-2); }
.workspace-content > section.card { padding:var(--panel-padding); }
.workspace-content > section.card > .section-heading { margin:0 0 var(--section-gap); gap:var(--space-3); min-height:var(--control-height); }
.workspace-content > section.card > .section-heading h2 { margin:0; }
.workspace-content > section.card > .section-heading .eyebrow { display:none; }
.workspace-content > section.card > .section-heading p:not(.eyebrow) { margin:var(--space-2) 0 0; }
.equipment-list { gap:var(--space-3); margin-top:0; }
.section-heading,.format-zone-heading,.simulation-analysis-heading { gap:var(--space-3); margin-bottom:var(--section-gap); }
#settings-dialog .settings-section { padding-bottom:var(--section-gap); margin-bottom:var(--section-gap); }
#settings-dialog .settings-section h3 { margin:0 0 var(--space-3); }
#settings-dialog .settings-section:last-child { padding-bottom:0; margin-bottom:0; }
.accent-heading { line-height:var(--leading-body); }
:is(#settings-dialog,#plant-calendar-dialog) .settings-simulation-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--space-3); align-items:start; }
:is(#settings-dialog,#plant-calendar-dialog) .settings-simulation-grid > .settings-option-group { margin:0; min-width:0; }
:is(#settings-dialog,#plant-calendar-dialog) .settings-simulation-grid label { display:grid; gap:var(--space-2); }
:is(#settings-dialog,#plant-calendar-dialog) .settings-simulation-grid select { width:100%; }
#message-dialog-message { white-space:pre-line; overflow-wrap:anywhere; }
.dialog-heading > .icon-button { width:var(--control-height); height:var(--control-height); min-width:var(--control-height); padding:var(--space-2); margin:0; flex-shrink:0; }
.dialog-actions > button:not(.icon-button) { min-height:var(--control-height); padding:var(--space-2) var(--space-4); border-radius:var(--radius-md); font-size:var(--font-body); font-weight:var(--weight-medium); }
#settings-dialog .accent-palette { display:flex; flex-wrap:wrap; gap:var(--space-2); }
html[data-header-view=vgraph] #line-performance > .section-heading { display:none; }

#basic-run-options { display:none; }
html[data-ui-mode=basic] #basic-run-options { display:block; padding:var(--space-3); margin:0 0 var(--section-gap); border:var(--border-width) solid var(--line); border-radius:var(--radius-md); background:var(--surface-soft); }

#basic-run-options > h3 { margin:0 0 var(--space-3); }

html[data-ui-mode=basic] #basic-efficiencies strong { font-size:var(--font-section); font-variant-numeric:tabular-nums; }
html[data-ui-mode=basic] .basic-machine .equipment-header strong { color:var(--ink); }
html[data-ui-mode=basic] .basic-buffer { font-size:var(--font-input); font-weight:var(--weight-semibold); color:var(--ink); }
html[data-ui-mode=basic] .basic-availability { font-size:var(--font-secondary); }
html[data-ui-mode=basic] #basic-conveyor-layout { margin-top:0; gap:var(--section-gap); }
html[data-ui-mode=basic] #basic-conveyor-panel { padding:var(--space-3); }
html[data-ui-mode=basic] #basic-conveyor-panel .format-zone-setup { padding:0; margin:0; border:0; }
.live-equipment-columns,.equipment-speed-sparkline-heading { text-transform:none; letter-spacing:normal; }
@media(max-width:760px) {
 :root { --panel-padding:var(--space-3); }
 html[data-ui-mode=basic] #basic-efficiencies { grid-template-columns:1fr; gap:var(--space-2); }
}

:is(#settings-dialog,#plant-calendar-dialog) .plant-calendar-grid { grid-template-columns:repeat(3,minmax(0,1fr)); row-gap:var(--space-4); column-gap:var(--space-3); align-items:end; }
:is(#settings-dialog,#plant-calendar-dialog) .plant-calendar-content { display:grid; gap:var(--space-4); }
:is(#settings-dialog,#plant-calendar-dialog) .plant-calendar-planning { display:grid; gap:var(--space-3); }

:is(#settings-dialog,#plant-calendar-dialog) .plant-calendar-table { margin:0; }
:is(#settings-dialog,#plant-calendar-dialog) .plant-calendar-table :is(th,td) { overflow-wrap:anywhere; }
:is(#settings-dialog,#plant-calendar-dialog) .settings-color-columns .plant-calendar-table thead th.numeric { width:9em; text-align:right; }
:is(#settings-dialog,#plant-calendar-dialog) .plant-calendar-table tbody th { font-weight:var(--weight-medium); }

:is(#settings-dialog,#plant-calendar-dialog) .plant-calendar-table input { width:100%; min-width:0; text-align:right; }
:is(#settings-dialog,#plant-calendar-dialog) .plant-calendar-events-timed { grid-template-columns:1fr; }
@media(max-width:620px) { :is(#settings-dialog,#plant-calendar-dialog) .plant-calendar-events-timed .plant-calendar-table thead th.numeric { width:20%; } }

/* Subsection toolbars share a baseline; the navigation already names the view. */
#editor-panel > .section-heading,#whatif-panel > .section-heading { display:none; }
.simulation-analysis-heading,.json-section-heading { display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); }

.import-menu > summary.icon-button { list-style:none; display:flex; align-items:center; justify-content:center; }

.import-menu > div { z-index:30; }

.json-section-heading > .button-row { margin-left:auto; padding:0; flex-wrap:wrap; }
.simulation-analysis-heading > div { min-width:0; }
.simulation-analysis-heading > .export-menu { margin-left:auto; flex-shrink:0; }

html[data-ui-mode=basic] #results-insight,
html[data-ui-mode=basic] .scenario-design-checks { display:none !important; }
/* Separate metric and control boxes, with more prominent percentages. */
html[data-ui-mode=basic] #basic-run-options { background:transparent; border:0; padding:0; }

/* Basic presents the same evaluated values without the advanced comparison table. */
.scenario-basic-metrics { display:none; }

html[data-ui-mode=basic] .analysis-recommendation:has(.analysis-capex) > h4,

html[data-ui-mode=basic] .scenario-preview-context { display:none; }

.scenario-basic-metric { display:flex; flex-direction:column; gap:var(--space-1); }

.scenario-basic-metric strong { color:var(--ink); font-size:var(--font-section); font-variant-numeric:tabular-nums; }
.scenario-basic-metric:first-child strong { font-size:2.4rem; line-height:1.1; }

html[data-ui-mode=advance] .analysis-critical { border-left-color:var(--danger); }

.json-field-heading { display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); flex-wrap:wrap; }
.json-field-heading .button-row { margin-left:auto; padding:0; gap:var(--space-1); }
/* Subsection headings and action menus use the same dimensions in every view. */
#simulation-analysis { margin-top:0; }
#simulation-analysis-content { margin-top:0; }
.workspace-content > section.card > .section-heading,
.simulation-analysis-heading,#line-performance > .section-heading,
.basic-conveyor-heading { min-height:var(--control-height); align-items:center; margin-top:0; margin-bottom:var(--section-gap); }
.workspace-content > section.card > .section-heading h2,
#basic-run-options-title,#simulation-analysis-title,#equipment-control-events-title,#vgraph-title,
.basic-conveyor-heading h3 { font-size:var(--font-card); font-weight:var(--weight-semibold); line-height:var(--leading-tight); margin:0; }
#basic-run-options > h3 { display:flex; align-items:center; min-height:var(--control-height); margin-bottom:var(--section-gap); }
.section-heading .export-menu,.editor-subheading .export-menu,.simulation-analysis-heading .export-menu { margin:0; vertical-align:middle; }
.editor-subheading > .button-row { align-items:center; }

html[data-ui-mode=basic] .scenario-tier-grid > .analysis-recommendation { min-width:0; display:flex; flex-direction:column; padding:var(--space-3); }
html[data-ui-mode=basic] .scenario-tier-grid > .analysis-recommendation > .analysis-capex,
html[data-ui-mode=basic] .scenario-tier-grid > .analysis-recommendation > h4 { margin:0 0 var(--space-4); min-height:var(--control-height); align-content:center; font-size:var(--font-card); }

/* Outlined icon buttons in editor and case toolbars. */
.editor-subheading .icon-button,.json-section-heading .icon-button,.cases-toolbar > .icon-button { border-color:var(--line); background:transparent; color:var(--muted); }
.editor-subheading .icon-button:hover,.cases-toolbar > .icon-button:hover { background:var(--surface-hover); color:var(--ink); }
.scenario-activity { width:100%; height:var(--state-border-width); margin:var(--space-3) 0; }

.scenario-activity { background:var(--surface-soft); }

.export-menu > div > button { border:0; box-shadow:none; background:transparent; color:var(--ink); border-radius:var(--radius-sm); min-height:var(--control-height); padding:var(--space-2) var(--space-3); margin:0; text-align:left; justify-content:flex-start; }
.export-menu > div > button:hover { background:var(--surface-hover); }
#run-panel > .section-heading { justify-content:flex-end; }

#basic-run-options-title { justify-content:space-between; gap:var(--space-3); }
#playback-progress, #simulation2d-progress { color:var(--accent); font-weight:var(--weight-semibold); font-variant-numeric:tabular-nums; white-space:nowrap; }
.app-shell:not(.case-open) .user-chip { display:block; max-width:none; overflow:visible; text-overflow:clip; overflow-wrap:anywhere; }
#settings-dialog #case-editor-form .field-grid,#settings-dialog #case-editor-form label,#settings-dialog #case-name { width:100%; max-width:none; box-sizing:border-box; }

tbody tr:is(:hover,:focus-within) > :is(th,td) { background:var(--table-row-hover); }

/* Subsección (Subsection): control reutilizable de bloque plegable.
   API visual: .fold-card, .fold-heading, .fold-toggle, .fold-content, .fold-tools.
   El contenedor padre aporta el primer margen exterior; evita sumarlo dos veces. */
.fold-card, html[data-ui-mode=basic] #basic-run-options.fold-card {
  margin:var(--space-4) 0; padding:var(--space-4);
  border:var(--border-width) solid var(--line);
  border-radius:var(--radius-md); background:var(--surface-soft);
}
.fold-heading, .fold-native > summary {
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap;
  gap:var(--space-3); margin:0; padding:0 0 var(--space-3);
  border-block-end:var(--border-width) solid var(--accent); color:var(--accent);
  font-size:var(--font-card); font-weight:var(--weight-semibold); line-height:var(--leading-tight);
}
.fold-heading h3, #realdata-panel .fold-heading .real-data-section-title { margin:0; color:var(--accent); font:inherit; line-height:var(--leading-tight); }
/* Reusable subsection pieces: title, optional descriptive subtitle and internal divider. */
.fold-heading .subsection-heading-copy { min-width:0; flex:1 1 auto; }
.fold-heading .subsection-heading-title, .fold-heading h3 { color:var(--accent);font-size:var(--font-card);font-weight:var(--weight-semibold);line-height:var(--leading-tight); }
.fold-heading .subsection-description { margin:var(--space-2) 0 0;max-width:84ch;color:var(--muted);font-size:var(--font-secondary);font-weight:var(--weight-regular);line-height:var(--leading-body); }
.fold-native > summary .subsection-heading-copy { display:flex;flex-direction:column;gap:var(--space-2);min-width:0; }
.fold-native > summary .subsection-description { display:block;color:var(--muted);font-size:var(--font-secondary);font-weight:var(--weight-regular);line-height:var(--leading-body); }
.subsection-fieldset { min-width:0; border:0;border-top:var(--border-width) solid var(--line);padding:var(--space-3) 0 0;margin:var(--space-4) 0 0; }
.fold-card fieldset > legend.subsection-divider, legend.subsection-divider { padding:0 var(--space-2) 0 0;color:var(--accent);font-size:var(--font-secondary);font-weight:var(--weight-semibold);line-height:var(--leading-body); }
.subsection-divider:not(legend) { display:flex;align-items:center;gap:var(--space-2);min-width:0;color:var(--accent);font-size:var(--font-secondary);font-weight:var(--weight-semibold); }
.subsection-divider:not(legend)::after { content:"";height:var(--border-width);background:var(--line);flex:1; }
.fold-heading p {
  margin:var(--space-2) 0 0;
  color:var(--muted); font-size:var(--font-secondary); font-weight:var(--weight-regular); line-height:var(--leading-body);
}
.fold-heading .fold-tools, .fold-heading .button-row { margin:0 0 0 auto; padding:0; }
.button-row > .export-menu, .fold-tools > .export-menu { display:flex; flex-shrink:0; margin:0; }
.fold-heading .fold-toggle {
  display:inline-flex; align-items:center; gap:var(--space-2); min-height:0; margin:0; padding:0;
  border:0; border-radius:0; background:transparent; box-shadow:none; color:var(--accent); font:inherit; text-align:start;
}
.fold-native > summary { cursor:pointer; list-style:none; justify-content:flex-start; }
.fold-native > summary::-webkit-details-marker { display:none; }
.fold-heading .fold-toggle::before, .fold-native > summary::before {
  content:""; flex:none; width:.45em; height:.45em; margin-inline-end:var(--space-1);
  border-inline-end:2px solid currentColor; border-block-end:2px solid currentColor;
  transform:rotate(45deg);
  transition:transform 180ms ease-in-out;
}
@supports (interpolate-size:allow-keywords) and selector(details::details-content) {
  .fold-native { interpolate-size:allow-keywords; }
  .fold-native::details-content {
    block-size:0; overflow:clip;
    transition:block-size 180ms ease-in-out, content-visibility 180ms allow-discrete;
  }
  .fold-native[open]::details-content { block-size:auto; }
}
@media (prefers-reduced-motion:reduce) {
  .fold-heading .fold-toggle::before, .fold-native > summary::before { transition:none; }
  .fold-native::details-content { transition:none; }
}
.fold-heading .fold-toggle[aria-expanded=false]::before,
.fold-native:not([open]) > summary::before { transform:rotate(-45deg); }
.fold-toggle:focus-visible, .fold-native > summary:focus-visible { outline:var(--focus-width) solid var(--accent); outline-offset:var(--space-1); }
.fold-content { margin-block-start:var(--space-3); min-width:0; }
