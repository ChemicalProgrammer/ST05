  // System descriptions and engineering help from canonical ST_TEXT_RESOURCES.
  Object.assign(translations,{"A CLEARER VIEW OF YOUR LINE":"UNA VISIÓN MÁS CLARA DE TU LÍNEA","Unlock your line’s potential.":"Descubre el potencial de tu línea.","Simulate packaging lines, compare performance and explore improvement scenarios.":"Simula líneas de envasado, compara su desempeño y explora escenarios de mejora.","Keep me signed in on this browser":"Mantener la sesión iniciada en este navegador","Continue with your account":"Continuar con tu cuenta","Uses the account authorized for this app.":"Utiliza la cuenta autorizada para esta aplicación.","Case navigation":"Navegación de casos","Simulations":"Simulaciones","SIMULATIONS":"SIMULACIONES","Simulations and comparison":"Simulaciones y comparación","Selected simulation":"Simulación seleccionada","SELECTED SIMULATION":"SIMULACIÓN SELECCIONADA","Workspace actions":"Acciones del espacio de trabajo","Order defines material flow. Use alternating machine → conveyor → machine steps; every conveyor requires physical geometry.":"El orden define el flujo de material. Alterna máquina → transportador → máquina; cada transportador necesita geometría física.","Configure a valid physical line before running: machine → conveyor → machine, with geometry on every conveyor. Changes save automatically.":"Configura una línea física válida antes de ejecutar: máquina → transportador → máquina, con geometría en cada transportador. Los cambios se guardan automáticamente.","At 1×, one virtual second takes one real second. The engine integrates at 0.25 s; the display interval only controls replay detail and result size. Every conveyor uses SimuLine physical geometry by default: L_act, L_p, package pitch, speed factor, runout, sensor delays, and insurance derive capacity, travel, normal photoeye pulses, Prime / Back-up control, recovery, and design audits. Abstract buffers are not used.":"A 1×, un segundo virtual equivale a un segundo real. El motor integra cada 0.25 s; el intervalo de visualización sólo controla el detalle de reproducción y el tamaño de resultados. Cada transportador utiliza geometría física de SimuLine: L_act, L_p, paso del paquete, factor de velocidad, descarga residual, retardos de sensores y factor de seguridad para calcular capacidad, recorrido, pulsos de sensores, controles Prime / Back-up, recuperación y verificaciones de diseño. No se usan buffers abstractos.","Schedule a pause, planned stop, emergency stop, reset, run, manual, or automatic mode change in virtual time.":"Programa pausas, paradas planificadas o de emergencia, restablecimientos, arranques y cambios entre modo manual y automático en tiempo virtual.","Line OEE is final output divided by the maximum output of the selected critical machine across the same virtual duration. Quality is assumed 100% until rejects are modeled.":"El OEE de línea es la producción final dividida entre la producción máxima de la máquina crítica seleccionada durante la misma duración virtual. Se supone calidad del 100 % hasta que se modelen los rechazos.","Scenario controls apply at the displayed virtual second and deterministically recalculate the run. They are simulation controls only; they never command real equipment.":"Los controles de escenario se aplican en el segundo virtual mostrado y recalculan la ejecución de forma determinista. Son únicamente controles de simulación; nunca gobiernan equipos reales.","Evaluate the selected simulation and create supported scenarios by investment category.":"Evalúa la simulación seleccionada y crea escenarios compatibles según su categoría de inversión.","Review zero, medium and high CAPEX options. Evidence labels distinguish static design inputs from dynamic run results. Each action creates a separate simulation.":"Revisa las opciones de CAPEX cero, medio y alto. Las etiquetas de evidencia distinguen los datos de diseño estáticos de los resultados dinámicos. Cada acción crea una simulación independiente.","The browser engine executes the deterministic Case. Apps Script is responsible for identity and Drive persistence; Gemini is not used for calculation. Sensor positions in the demo are transparent synthetic assumptions, not a PLC or safety-control design.":"El motor del navegador ejecuta el caso determinista. Apps Script gestiona la identidad y el almacenamiento en Drive; Gemini no realiza cálculos. Las posiciones de sensores del demo son supuestos sintéticos explícitos, no constituyen un diseño PLC ni de seguridad.","Sending shares a compact analysis with Gemini. Conversations reset when changing simulation or case.":"El envío comparte un análisis compacto con Gemini. Las conversaciones se reinician al cambiar de simulación o caso.","Choose a Drive folder you can access. Cases and results are saved in this workspace.":"Elige una carpeta de Drive a la que tengas acceso. Los casos y resultados se guardan en ese espacio de trabajo.","Your API key is stored in your Apps Script user properties and used only by the server.":"Tu clave API se guarda en las propiedades de usuario de Apps Script y sólo la utiliza el servidor.","Read metadata in B1:B7 or legacy C1:C7 and equipment rows starting at A10. NA and N/A mean not applicable. Compare current and Sheet values, choose equipment and fields, then apply the selected changes. The active simulation saves automatically.":"Lee los metadatos de B1:B7 o C1:C7 en formatos antiguos y los equipos a partir de A10. NA y N/A significan no aplicable. Compara los valores actuales con los de la hoja, selecciona equipos y campos y aplica los cambios. La simulación activa se guarda automáticamente.","Clears this account's Drive connection, Gemini key and settings, and this browser's app preferences. Drive cases, results and index are retained. Keep your folder ID so you can reconnect.":"Elimina la conexión a Drive, la clave de Gemini y las preferencias de esta cuenta y del navegador. Los casos, resultados e índice almacenados en Drive se conservan. Guarda el ID de carpeta para reconectarte.","Close the current case before resetting. Drive cases, results and index are retained. Keep your folder ID so you can reconnect.":"Cierra el caso actual antes de restablecer. Se conservan los casos, resultados e índice de Drive. Guarda el ID de carpeta para reconectarte.","Reset the app? Your Drive folder ID, Gemini API key, account prompts and browser preferences will be cleared. Pending Settings edits will be discarded. Drive cases, results and index will remain. Keep your folder ID to reconnect. Other accounts are unaffected.":"¿Restablecer la aplicación? Se eliminarán el ID de carpeta de Drive, la clave API de Gemini, las instrucciones de tu cuenta y las preferencias del navegador. Se descartarán los cambios pendientes de Configuración. Los casos, resultados e índice permanecerán en Drive. Conserva el ID de carpeta para reconectarte. No afecta a otras cuentas.","Browser-local pilot: up to four factors, two levels, and at least three rounds per combination. Configure factors in What-If. Applied when Settings closes.":"Función experimental local del navegador: hasta cuatro factores, dos niveles y al menos tres rondas por combinación. Configura los factores en Qué pasaría si. Se aplica al cerrar Configuración.","Applies immediately to this browser and Settings. Other users keep their own mode.":"Se aplica inmediatamente a este navegador y a Configuración. Los demás usuarios conservan su propio modo.","This browser could not save the interface mode. Try again with browser storage enabled.":"El navegador no pudo guardar el modo de interfaz. Inténtalo de nuevo con el almacenamiento del navegador habilitado.","Changing the storage folder saves and closes the current case. Existing cases stay in their original folder.":"Al cambiar la carpeta de almacenamiento, se guarda y cierra el caso actual. Los casos existentes permanecen en su carpeta original.","Gemini chat will stop working until you add a new API key. Your cases and simulation results will remain available.":"El chat de Gemini dejará de funcionar hasta que agregues una nueva clave API. Tus casos y resultados seguirán disponibles.","Select the machine that sets the line reference rate. Only one machine can be selected; its physical equipment type stays unchanged.":"Selecciona la máquina que establece la velocidad de referencia de la línea. Sólo puede haber una seleccionada; su tipo físico no cambia.","Installed machine capacity. This is distinct from the normal line target and the estimated recovery overspeed. The current engine still processes at the configured nominal rate.":"Capacidad instalada de la máquina. Es distinta de la velocidad objetivo normal y de la sobrevelocidad de recuperación estimada. El motor sigue operando a la velocidad nominal configurada.","Design estimate only. Leave blank to use MTBF as the recovery window. A shorter time requires more overspeed; the engine does not apply this target automatically.":"Estimación exclusiva de diseño. Deja vacío para usar MTBF como ventana de recuperación. Un tiempo menor requiere más sobrevelocidad; el motor no aplica ese objetivo automáticamente.","Maximum speed and recovery time must be positive numbers when provided.":"La velocidad máxima y el tiempo de recuperación deben ser positivos cuando se especifican.","Enter a positive belt speed and package length, a conveyor long enough for one moving pitch, and an accumulated gap no greater than the moving gap.":"Ingresa una velocidad de banda y longitud de paquete positivas, una longitud de transportador suficiente para un paso en movimiento y una separación acumulada que no supere la separación en movimiento.","Automatic speed uses upstream discharge velocity and the speed factor. Manual speed uses the physical mm/s value below.":"La velocidad automática usa la velocidad de descarga aguas arriba y el factor de velocidad. La velocidad manual utiliza el valor físico en mm/s indicado abajo.","Physical belt velocity. It controls travel time and transfer capacity; the nominal conveyor BPM field is not an independent limit.":"Velocidad física de la banda. Determina el tiempo de transporte y la capacidad de transferencia; el campo BPM nominal del transportador no es un límite independiente.","Clear distance between moving packages. Leave blank to derive spacing from the discharge pitch and automatic speed factor. Moving pitch is product length plus this gap.":"Separación libre entre paquetes en movimiento. Deja vacío para calcularla con el paso de descarga y el factor de velocidad automático. El paso en movimiento es la longitud del producto más esta separación.","Clear distance between queued packages; default 0 mm means touching packages. It determines accumulated capacity and queue sensor thresholds. Must not exceed moving gap.":"Distancia libre entre paquetes acumulados; 0 mm significa que se tocan. Determina la capacidad acumulada y los umbrales de los sensores de cola. No debe superar la separación en movimiento.","Worksheet audit uses automatic design assumptions. Runtime speed, spacing and capacity are shown separately.":"La verificación de diseño de la hoja utiliza supuestos automáticos. La velocidad, separación y capacidad operativas se muestran por separado.","Productive capacity is output / (nominal rate × full duration). It can be compared with processing utilization in a deterministic cycle model; stateSeconds contains the separate elapsed fluid-model states.":"La capacidad productiva es producción / (velocidad nominal × duración total). Puede compararse con la utilización del proceso en un modelo determinista de ciclos; stateSeconds conserva por separado los tiempos de cada estado.","Starved and blocked columns count stopped flow. Partial losses are equivalent lost capacity during ticks with positive flow; they are not additional stopped time.":"Las columnas Sin alimentación y Bloqueado representan interrupciones del flujo. Las pérdidas parciales equivalen a capacidad perdida en intervalos con flujo positivo; no son tiempo detenido adicional.","Quality assumes 100% (no reject model). Loss and downtime totals are equipment-minutes; simultaneous losses are not line downtime.":"Se supone una calidad del 100 % (sin modelo de rechazos). Los totales de pérdidas y paradas se expresan en minutos-equipo; las pérdidas simultáneas no son necesariamente paradas de línea.","Line throughput = final equipment output ÷ complete run:":"Producción efectiva de línea = producción del último equipo ÷ duración completa:","Each machine's effective throughput = availability × run efficiency × configured processing speed. Starving and blocking reduce run efficiency. Rates use the case's equivalent flow unit; pack pattern is not an automatic conversion.":"La producción efectiva de cada máquina es disponibilidad × eficiencia en operación × velocidad de proceso configurada. La falta de alimentación y el bloqueo reducen la eficiencia en operación. Las velocidades usan la unidad de flujo equivalente del caso; el patrón de empaque no implica conversión automática.","The compared runs use different flow units. Convert them to a common unit before interpreting throughput and production differences.":"Las ejecuciones comparadas usan unidades de flujo diferentes. Convierte a una unidad común antes de interpretar las diferencias de producción y velocidad.","These proposals use round 1 as dynamic evidence. Replication averages are available in Results; proposed gains remain unverified.":"Estas propuestas usan la ronda 1 como evidencia dinámica. Los promedios de réplicas están disponibles en Resultados; las ganancias propuestas aún no están verificadas.","Events changed. The other rounds will be recalculated when round 1 playback finishes.":"Los eventos cambiaron. Las demás rondas se recalcularán al finalizar la reproducción de la ronda 1.","Events added during round 1 changed the result. Recalculating the other rounds with the final event schedule.":"Los eventos agregados durante la ronda 1 modificaron el resultado. Se están recalculando las otras rondas con el programa final de eventos.","Background rounds cancelled. Only the current round 1 result is available.":"Se cancelaron las rondas en segundo plano. Sólo está disponible el resultado actual de la ronda 1.","Round 1 is playing as it calculates. Other rounds are calculating in the background.":"La ronda 1 se reproduce mientras se calcula. Las demás rondas se calculan en segundo plano.","Round 1 keeps playback and live controls. Other rounds calculate metrics in the background using the same scheduled events and independent seeds.":"La ronda 1 conserva la reproducción y los controles en vivo. Las demás calculan indicadores en segundo plano con los mismos eventos programados y semillas independientes.","Live controls are available in round 1. Scheduled events apply to every round.":"Los controles en vivo están disponibles en la ronda 1. Los eventos programados se aplican a todas las rondas.","Choose 1–100 whole rounds, 1–3 shifts and 0.25–24 hours per shift in quarter-hour increments.":"Selecciona entre 1 y 100 rondas enteras, entre 1 y 3 turnos y entre 0.25 y 24 horas por turno en incrementos de un cuarto de hora.","Results show the selected average or individual round. Playback charts show an actual round; the representative round is closest to mean production.":"Resultados muestra el promedio seleccionado o una ronda individual. Las gráficas de reproducción muestran una ronda real; la representativa es la más cercana a la producción media.","Normal line target = min(configured processing rate, critical machine rate). Estimated overspeed = normal target + recoverable units / target recovery time. Recoverable units = min(normal target × MTTR, useful installed accumulation toward the critical machine). The default recovery window is MTBF; it is a planning assumption, not a measured recovery time. Missing geometry or enabled reliability leaves the estimate unavailable. The critical machine stays at normal speed. The curve is not forced into a V and is not applied by the engine. Actual desired inventory and protection during repeated stops still require dynamic validation. † target exceeds installed maximum.":"Velocidad normal objetivo = mínimo(velocidad configurada, velocidad de la máquina crítica). Sobrevelocidad estimada = objetivo normal + unidades recuperables / tiempo objetivo de recuperación. Unidades recuperables = mínimo(objetivo normal × MTTR, acumulación útil instalada hacia la máquina crítica). La ventana de recuperación predeterminada es MTBF: es un supuesto de diseño, no un tiempo medido. Sin geometría o confiabilidad habilitada la estimación no está disponible. La máquina crítica permanece a velocidad normal. La curva no se fuerza a una V ni se aplica por el motor. El inventario deseado real y la protección ante paradas repetidas aún requieren validación dinámica. † El objetivo excede el máximo instalado.","Normal line target and estimated recovery overspeed by machine in units per minute":"Velocidad normal objetivo y sobrevelocidad de recuperación estimada por máquina en unidades por minuto","Design speeds only. The current engine does not accelerate machines above their nominal speed after a stop; this profile does not certify recovery or critical machine protection.":"Sólo velocidades de diseño. El motor actual no acelera las máquinas por encima de la velocidad nominal tras una parada; este perfil no certifica recuperación ni protección de la máquina crítica.","No recovery overspeed is configured: maximum and normal speeds are equal or maximum speeds are missing. Imported maximum speed currently initializes normal speed. Recovery and V-Graph compliance are not evaluated.":"No hay sobrevelocidad de recuperación configurada: las velocidades máxima y normal son iguales o faltan velocidades máximas. La velocidad máxima importada inicializa actualmente la normal. No se evalúa la recuperación ni el cumplimiento del V-Graph.","The table's capacity estimate for machines other than the critical machine is max(normal speed, critical machine normal speed ÷ intrinsic availability). It does not calculate recovery overspeed: that requires desired and actual buffer inventory, available accumulation, and a recovery interval. The engine does not command overspeed. † estimate exceeds configured maximum; a missing maximum leaves feasibility unverified.":"La estimación de capacidad para las máquinas no críticas es el máximo entre la velocidad normal y la velocidad normal de la máquina crítica dividida entre la disponibilidad intrínseca. No calcula sobrevelocidad de recuperación: ésta requiere inventario acumulado deseado y real, acumulación disponible e intervalo de recuperación. El motor no ordena sobrevelocidad. † La estimación excede el máximo configurado; sin un máximo, la viabilidad no está verificada.","Replication statistics are compared separately. The standard result comparison below uses round 1. Compare batch means only with matching duration, round count and seed lists.":"Las estadísticas de réplicas se comparan por separado. La comparación estándar de resultados usa la ronda 1. Compara las medias únicamente con igual duración, cantidad de rondas y listas de semillas."});

uced":"Producido","Summary · endpoint snapshots":"Resumen · estados en los extremos","Conveyor controls are not supported by the experimental SimPy engine.":"El motor experimental SimPy no admite los controles de transportadores.","Transport unit":"Unidad transportada","Material flow":"Flujo de material","Bottle":"Botella","Bottle → Bottle":"Botella → Botella","Bottle → Case":"Botella → Caja","Case → Case":"Caja → Caja","Unnamed":"Sin nombre","Adjusts accumulation belt speed and product spacing to achieve design occupancy.":"Ajusta la velocidad de banda en acumulación y la separación de productos para alcanzar la ocupación de diseño.","Edit LBA":"Editar LBA","Set target Overspeed":"Definir sobrevelocidad objetivo","Upstream restart delay for this connection.":"Retardo de reinicio aguas arriba para esta conexión.","Downstream infeed pitch for this connection.":"Paso de alimentación aguas abajo para esta conexión.","Speed increase relative to the discharge zone.":"Incremento de velocidad respecto de la zona de descarga.","Speed increase relative to the coding zone.":"Incremento de velocidad respecto de la zona de codificación.","Equipment editor is incomplete. The saved line was preserved. Open Equipment to reload the full line before editing it.":"El editor de equipos está incompleto. La línea guardada se conservó. Abre Equipos para recargarla antes de editar.","Characteristics":"Características","Upstream Discharge Velocity must be greater than zero.":"La velocidad de descarga aguas arriba debe ser mayor que cero.","Time to First Package After Restart must be zero or greater.":"El tiempo hasta el primer paquete tras reiniciar debe ser cero o mayor.","Refresh to load models for the saved API key.":"Actualiza para cargar los modelos de la clave API guardada.","Save an API key to load available models.":"Guarda una clave API para cargar los modelos disponibles.","Loading available models…":"Cargando modelos disponibles…","Models reported by Gemini for the saved API key :"Impacto de la pérdida de velocidad sobre producción y eficiencia","Bottle equivalents":"Botellas equivalentes","Recovery above reference":"Recuperación por encima de la referencia","Equipment operation":"Operación de equipos","Count":"Cantidad","Own stop breakdown":"Desglose de paradas propias","Results view":"Vista de resultados","OEE comparison":"Comparación de OEE","Format catalogs":"Catálogos de formatos","Close formats":"Cerrar formatos","Define the product and its bottle dimensions for simulation.":"Define el producto y sus dimensiones de botella para la simulación.","Associate a product with packaging dimensions and production units.":"Asocia el producto con dimensiones de empaque y unidades de producción.","Override machine operating rates and start-up behavior for the selected product or format.":"Sobrescribe velocidades operativas y comportamiento de arranque de máquinas para el producto o formato seleccionado.","Override conveyor speeds, transported units, and bottle or case spacing.":"Sobrescribe las velocidades de los transportadores, unidades transportadas y separaciones de botellas o cajas.","Current format":"Formato actual","Current product":"Producto actual","Clear fields":"Limpiar campos","Import configuration":"Importar configuración","Export configuration":"Exportar configuración","Add a product first, then create its packing format.":"Agrega primero un producto y después crea su formato de empaque.","Add a product to configure its properties and equipment behavior.":"Agrega un producto para configurar sus propiedades y el comportamiento de los equipos.","Format name":"Nombre del formato","Product name":"Nombre del producto","Linked product":"Producto asociado","Bottles per case":"Botellas por caja","Volume":"Volumen","Volume unit":"Unidad de volumen","Open JSON file":"Abrir archivo JSON","Configuration exceeds 1 MB.":"La configuración supera 1 MB.","This format references a product not present in this case. Import or select that product first.   Object.assign(translations,{"Sheet / reviewed value":"Hoja / valor revisado","Review a proposed adjustment":"Revisar ajuste propuesto","{L} × (1 + {Q}/100) − {K} = {pitch} × (1 + {factor}/100) − {length} = {gap} mm.":"{L} × (1 + {Q}/100) − {K} = {pitch} × (1 + {factor}/100) − {length} = {gap} mm.","The calculated pitch is smaller than the package length, creating a negative gap in this model. Check that package length is measured along the direction of travel and discharge pitch is measured center to center. If those measurements are wrong, correct the Sheet and preview again.":"El paso calculado es menor que la longitud del paquete, lo que produce una separación negativa en este modelo. Verifica que la longitud del paquete se mida en la dirección del movimiento y el paso de descarga entre centros. Si las mediciones son incorrectas, corrige la hoja y vuelve a generar la vista previa.","With K and L fixed, a conveyor speed factor of {proposed}% is the rounded mathematical minimum to avoid a negative gap. This is a simulation proposal, not a verified plant setting or an optimized speed. Accept only if that speed change is feasible for the equipment. Other physical checks still apply.":"Con K y L fijos, un factor de velocidad del transportador de {proposed}% es el mínimo matemático redondeado para evitar una separación negativa. Es una propuesta de simulación, no un ajuste verificado de planta ni una velocidad optimizada. Acéptalo sólo si el cambio de velocidad es viable para el equipo. Las demás verificaciones físicas siguen aplicando.","Accept proposed {Q}: {proposed}%":"Aceptar {Q} propuesto: {proposed}%","Accepted for preview: {cell} changes from {before}% in the Sheet to {after}%. It will be imported only if this field is selected when you apply changes. The spreadsheet is unchanged.":"Aceptado para vista previa: {cell} cambia de {before}% en la hoja a {after}%. Se importará sólo si seleccionas este campo al aplicar cambios. La hoja no cambia.","Undo adjustment" o que deseas actualizar.","Name changed at this source row: choose an existing equipment or add new.":"El nombre cambió en esta fila de origen: elige un equipo existente o agrégalo como nuevo.","New equipment — appended to the line.":"Equipo nuevo — agregado al final de la línea.","Matched by a unique name or previous import.":"Coincidencia por nombre único o importación anterior.","Two Sheet rows target the same equipment. Skip one or choose another target.":"Dos filas de la hoja corresponden al mismo equipo. Omite una o elige otro destino.","Target equipment no longer exists. Preview again.":"El equipo de destino ya no existe. Genera otra vista previa.",": fix this cell or deselect the field.":": corrige esta celda o desmarca el campo.",": MTBF and MTTR must both be positive or both NA. Adjust the field selection.":": MTBF y MTTR deben ser ambos positivos o ambos NA. Ajusta la selección de campos.",": new/updated equipment needs a name and positive nominal speed. Select those fields or skip the row.":": el equipo nuevo o actualizado necesita nombre y velocidad nominal positiva. Selecciona esos campos u omite la fila.",": fix or deselect the metadata field.":": corrige o desmarca el campo de metadatos."});
  // Scenario feasibility, engineering inspector, comparisons and assistant help.
  Object.assign(translations,{"No supported changes were found with the available evidence. Review the engineering checks or run the simulation to add dynamic evidence.":"Con la evidencia disponible no se encontraron cambios compatibles. Revisa las verificaciones de ingeniería o ejecuta la simulación para agregar evidencia dinámica.","Review this field in the equipment configuration before creating the scenario.":"Revisa este campo en la configuración del equipo antes de crear el escenario.","In Line Setup, select this conveyor and change Conveyor speed factor (%). This changes belt velocity relative to upstream discharge and therefore package spacing. Verify the drive can achieve the proposed setting.":"En Configuración de línea, selecciona este transportador y cambia el factor de velocidad (%). Esto modifica la velocidad de banda respecto a la descarga aguas arriba y, por tanto, el espacio entre paquetes. Verifica que el variador pueda alcanzar el valor propuesto.","In Line Setup, change Back-up blocked delay. This controls how long the sensor must remain blocked before requesting an upstream stop; the setting is checked against normal package pulse duration.":"En Configuración de línea, cambia el retardo de bloqueo Back-up. Controla cuánto debe permanecer bloqueado el sensor antes de solicitar una parada aguas arriba; se compara con la duración normal de los pulsos de paquetes.","In Line Setup, change Back-up clear delay. This controls how long the sensor must remain clear before releasing the upstream stop; review it against normal inter-package gaps.":"En Configuración de línea, cambia el retardo de liberación Back-up. Controla cuánto debe permanecer libre el sensor antes de reanudar el equipo aguas arriba; revísalo frente a los espacios normales entre paquetes.","In Line Setup, change Installed Back-up position. The distance is measured from the upstream discharge. This represents relocating the sensor to reserve the required overflow length.":"En Configuración de línea, cambia la posición instalada de Back-up. La distancia se mide desde la descarga aguas arriba. Representa reubicar el sensor para reservar la longitud de desbordamiento necesaria.","In Line Setup, change Installed length (L_act). This represents a physical conveyor length change to support accumulation and recovery; verify layout space and feasibility.":"En Configuración de línea, cambia la longitud instalada (L_act). Representa un cambio físico del transportador para permitir acumulación y recuperación; verifica espacio disponible y viabilidad.","In Line Setup, change Prime reserve (L_p). Review the corresponding sensor location and downstream startup requirement before applying the value.":"En Configuración de línea, cambia la reserva Prime (L_p). Revisa la posición del sensor y los requisitos de arranque aguas abajo antes de aplicar el valor.","In Line Setup, change Downstream ramp-up time. Confirm the machine and its controls can reach full speed within this proposed time.":"En Configuración de línea, cambia el tiempo de aceleración aguas abajo. Confirma que la máquina y sus controles puedan alcanzar velocidad plena en el tiempo propuesto.","In the equipment process JSON, change upstream.startupTimeSeconds. Confirm the actual control sequence can support the proposed startup time.":"En el JSON de proceso del equipo, cambia upstream.startupTimeSeconds. Confirma que la secuencia de control real admita el tiempo de arranque propuesto.","Current evidence does not support an automatic change in this category.":"La evidencia actual no justifica un cambio automático en esta categoría.","Complete the physical line inputs before applying this scenario.":"Completa los datos físicos de la línea antes de aplicar este escenario.","This change would invalidate a design check. Resolve the related geometry constraints first.":"Este cambio invalidaría una verificación de diseño. Resuelve primero las restricciones geométricas relacionadas.","Create a separate simulation with the listed changes? The baseline and random seed are preserved. Run the new scenario to measure its effect.":"¿Crear una simulación independiente con los cambios indicados? Se conservan la línea base y la semilla aleatoria. Ejecuta el escenario nuevo para medir su efecto.","Scenario created and saved. Review the inputs and run it to evaluate the impact.":"Escenario creado y guardado. Revisa las entradas y ejecútalo para evaluar su impacto.","The source simulation changed. Generate a new proposal before applying it.":"La simulación de origen cambió. Genera una propuesta nueva antes de aplicarla.","These checks implement the supplied design brief where inputs exist; they do not certify handbook compliance. CAPEX levels describe intervention scale, not a cost estimate or financial return. Buffer coverage uses the adjacent upstream machine's MTTR for microstops up to 4 minutes. Unmodeled turn losses, filled-container diameter and PLC desired-state behavior are not assumed.":"Estas verificaciones aplican los criterios de diseño proporcionados cuando existen datos, pero no certifican el cumplimiento de manuales. Las categorías CAPEX describen la magnitud de la intervención, no una estimación de costos o rentabilidad. La cobertura del buffer utiliza el MTTR de la máquina adyacente aguas arriba para microparadas de hasta 4 minutos. No se suponen pérdidas por curvas no modeladas, diámetro de envases llenos ni comportamiento deseado de PLC.","Expected direction is a hypothesis. Numerical OEE, throughput and loss improvements require a new run and comparison.":"La dirección esperada es una hipótesis. Las mejoras en OEE, producción efectiva y pérdidas requieren una ejecución y comparación nuevas.","90° turns and filled-container diameter":"Curvas de 90° y diámetro del envase lleno","Not evaluated: required inputs or model support are missing":"No evaluado: faltan datos requeridos o compatibilidad del modelo","Illustrative values only. Replace them with verified equipment data. Copying does not change your equipment. Merge only the fields you need: replacing a whole object can remove existing data. For conveyors, the visible geometry controls take precedence over the same JSON fields.":"Valores únicamente ilustrativos. Sustitúyelos por datos verificados del equipo. Copiar no modifica el equipo. Combina sólo los campos necesarios: reemplazar un objeto completo puede eliminar datos existentes. En transportadores, los controles visibles de geometría tienen prioridad sobre los campos JSON equivalentes.","Select the example and press Ctrl/Cmd+C.":"Selecciona el ejemplo y pulsa Ctrl/Cmd+C.","Unique equipment identifier used by commands and saved results. Keep it stable and unique within the simulation.":"Identificador único del equipo usado en comandos y resultados guardados. Debe ser estable y único dentro de la simulación.","Equipment name displayed in the line, results and comparisons.":"Nombre del equipo mostrado en la línea, resultados y comparaciones.","Equipment category. Conveyor enables the physical belt and sensor settings; other categories represent processing machines.":"Categoría de equipo. Transportador habilita los ajustes físicos de banda y sensores; las demás categorías representan máquinas de proceso.","Nominal speed in BPM (bottles per minute), regardless of the case flow-unit label. The engine stores this value divided by 60. This changes the time basis only; it does not convert cases or pallets into bottles. Conveyor belt velocity is calculated separately from geometry and speed factor.":"Velocidad nominal en BPM (botellas por minuto), independientemente de la unidad de flujo del caso. El motor almacena ese valor dividido entre 60. Sólo cambia la base temporal; no convierte cajas ni tarimas en botellas. La velocidad de la banda se calcula por separado a partir de geometría y factor de velocidad.","Initial operating mode: AUTO follows line controls; MANUAL uses manual operation; PAUSE and STOP start the equipment paused or stopped.":"Modo de operación inicial: AUTO sigue los controles de línea; MANUAL permite operación manual; PAUSE y STOP inician el equipo pausado o detenido.","Optional equipment attributes as a JSON object. Use the example guide for supported fields; an empty object is allowed.":"Atributos opcionales del equipo en un objeto JSON. Consulta la guía de ejemplos para los campos compatibles; se permite un objeto vacío.","Failure model inputs as a JSON object. Reliability requires both positive MTBF and MTTR in minutes. Use measured plant values; an empty object adds no reliability profile.":"Entradas del modelo de fallas como objeto JSON. La confiabilidad requiere MTBF y MTTR positivos en minutos. Usa valores medidos en planta; un objeto vacío no agrega perfil de confiabilidad.","Structured process and engineering inputs. Visible conveyor controls take precedence over their JSON equivalents. Sheets import also fills these fields. See the example guide before editing.":"Datos estructurados de proceso e ingeniería. Los controles visibles de transportadores prevalecen sobre los campos JSON equivalentes. La importación de hojas también completa estos campos. Consulta la guía antes de editar.","Boolean: marks this equipment as critical for the line analysis.":"Booleano: marca el equipo como crítico para el análisis de línea.","Mean operating time between failures, in minutes. A positive plant input used to sample failure intervals with the run seed.":"Tiempo medio de operación entre fallas, en minutos. Valor positivo de planta empleado para muestrear intervalos de falla con la semilla de ejecución.","Mean repair time, in minutes. The current engine uses this as a fixed repair duration. Keep the measured baseline value.":"Tiempo medio de reparación, en minutos. El motor actual lo utiliza como duración de reparación fija. Conserva el valor base medido.","Configured maximum machine speed, in units per minute; used by engineering analysis. It does not replace the nominal rat   var language=window.STPreferences?.read('language')==='es'?'es':'en';

  function applyTree(root){
