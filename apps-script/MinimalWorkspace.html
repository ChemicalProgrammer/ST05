<section id="minimal-workspace" class="minimal-workspace hidden" aria-label="Basic workspace">
  <section id="minimal-equipment" class="fold-card minimal-section" aria-labelledby="minimal-equipment-title">
    <div class="fold-heading">
      <div class="subsection-heading-copy"><h3 id="minimal-equipment-title" class="subsection-heading-title"><button class="fold-toggle" type="button" data-subsection-toggle aria-expanded="true" aria-controls="minimal-equipment-content">Equipment and conveyors</button></h3></div>
      <div class="fold-tools button-row"><button id="minimal-export-equipment-sheet" type="button" class="ghost icon-button" data-icon="upload" title="Export equipment to Google Sheets" aria-label="Export equipment to Google Sheets"></button></div>
    </div>
    <div id="minimal-equipment-content" class="fold-content">
      <div id="minimal-equipment-table-host"></div>
      <p id="minimal-input-review" class="minimal-message" role="status" hidden>Review imported inputs before running.</p>
    </div>
  </section>
  <section id="minimal-simulation" class="fold-card minimal-section" aria-labelledby="minimal-simulation-title">
    <div class="fold-heading">
      <div class="subsection-heading-copy"><h3 id="minimal-simulation-title" class="subsection-heading-title"><button class="fold-toggle" type="button" data-subsection-toggle aria-expanded="true" aria-controls="minimal-simulation-content">Simulation</button></h3></div>
      <div class="fold-tools button-row minimal-simulation-tools">
        <label class="time-value-label"><span>Duration</span><span class="time-value-control"><input id="minimal-duration" type="number" min="0.001" step="any" required value="8" aria-label="Duration"><select id="minimal-duration-unit" aria-label="Duration time unit"><option value="SECONDS">s</option><option value="MINUTES">min</option><option value="HOURS" selected>h</option><option value="DAYS">d</option></select></span></label>
        <button id="minimal-run" type="button">Run simulation</button>
        <button id="minimal-export-minitab" class="secondary" type="button" data-icon="upload" title="Export to Minitab" aria-label="Export to Minitab" hidden disabled>Minitab</button>
      </div>
    </div>
    <div id="minimal-simulation-content" class="fold-content">
      <div id="minimal-run-progress" class="minimal-progress" hidden><progress max="100" value="0" aria-label="Simulation progress"></progress><output>0%</output></div>
      <div id="minimal-result-cards" class="minimal-result-grid" hidden></div>
    </div>
  </section>
  <section id="minimal-optimization" class="fold-card minimal-section" aria-labelledby="minimal-optimization-title" hidden>
    <div class="fold-heading">
      <div class="subsection-heading-copy"><h3 id="minimal-optimization-title" class="subsection-heading-title"><button class="fold-toggle" type="button" data-subsection-toggle aria-expanded="true" aria-controls="minimal-optimization-content">Optimization</button></h3></div>
      <div class="fold-tools button-row"><button id="minimal-ideal-benchmark" type="button" class="secondary" disabled>Ideal Line Benchmark</button><button id="minimal-search" type="button">Find optimizations</button></div>
    </div>
    <div id="minimal-optimization-content" class="fold-content">
      <div id="minimal-search-progress" class="minimal-progress" hidden><progress max="100" value="0" aria-label="Optimization progress"></progress><output>0%</output></div>
      <p id="minimal-search-message" class="minimal-message" role="status" hidden></p>
      <div id="minimal-scenario-cards" hidden></div>
    </div>
  </section>
</section>
<dialog id="minimal-import-dialog" aria-labelledby="minimal-import-title">
  <header class="dialog-heading"><h2 id="minimal-import-title">Import case</h2><button id="minimal-import-close" type="button" class="ghost icon-button" data-icon="x" aria-label="Close"></button></header>
  <form id="minimal-import-form">
    <div class="dialog-body">
      <input id="minimal-import-link" type="text" required autocomplete="off" aria-label="Google Sheets link" placeholder="Google Sheets link">
      <p id="minimal-import-status" role="status" aria-live="polite" hidden></p>
    </div>
    <footer class="dialog-actions"><button id="minimal-import-submit" type="submit">Import</button></footer>
  </form>
</dialog>
