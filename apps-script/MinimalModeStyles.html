<style>
/* Presentation-only adapter; existing editor, playback and scenario engines stay mounted. */
html[data-workspace-mode=MINIMAL] .case-open .workspace-content > section:not(#minimal-workspace):not(#status) {display:none!important;}
html[data-workspace-mode=MINIMAL] .case-open #basic-navigation,
html[data-workspace-mode=MINIMAL] .case-open #toggle-gemini,
html[data-workspace-mode=MINIMAL] .case-open #request-progress,
html[data-workspace-mode=MINIMAL] .case-open #equipment-inspector {display:none!important;}
/* Keep the common second header row; only the navigation tabs are hidden. */
html[data-workspace-mode=MINIMAL] .case-open #basic-section-row:not(.hidden) {display:flex;flex-basis:100%;justify-content:flex-end;flex-wrap:wrap;}
html[data-workspace-mode=MINIMAL] .case-open #header-case-actions {flex:0 1 auto;width:auto;min-width:0;max-width:100%;margin-left:auto;justify-content:flex-end;}
html[data-workspace-mode=MINIMAL] .case-open #simulation-toolbar {flex-wrap:wrap;justify-content:flex-end;}
@media(max-width:600px){html[data-workspace-mode=MINIMAL] .case-open #header-case-actions {width:100%;flex:1 1 100%;}html[data-workspace-mode=MINIMAL] .case-open #simulation-toolbar {flex:1;}}
html[data-workspace-mode=MINIMAL] .case-open .breadcrumb {flex:1 1 var(--size-220);}
html[data-workspace-mode=MINIMAL] .case-open #basic-case-actions {margin-left:auto;}
/* Basic uses the same Subsection contract and exterior gutter as every
   workspace. Its grid owns the inter-section gap; don't add sibling margins
   from the shared block-flow layout a second time. */
html[data-workspace-mode=MINIMAL] .case-open .workspace-content {padding:var(--workspace-gutter);}
.minimal-workspace {display:grid;gap:var(--subsection-gap);min-width:0;margin:0;padding:0;}
#minimal-workspace > .fold-card {margin:0;min-width:0;}
.minimal-section > .fold-content {display:grid;gap:var(--space-3);min-width:0;}
/* Before a run/search the body can be empty. It must not reserve an extra
   header-to-content margin. A collapsed body uses the shared hidden rule. */
.minimal-section > .fold-content:not(:has(> :not([hidden]):not(.hidden))) {margin-block-start:0;}
.minimal-section .minimal-message {margin:0;}
html[data-workspace-mode=MINIMAL] #minimal-equipment-table-host {min-width:0;max-width:100%;}
.minimal-simulation-tools {align-items:center;justify-content:flex-end;}
.minimal-simulation-tools :is(.time-value-label,.minimal-inline-label) {display:flex;align-items:center;gap:var(--space-2);margin:0;}
.minimal-simulation-tools #minimal-rounds {width:var(--size-64,64px);min-width:0;}
.minimal-simulation-tools #minimal-round-view {width:auto;max-width:100%;min-width:0;}
.minimal-simulation-tools .time-value-control {width:auto;}
.minimal-simulation-tools #minimal-duration {width:var(--size-80,80px);min-width:0;}
#minimal-result-cards {grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--size-160)),1fr));}
.minimal-result-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3);}
.minimal-result-grid[hidden],.minimal-workspace [hidden],#minimal-import-status[hidden] {display:none!important;}
.minimal-result-grid article {min-width:0;display:grid;gap:var(--space-2);align-content:start;}
.minimal-result-grid .metric-value {font-variant-numeric:tabular-nums;}
/* All four baseline KPIs use the existing featured-card component. */
#minimal-result-cards .metric-card--featured > strong {font-size:var(--font-kpi);}
/* One active Zero category: give its compact five-column table the full width. */
#minimal-scenario-cards {min-width:0;}
html[data-workspace-mode=MINIMAL] #minimal-scenario-cards .scenario-tier-grid {grid-template-columns:minmax(0,1fr);}
html[data-workspace-mode=MINIMAL] .scenario-compact-comparison {overflow-x:auto;min-width:0;margin:0;}
html[data-workspace-mode=MINIMAL] .scenario-compact-comparison table {width:100%;min-width:470px;border-collapse:collapse;font-size:var(--font-secondary);}
html[data-workspace-mode=MINIMAL] .scenario-compact-comparison :is(th,td) {padding:var(--space-2);border-bottom:var(--border-width) solid var(--line);text-align:left;vertical-align:middle;}
html[data-workspace-mode=MINIMAL] .scenario-compact-comparison :is(th,td):not(:first-child) {text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
html[data-workspace-mode=MINIMAL] .scenario-compact-comparison td:first-child {white-space:normal;overflow-wrap:anywhere;}
html[data-workspace-mode=MINIMAL] .scenario-compact-comparison tbody tr:last-child td {border-bottom:0;}
html[data-workspace-mode=MINIMAL] #minimal-scenario-cards .analysis-recommendation > :is(.scenario-activity,.scenario-progress-label,.scenario-trace-panel,.scenario-search-progress) {display:none!important;}
.minimal-message {font-size:var(--font-secondary);color:var(--muted);}
.minimal-progress {position:relative;display:flex;align-items:center;gap:var(--space-3);}
.minimal-progress progress {flex:1;min-width:0;width:100%;height:var(--progress-capsule-height,1rem);accent-color:var(--accent);}
.minimal-progress output {font-size:var(--font-secondary);font-variant-numeric:tabular-nums;min-width:4em;text-align:right;}
#minimal-search-progress output {max-width:60%;overflow-wrap:anywhere;}
@media(max-width:640px){#minimal-search-progress {flex-wrap:wrap;}#minimal-search-progress progress {flex-basis:100%;}#minimal-search-progress output {max-width:100%;margin-inline-start:auto;}}
#minimal-import-dialog {width:min(100% - var(--space-6),var(--size-480,480px));}
#minimal-import-status {color:var(--danger);font-size:var(--font-secondary);}
@media(max-width:760px){.minimal-result-grid {grid-template-columns:1fr;}}
</style>
