  "Equipment failure downtime (min)": "Downtime por fallas (min)",
  "Effective runtime goal not reached before the calendar limit.": "No se alcanzó el objetivo de tiempo efectivo antes del límite calendario.",
  "Gross line speed loss sums deficits over each interval with positive output: max(0, interval duration − output / active format reference rate). Above-reference production is recorded separately as recovery. Net balance = gross loss − recovery = operating time − equivalent productive time. It can be negative when buffers discharge. Full stops are counted separately. For example, producing 300 bottles in a 2 min ramp at a 300 bpm reference represents a loss of 1 min. Line loss is measured at the final output, not as the sum of equipment losses. Actual plant rate loss is comparison-only and adds no engine penalty. Match period, reference and gross/net definition before comparison. The model includes scrap from major/general stops or STOP when configured; other reject mechanisms are not modeled. Gradual deceleration is not modeled. The average view uses measurements from all rounds.": "La pérdida bruta de velocidad de la línea suma los déficits de cada intervalo con salida positiva: máximo(0, duración del intervalo − producción / velocidad de referencia del formato activo). La recuperación suma por separado la producción por encima de esa referencia. Balance neto = pérdida bruta − recuperación = tiempo de operación − tiempo productivo equivalente. Puede ser negativo por descarga de acumuladores. Las paradas completas se contabilizan aparte. Ejemplo: producir 300 botellas en una rampa de 2 min con referencia de 300 bpm equivale a perder 1 min. La pérdida de línea se mide en la salida final; no es la suma de los equipos. El dato real de planta solo sirve como comparación y no agrega una penalización al motor. Antes de compararlo deben coincidir periodo, referencia y definición bruta o neta. El modelo incluye desperdicio por paro mayor/general o STOP cuando está configurado; no modela otras causas de rechazo. No se modela desaceleración gradual. La vista promedio utiliza las mediciones de todas las rondas.",
  "Values refer to final line output. Equivalent quantities use each active format reference. Efficiency impact = 100 × equivalent quantity / ideal output over the entire simulated duration. Loss is negative and recovery positive; net balance keeps its resulting sign. Expressed in percentage points (pp), not relative percentage change or automatically AU. Recovery may reflect buffer discharge and does not guarantee recoverable additional production. Full stops are excluded. The average view calculates each round before averaging. Older results are converted only if a constant reference can be identified; otherwise rerun the simulation. These values are not the sum of equipment losses.": "Los valores corresponden a la salida final de la línea. Las cantidades equivalentes se calculan con la referencia de cada formato activo. Efecto en eficiencia = 100 × cantidad equivalente / producción ideal de toda la duración simulada. La pérdida tiene signo negativo y la recuperación positivo; el balance conserva el signo resultante. Se expresa en puntos porcentuales (pp), no en porcentaje de cambio ni automáticamente en AU. La recuperación puede reflejar descarga de acumuladores y no garantiza producción adicional recuperable. Se excluyen las paradas completas. En la vista promedio se calcula cada ronda antes de promediar. Los resultados antiguos solo se convierten si se identifica una referencia constante; de lo contrario hay que repetir la simulación. Estos valores no son una sumatoria de pérdidas por equipo.",
  "Net equipment balance = positive-flow time − equivalent productive time at that equipment's configured nominal rate for each format. Full stops are excluded. Negative values indicate production above its reference. The equipment total is the algebraic sum of all listed equipment, including conveyors: negative values offset positive ones. Times may overlap and the same product may pass through several machines. The sum can therefore exceed simulated duration and is not unique line loss, line downtime or AEM loss. Equipment and line references may differ. The average view uses all rounds; — indicates unavailable data.": "Balance neto por equipo = tiempo con flujo positivo − tiempo productivo equivalente a la velocidad nominal configurada de ese equipo y formato. Se excluyen las paradas completas. Un valor negativo indica producción por encima de su referencia. La fila «Suma de equipos (tiempos simultáneos)» suma algebraicamente todos los equipos mostrados, incluidos los transportadores: los valores negativos compensan los positivos. Los tiempos pueden coincidir y el mismo producto puede pasar por varios equipos. Por eso esta suma puede superar la duración simulada y no equivale a la pérdida única de la línea, a su downtime ni a las pérdidas AEM. La referencia de cada equipo puede ser distinta de la referencia de línea. La vista promedio usa todas las rondas; — significa dato no disponible.",
  "MTTR ends when repair finishes. By default, equipment recovers without additional waiting or ramp, subject to material availability and stop controls. Repair ramps require explicit equipment-level activation; initial, command and sensor ramps are independent. Restart counts represent recovery requests and ramp counts executed sequences, even when interrupted. Bottle equivalents are processed product, not lost product. Stop transition includes accumulation response and residual discharge; gradual deceleration is not modeled. The same product may be counted at multiple machines; do not sum as unique line production. — means unavailable data. The MTBF clock advances only during positive processed-flow intervals; a partly productive interval counts in full and no-flow waits do not count. In average view, all counters are round averages.": "El MTTR termina al finalizar la reparación. Por defecto el equipo se recupera sin espera ni rampa adicional, sujeto a disponibilidad de material y controles de parada. La rampa tras reparación requiere habilitación expresa por equipo; las rampas iniciales, por comando y por sensor son independientes. Los reinicios cuentan solicitudes de recuperación y las rampas cuentan secuencias ejecutadas, incluso interrumpidas. Las botellas equivalentes son producto procesado, no perdido. La transición de parada incluye respuesta a acumulación y descarga residual; no se modela desaceleración gradual. El mismo producto puede contarse en varios equipos: no sumar como producción única de línea. — significa dato no disponible. El reloj MTBF avanza solo en intervalos con flujo procesado positivo; un intervalo parcialmente productivo cuenta completo y las esperas sin flujo no cuentan. En vista promedio todos los contadores son promedios de las rondas.",
  "Calculation complete. Results are ready; playback is optional.": "Cálculo completo. Los resultados están disponibles; la reproducción es opcional.",

  "No se alcanzó el objetivo de tiempo efectivo antes del límite calendario.": "Effective runtime goal not reached before the calendar limit.",
  "La pérdida bruta de velocidad de la línea suma los déficits de cada intervalo con salida positiva: máximo(0, duración del intervalo − producción / velocidad de referencia del formato activo). La recuperación suma por separado la producción por encima de esa referencia. Balance neto = pérdida bruta − recuperación = tiempo de operación − tiempo productivo equivalente. Puede ser negativo por descarga de acumuladores. Las paradas completas se contabilizan aparte. Ejemplo: producir 300 botellas en una rampa de 2 min con referencia de 300 bpm equivale a perder 1 min. La pérdida de línea se mide en la salida final; no es la suma de los equipos. El dato real de planta solo sirve como comparación y no agrega una penalización al motor. Antes de compararlo deben coincidir periodo, referencia y definición bruta o neta. El modelo incluye desperdicio por paro mayor/general o STOP cuando está configurado; no modela otras causas de rechazo. No se modela desaceleración gradual. La vista promedio utiliza las mediciones de todas las rondas.": "Gross line speed loss sums deficits over each interval with positive output: max(0, interval duration − output / active format reference rate). Above-reference production is recorded separately as recovery. Net balance = gross loss − recovery = operating time − equivalent productive time. It can be negative when buffers discharge. Full stops are counted separately. For example, producing 300 bottles in a 2 min ramp at a 300 bpm reference represents a loss of 1 min. Line loss is measured at the final output, not as the sum of equipment losses. Actual plant rate loss is comparison-only and adds no engine penalty. Match period, reference and gross/net definition before comparison. The model includes scrap from major/general stops or STOP when configured; other reject mechanisms are not modeled. Gradual deceleration is not modeled. The average view uses measurements from all rounds.",
  "Los valores corresponden a la salida final de la línea. Las cantidades equivalentes se calculan con la referencia de cada formato activo. Efecto en eficiencia = 100 × cantidad equivalente / producción ideal de toda la duración simulada. La pérdida tiene signo negativo y la recuperación positivo; el balance conserva el signo resultante. Se expresa en puntos porcentuales (pp), no en porcentaje de cambio ni automáticamente en AU. La recuperación puede reflejar descarga de acumuladores y no garantiza producción adicional recuperable. Se excluyen las paradas completas. En la vista promedio se calcula cada ronda antes de promediar. Los resultados antiguos solo se convierten si se identifica una referencia constante; de lo contrario hay que repetir la simulación. Estos valores no son una sumatoria de pérdidas por equipo.": "Values refer to final line output. Equivalent quantities use each active format reference. Efficiency impact = 100 × equivalent quantity / ideal output over the entire simulated duration. Loss is negative and recovery positive; net balance keeps its resulting sign. Expressed in percentage points (pp), not relative percentage change or automatically AU. Recovery may reflect buffer discharge and does not guarantee recoverable additional production. Full stops are excluded. The average view calculates each round before averaging. Older results are converted only if a constant reference can be identified; otherwise rerun the simulation. These values are not the sum of equipment losses.",
  "Balance neto por equipo = tiempo con flujo positivo − tiempo productivo equivalente a la velocidad nominal configurada de ese equipo y formato. Se excluyen las paradas completas. Un valor negativo indica producción por encima de su referencia. La fila «Suma de equipos (tiempos simultáneos)» suma algebraicamente todos los equipos mostrados, incluidos los transportadores: los valores negativos compensan los positivos. Los tiempos pueden coincidir y el mismo producto puede pasar por varios equipos. Por eso esta suma puede superar la duración simulada y no equivale a la pérdida única de la línea, a su downtime ni a las pérdidas AEM. La referencia de cada equipo puede ser distinta de la referencia de línea. La vista promedio usa todas las rondas; — significa dato no disponible.": "Net equipment balance = positive-flow time − equivalent productive time at that equipment's configured nominal rate for each format. Full stops are excluded. Negative values indicate production above its reference. The equipment total is the algebraic sum of all listed equipment, including conveyors: negative values offset positive ones. Times may overlap and the same product may pass through several machines. The sum can therefore exceed simulated duration and is not unique line loss, line downtime or AEM loss. Equipment and line references may differ. The average view uses all rounds; — indicates unavailable data.",
  "El MTTR termina al finalizar la reparación. Por defecto el equipo se recupera sin espera ni rampa adicional, sujeto a disponibilidad de material y controles de parada. La rampa tras reparación requiere habilitación expresa por equipo; las rampas iniciales, por comando y por sensor son independientes. Los reinicios cuentan solicitudes de recuperación y las rampas cuentan secuencias ejecutadas, incluso interrumpidas. Las botellas equivalentes son producto procesado, no perdido. La transición de parada incluye respuesta a acumulación y descarga residual; no se modela desaceleración gradual. El mismo producto puede contarse en varios equipos: no sumar como producción única de línea. — significa dato no disponible. El reloj MTBF avanza solo en intervalos con flujo procesado positivo; un intervalo parcialmente productivo cuenta completo y las esperas sin flujo no cuentan. En vista promedio todos los contadores son promedios de las rondas.": "MTTR ends when repair finishes. By default, equipment recovers without additional waiting or ramp, subject to material availability and stop controls. Repair ramps require explicit equipment-level activation; initial, command and sensor ramps are independent. Restart counts represent recovery requests and ramp counts executed sequences, even when interrupted. Bottle equivalents are processed product, not lost product. Stop transition includes accumulation response and residual discharge; gradual deceleration is not modeled. The same product may be counted at multiple machines; do not sum as unique line production. — means unavailable data. The MTBF clock advances only during positive processed-flow intervals; a partly productive interval counts in full and no-flow waits do not count. In average view, all counters are round averages.",
  "Cálculo completo. Los resultados están disponibles; la reproducción es opcional.": "Calculation complete. Results are ready; playback is optional.",

  "Producción = unidades acumuladas a la salida del último equipo.": "Production = cumulative units leaving the final equipment.",

  "Producción promedio = salida acumulada / minutos virtuales transcurridos.": "Average throughput = cumulative output / elapsed virtual minutes.",
  "Inventario = suma de paquetes acumulados por unidad física; botellas y cajas por separado.": "Inventory = sum of accumulated packages by native flow unit; bottles and cases are counted separately.",
  "Desbordamiento = suma de paquetes perdidos por desbordamiento, por unidad física.": "Overflow loss = sum of packages lost from conveyor overflow by native flow unit.",

  "Básico": "Basic",
  "DES · SimPy (experimental). Los transportadores usan una cola FIFO; se omiten colas espaciales, sensores, rampas y descarga residual. El OEE no está validado.": "DES · SimPy (experimental). FIFO item conveyors; spatial queues, sensors, ramps and runout are omitted. OEE is not validated.",
  "Se aplica a esta simulación. Las categorías desmarcadas no generan fallas. Se conservan los valores MTBF y MTTR de los equipos.": "Applies to this simulation. Unchecked categories generate no failures. Equipment MTBF and MTTR values are retained.",
  "Muestra u oculta la sección Datos reales de este caso. Se conservan las observaciones guardadas.": "Show or hide the Real data section for this case. Stored observations are retained.",
  "Configura aquí los eventos, la ventana de gráficas y el registro. La duración y velocidad de reproducción se ajustan en Simulación.": "Set events, chart window and recording here. Duration and playback speed are configured in Simulation.",

  "Intervalo de muestreo de gráficas": "Chart sample interval",
  "Unidad del intervalo de muestreo de gráficas": "Chart sample interval time unit",
  "El muestreo de gráficas utiliza tiempo virtual. Los valores en vivo se actualizan con el estado calculado actual; los FPS fijan la frecuencia máxima de actualización de la pantalla. El historial guardado puede resumirse.": "Chart sampling uses simulated time. Live values update from the current calculated state; FPS sets the maximum screen refresh rate. Saved history may be summarized.",
  "UNA VISIÓN MÁS CLARA DE TU LÍNEA": "A CLEARER VIEW OF YOUR LINE",
  "Descubre el potencial de tu línea.": "Unlock your line’s potential.",
  "Simula líneas de envasado, compara su desempeño y explora escenarios de mejora.": "Simulate packaging lines, compare performance and explore improvement scenarios.",
  "Mantener la sesión iniciada en este navegador": "Keep me signed in on this browser",
  "Utiliza la cuenta autorizada para esta aplicación.": "Uses the account authorized for this app.",
  "Navegación de casos": "Case navigation",
  "Simulaciones y comparación": "Simulations and comparison",
  "Simulación seleccionada": "Selected simulation",
  "SIMULACIÓN SELECCIONADA": "SELECTED SIMULATION",
  "El orden define el flujo de material. Alterna máquina → transportador → máquina; cada transportador necesita geometría física.": "Order defines material flow. Use alternating machine → conveyor → machine steps; every conveyor requires physical geometry.",
  "Configura una línea física válida antes de ejecutar: máquina → transportador → máquina, con geometría en cada transportador. Los cambios se guardan automáticamente.": "Configure a valid physical line before running: machine → conveyor → machine, with geometry on every conveyor. Changes save automatically.",
  "A 1×, un segundo simulado corresponde a un segundo real cuando el cálculo mantiene el ritmo. El motor define el paso físico de integración; el muestreo de gráficas controla sus puntos de forma independiente de los valores en vivo. Cada transportador utiliza geometría física de SimuLine: L_act, L_p, paso del paquete, factor de velocidad, descarga residual, retardos de sensores y factor de seguridad para calcular capacidad, recorrido, pulsos de sensores, controles Prime / Back-up, recuperación y verificaciones de diseño. No se usan buffers abstractos.": "At 1×, one simulated second corresponds to one real second when calculation keeps pace. The engine defines the physical integration step; chart sampling controls chart points independently of live values. Every conveyor uses SimuLine physical geometry by default: L_act, L_p, package pitch, speed factor, runout, sensor delays, and insurance derive capacity, travel, normal photoeye pulses, Prime / Back-up control, recovery, and design audits. Abstract buffers are not used.",
  "Programa pausas, paradas planificadas o de emergencia, restablecimientos, arranques y cambios entre modo manual y automático en tiempo virtual.": "Schedule a pause, planned stop, emergency stop, reset, run, manual, or automatic mode change in virtual time.",
  "El OEE de línea es la producción final dividida entre la producción máxima de la máquina crítica seleccionada durante la misma duración virtual. Se supone calidad del 100 % hasta que se modelen los rechazos.": "Line OEE is final output divided by the maximum output of the selected critical machine across the same virtual duration. Quality is assumed 100% until rejects are modeled.",
  "Los controles de escenario se aplican en el segundo virtual mostrado y recalculan la ejecución de forma determinista. Son únicamente controles de simulación; nunca gobiernan equipos reales.": "Scenario controls apply at the displayed virtual second and deterministically recalculate the run. They are simulation controls only; they never command real equipment.",
  "Evalúa la simulación seleccionada y crea escenarios compatibles según su categoría de inversión.": "Evaluate the selected simulation and create supported scenarios by investment category.",
  "Revisa las opciones de CAPEX cero, medio y alto. Las etiquetas de evidencia distinguen los datos de diseño estáticos de los resultados dinámicos. Cada acción crea una simulación independiente.": "Review zero, medium and high CAPEX options. Evidence labels distinguish static design inputs from dynamic run results. Each action creates a separate simulation.",
  "El motor del navegador ejecuta el caso determinista. Apps Script gestiona la identidad y el almacenamiento en Drive; Gemini no realiza cálculos. Las posiciones de sensores del demo son supuestos sintéticos explícitos, no constituyen un diseño PLC ni de seguridad.": "The browser engine executes the deterministic Case. Apps Script is responsible for identity and Drive persistence; Gemini is not used for calculation. Sensor positions in the demo are transparent synthetic assumptions, not a PLC or safety-control design.",
  "El envío comparte un análisis compacto con Gemini. Las conversaciones se reinician al cambiar de simulación o caso.": "Sending shares a compact analysis with Gemini. Conversations reset when changing simulation or case.",
  "Tu clave API se guarda en las propiedades de usuario de Apps Script y sólo la utiliza el servidor.": "Your API key is stored in your Apps Script user properties and used only by the server.",
  "Lee los metadatos de B1:B7 o C1:C7 en formatos antiguos y los equipos a partir de A10. NA y N/A significan no aplicable. Compara los valores actuales con los de la hoja, selecciona equipos y campos y aplica los cambios. La simulación activa se guarda automáticamente.": "Read metadata in B1:B7 or legacy C1:C7 and equipment rows starting at A10. NA and N/A mean not applicable. Compare current and Sheet values, choose equipment and fields, then apply the selected changes. The active simulation saves automatically.",
  "Elimina la conexión a Drive, la clave de Gemini y las preferencias de esta cuenta y del navegador. Los casos, resultados e índice almacenados en Drive se conservan. Guarda el ID de carpeta para reconectarte.": "Clears this account's Drive connection, Gemini key and settings, and this browser's app preferences. Drive cases, results and index are retained. Keep your folder ID so you can reconnect.",
  "Cierra el caso actual antes de restablecer. Se conservan los casos, resultados e índice de Drive. Guarda el ID de carpeta para reconectarte.": "Close the current case before resetting. Drive cases, results and index are retained. Keep your folder ID so you can reconnect.",
  "¿Restablecer la aplicación? Se eliminarán el ID de carpeta de Drive, la clave API de Gemini, las instrucciones de tu cuenta y las preferencias del navegador. Se descartarán los cambios pendientes de Configuración. Los casos, resultados e índice permanecerán en Drive. Conserva el ID de carpeta para reconectarte. No afecta a otras cuentas.": "Reset the app? Your Drive folder ID, Gemini API key, account prompts and browser preferences will be cleared. Pending Settings edits will be discarded. Drive cases, results and index will remain. Keep your folder ID to reconnect. Other accounts are unaffected.",
  "Función experimental local del navegador: hasta cuatro factores, dos niveles y al menos tres rondas por combinación. Configura los factores en Qué pasaría si. Se aplica al cerrar Configuración.": "Browser-local pilot: up to four factors, two levels, and at least three rounds per combination. Configure factors in What-If. Applied when Settings closes.",
  "Se aplica inmediatamente a este navegador y a Configuración. Los demás usuarios conservan su propio modo.": "Applies immediately to this browser and Settings. Other users keep their own mode.",
  "El navegador no pudo guardar el modo de interfaz. Inténtalo de nuevo con el almacenamiento del navegador habilitado.": "This browser could not save the interface mode. Try again with browser storage enabled.",
  "El chat de Gemini dejará de funcionar hasta que agregues una nueva clave API. Tus casos y resultados seguirán disponibles.": "Gemini chat will stop working until you add a new API key. Your cases and simulation results will remain available.",
  "Selecciona la máquina que establece la velocidad de referencia de la línea. Sólo puede haber una seleccionada; su tipo físico no cambia.": "Select the machine that sets the line reference rate. Only one machine can be selected; its physical equipment type stays unchanged.",
  "Capacidad instalada de la máquina. Es distinta de la velocidad objetivo normal y de la sobrevelocidad de recuperación estimada. El motor sigue operando a la velocidad nominal configurada.": "Installed machine capacity. This is distinct from the normal line target and the estimated recovery overspeed. The current engine still processes at the configured nominal rate.",
  "Estimación exclusiva de diseño. Deja vacío para usar MTBF como ventana de recuperación. Un tiempo menor requiere más sobrevelocidad; el motor no aplica ese objetivo automáticamente.": "Design estimate only. Leave blank to use MTBF as the recovery window. A shorter time requires more overspeed; the engine does not apply this target automatically.",
  "La velocidad máxima y el tiempo de recuperación deben ser positivos cuando se especifican.": "Maximum speed and recovery time must be positive numbers when provided.",
  "Ingresa una velocidad de banda y longitud de paquete positivas, y una longitud de transportador suficiente para un pitch de transporte calculado.": "Enter a positive belt speed and package length, and a conveyor long enough for one calculated moving pitch.",
  "La velocidad automática usa la velocidad de descarga aguas arriba y el factor de velocidad. La velocidad manual utiliza el valor físico en mm/s indicado abajo.": "Automatic speed uses upstream discharge velocity and the speed factor. Manual speed uses the physical mm/s value below.",
  "Velocidad física de la banda. Determina el tiempo de transporte y la capacidad de transferencia; el campo BPM nominal del transportador no es un límite independiente.": "Physical belt velocity. It controls travel time and transfer capacity; the nominal conveyor BPM field is not an independent limit.",
  "Separación libre calculada entre envases en movimiento: máximo entre la longitud del envase y la velocidad de banda dividida por el flujo nominal de envases del equipo anterior, menos la longitud del envase.": "Calculated clear distance between moving packages: max(package length, belt speed / upstream nominal package rate) minus package length.",
  "Los envases acumulados están en contacto (separación fija de cero). El pitch acumulado es igual a la longitud del envase.": "Accumulated packages are in contact (fixed zero gap). Packed pitch equals package length.",
  "La verificación de diseño de la hoja utiliza supuestos automáticos. La velocidad, separación y capacidad operativas se muestran por separado.": "Worksheet audit uses automatic design assumptions. Runtime speed, spacing and capacity are shown separately.",
  "La capacidad productiva es producción / (velocidad nominal × duración total). Puede compararse con la utilización del proceso en un modelo determinista de ciclos; stateSeconds conserva por separado los tiempos de cada estado.": "Productive capacity is output / (nominal rate × full duration). It can be compared with processing utilization in a deterministic cycle model; stateSeconds contains the separate elapsed fluid-model states.",
  "Las columnas Sin alimentación y Bloqueado representan interrupciones del flujo. Las pérdidas parciales equivalen a capacidad perdida en intervalos con flujo positivo; no son tiempo detenido adicional.": "Starved and blocked columns count stopped flow. Partial losses are equivalent lost capacity during ticks with positive flow; they are not additional stopped time.",
  "Se supone una calidad del 100 % (sin modelo de rechazos). Los totales de pérdidas y paradas se expresan en minutos-equipo; las pérdidas simultáneas no son necesariamente paradas de línea.": "Quality assumes 100% (no reject model). Loss and downtime totals are equipment-minutes; simultaneous losses are not line downtime.",
  "Producción efectiva de línea = producción del último equipo ÷ duración completa:": "Line throughput = final equipment output ÷ complete run:",
  "La producción efectiva de cada máquina es disponibilidad × eficiencia en operación × velocidad de proceso configurada. La falta de alimentación y el bloqueo reducen la eficiencia en operación. Las velocidades usan la unidad de flujo equivalente del caso; el patrón de empaque no implica conversión automática.": "Each machine's effective throughput = availability × run efficiency × configured processing speed. Starving and blocking reduce run efficiency. Rates use the case's equivalent flow unit; pack pattern is not an automatic conversion.",
  "Las ejecuciones comparadas usan unidades de flujo diferentes. Convierte a una unidad común antes de interpretar las diferencias de producción y velocidad.": "The compared runs use different flow units. Convert them to a common unit before interpreting throughput and production differences.",
  "Estas propuestas usan la ronda 1 como evidencia dinámica. Los promedios de réplicas están disponibles en Resultados; las ganancias propuestas aún no están verificadas.": "These proposals use round 1 as dynamic evidence. Replication averages are available in Results; proposed gains remain unverified.",
  "Los eventos cambiaron. Las demás rondas se recalcularán al finalizar la reproducción de la ronda 1.": "Events changed. The other rounds will be recalculated when round 1 playback finishes.",
  "Los eventos agregados durante la ronda 1 modificaron el resultado. Se están recalculando las otras rondas con el programa final de eventos.": "Events added during round 1 changed the result. Recalculating the other rounds with the final event schedule.",
  "Se cancelaron las rondas en segundo plano. Sólo está disponible el resultado actual de la ronda 1.": "Background rounds cancelled. Only the current round 1 result is available.",
  "La ronda 1 se reproduce mientras se calcula. Las demás rondas se calculan en segundo plano.": "Round 1 is playing as it calculates. Other rounds are calculating in the background.",
  "La ronda 1 conserva la reproducción y los controles en vivo. Las demás calculan indicadores en segundo plano con los mismos eventos programados y semillas independientes.": "Round 1 keeps playback and live controls. Other rounds calculate metrics in the background using the same scheduled events and independent seeds.",
  "Los controles en vivo están disponibles en la ronda 1. Los eventos programados se aplican a todas las rondas.": "Live controls are available in round 1. Scheduled events apply to every round.",
  "Resultados muestra el promedio seleccionado o una ronda individual. Las gráficas de reproducción muestran una ronda real; la representativa es la más cercana a la producción media.": "Results show the selected average or individual round. Playback charts show an actual round; the representative round is closest to mean production.",
  "Velocidad normal objetivo = mínimo(velocidad configurada, velocidad de la máquina crítica). Sobrevelocidad estimada = objetivo normal + unidades recuperables / tiempo objetivo de recuperación. Unidades recuperables = mínimo(objetivo normal × MTTR, acumulación útil instalada hacia la máquina crítica). La ventana de recuperación predeterminada es MTBF: es un supuesto de diseño, no un tiempo medido. Sin geometría o confiabilidad habilitada la estimación no está disponible. La máquina crítica permanece a velocidad normal. La curva no se fuerza a una V ni se aplica por el motor. El inventario deseado real y la protección ante paradas repetidas aún requieren validación dinámica. † El objetivo excede el máximo instalado.": "Normal line target = min(configured processing rate, critical machine rate). Estimated overspeed = normal target + recoverable units / target recovery time. Recoverable units = min(normal target × MTTR, useful installed accumulation toward the critical machine). The default recovery window is MTBF; it is a planning assumption, not a measured recovery time. Missing geometry or enabled reliability leaves the estimate unavailable. The critical machine stays at normal speed. The curve is not forced into a V and is not applied by the engine. Actual desired inventory and protection during repeated stops still require dynamic validation. † target exceeds installed maximum.",
  "Velocidad normal objetivo y sobrevelocidad de recuperación estimada por máquina en unidades por minuto": "Normal line target and estimated recovery overspeed by machine in units per minute",
  "Sólo velocidades de diseño. El motor actual no acelera las máquinas por encima de la velocidad nominal tras una parada; este perfil no certifica recuperación ni protección de la máquina crítica.": "Design speeds only. The current engine does not accelerate machines above their nominal speed after a stop; this profile does not certify recovery or critical machine protection.",
  "No hay sobrevelocidad de recuperación configurada: las velocidades máxima y normal son iguales o faltan velocidades máximas. La velocidad máxima importada inicializa actualmente la normal. No se evalúa la recuperación ni el cumplimiento del V-Graph.": "No recovery overspeed is configured: maximum and normal speeds are equal or maximum speeds are missing. Imported maximum speed currently initializes normal speed. Recovery and V-Graph compliance are not evaluated.",
  "La estimación de capacidad para las máquinas no críticas es el máximo entre la velocidad normal y la velocidad normal de la máquina crítica dividida entre la disponibilidad intrínseca. No calcula sobrevelocidad de recuperación: ésta requiere inventario acumulado deseado y real, acumulación disponible e intervalo de recuperación. El motor no ordena sobrevelocidad. † La estimación excede el máximo configurado; sin un máximo, la viabilidad no está verificada.": "The table's capacity estimate for machines other than the critical machine is max(normal speed, critical machine normal speed ÷ intrinsic availability). It does not calculate recovery overspeed: that requires desired and actual buffer inventory, available accumulation, and a recovery interval. The engine does not command overspeed. † estimate exceeds configured maximum; a missing maximum leaves feasibility unverified.",
  "Las estadísticas de réplicas se comparan por separado. La comparación estándar de resultados usa la ronda 1. Compara las medias únicamente con igual duración, cantidad de rondas y listas de semillas.": "Replication statistics are compared separately. The standard result comparison below uses round 1. Compare batch means only with matching duration, round count and seed lists.",

  "La simulación activa cambió. Vuelve a abrir el editor.": "The active simulation changed. Reopen the editor.",
  "El paso calculado es menor que la longitud del paquete, lo que produce una separación negativa en este modelo. Verifica que la longitud del paquete se mida en la dirección del movimiento y el paso de descarga entre centros. Si las mediciones son incorrectas, corrige la hoja y vuelve a generar la vista previa.": "The calculated pitch is smaller than the package length, creating a negative gap in this model. Check that package length is measured along the direction of travel and discharge pitch is measured center to center. If those measurements are wrong, correct the Sheet and preview again.",
  "Con K y L fijos, un factor de velocidad del transportador de {proposed}% es el mínimo matemático redondeado para evitar una separación negativa. Es una propuesta de simulación, no un ajuste verificado de planta ni una velocidad optimizada. Acéptalo sólo si el cambio de velocidad es viable para el equipo. Las demás verificaciones físicas siguen aplicando.": "With K and L fixed, a conveyor speed factor of {proposed}% is the rounded mathematical minimum to avoid a negative gap. This is a simulation proposal, not a verified plant setting or an optimized speed. Accept only if that speed change is feasible for the equipment. Other physical checks still apply.",
  "Aceptado para vista previa: {cell} cambia de {before}% en la hoja a {after}%. Se importará sólo si seleccionas este campo al aplicar cambios. La hoja no cambia.": "Accepted for preview: {cell} changes from {before}% in the Sheet to {after}%. It will be imported only if this field is selected when you apply changes. The spreadsheet is unchanged.",

  "Se omitió porque las celdas de origen contienen errores. Revisa los campos siguientes y elige un destino de importación.": "Skipped because source cells contain errors. Review the fields below and choose an import target.",
  "· Se borrarán los resultados existentes; ejecuta nuevamente.": "· Existing results will be cleared; run again.",
  "Revisa longitud del paquete {K}, paso de descarga aguas arriba {L} y factor de velocidad del transportador {Q} en la hoja o Configuración de línea. Estos valores producen una separación calculada negativa; verifica la orientación y separación físicas.": "Check package length {K}, upstream discharge pitch {L} and conveyor speed factor {Q} in the Sheet or Line setup. These values produce a negative calculated gap; review the actual package orientation and spacing.",
  "Selecciona qué aplicar a esta simulación. Los equipos existentes conservan su ID y posición; los nuevos se agregan en el orden de la hoja. Las filas ausentes nunca eliminan equipos. Los campos NA no se seleccionan de forma predeterminada para equipos existentes.": "Choose what to apply to this simulation. Existing equipment keeps its ID and position; new equipment is appended in Sheet order. Missing Sheet rows never delete equipment. NA fields are not selected by default for existing equipment.",

  ": MTBF y MTTR deben ser ambos positivos o ambos NA. Ajusta la selección de campos.": ": MTBF and MTTR must both be positive or both NA. Adjust the field selection.",
  "Con la evidencia disponible no se encontraron cambios compatibles. Revisa las verificaciones de ingeniería o ejecuta la simulación para agregar evidencia dinámica.": "No supported changes were found with the available evidence. Review the engineering checks or run the simulation to add dynamic evidence.",
  "Revisa este campo en la configuración del equipo antes de crear el escenario.": "Review this field in the equipment configuration before creating the scenario.",
  "En Configuración de línea, selecciona este transportador y cambia el factor de velocidad (%). Esto modifica la velocidad de banda respecto a la descarga aguas arriba y, por tanto, el espacio entre paquetes. Verifica que el variador pueda alcanzar el valor propuesto.": "In Line Setup, select this conveyor and change Conveyor speed factor (%). This changes belt velocity relative to upstream discharge and therefore package spacing. Verify the drive can achieve the proposed setting.",
  "En Configuración de línea, cambia el retardo de bloqueo Back-up. Controla cuánto debe permanecer bloqueado el sensor antes de solicitar una parada aguas arriba; se compara con la duración normal de los pulsos de paquetes.": "In Line Setup, change Back-up blocked delay. This controls how long the sensor must remain blocked before requesting an upstream stop; the setting is checked against normal package pulse duration.",
  "En Configuración de línea, cambia el retardo de liberación Back-up. Controla cuánto debe permanecer libre el sensor antes de reanudar el equipo aguas arriba; revísalo frente a los espacios normales entre paquetes.": "In Line Setup, change Back-up clear delay. This controls how long the sensor must remain clear before releasing the upstream stop; review it against normal inter-package gaps.",
  "En Configuración de línea, cambia la posición instalada de Back-up. La distancia se mide desde la descarga aguas arriba. Representa reubicar el sensor para reservar la longitud de desbordamiento necesaria.": "In Line Setup, change Installed Back-up position. The distance is measured from the upstream discharge. This represents relocating the sensor to reserve the required overflow length.",
  "En Configuración de línea, cambia la longitud instalada (L_act). Representa un cambio físico del transportador para permitir acumulación y recuperación; verifica espacio disponible y viabilidad.": "In Line Setup, change Installed length (L_act). This represents a physical conveyor length change to support accumulation and recovery; verify layout space and feasibility.",
  "En Configuración de línea, cambia la reserva Prime (L_p). Revisa la posición del sensor y los requisitos de arranque aguas abajo antes de aplicar el valor.": "In Line Setup, change Prime reserve (L_p). Review the corresponding sensor location and downstream startup requirement before applying the value.",
  "En Configuración de línea, cambia el tiempo de aceleración aguas abajo. Confirma que la máquina y sus controles puedan alcanzar velocidad plena en el tiempo propuesto.": "In Line Setup, change Downstream ramp-up time. Confirm the machine and its controls can reach full speed within this proposed time.",
  "La evidencia actual no justifica un cambio automático en esta categoría.": "Current evidence does not support an automatic change in this category.",
  "Completa los datos físicos de la línea antes de aplicar este escenario.": "Complete the physical line inputs before applying this scenario.",
  "Este cambio invalidaría una verificación de diseño. Resuelve primero las restricciones geométricas relacionadas.": "This change would invalidate a design check. Resolve the related geometry constraints first.",
  "¿Crear una simulación independiente con los cambios indicados? Se conservan la línea base y la semilla aleatoria. Ejecuta el escenario nuevo para medir su efecto.": "Create a separate simulation with the listed changes? The baseline and random seed are preserved. Run the new scenario to measure its effect.",
  "Escenario creado y guardado. Revisa las entradas y ejecútalo para evaluar su impacto.": "Scenario created and saved. Review the inputs and run it to evaluate the impact.",
  "La simulación de origen cambió. Genera una propuesta nueva antes de aplicarla.": "The source simulation changed. Generate a new proposal before applying it.",
  "Estas verificaciones aplican los criterios de diseño proporcionados cuando existen datos, pero no certifican el cumplimiento de manuales. Las categorías CAPEX describen la magnitud de la intervención, no una estimación de costos o rentabilidad. La cobertura del buffer utiliza el MTTR de la máquina adyacente aguas arriba para microparadas de hasta 4 minutos. No se suponen pérdidas por curvas no modeladas, diámetro de envases llenos ni comportamiento deseado de PLC.": "These checks implement the supplied design brief where inputs exist; they do not certify handbook compliance. CAPEX levels describe intervention scale, not a cost estimate or financial return. Buffer coverage uses the adjacent upstream machine's MTTR for microstops up to 4 minutes. Unmodeled turn losses, filled-container diameter and PLC desired-state behavior are not assumed.",
  "La dirección esperada es una hipótesis. Las mejoras en OEE, producción efectiva y pérdidas requieren una ejecución y comparación nuevas.": "Expected direction is a hypothesis. Numerical OEE, throughput and loss improvements require a new run and comparison.",
  "Curvas de 90° y diámetro del envase lleno": "90° turns and filled-container diameter",
  "Valores únicamente ilustrativos. Sustitúyelos por datos verificados del equipo. Copiar no modifica el equipo. Combina sólo los campos necesarios: reemplazar un objeto completo puede eliminar datos existentes. En transportadores, los controles visibles de geometría tienen prioridad sobre los campos JSON equivalentes.": "Illustrative values only. Replace them with verified equipment data. Copying does not change your equipment. Merge only the fields you need: replacing a whole object can remove existing data. For conveyors, the visible geometry controls take precedence over the same JSON fields.",
  "Identificador único del equipo usado en comandos y resultados guardados. Debe ser estable y único dentro de la simulación.": "Unique equipment identifier used by commands and saved results. Keep it stable and unique within the simulation.",
  "Nombre del equipo mostrado en la línea, resultados y comparaciones.": "Equipment name displayed in the line, results and comparisons.",
  "Categoría de equipo. Transportador habilita los ajustes físicos de banda y sensores; las demás categorías representan máquinas de proceso.": "Equipment category. Conveyor enables the physical belt and sensor settings; other categories represent processing machines.",
  "Velocidad nominal en BPM (botellas por minuto), independientemente de la unidad de flujo del caso. El motor almacena ese valor dividido entre 60. Sólo cambia la base temporal; no convierte cajas ni tarimas en botellas. La velocidad de la banda se calcula por separado a partir de geometría y factor de velocidad.": "Nominal speed in BPM (bottles per minute), regardless of the case flow-unit label. The engine stores this value divided by 60. This changes the time basis only; it does not convert cases or pallets into bottles. Conveyor belt velocity is calculated separately from geometry and speed factor.",
  "Modo de operación inicial: AUTO sigue los controles de línea; MANUAL permite operación manual; PAUSE y STOP inician el equipo pausado o detenido.": "Initial operating mode: AUTO follows line controls; MANUAL uses manual operation; PAUSE and STOP start the equipment paused or stopped.",
  "Atributos opcionales del equipo en un objeto JSON. Consulta la guía de ejemplos para los campos compatibles; se permite un objeto vacío.": "Optional equipment attributes as a JSON object. Use the example guide for supported fields; an empty object is allowed.",
  "Entradas del modelo de fallas como objeto JSON. La confiabilidad requiere MTBF y MTTR positivos en minutos. Usa valores medidos en planta; un objeto vacío no agrega perfil de confiabilidad.": "Failure model inputs as a JSON object. Reliability requires both positive MTBF and MTTR in minutes. Use measured plant values; an empty object adds no reliability profile.",
  "Datos estructurados de proceso e ingeniería. Los controles visibles de transportadores prevalecen sobre los campos JSON equivalentes. La importación de hojas también completa estos campos. Consulta la guía antes de editar.": "Structured process and engineering inputs. Visible conveyor controls take precedence over their JSON equivalents. Sheets import also fills these fields. See the example guide before editing.",
  "Booleano: marca el equipo como crítico para el análisis de línea.": "Boolean: marks this equipment as critical for the line analysis.",
  "Tiempo medio de operación entre fallas, en minutos. Valor positivo de planta empleado para muestrear intervalos de falla con la semilla de ejecución.": "Mean operating time between failures, in minutes. A positive plant input used to sample failure intervals with the run seed.",
  "Tiempo medio de reparación, en minutos. El motor actual lo utiliza como duración de reparación fija. Conserva el valor base medido.": "Mean repair time, in minutes. The current engine uses this as a fixed repair duration. Keep the measured baseline value.",
  "Velocidad máxima configurada de la máquina, en unidades por minuto; utilizada para análisis de ingeniería. No reemplaza el campo de velocidad nominal.": "Configured maximum machine speed, in units per minute; used by engineering analysis. It does not replace the nominal rate field.",

  "mayor tiempo combinado sin alimentación, bloqueado y en falla entre las máquinas. Es un indicador de pérdidas, no una prueba del cuello de botella.": "highest combined starving, blocking and failure time among machines. This is a loss indicator, not proof of the line bottleneck.",
  "· Ejecución completa ·": "· Full run ·",
  "Mantén presionada una botella para acumular; arrástrala afuera para quitarla; haz clic para efecto dominó o doble clic para el robot. − / + ajusta velocidad; ← / → cambia dirección. Con el foco aquí: Espacio mantiene/suelta, Supr elimina, R activa robot, D dominó y Esc restablece.": "Hold a bottle to accumulate; drag away to remove; click for domino; double-click for robot. − / + speed; ← / → direction. Focus here: Space hold/release, Delete remove, R robot, D domino, Esc reset.",
  "Hoja creada en Exportaciones. Pestañas:": "Spreadsheet created in Exports. Tabs:",
  "SimuLine simula líneas de envasado para analizar la producción efectiva, la acumulación y el comportamiento de los equipos, comparar simulaciones y explorar escenarios de mejora con Gemini.": "SimuLine simulates packaging lines to analyze throughput, accumulation and equipment behavior, compare simulations, and explore improvement scenarios with Gemini.",
  "No se pudo actualizar la lista de casos. Los casos en caché siguen disponibles; pulsa Actualizar casos para reintentar.": "The case list could not be refreshed. Cached cases remain available; use Refresh cases to retry.",
  "Las exportaciones de comparación incluyen configuraciones seleccionadas, resúmenes guardados, indicadores de equipos y estadísticas de réplicas. Se excluyen cuadros de reproducción y registros de eventos.": "Comparison exports include selected configurations, saved summaries, equipment metrics and replication statistics. Replay frames and event logs are excluded.",
  "Las propuestas Qué pasaría si usan la simulación seleccionada y sus resultados actuales. Las ganancias sugeridas no se verifican hasta ejecutar la simulación propuesta.": "What-If proposals use the selected simulation and its current results. Suggested gains remain unverified until the proposed simulation is run.",
  "Importa una configuración exportada o pega un objeto de simulación con equipment y dynamicConfig opcional. Sólo cambia la simulación activa; se conservan la identidad del caso y las demás simulaciones. Aplicar borra resultados anteriores.": "Import a configuration export or paste a simulation object with equipment and optional dynamicConfig. Only the active simulation changes. Case identity and other simulations are preserved. Apply clears previous results.",
  "Incluye las entradas y la configuración de la simulación seleccionada. No incluye resultados ni reproducción.": "Includes the selected simulation inputs and settings. Results and replay are not included.",
  "Sólo se incluyen agregados y entradas seleccionadas; se excluyen reproducción, eventos, programas de comandos e importaciones sin procesar. La cobertura informa las omisiones. Los indicadores de tiempo usan segundos salvo indicación contraria; las velocidades nominales usan unidades por segundo. La producción efectiva es la producción final dividida entre duración total, multiplicada por 60. Las pérdidas de equipos pueden superponerse temporalmente y no equivalen a paradas de línea. Se supone calidad del 100 %; los escenarios son propuestas no probadas, no ganancias garantizadas. MTBF/MTTR son entradas fijas de planta. El límite de caracteres no garantiza compatibilidad con todas las ventanas de contexto.": "Aggregates and selected inputs only; replay, event logs, command schedules and raw imports are excluded. Coverage reports omissions. Time metrics are seconds unless their field name states otherwise; nominal rates are units per second. Throughput is final output divided by full duration, multiplied by 60. Equipment loss totals may overlap in clock time and are not line downtime. Quality is assumed 100%; scenarios are untested proposals, not guaranteed gains. MTBF/MTTR are fixed plant inputs. The character limit is not a guarantee of compatibility with every model context window.",
  "La producción efectiva usa la salida del último equipo durante toda la ejecución. Los nombres de indicadores especifican segundos, cantidades, velocidades o porcentajes. Los totales de pérdidas suman tiempos de equipos y pueden superponerse; no son tiempo de parada de línea. Se supone calidad del 100 %. El informe incluye configuración para interpretar resultados, no reproducción ni eventos individuales.": "Throughput uses final equipment output over the complete run. Metric names specify seconds, counts, rates or percentages. Loss totals sum equipment time and can overlap; they are not elapsed line downtime. Quality is assumed 100%. The report includes configuration for interpretation, not replay or individual events.",
  "Permite las ventanas emergentes de esta aplicación y vuelve a exportar. En el diálogo de impresión, selecciona Guardar como PDF. También puedes exportar el informe HTML e imprimirlo desde el navegador.": "Allow pop-ups for this app, then export again. In the print dialog, select Save as PDF. You can also export the HTML report and print it from your browser.",
  "Completa los campos obligatorios y corrige el JSON inválido antes de guardar este cambio.": "Complete the required fields and correct invalid JSON before this change can be saved.",
  "Tus cambios no sobrescribieron la versión más reciente. Descarga el borrador antes de cargar la versión de Drive y revisa las diferencias.": "Your changes have not overwritten the newer version. Download your draft before loading the version from Drive, then review the differences.",
  "¿Quitar este equipo de la simulación actual? Se borrarán sus resultados.": "Remove this equipment from the current simulation? Its results will be cleared.",
  "Conserva al menos una simulación en el caso. Puedes eliminar el caso completo desde Configuración.": "Keep at least one simulation in the case. You can delete the entire case in Settings.",
  "Configuración avanzada del motor. Los formularios y la importación de hojas llenan estos valores. La mayoría de usuarios no necesita editar JSON. Un JSON inválido no se guarda; corrígelo para reanudar el guardado automático. Los controles de geometría de transportadores prevalecen sobre sus campos JSON.": "Advanced engine configuration. These values are populated by the forms and Sheet import. Most users do not need to edit JSON. Invalid JSON is not saved; correct it to resume automatic saving. Conveyor geometry controls take precedence over the corresponding JSON fields.",
  "· cambios de escenario aún no guardados en Drive": "· scenario edits not yet saved to Drive",
  ". Se supone calidad del 100 % (sin modelo de rechazos). Los totales de pérdidas y paradas se expresan en minutos-equipo; las pérdidas simultáneas no equivalen a paradas de línea.": ". Quality assumes 100% (no reject model). Loss and downtime totals are equipment-minutes; simultaneous losses are not line downtime.",
  ": mayor tiempo combinado sin alimentación, bloqueo y falla entre máquinas. Es un indicador de pérdidas, no una prueba del cuello de botella.": ": highest combined starving, blocking and failure time among machines. This is a loss indicator, not proof of the line bottleneck.",
  "Obligatorio para cada transportador. La geometría permanece activa: el motor calcula velocidad de banda, paso, capacidad, Prime, margen Back-up, recuperación y verificación a partir de estas entradas.": "Required for every conveyor. Geometry is always active: the engine derives conveyor velocity, pitch, capacity, Prime, Back-up margin, recovery, and audit from these named inputs.",

  function applyTree(root){
    if(!root)return;
    if(root.nodeType===3){updateText(root);return;}
    if(root.nodeType!==1&&root.nodeType!==9&&root.nodeType!==11)return;
    if(root.nodeType===1&&skipped(root))return;
    var walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    while(walker.nextNode())updateText(walker.currentNode);
    if(root.nodeType===1)attributeNames.forEach(function(name){updateAttribute(root,name);});
    if(root.querySelectorAll)root.querySelectorAll('[title],[aria-label],[aria-description],[placeholder],[data-label],[alt]').forEach(function(node){
      attributeNames.forEach(function(name){updateAttribute(node,name);});
    });
  }

  function observe(){
    if(observer)observer.disconnect();
    // Legacy components can still create Spanish labels while English is active.
    // Observe both languages and translate only exact registered strings.
    if(!document.body)return;
    observer=new MutationObserver(function(changes){
      if(applying)return;
      applying=true;
      try{
        changes.forEach(function(change){
          if(change.type==='characterData')updateText(change.target);
          else if(change.type==='attributes')updateAttribute(change.target,change.attributeName);
          else change.addedNodes.forEach(applyTree);
        });
      }finally{applying=false;}
    });
    observer.observe(document.body,{subtree:true,childList:true,characterData:true,
      attributes:true,attributeFilter:attributeNames});
  }
  function apply(){
    document.documentElement.lang=language;
    var wasObserving=!!observer;
    if(wasObserving)observer.disconnect();
    applying=true;
    try{applyTree(document.body);applyTree(document.head?.querySelector('title'));}
    finally{applying=false;}
    observe();
    var picker=document.getElementById('settings-language');
    if(picker)picker.value=language;
  }
  Object.assign(translations,{'Minitab (CSV ZIP)':'Minitab (ZIP de CSV)','Complete the numerical simulation before exporting to Minitab.':'Completa la simulación numérica antes de exportar a Minitab.'});
  function setLanguage(value){
    var next=value==='es'?'es':'en';
    if(language!==next){language=next;window.STPreferences?.write('language',next);}
    apply();
    window.dispatchEvent(new CustomEvent('st-language-change',{detail:{language:next}}));
  }
  function init(){
    var picker=document.getElementById('settings-language');
    if(picker){
      picker.value=language;
      picker.addEventListener('change',function(){setLanguage(this.value);});
    }
    apply();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
  else init();
  return {current:function(){return language;},setLanguage:setLanguage,apply:apply,
    translate:function(value){return localized(value,language);}};
})();
