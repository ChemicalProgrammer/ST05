<script>
var STReliabilityControls = (function(){
  function attach(card){
    var fields=card._fields, profile=fields.querySelector('.equipment-noise-profile'), process=fields.querySelector('.equipment-process-data');
    var group=document.createElement('section');group.className='equipment-grid reliability-controls';
    var controls={};
    [['enabled',__ST_TEXT__('reliability.enabled')],['mtbfMinutes',__ST_TEXT__('reliability.mtbf')],['mttrMinutes',__ST_TEXT__('reliability.mttr')]].forEach(function(spec){
      var label=document.createElement('label'),input=document.createElement('input');label.textContent=spec[1];label.title=spec[1]+' — positive minutes when failures are enabled; disabling failures retains these values.';input.className='reliability-'+spec[0];input.type=spec[0]==='enabled'?'checkbox':'number';if(input.type==='checkbox')label.className='checkbox-label st-checkbox-card';if(input.type==='number'){input.min='0';input.step='any';}label.appendChild(input);group.appendChild(label);controls[spec[0]]=input;
    });
    var modeLabel=document.createElement('label'),mode=document.createElement('select');
    modeLabel.textContent='Stop inputs';
    mode.setAttribute('aria-label','Stop inputs');
    mode.add(new Option('General','general'));mode.add(new Option('Minor and major','split'));
    modeLabel.append(mode);group.prepend(modeLabel);
    var splitControls={};
    ['minor','major'].forEach(function(kind){
      splitControls[kind]={};
      ['mtbfMinutes','mttrMinutes'].forEach(function(key){
        var label=document.createElement('label'),input=document.createElement('input');
        label.textContent=(kind==='minor'?'Minor':'Major')+' '+(key==='mtbfMinutes'?'MTBF':'MTTR')+' [min]';
        input.type='number';input.min='0';input.step='any';input.placeholder='0 if no stops';
        label.append(input);group.append(label);splitControls[kind][key]=input;
      });
    });
    var assumption=document.createElement('p');assumption.className='chart-note conveyor-reliability-assumption';assumption.style.gridColumn='1 / -1';group.append(assumption);
    function visibility(){
      var conveyor=fields.querySelector('.equipment-type').value==='CONVEYOR';
      controls.enabled.parentElement.firstChild.nodeValue=conveyor?'Model own conveyor failures (exception)':__ST_TEXT__('reliability.enabled');
      controls.enabled.parentElement.title=conveyor?'Default assumption: no own random conveyor failures. Enable only for a documented exception with MTBF and MTTR. Existing enabled profiles are preserved.':__ST_TEXT__('reliability.enabled');
      ['mtbfMinutes','mttrMinutes'].forEach(function(key){controls[key].parentElement.hidden=mode.value==='split'||conveyor&&!controls.enabled.checked;controls[key].parentElement.style.display=controls[key].parentElement.hidden?'none':'';});
      Object.values(splitControls).forEach(function(pair){Object.values(pair).forEach(function(input){
        input.parentElement.hidden=mode.value!=='split';
        input.parentElement.style.display=input.parentElement.hidden?'none':'';
      });});
      assumption.hidden=!conveyor;assumption.textContent=controls.enabled.checked?'Exception active: this conveyor has its own failure model. Existing configured values are preserved; disable the exception to use the no-own-failures assumption.':'Model assumption: conveyors have no own random failures. MTBF and MTTR are not required. Material shortage, blocking, sensors and scheduled or manual stops still affect operation.';
    }
    fields.querySelector('.equipment-grid').after(group);
    fields.querySelector('.equipment-type').addEventListener('change',visibility);
    function refresh(){try{var noise=JSON.parse(profile.value),data=JSON.parse(process.value),rel=noise.reliability||data.equipment||{};controls.enabled.checked=!!noise.reliability;
      mode.value=data.equipment?.stopInputs?'split':'general';
      Object.entries(splitControls).forEach(function(entry){Object.keys(entry[1]).forEach(function(key){
        entry[1][key].value=data.equipment?.stopInputs?.[entry[0]]?.[key]??'';
      });});['mtbfMinutes','mttrMinutes'].forEach(function(key){controls[key].value=rel[key]??'';});}catch(e){/* Keep unfinished advanced JSON intact. */}visibility();}
    function update(){
      try{
        var noise=JSON.parse(profile.value),data=JSON.parse(process.value);
        if(!noise||Array.isArray(noise)||typeof noise!=='object'||!data||Array.isArray(data)||typeof data!=='object')throw Error('Invalid JSON');
        var rel={mtbfMinutes:Number(controls.mtbfMinutes.value),mttrMinutes:Number(controls.mttrMinutes.value)};
        data.equipment=Object.assign({},data.equipment);
        if(mode.value==='split'){
          var split={};
          Object.entries(splitControls).forEach(function(entry){
            var pair=entry[1],bf=pair.mtbfMinutes.value,tr=pair.mttrMinutes.value;
            if(bf===''||tr===''||!Number.isFinite(Number(bf))||!Number.isFinite(Number(tr))||!(Number(bf)>0&&Number(tr)>0)&&!(Number(bf)===0&&Number(tr)===0))throw Error((entry[0]==='minor'?'Minor':'Major')+' stops: enter both MTBF and MTTR as positive minutes, or 0 and 0 if there were no stops.');
            split[entry[0]]={mtbfMinutes:Number(bf),mttrMinutes:Number(tr)};
          });
          var minor=split.minor,major=split.major,m=minor.mtbfMinutes>0?1/minor.mtbfMinutes:0,M=major.mtbfMinutes>0?1/major.mtbfMinutes:0;
          rel={mtbfMinutes:m+M>0?1/(m+M):null,mttrMinutes:m+M>0?(m*minor.mttrMinutes+M*major.mttrMinutes)/(m+M):null};
          data.equipment.stopInputs=split;
          Object.keys(rel).forEach(function(key){controls[key].value=rel[key]??'';});
        }else delete data.equipment.stopInputs;
        if(window.STBasicMode?.isBasic()&&fields.querySelector('.equipment-type').value!=='CONVEYOR')controls.enabled.checked=mode.value==='general'||rel.mtbfMinutes>0;
        if(mode.value==='split'&&rel.mtbfMinutes===null)controls.enabled.checked=false;
        if(controls.enabled.checked&&rel.mtbfMinutes>0&&rel.mttrMinutes>0)noise.reliability=Object.assign({},noise.reliability,rel);else delete noise.reliability;
        if(mode.value==='split'||controls.enabled.checked||controls.mtbfMinutes.value!==''||controls.mttrMinutes.value!=='')Object.assign(data.equipment,rel);
        profile.value=JSON.stringify(noise,null,2);process.value=JSON.stringify(data,null,2);group.dataset.invalid='';delete group.dataset.validationMessage;
      }catch(e){group.dataset.invalid='true';group.dataset.validationMessage=e.message;}
      visibility();
    }
    [mode,...Object.values(splitControls.minor),...Object.values(splitControls.major),...Object.values(controls)].forEach(function(input){input.addEventListener('input',update);input.addEventListener('change',update);});
    card._validateReliability=update;
    profile.addEventListener('change',refresh);process.addEventListener('change',refresh);refresh();
    if(window.STBasicMode?.isBasic()&&fields.querySelector('.equipment-type').value!=='CONVEYOR'){
      controls.enabled.checked=true;update();
    }
  }
  attach.valid=function(card){var fields=card._fields,group=fields.querySelector('.reliability-controls');card._validateReliability?.();return !group.dataset.invalid&&(group.querySelector('select').value==='split'||!fields.querySelector('.reliability-enabled').checked||['mtbfMinutes','mttrMinutes'].every(function(key){return Number(fields.querySelector('.reliability-'+key).value)>0;}));};
  return attach;
})();
var STConfigurationEditor=(function(){
  function object(value){return value&&typeof value==='object'&&!Array.isArray(value);}
  function validateDraftPhysicalFields(e,index){
    var path='equipment['+index+'].processData',data=e.processData;
    var fields={
      geometry:['lactMm','lpPrimeMm','actualDischargeMm','actualCodingMm'],
      upstream:['packageLengthMm','dischargePitchMm','startupTimeSeconds','bottlesDischargedAtStop','dischargeVelocityMPerMinute'],
      downstream:['infeedPitchMm','rampUpTimeSeconds'],
      speedAndSensors:['conveyorSpeedFactorVsDischargeVelocityPercent','codingConveyorSpeedFactorVsPreviousConveyorPercent','conveyorSpeedFactorVsPreviousConveyorPercent','blockedTimeDelaySeconds','clearTimeDelaySeconds','insuranceFactorUnits','overspeedVsInfeedScrewPercent'],
      equipment:['maximumSpeedBpm','recoveryTimeSeconds','residenceTimeSeconds','internalCapacityBottles','mtbfMinutes','mttrMinutes'],
      accumulation:['usableLengthMm','productLengthMm','productPitchMm','gapMm','movingGapMm','accumulatedGapMm','accumulatedPitchMm','conveyorSpeedMmPerSecond','conveyorSpeedFactorPercent','primeSensorPositionMm','backupSensorPositionMm','backupRestartPositionMm','dischargeRunoutLengthMm','rejectRunoutLengthMm','blockedTimeDelaySeconds','clearTimeDelaySeconds','insuranceFactorUnits','upstreamStopResponseSeconds','bottlesDischargedAtStop','downstreamRampUpSeconds','restartToFirstPackageSeconds','declaredAccumulationSeconds','manualLbaMm','targetPopulationPercent','targetOverspeedPercent']
    };
    Object.keys(fields).forEach(function(group){
      if(data[group]==null)return;
      if(!object(data[group]))throw Error(path+'.'+group+' must be an object.');
      fields[group].forEach(function(key){var value=data[group][key];if(value!=null&&(typeof value!=='number'||!Number.isFinite(value)||value<0))throw Error(path+'.'+group+'.'+key+' must be a non-negative number or null.');});
    });
  }
  function canReviewPhysicalIssue(issue,equipment){
    var match=/^case\.equipment\[(\d+)\]\.processData\.accumulation(?:\.(.*))?$/.exec(issue.path||'');
    if(!match)return false;
    var item=equipment[Number(match[1])],data=item?.processData?.accumulation,field=match[2];
    if(item?.type!=='CONVEYOR'&&item?.processData?.role!=='CONVEYOR')return false;
    // A draft may lack geometry or have a physical relationship to review.
    // Invalid control modes and explicit target constraints remain blocking.
    if(['speedMode','targetPopulationPercent','targetOverspeedPercent','movingGapMm','accumulatedGapMm'].includes(field))return false;
    if(!field&&data?.targetPopulationPercent!==undefined&&data?.targetOverspeedPercent!==undefined)return false;
    if(field==='manualLbaMm'&&!(data?.manualLbaMm>0))return false;
    return true;
  }
  function physicalReviewMessage(review){
    if(!review?.issues?.length)return '';
    var header='Draft configuration — physical review required before simulation.';
    return (window.STLanguage?.translate(header)||header)+'\n'+review.issues.map(function(issue){return issue.equipmentName+' · '+issue.path+': '+issue.reason;}).join('\n');
  }
  function validate(text,current){
    var parsed=JSON.parse(text,function(key,value){if(['__proto__','constructor','prototype'].includes(key))throw Error('Unsafe JSON key: '+key);return value;});
    if(!object(parsed))throw Error('Configuration must be a JSON object.');
    if(parsed.schema&&parsed.schema!=='st-line-configuration-v1')throw Error('Unsupported configuration schema: '+parsed.schema);
    if(parsed.importMode!==undefined&&(!['DRAFT','VALIDATED'].includes(parsed.importMode)||parsed.schema!=='st-line-configuration-v1'))throw Error('importMode requires st-line-configuration-v1 and must be DRAFT or VALIDATED.');
    var draftImport=parsed.importMode==='DRAFT';
    if(parsed.simulations)throw Error('Import an active simulation configuration export, not an entire case.');
    if(parsed.case?.unitOfFlow&&parsed.case.unitOfFlow!==current.case.unitOfFlow)throw Error('unitOfFlow must match the active case: '+current.case.unitOfFlow);
    var source=parsed.schema?parsed.simulation:parsed;
    if(!object(source)||!Array.isArray(source.equipment))throw Error('equipment must be an array.');
    if(source.engineConfig&&JSON.stringify(source.engineConfig)!==JSON.stringify(current.simulation.engineConfig))throw Error('engineConfig is shared by the case and must match the active case.');
    if(source.dynamicConfig!==undefined&&!object(source.dynamicConfig))throw Error('dynamicConfig must be an object.');
    if(draftImport&&!object(source.dynamicConfig))throw Error('A draft import requires its complete dynamicConfig.');
    // Drafts are complete input snapshots. They must not inherit another case's
    // runtime target, products, commands or calendar while awaiting review.
    var run=Object.assign({},draftImport?{}:current.simulation.dynamicConfig,source.dynamicConfig||{}),formatCatalog;
    if(Object.prototype.hasOwnProperty.call(source.dynamicConfig||{},'initialFormatId'))run.initialProductId=run.initialFormatId;
    else if(Object.prototype.hasOwnProperty.call(source.dynamicConfig||{},'initialProductId'))run.initialFormatId=run.initialProductId;
    if(parsed.case?.metadata?.formatCatalog||parsed.case?.metadata?.products){
      formatCatalog=SimulatorEngine.mergeFormatCatalogs(SimulatorEngine.normalizeFormatCatalog(current.case.metadata||{},current.simulation.equipment),SimulatorEngine.normalizeFormatCatalog(parsed.case.metadata,source.equipment||current.simulation.equipment));
      run.productCatalog=SimulatorEngine.resolvePackingFormats(formatCatalog);
    }
    if(run.tickSeconds!==0.25)throw Error('tickSeconds must be 0.25 in this interface.');
    if(!['FIXED','SHIFTS'].includes(run.durationMode)||!Number.isInteger(run.rounds)||run.rounds<1||run.rounds>100)throw Error('Use durationMode FIXED or SHIFTS and rounds from 1 to 100.');
    if(run.durationMode==='SHIFTS'){
      if(!(run.shiftHours>=0.25&&run.shiftHours<=24)||!Number.isInteger(run.shiftHours*4)||![1,2,3].includes(run.shiftCount))throw Error('Invalid shiftHours or shiftCount.');
      run.shiftSeconds=run.shiftHours*3600;run.durationSeconds=run.shiftSeconds*run.shiftCount;
    }
    source.equipment.forEach(function(e,index){
      if(!object(e)||typeof e.name!=='string'||!e.name.trim())throw Error('equipment['+index+'].name is required.');
      if(typeof e.id==='string')e.id=e.id.trim();e.name=e.name.trim();
      if(!['BLOWER','BLOWMOLDER','CONVEYOR','PACEMAKER','PUCKER','FILLER','CAPPER','FEEDER','DEPUCKER','SLEEVER','CASE_PACKER','PALLETIZER','CUSTOM'].includes(e.type))throw Error('equipment['+index+'].type is unsupported.');
      ['characteristics','noiseProfile','processData'].forEach(function(key){if(e[key]===undefined)e[key]={};if(!object(e[key]))throw Error('equipment['+index+'].'+key+' must be an object.');});
      if(draftImport)validateDraftPhysicalFields(e,index);
      ['maximumSpeedBpm','recoveryTimeSeconds'].forEach(function(key){var value=e.processData.equipment?.[key];if(value!=null&&(typeof value!=='number'||!Number.isFinite(value)||value<=0))throw Error('equipment['+index+'].processData.equipment.'+key+' must be a positive number.');});
      if(e.type==='CONVEYOR'&&(e.processData.role==='PACEMAKER'||e.characteristics.isPacemaker===true))throw Error('A conveyor cannot be the critical machine.');
      if(e.noiseProfile.reliability){e.processData.equipment=Object.assign({},e.processData.equipment,e.noiseProfile.reliability);}
    });
    if(source.equipment.filter(function(e){return e.type==='PACEMAKER'||e.processData.role==='PACEMAKER'||e.characteristics.isPacemaker===true;}).length>1)throw Error('Select only one machine as the critical machine.');
    var result=SimulatorEngine.validateSimulationInput({case:{equipment:source.equipment},run:run});
    var issues=!result.ok?result.error.details:[],blocking=draftImport?issues.filter(function(issue){return !canReviewPhysicalIssue(issue,source.equipment);}):issues;
    if(blocking.length)throw Error(blocking.map(function(d){return d.path+': '+d.reason;}).join('\n'));
    var configuration={equipment:source.equipment,dynamicConfig:run,formatCatalog:formatCatalog};
    if(draftImport&&issues.length)configuration.physicalReview={status:'REQUIRES_REVIEW',issues:issues.map(function(issue){
      var index=Number(/^case\.equipment\[(\d+)\]/.exec(issue.path)[1]),equipment=source.equipment[index];
      return {path:issue.path,reason:issue.reason,equipmentId:equipment.id,equipmentName:equipment.name};
    })};
    return configuration;
  }
  function init(state,callbacks){
    var dialog=document.getElementById('configuration-dialog'),draft=document.getElementById('configuration-draft'),error=document.getElementById('configuration-error'),file=document.getElementById('configuration-file'),apply=document.getElementById('configuration-apply');
    var context=null,serial=0,importRequest=null,filename=document.getElementById('configuration-filename');
    function reviewDraft(){
      if(!context)return;
      error.textContent='';
      var parsed;try{parsed=JSON.parse(draft.value);}catch(e){return;}
      if(parsed?.importMode!=='DRAFT')return;
      try{error.textContent=physicalReviewMessage(validate(draft.value,context.current).physicalReview);}catch(e){error.textContent=e.message;}
    }
    function request(){return {token:++serial,caseId:state.activeCase?.id,simulationId:state.activeSimulationId};}
    function currentRequest(entry){return entry&&entry.token===serial&&state.activeCase?.id===entry.caseId&&state.activeSimulationId===entry.simulationId;}
    function close(){serial++;context=null;importRequest=null;draft.value='';file.value='';filename.textContent='';filename.hidden=true;dialog.close();}
    async function open(entry,selected){
      try{
        if(selected&&selected.size>6*1024*1024)throw Error('JSON file exceeds 6 MB.');
        var current=await callbacks.capture();if(!currentRequest(entry))return;
        var text=selected?await selected.text():JSON.stringify(current,null,2);if(!currentRequest(entry))return;
        context={caseId:entry.caseId,simulationId:entry.simulationId,current:current};
        draft.value=text;file.value='';filename.textContent=selected?.name||'';filename.hidden=!filename.textContent;
        error.textContent='';reviewDraft();apply.disabled=false;dialog.showModal();draft.focus();
      }catch(e){if(currentRequest(entry))STDialog.open({message:e.message});}
    }
    function importFile(event){
      event.preventDefault();event.currentTarget.closest('.export-menu')?.removeAttribute('open');
      importRequest=request();file.value='';
      // Keep the native picker inside the original user gesture. Only open the
      // editor after a file is selected; cancelling leaves the current case alone.
      file.click();
    }
    document.getElementById('open-json-import').onclick=importFile;
    document.getElementById('import-setup-json').onclick=importFile;
    document.getElementById('edit-setup-json').onclick=function(){importRequest=null;open(request());};
    document.getElementById('configuration-close').onclick=close;
    document.getElementById('configuration-cancel').onclick=close;dialog.addEventListener('cancel',function(event){event.preventDefault();close();});
    file.onchange=function(){var selected=file.files[0],entry=importRequest;importRequest=null;if(selected&&currentRequest(entry))open(entry,selected);};
    file.addEventListener('cancel',function(){importRequest=null;});
    draft.addEventListener('input',reviewDraft);
    window.addEventListener('st-language-change',reviewDraft);
    apply.onclick=function(){try{
      if(!context||state.activeCase?.id!==context.caseId||state.activeSimulationId!==context.simulationId)throw Error('The active simulation changed. Reopen the editor.');
      var configuration=validate(draft.value,context.current);callbacks.apply(configuration);close();
    }catch(e){{error.textContent=e.message;STErrors.capture(error,e);}}};
  }
  return {init:init,validate:validate};
})();
</script>
