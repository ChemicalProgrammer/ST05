<script>
window.STEquipmentInspector=(function(){
  var state,selected=null,opened=false,context='',helpSequence=0;
  function el(id){return document.getElementById(id);}
  function key(){return (state?.activeCase?.id||'')+':'+(state?.activeSimulationId||'');}
  function release(){
    var selection=selected?{id:selected.dataset.equipmentId,opened:opened,context:context}:null;
    if(selected){selected.appendChild(selected._fields);selected.classList.remove('equipment-selected');}
    selected=null;return selection;
  }
  function restore(selection){
    if(!selection||selection.context!==key()){opened=false;return;}
    var card=Array.from(document.querySelectorAll('#equipment-list .equipment-card')).find(function(c){return c.dataset.equipmentId===selection.id;});
    if(card){select(card,false);opened=selection.opened;}else opened=false;
  }
  function exchangeValues(a,b){
    var left=Array.from(a.querySelectorAll('input,select,textarea'));
    var right=Array.from(b.querySelectorAll('input,select,textarea'));
    if(left.length!==right.length)return false;
    left.forEach(function(control,index){
      var other=right[index],value=control.value,checked=control.checked;
      var bpm=control.dataset.originalBpm,rate=control.dataset.originalRate;
      ['manualValue','inputMode'].forEach(function(key){var value=control.dataset[key];if(other.dataset[key]===undefined)delete control.dataset[key];else control.dataset[key]=other.dataset[key];if(value===undefined)delete other.dataset[key];else other.dataset[key]=value;});
      control.value=other.value;control.checked=other.checked;
      other.value=value;other.checked=checked;
      if(control.classList.contains('equipment-rate')){
        control.dataset.originalBpm=other.dataset.originalBpm;
        control.dataset.originalRate=other.dataset.originalRate;
        other.dataset.originalBpm=bpm;other.dataset.originalRate=rate;
      }
    });
    return true;
  }
  function layout(card){return card._fields.querySelector('.equipment-type').value==='CONVEYOR'?'CONVEYOR':'EQUIPMENT';}
  function refreshTitle(card){
    var fields=card._fields;if(!fields)return;
    var control=fields.querySelector('.equipment-type'),type=control.value,header=card.querySelector('.equipment-header'),title=header.querySelector('strong');
    card.dataset.equipmentType=type;
    var symbol=header.querySelector('.equipment-card-symbol');
    if(!symbol){symbol=document.createElement('span');symbol.className='equipment-card-symbol';symbol.setAttribute('aria-hidden','true');header.prepend(symbol);}
    if(symbol.dataset.type!==type){symbol.innerHTML=STIcons.equipment(type);symbol.dataset.type=type;}
    if(window.STBasicMode?.isSplit()){title.textContent=fields.querySelector('.equipment-name').value;return;}
    var name=document.createElement('span');name.className='equipment-title-name';name.textContent=fields.querySelector('.equipment-name').value||card.dataset.equipmentId||'—';
    var meta=document.createElement('span');meta.className='equipment-title-meta';meta.textContent=' '+(control.selectedOptions[0]?.textContent||type);
    if(type!=='CONVEYOR'){var rate=fields.querySelector('.equipment-rate'),value=Number(rate.value);meta.textContent+=' · '+(rate.value&&Number.isFinite(value)?value.toLocaleString(undefined,{maximumFractionDigits:2}):'—')+__ST_TEXT__('client.bpm');}
    title.replaceChildren(name,meta);
  }
  function select(card,focus){
    if(window.STBasicMode?.inline(card))return;
    if(selected===card){opened=true;return;}
    var previous=selected,panel=el('equipment-inspector'),scroll=panel.scrollTop;
    var sameLayout=previous&&context===key()&&layout(previous)===layout(card);
    if(sameLayout){
      if(!card._helpReady){decorate(card);card._helpReady=true;}
      var retained=previous._fields,incoming=card._fields;
      if(exchangeValues(retained,incoming)){
        release();
        previous._fields=incoming;card._fields=retained;
        incoming._owner=previous;retained._owner=card;
        previous.appendChild(incoming);
        previous._refreshFormatPreview?.();card._refreshFormatPreview?.();
        selected=card;context=key();opened=true;
        panel.appendChild(retained);card.classList.add('equipment-selected');
        panel.scrollTop=scroll;
        window.dispatchEvent(new Event('st:inspector'));
        panel.scrollTop=scroll;
        if(focus!==false)panel.querySelector('input,select,textarea')?.focus({preventScroll:true});
        panel.scrollTop=scroll;
        return;
      }
    }
    release();selected=card;context=key();opened=true;
    if(!card._helpReady){decorate(card);card._helpReady=true;}
    panel.appendChild(card._fields);card.classList.add('equipment-selected');
    window.dispatchEvent(new Event('st:inspector'));
    if(focus!==false)panel.querySelector('input,select,textarea')?.focus();
  }
  function sync(){
    if(context!==key()){release();opened=false;el('equipment-inspector').textContent='';}
    var visible=Boolean(opened&&selected&&state.activeCase&&state.uiView==='editor');
    return visible;
  }
  function init(current,dirty){
    state=current;
    ['input','change'].forEach(function(type){el('equipment-inspector').addEventListener(type,function(event){if(event.target.matches('input,select,textarea')){var fields=selected?._fields;if(fields){selected.querySelector('.equipment-header strong').textContent=fields.querySelector('.equipment-type').value+' · '+fields.querySelector('.equipment-name').value+(fields.querySelector('.equipment-type').value==='CONVEYOR'?'':' · '+Number(fields.querySelector('.equipment-rate').value)+__ST_TEXT__('client.bpm'));refreshTitle(selected);}dirty(event);}});});
  }
  function help(control,text){
    var label=control.closest('label');if(!label||control.type==='hidden')return;label.title=text;
    var details=document.createElement('details');details.className='parameter-help';
    var summary=document.createElement('summary');summary.innerHTML=STIcons.svg('info');summary.setAttribute('aria-label',__ST_TEXT__('inspector.parameter_help'));
    var message=document.createElement('p');message.id='parameter-help-'+(++helpSequence);message.textContent=text;message.setAttribute('role','tooltip');
    control.setAttribute('aria-describedby',message.id);details.append(summary,message);label.appendChild(details);
  }
  var basic={
    'equipment-name':__ST_TEXT__('inspector.help_name'),
    'equipment-type':__ST_TEXT__('inspector.help_type'),
    'equipment-unit':__ST_TEXT__('client.equipment_unit_help'),
    'equipment-rate':__ST_TEXT__('inspector.help_rate'),
  };
  // Ayuda contextual de propiedades, sin edición JSON, ejemplos ni diálogos.
  function decorate(card){
    card._fields.querySelectorAll('input,select,textarea').forEach(function(control){
      var label=control.closest('label');
      if(!label||control.type==='hidden')return;
      help(control,basic[control.className]||label.title||'');
    });
  }
  return {init:init,select:select,release:release,restore:restore,sync:sync,decorate:decorate,refreshTitle:refreshTitle,hide:function(){opened=false;},show:function(){if(selected)opened=true;},available:function(){return !!selected&&state?.uiView==='editor';},name:function(){return selected?selected._fields.querySelector('.equipment-name').value:'';}};
})();
</script>
