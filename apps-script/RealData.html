  function tip(element,text){text=ui(text);element.title=text;element.setAttribute('aria-description',text);element.tabIndex=0;}
  function status(text,error){lastStatus={text,error};const e=document.getElementById('real-data-status');e.textContent=ui(text);e.classList.toggle('real-data-error',!!error);}
  function persist(record){
    const c=state.activeCase,list=records().slice(),index=list.findIndex(r=>r.id===record.id);
    if(index<0&&list.length>=M.MAX_RECORDS)throw Error('Límite de registros alcanzado.');
    if(index<0)list.push(record);else list[index]=record;
    const next={schema:M.VERSION,records:list};if(new Blob([JSON.stringify(next)]).size>512*1024)throw Error('Los registros exceden 512 KB. Exporta los registros antes de eliminar los que no necesites.');
    c.metadata=c.metadata||{};c.metadata.realData=next;selected.set(c.id,record.id);actions.changed();
  }
  function edit(path,value,equipmentId){
    try{
      const draft=M.normalize(current());
      if(equipmentId){
        let entry=draft.equipment.find(e=>e.equipmentId===equipmentId);
        if(!entry){entry={equipmentId,name:context.simulation?.equipment?.find(e=>e.id===equipmentId)?.name||equipmentId,stopClass:'FAILURES'};draft.equipment.push(entry);}
        entry[path]=value;
        if(path==='failureSeconds'&&value===null&&entry.stopClass==='FAILURES')entry.downtimeSeconds=null;
      }else {
        if(path.startsWith('timeBreakdown.unplanned.')&&M.timeMode(draft,'unplanned')&&!draft.timeOverrides.unplanned){
          draft.timeOverrides.unplanned={enabled:true,valueSeconds:M.timeHierarchy(draft).values.unplanned};
        }
        M.set(draft,path,value);
        if(path.startsWith('timeBreakdown.')){const branch=path.split('.')[1];draft.timeBreakdown[branch].enabled=true;draft.timeHierarchyEnabled=true;draft.timeOverrides[branch]={...(draft.timeOverrides[branch]||{}),enabled:false};}
        if(path.startsWith('timeOverrides.'))draft.timeHierarchyEnabled=true;
        if(['durationSeconds','rateLossSeconds','aem.scrapSeconds','aem.reworkSeconds'].includes(path))draft.timeHierarchyEnabled=true;
        for(const [id,category] of Object.entries(M.timeCategories))if(path===category.total){draft.timeBreakdown[id].enabled=false;draft.timeHierarchyEnabled=true;}
      }
      if(path==='reportedProductionUnits'||path==='reportedProductionCases'){
        draft.production=draft.reportedProductionUnits??draft.reportedProductionCases;draft.productionUnit=draft.reportedProductionUnits!=null?'BOTTLES':'CASES';
      }
      persist(M.normalize(draft));status('Datos actualizados. Se guardan con el caso.');refresh();
      const option=document.querySelector('#real-data-record option:checked');if(option)option.textContent=draft.name+(draft.date?' · '+draft.date:'');
    }catch(error){status(error.message,true);}
  }
  function control(parent,field,record,equipmentId){
    const [path,label,type,scale=1,options]=field,wrapper=el('label',ui(label)),input=el(type==='select'?'select':type==='textarea'?'textarea':'input');
    let value=M.at(record,path);
    const zeroDefault=type==='number'&&(path.startsWith('timeBreakdown.')||path.startsWith('timeOverrides.')||['durationSeconds','rateLossSeconds','aem.scrapSeconds','aem.reworkSeconds'].includes(path)||equipmentId&&['failureSeconds','failureCount'].includes(path));
    if(type==='select')for(const [v,text] of options){const option=el('option',ui(text));option.value=v;input.append(option);}
    else if(type!=='textarea')input.type=type;
    input.dataset.realField=path;if(equipmentId){input.dataset.equipmentId=equipmentId;input.dataset.realEquipmentField=path;}
    if(path.startsWith('aem.')||path==='referenceSpeedBpm')input.dataset.aemField=path;
    if(type==='number'){
      input.min=['referenceSpeedBpm','bottlesPerCase','exposureSeconds'].includes(path)?'0.000001':'0';
      input.step=['failureCount','bottlesPerCase'].includes(path)?'1':'any';if(/Percent$/.test(path))input.max='100';
      input.value=value==null?'':value/scale;if(zeroDefault)input.placeholder='0';
    }else input.value=value??'';
    if(type==='text')input.maxLength=path==='source'?2000:160;
    if(type==='textarea')input.maxLength=equipmentId?4000:8000;
    if(path==='downtimeSeconds'&&equipmentId)tip(input,'Downtime anterior del equipo. Solo se usa como falla propia cuando su clase es FAILURES. Se conserva sin reclasificarlo automáticamente.');
    if(path==='failureSeconds')tip(input,'Minutos de falla propia del equipo, asociados a reparación. No incluye starving, blocking, pausas programadas ni rampas posteriores.');
    if(path==='operatingSeconds')tip(input,'Tiempo operativo interno medido, no el período calendario. Se usa para calcular MTBF = tiempo operativo / número de fallas.');
    if(path==='exposureSeconds')tip(input,'Período de observación del equipo. Debe coincidir con el período de la simulación para una comparación equivalente.');
    if(path==='validation.rateLossBasis')tip(input,'La pérdida bruta no resta recuperación. El balance neto es pérdida bruta − recuperación. La selección solo cambia la comparación, no el motor.');
    input.oninput=()=>{if(input.readOnly||input.disabled)return;if(!input.checkValidity()){status(tr('Check the value of ','Revisa el valor de ')+ui(label)+'.',true);return;}edit(path,type==='number'?(input.value===''?null:Number(input.value)*scale):input.value,equipmentId);};
    wrapper.append(input);parent.append(wrapper);
    if(parent.tagName==='SUMMARY'){input.addEventListener('click',e=>e.stopPropagation());input.addEventListener('keydown',e=>e.stopPropagation());}
    return input;
  }

  function explorerSelection(layout,content,entries){
    let activeId=null;

      const next=entries.get(id);

      const motion=window.STMotion,previous=entries.get(activeId);
      const animate=!!previous&&layout.isConnected&&!!motion&&!motion.reduced?.();
      // Start from the currently visible height when switching rapidly.
      const before=animate?content.getBoundingClientRect().height:0;
      motion?.cancel(content);
      if(previous)motion?.cancel(previous.panel);
      for(const [key,{button,panel}] of entries){
        button.setAttribute('aria-current',key===id?'page':'false');
        panel.hidden=key!==id;
      }
      activeId=id;
      if(animate){

        if(before>0&&after>0&&Math.abs(after-before)>1){
          motion.play(content,[{height:before+'px',boxSizing:'border-box',overflow:'hidden'},
            {height:after+'px',boxSizing:'border-box',overflow:'hidden'}],
            {duration:motion.duration('card-update',220),easing:'ease-out'});
        }
        motion.reveal(next.panel);
      }
      return true;
    };
  }

    const discrepancies=checks.length?'<div class="real-data-calibration-notice"><strong>'+tr('Reconciliation checks','Comprobaciones de conciliación')+'</strong><ul>'+checks.map(item=>'<li>'+esc(checkLabels[item.code])+' '+tr('Reported: ','Reportado: ')+fmt(item.reported)+' '+item.unit+' · '+tr('Calculated: ','Calculado: ')+fmt(item.calculated)+' '+item.unit+'</li>').join('')+'</ul></div>':'';
    const attrs=c=>' title="'+esc(displayText(c.formula))+'" aria-description="'+esc(displayText(c.formula))+'" tabindex="0"';
    return '<div class="real-data-calibration-scroll" role="region" aria-label="'+esc(ui('Hoja de cálculo de rate loss calibrado'))+'" tabindex="0"><table class="real-data-calibration-table"><thead><tr>'+columns.map(c=>'<th scope="col"'+attrs(c)+'>'+esc(ui(c.label))+(c.unit?'<small>['+esc(c.unit==='pp'?'%':c.unit)+']</small>':'')+'</th>').join('')+'</tr></thead><tbody><tr>'+columns.map(c=>'<td data-calibration="'+esc(c.id)+'" class="'+(c.letter==='A'||c.letter==='B'?'':'numeric')+'"'+attrs(c)+'>'+((c.letter==='A'||c.letter==='B')?esc(c.value||'—'):fmt(c.value))+(c.unit==='%'?' %':'')+'</td>').join('')+'</tr></tbody></table></div><p class="chart-note">'+esc(ui(result.calibration.note))+'</p>'+discrepancies;

  }
  function downtimeHtml(d){
    const rows=d.rows;
    if(!rows.length)return '<p class="empty">'+esc(ui('Sin equipos para comparar.'))+'</p>';
    const columns=M.equipmentFields;
    const cells=comparison=>columns.map(({id})=>{
      const values=comparison[id];
      return [values.real,values.simulated,values.difference].map(value=>'<td class="numeric">'+fmt(value)+'</td>').join('');
    }).join('');
    const subhead=['Real','Simulated','Difference [%]'].map(label=>'<th scope="col" class="numeric">'+label+'</th>').join('');
    return '<p class="chart-note">'+esc(ui('Difference [%] = (Simulated − Real) ÷ Real × 100. Si Real es cero o falta un dato, se muestra —. La suma de minutos entre equipos puede incluir paros simultáneos. El paro reportado sin desglose comparable se conserva como referencia.'))+'</p>'+
      '<table class="real-data-downtime-table"><colgroup span="1"></colgroup>'+columns.map(()=>'<colgroup span="3"></colgroup>').join('')+'<thead><tr><th scope="col" rowspan="2">'+esc(ui('Equipo'))+'</th>'+
      columns.map(({label,unit})=>'<th scope="colgroup" colspan="3">'+esc(ui(label))+' ['+esc(ui(unit))+']</th>').join('')+'</tr><tr>'+columns.map(()=>subhead).join('')+'</tr></thead><tbody>'+
      rows.map(row=>'<tr><th scope="row">'+esc(row.name)+'</th>'+cells(row.comparison)+'</tr>').join('')+
      '</tbody><tfoot><tr><th scope="row">'+esc(ui('Total de equipos'))+'</th>'+cells(d.comparisonTotals)+'</tr></tfoot></table>';
  }
  function showComparisonExplorer(target,selectedGroup){
    const groups=[...target.querySelectorAll('[data-comparison-group]')];
    if(!groups.length)return;
    const layout=el('div',null,'real-data-explorer real-data-comparison-explorer');
    const nav=el('nav',null,'real-data-explorer-nav real-data-comparison-nav');
    nav.setAttribute('aria-label',ui('Rubros de comparación'));
    // Same icon-and-label navigation component used by the application header.
    const tabs={
      calendar:['calendar','Calendar','Calendario'],
      planned:['settings','Planned downtime','Paradas planificadas'],
      operation:['warning','Unplanned downtime','Paradas no planificadas'],
      losses:['pulse','Runtime losses','Pérdidas durante la marcha'],
      production:['box','Production','Producción'],
      inputs:['filter','Reference parameters','Parámetros de referencia'],
      indicators:['chart','Performance indicators','Indicadores de desempeño'],
      'equipment-downtime':['machine','Equipment downtime','Downtime por equipo']
    };
    const content=el('div',null,'real-data-explorer-content');
    const buttons=new Map(),select=explorerSelection(layout,content,buttons);
    for(const group of groups){
      const id=group.dataset.comparisonGroup;
      const label=group.querySelector('.subsection-native-title').textContent;
      const description=group.querySelector('.subsection-description')?.textContent||'';
      const [icon,en,es]=tabs[id]||['list',label,label];
      const button=el('button',null,'app-section-tab real-data-comparison-tab');
      button.type='button';button.dataset.icon=icon;
      window.STIcons?.button(button,icon);
      button.append(el('span',tr(en,es)));
      button.dataset.comparisonSelect=id;
      button.setAttribute('aria-controls','real-data-comparison-'+id);
      button.setAttribute('aria-label',label);button.title=label;
      button.onclick=()=>select(id);
      const panel=el('article',null,'real-data-explorer-panel real-data-comparison-panel');
      panel.id='real-data-comparison-'+id;
      panel.dataset.comparisonGroup=id;
      const heading=el('div',null,'real-data-comparison-heading');
      const title=el('h3',label,'real-data-panel-title real-data-comparison-title');title.id=panel.id+'-title';
      heading.append(title);
      if(description)heading.append(el('p',description,'subsection-description'));
      panel.setAttribute('aria-labelledby',title.id);
      panel.append(heading,group.querySelector('.real-data-comparison-scroll'));
      buttons.set(id,{button,panel});
      nav.append(button);
      content.append(panel);
    }
    layout.append(nav,content);
    target.replaceChildren(layout);
    select(buttons.has(selectedGroup)?selectedGroup:groups[0].dataset.comparisonGroup);
  }
  function refresh(){
    refreshTimeTree();
    const comparison=document.getElementById('real-data-comparison');
    const selectedGroup=comparison.querySelector('[aria-current="page"]')?.dataset.comparisonSelect;
    const r=current();data=r?M.build(r,context.simulation,source(),selection,context.caseRecord):null;
    for(const id of ['real-data-export-json','real-data-export-html'])document.getElementById(id).disabled=!data;
    for(const [id,html] of [['real-data-comparison',data?comparisonHtml(data):''],['real-data-calibration',data?calibrationHtml(data):'']])document.getElementById(id).innerHTML=html||'<p class="empty">'+esc(ui('Sin registro seleccionado.'))+'</p>';
    STSubsection.init(comparison);
    showComparisonExplorer(comparison,selectedGroup);

  }
  function render(caseRecord,simulation,live){
    if(!state||!caseRecord)return;
    if(context?.simulation?.id!==simulation?.id||context?.caseRecord?.id!==caseRecord.id)selection='average';
    const replacedCase=context?.caseRecord!==caseRecord;
    context={caseRecord,simulation,live};const record=current(),key=caseRecord.id+':'+(record?.id||'')+':'+(simulation?.id||'');
    if(record)selected.set(caseRecord.id,record.id);
    const selector=document.getElementById('real-data-record');selector.replaceChildren();for(const r of records()){const option=el('option',r.name+(r.date?' · '+r.date:''));option.value=r.id;selector.append(option);}selector.value=record?.id||'';
    if(owner!==key||replacedCase){owner=key;register();}
    document.getElementById('real-data-delete').disabled=!record;
    const select=document.getElementById('real-data-view'),result=source(),options=[['average',ui('Promedio de rondas')]];
    if(result?.batch?.rows?.length){options.push(['representative',ui('Ronda representativa')]);for(const r of result.batch.rows)options.push([String(r.round),tr('Round ','Ronda ')+r.round+' · '+tr('seed ','semilla ')+r.seed]);}
    if(!options.some(([value])=>value===selection))selection='average';select.replaceChildren();for(const [value,text] of options){const o=el('option',text);o.value=value;select.append(o);}select.value=selection;
    document.getElementById('real-data-simulation').textContent=tr('Comparison with: ','Comparación con: ')+(simulation?.name||tr('no simulation selected','sin simulación seleccionada'))+tr('. Real records belong to the case.','. Los registros reales pertenecen al caso.');
    refresh();
  }
  function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
  function reportHtml(result){
    const fields=M.fieldGroups.flatMap(g=>g.fields.map(([path,label,type,scale=1])=>({label:ui(label),value:M.at(result.observation,path),scale,type}))).filter(r=>r.value!=null&&r.value!=='');
    for(const [id,category] of Object.entries(M.timeCategories))for(const [key,label] of category.fields){const value=result.observation.timeBreakdown?.[id]?.[key];if(value!=null)fields.push({label:category.label+' / '+label+' (min)',value,scale:60,type:'number'});}
    for(const [id,mode] of Object.entries(result.observation.timeOverrides||{}))if(mode.enabled)fields.push({label:(M.timeCategories[id]?.label||({plant:'Plant Available Time',production:'Production Available Time',runtime:'Runtime',losses:'Runtime Losses'})[id])+tr(' (manual entry, min)',' (entrada manual, min)'),value:mode.valueSeconds??0,scale:60,type:'number'});
    if(result.observation.reportedProductionUnits==null&&result.observation.reportedProductionCases==null&&finite(result.observation.production))fields.push({label:tr('Original production (','Producción original (')+result.observation.productionUnit+')',value:result.observation.production,scale:1});
    const registration='<table><tbody>'+fields.map(f=>'<tr><th>'+esc(f.label)+'</th><td>'+esc(typeof f.value==='number'?fmt(f.value/f.scale):f.value)+'</td></tr>').join('')+'</tbody></table>';
    return '<!doctype html><html lang="'+tr('en','es')+'"><meta charset="utf-8"><title>'+esc(ui('Comparación de datos reales'))+'</title><style>body{font:14px system-ui;max-width:1200px;margin:24px auto;padding:16px;color:#213547}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{padding:8px;border-bottom:1px solid #ccd5dd;text-align:left}.real-data-calibration-scroll,.real-data-comparison-scroll{overflow-x:auto}.real-data-downtime-table thead th{white-space:nowrap}.real-data-calibration-table{min-width:1600px}.real-data-calibration-table thead{background:#24599a;color:white}.real-data-calibration-table th{text-align:center}.real-data-calibration-table small{display:block}.numeric{text-align:right;font-variant-numeric:tabular-nums}.real-data-reported{display:block;font-weight:400}.chart-note{color:#52616c}.real-data-group-row{background:#eef4f7}section{margin:24px 0}@media print{tr{break-inside:avoid}body{max-width:none;margin:0}}</style><h1>'+esc(result.observation.name)+'</h1><section><h2>'+esc(ui('Registro'))+'</h2>'+registration+'</section><section><h2>'+esc(ui('Comparación de parámetros'))+'</h2>'+comparisonHtml(result)+'</section><section><h2>'+esc(ui('Ajuste calibrado de rate loss'))+'</h2>'+calibrationHtml(result,false)+'</section><details><summary>'+esc(ui('Datos de equipos capturados'))+'</summary><pre>'+esc(JSON.stringify(result.observation.equipment,null,2))+'</pre></details></html>';
  }
  function init(currentState,callbacks){
    state=currentState;actions=callbacks;syncStaticLabels();
    window.addEventListener('st-language-change',()=>{
      syncStaticLabels();
      if(context?.caseRecord&&context.caseRecord===state.activeCase){
        owner='';render(context.caseRecord,context.simulation,context.live);
        if(lastStatus)status(lastStatus.text,lastStatus.error);
      }
    });
    document.getElementById('real-data-new').onclick=()=>{try{const r=M.normalize(M.empty());r.name=tr('Record ','Registro ')+(records().length+1);persist(r);owner='';render(context.caseRecord,context.simulation,context.live);}catch(error){status(error.message,true);}};
    document.getElementById('real-data-record').onchange=e=>{selected.set(state.activeCase.id,e.target.value);owner='';render(context.caseRecord,context.simulation,context.live);};
    document.getElementById('real-data-view').onchange=e=>{selection=e.target.value;refresh();};
    document.getElementById('real-data-delete').onclick=async()=>{const c=state.activeCase,r=current();if(!r)return;const answer=await STDialog.open({title:ui('Eliminar registro'),message:tr('Delete '+r.name+'? Simulation results are retained.','¿Eliminar '+r.name+'? Los resultados de simulación se conservan.'),buttons:[{id:'cancel',label:ui('Cancelar')},{id:'delete',label:ui('Eliminar'),destructive:true}]});if(answer.action!=='delete'||state.activeCase!==c)return;c.metadata.realData={schema:M.VERSION,records:records().filter(row=>row.id!==r.id)};selected.delete(c.id);actions.changed();owner='';render(c,context.simulation,context.live);};
    const input=document.getElementById('real-data-file');document.getElementById('real-data-import').onclick=()=>input.click();
    input.onchange=async()=>{const file=input.files?.[0],c=state.activeCase,ticket=++revision;input.value='';if(!file)return;try{if(file.size>2*1024*1024)throw Error('El JSON excede 2 MB.');const imported=M.importRecords(JSON.parse(await file.text()));if(state.activeCase!==c||ticket!==revision)return;if(records().length+imported.length>M.MAX_RECORDS)throw Error('Límite de registros alcanzado.');const added=imported.map(r=>({...r,id:M.empty().id})),next={schema:M.VERSION,records:records().concat(added)};if(new Blob([JSON.stringify(next)]).size>512*1024)throw Error('Los registros exceden 512 KB.');c.metadata=c.metadata||{};c.metadata.realData=next;selected.set(c.id,added[0].id);actions.changed();owner='';render(c,context.simulation,context.live);status('Registro importado.');}catch(error){status(error.message,true);}};
    document.getElementById('real-data-template').onclick=()=>download(JSON.stringify(M.template(context?.simulation?.equipment||[]),null,2),'real-data-template.json','application/json');
    document.getElementById('real-data-export-json').onclick=()=>{if(data)download(JSON.stringify(data,null,2),'real-vs-simulated.json','application/json');};
    document.getElementById('real-data-export-html').onclick=()=>{if(data)download(reportHtml(data),'real-vs-simulated.html','text/html;charset=utf-8');};
  }
  function selectRecord(caseId,id){selected.set(caseId,id);owner='';}
  return {init,render,selectRecord,normalize:M.normalize,importRecords:M.importRecords,snapshot:M.snapshot,compare:M.build,template:M.template,reportHtml};
})();
</script>
