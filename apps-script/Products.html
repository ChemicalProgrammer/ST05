<script>
window.STProducts=(function(){
  var state,hooks,currentTab='products',selectedFormatId,selection={products:null,formats:null};
  function copy(value){return JSON.parse(JSON.stringify(value));}
  function activeEquipment(){const list=hooks?.simulation?.()?.equipment;return list?.length?list:(state?.activeCase?.equipment||[]);}
  function data(){return SimulatorEngine.normalizeFormatCatalog(state?.activeCase?.metadata||{},activeEquipment());}
  function mode(){const setting=state?.activeCase?.metadata?.productFormatMode;if(setting==='single'||setting==='multiple')return setting;
    const c=data();return c.products.length>1||c.formats.length>1?'multiple':'single';}
  function catalog(){return SimulatorEngine.resolvePackingFormats(data());}
  function initialId(sim){return sim?.dynamicConfig?.initialFormatId??sim?.dynamicConfig?.initialProductId??'';}
  // Single usa exclusivamente el formato visible y los ajustes instalados:
  // los overrides guardados para Multiple nunca se pierden ni se aplican ocultos.
  function activeFormats(){
    const resolved=catalog();
    if(mode()!=='single')return resolved;
    const chosen=resolved.find(f=>f.id===initialId(hooks?.simulation?.()))||resolved[0];
    return chosen?[{...chosen,equipment:{}}]:[];
  }
  function currentFormat(){try{return activeFormats().find(f=>f.id===initialId(hooks?.simulation()));}catch(ignore){return null;}}
  function hasFormats(){return !!data().formats.length;}
  // Edit the owner of an active override; inherited speeds remain installation defaults.
  function setCurrentRate(equipmentId,ratePerMinute){
    if(mode()==='single')return false;
    var c=data(),format=c.formats.find(f=>f.id===initialId(hooks.simulation()));if(!format)return false;
    var local=format.equipment?.[equipmentId]||{},product=c.products.find(p=>p.id===format.productId),shared=product?.equipment?.[equipmentId];
    var active=p=>p&&p.enabled!==false&&p.applies!==false&&p.ratePerMinute!==undefined;
    var owner=active(local)?local:(local.inputUnit||'BOTTLES')==='BOTTLES'&&(local.outputUnit||local.inputUnit||'BOTTLES')==='BOTTLES'&&active(shared)?shared:null;
    if(!owner)return false;
    owner.ratePerMinute=ratePerMinute;state.activeCase.metadata={...state.activeCase.metadata,formatCatalog:c};delete state.activeCase.metadata.products;return true;
  }
  function packSize(format){return format?.bottlesPerCase??format?.presentations?.case?.bottlesPerCase;}
  function id(prefix){return prefix+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);}
  function unit(e,side,format){side=side||'output';var base=e.processData?.flowUnits?.[side]||'BOTTLES';if(format)return format.equipment?.[e.id]?.[side+'Unit']||base;var metadata=state.activeCase.metadata||{},formats=metadata.formatCatalog?.formats||metadata.products||[],values=formats.map(f=>f.equipment?.[e.id]?.[side+'Unit']||base);return values.length&&values.every(value=>value===values[0])?values[0]:base;}
  function alignCatalog(c){
    var all=activeEquipment(),keep=new Set(all.map(e=>e.id)),activeId=hooks.simulation()?.id||state.activeSimulationId;
    (state.activeCase.simulations||[]).filter(s=>s.id!==activeId).forEach(s=>(s.equipment||[]).forEach(e=>keep.add(e.id)));
    [...c.products,...c.formats].forEach(record=>{record.equipment=record.equipment||{};Object.keys(record.equipment).forEach(key=>{if(!keep.has(key))delete record.equipment[key];});});
    c.formats.forEach(function(f){f.equipment=f.equipment||{};all.forEach(function(e,i){var input=unit(e,'input'),output=unit(e,'output'),p=f.equipment[e.id];if(!p)f.equipment[e.id]={inputUnit:input,outputUnit:output,enabled:false};});Object.keys(f.equipment).forEach(key=>{if(!keep.has(key))delete f.equipment[key];});});
    all.forEach(function(e){[...c.products,...c.formats].forEach(function(record){if(!record.equipment[e.id])record.equipment[e.id]={enabled:false};});});return c;
  }
  function reconcile(){if(!state?.activeCase)return false;var before=JSON.stringify(state.activeCase.metadata||{}),c=alignCatalog(data());if(!c.formats.length&&!c.products.length)return false;state.activeCase.metadata={...state.activeCase.metadata,formatCatalog:c};delete state.activeCase.metadata.products;return before!==JSON.stringify(state.activeCase.metadata);}
  function setPhysicalUnits(equipmentId,input,output){
    var c=data();c.formats.forEach(function(f){f.equipment=f.equipment||{};var profile=f.equipment[equipmentId]||(f.equipment[equipmentId]={});profile.inputUnit=input;profile.outputUnit=output;});
    state.activeCase.metadata={...state.activeCase.metadata,formatCatalog:c};delete state.activeCase.metadata.products;
  }
  function references(formatId){
    var active=hooks.simulation(),sims=(state.activeCase.simulations||[]).slice();if(active&&!sims.some(s=>s.id===active.id))sims.push(active);var refs=[];
    sims.forEach(function(sim){if(sim.id!==active?.id&&initialId(sim)===formatId)refs.push((sim.name||sim.id)+' initial format');var events=sim.id===active?.id?(state.run?.plannedStops||sim.dynamicConfig?.plannedStops):sim.dynamicConfig?.plannedStops;if(events?.some(e=>(e.targetFormatId??e.targetProductId)===formatId))refs.push((sim.name||sim.id)+' changeover');});return refs;
  }
  function identity(){return JSON.stringify([state.activeCase?.id,hooks.simulation()?.id,initialId(hooks.simulation()),state.activeCase?.metadata?.formatCatalog||state.activeCase?.metadata?.products,activeEquipment(),mode()]);}
  function render(force){
    var target=document.getElementById('products-workspace');if(!target||state?.uiView!=='products')return;
    var stamp=identity();
    if(force!==true&&target._formatIdentity===stamp&&target.querySelector('.products-editor'))return;target._formatIdentity=stamp;target.replaceChildren();if(state.activeCase)open(true);
  }
  async function open(inline){
    inline=inline===true;if((!inline&&hooks.locked())||!hooks.capture())return;
    var original=data(),draft=alignCatalog(original),simple=mode();
    if(simple==='single'){
      // Siempre hay un par en el modo simple. Nunca eliminar otros registros guardados.
      if(!draft.products.length)draft.products.push({id:id('product'),name:'Product 1',bottle:{},equipment:{}});
      if(!draft.formats.length)draft.formats.push({id:id('format'),name:'Format 1',productId:draft.products[0].id,bottlesPerCase:12,case:{},equipment:{}});
      alignCatalog(draft);
    }
    var initial=initialId(hooks.simulation()),selected=draft.formats.some(f=>f.id===selectedFormatId)?selectedFormatId:draft.formats.some(f=>f.id===initial)?initial:draft.formats[0]?.id;
    var ownerCase=state.activeCase,ownerSimulation=hooks.simulation(),focus=document.activeElement;
    var dialog=document.createElement(inline?'section':'dialog');dialog.className=inline?'products-editor':'settings-dialog products-dialog';dialog.setAttribute(inline?'aria-label':'aria-labelledby',inline?'Formats':'formats-dialog-title');
    var heading=document.createElement('header');heading.className='dialog-heading';var title=document.createElement('h2');title.id='formats-dialog-title';title.textContent='Formats';heading.hidden=inline;heading.append(title);
    // Ya no se necesitan las dos pestañas; el selector identifica ambos tipos.
    var body=document.createElement('div');body.className='dialog-body';body.id='formats-tab-panel';body.setAttribute('role','tabpanel');
    dialog.append(heading,body);if(inline)document.getElementById('products-workspace').append(dialog);else document.body.append(dialog);
    if(!inline){var close=document.createElement('button');close.type='button';close.className='ghost icon-button';close.innerHTML=STIcons.svg('x');close.setAttribute('aria-label','Close formats');close.onclick=function(){dialog.close();};heading.append(close);}
    var published=JSON.stringify(original);
    function commit(){
      if(hooks.locked()||ownerCase!==state.activeCase||ownerSimulation!==hooks.simulation())return;
      if(JSON.stringify(draft)===published)return;
      state.activeCase.metadata={...state.activeCase.metadata,formatCatalog:copy(draft)};delete state.activeCase.metadata.products;
      var active=initialId(ownerSimulation);if(active&&!draft.formats.some(f=>f.id===active))ownerSimulation.dynamicConfig={...ownerSimulation.dynamicConfig,initialFormatId:undefined,initialProductId:undefined};
      published=JSON.stringify(draft);
      if(simple==='single'&&!initialId(ownerSimulation)&&draft.formats.length){
        const selected=draft.formats[0].id;
        ownerSimulation.dynamicConfig={...(ownerSimulation.dynamicConfig||{}),initialFormatId:selected,initialProductId:selected};
        renderInitialSelector();
      }
      var target=document.getElementById('products-workspace');if(target)target._formatIdentity=identity();
      if(hooks.edited)hooks.edited();else hooks.changed(false);
    }
    dialog.addEventListener('input',commit);dialog.addEventListener('change',commit);
    var error=document.createElement('p');error.className='notice product-error hidden';error.setAttribute('role','alert');
    function showError(message){error.textContent=message;error.classList.remove('hidden');}
    var collapsedSections=new Set();
    // Crea un bloque plegable y devuelve su cuerpo y su barra de herramientas.
    function section(text){
      var sectionKey=text;
      var guidance={
        Products:'Define the product and its bottle dimensions for simulation.',
        Formats:'Associate a product with packaging dimensions and production units.',
        'Products & Formats':'Edit the selected product or packing format and its dimensions.',
        Machines:'Override machine operating rates and start-up behavior for the selected product or format.',
        Conveyors:'Override conveyor speeds, transported units, and bottle or case spacing.'
      };
      var group=STSubsection.create({title:text,description:guidance[text]||'Review the settings for '+text.toLowerCase()+'.',
        native:false,open:!collapsedSections.has(sectionKey),contentId:id('formats-subsection'),
        className:'settings-section product-subsection'});
      group.tools.classList.add('product-selector-row');
      group.title.querySelector('.fold-toggle').addEventListener('click',function(){
        if(group.body.hidden)collapsedSections.delete(sectionKey);else collapsedSections.add(sectionKey);
      });
      body.append(group.section);
      return {content:group.body,tools:group.tools};
    }
    function tr(text){return window.STLanguage?.translate(String(text))??String(text);}
    function note(parent,text){var n=document.createElement('p');n.className='chart-note format-guidance';n.textContent=tr(text);parent.append(n);return n;}
    function control(obj,key,label,options){
      options=options||{};var input=document.createElement('input');input.type=options.text?'text':'number';input.setAttribute('aria-label',tr(label));input.value=obj[key]??'';
      if(options.text)input.maxLength=120;else{input.min=options.min??'0';input.step=options.step||'any';if(options.scale&&obj[key]!==undefined)input.value=Number((obj[key]*options.scale).toPrecision(15));}
      input.required=!!options.required;input.oninput=function(){if(options.text)obj[key]=input.value;else if(input.value==='')delete obj[key];else obj[key]=Number(input.value)/(options.scale||1);if(key==='name'&&obj.id)dialog.querySelectorAll('select option').forEach(function(option){if([obj.id,'products:'+obj.id,'formats:'+obj.id].includes(option.value))option.textContent=input.value||tr('(Unnamed)');});options.changed?.();};return input;
    }
    function field(parent,labelText,obj,key,options){var label=document.createElement('label');label.textContent=tr(labelText);var input=control(obj,key,labelText,options);label.append(input);parent.append(label);return input;}
    function table(parent,caption,columns,equipment,drawRow){
      var scroll=document.createElement('div');scroll.className='table-scroll';var table=document.createElement('table');table.className='settings-color-table product-settings-table';table.setAttribute('aria-label',caption);
      var head=document.createElement('thead'),row=document.createElement('tr');columns.forEach(function(text,index){var cell=document.createElement('th');cell.scope='col';cell.textContent=tr(text);if(index>1)cell.className='numeric';row.append(cell);});head.append(row);table.append(head);var body=document.createElement('tbody');
      equipment.forEach(function(e){var row=document.createElement('tr');row.dataset.equipmentId=e.id;drawRow(row,e);body.append(row);});
      if(!equipment.length){var row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=columns.length;cell.className='empty';cell.textContent=tr('No '+caption.toLowerCase()+' in this simulation.');row.append(cell);body.append(row);}
      table.append(body);scroll.append(table);parent.append(scroll);return table;
    }
    function textCell(row,text){var td=document.createElement('td');td.textContent=text;row.append(td);}
    function inputCell(row,e,profile,key,label,options){var td=document.createElement('td');td.className='numeric';var input=control(profile,key,e.name+' · '+label,options);if(!options?.text)input.placeholder=tr('Default');td.append(input);row.append(td);}
    function selectField(parent,labelText,value,choices,changed,showLabel=true){
      var select=document.createElement('select');select.setAttribute('aria-label',tr(labelText));
      var blank=document.createElement('option');blank.value='';blank.textContent=tr('Select '+labelText.toLowerCase().replace(/^current /,''));select.append(blank);
      choices.forEach(function(item){var option=document.createElement('option');option.value=item.id;option.textContent=item.name||'(Unnamed)';select.append(option);});select.value=value||'';select.onchange=function(){changed(select.value);};if(showLabel){var label=document.createElement('label');label.textContent=tr(labelText);label.append(select);parent.append(label);}else parent.append(select);return select;
    }
    function icon(parent,name,label,handler){var b=document.createElement('button');b.type='button';b.className='ghost icon-button';b.innerHTML=STIcons.svg(name);b.title=tr(label);b.setAttribute('aria-label',tr(label));b.onclick=handler;parent.append(b);return b;}
    function action(parent,text,handler){var b=document.createElement('button');b.type='button';b.className='ghost';b.textContent=text;b.onclick=handler;parent.append(b);return b;}
    async function confirmAction(title,message,label,change){
      if(hooks.locked())return;var answer=await STDialog.open({title:title,message:message,buttons:[{id:'cancel',label:'Cancel'},{id:'confirm',label:label,destructive:true}]});
      if(answer.action!=='confirm'||!dialog.isConnected||hooks.locked()||ownerCase!==state.activeCase||ownerSimulation!==hooks.simulation())return;change();
    }
    // Campos de Producto/Formato reutilizados por las vistas Simple y Multiple.
    function materialFields(main,current,kind){
      var isFormat=kind==='formats',grid=document.createElement('div');
      grid.className='settings-simulation-grid product-general-grid';main.append(grid);
      field(grid,isFormat?'Format name':'Product name',current,'name',{text:true,required:true});
      if(isFormat){
        if(simple==='multiple'&&draft.products.length>1)selectField(grid,'Linked product',current.productId,draft.products,function(value){current.productId=value;commit();});
        field(grid,'Bottles per case',current,'bottlesPerCase',{min:'1',step:'1',required:true});
        current.case=current.case||{};
      }else{
        current.bottle=current.bottle||{};
        var units=SimulatorEngine.productVolumeUnits,unit=current.volumeUnit||'mL';
        field(grid,'Volume',current,'volumeMl',{scale:1/units[unit]});
        selectField(grid,'Volume unit',unit,Object.keys(units).map(u=>({id:u,name:u})),function(value){
          if(!value)return;if(value==='mL')delete current.volumeUnit;else current.volumeUnit=value;commit();draw();
        }).firstChild.remove();
      }
      var dimensions=isFormat?current.case:current.bottle;
      [['lengthMm',isFormat?'Case length along travel (mm)':'Length along travel (mm)'],
       ['widthMm',isFormat?'Case width (mm)':'Width (mm)'],
       ['heightMm',isFormat?'Case height (mm)':'Height (mm)']]
        .forEach(spec=>field(grid,spec[1],dimensions,spec[0],{min:'0.001'}));
    }
    function addMaterial(kind){
      if(kind==='formats'&&!draft.products.length){showError(tr('Add a product first.'));return;}
      var item={id:id(kind==='formats'?'format':'product'),
        name:(kind==='formats'?'Format ':'Product ')+(draft[kind].length+1),equipment:{}};
      if(kind==='formats'){
        item.productId=draft.products.find(p=>p.id===selection.products)?.id||draft.products[0].id;
        item.bottlesPerCase=12;item.case={};
      }else item.bottle={};
      draft[kind].push(item);alignCatalog(draft);currentTab=kind;selection[kind]=item.id;
      if(kind==='formats')selectedFormatId=item.id;
      draw();
    }
    function addMenu(parent){
      var menu=document.createElement('details');menu.className='export-menu product-add-menu';
      var summary=document.createElement('summary');summary.className='secondary icon-button';
      summary.setAttribute('role','button');summary.innerHTML=STIcons.svg('plus');
      summary.title=tr('Add product or format');summary.setAttribute('aria-label',summary.title);
      var list=document.createElement('div');
      [['products','Add product'],['formats','Add format']].forEach(function(pair){
        var b=document.createElement('button');b.type='button';b.className='ghost';b.textContent=tr(pair[1]);
        b.disabled=pair[0]==='formats'&&!draft.products.length;
        b.onclick=function(event){event.stopPropagation();menu.open=false;addMaterial(pair[0]);};
        list.append(b);
      });
      menu.append(summary,list);parent.append(menu);
    }
    function simpleMaterial(main,record,kind){
      var div=document.createElement('div');div.className='product-material-block';
      var h=document.createElement('h3');h.textContent=tr(kind==='formats'?'Format':'Product');div.append(h);
      materialFields(div,record,kind);main.append(div);
    }
    function renderMaterial(kind){
      var isFormat=kind==='formats',singular=isFormat?'format':'product',records=draft[kind],current=records.find(r=>r.id===(selection[kind]||(isFormat?selectedFormatId:null)))||records[0];selection[kind]=current?.id;
      var group=section('Products & Formats'),main=group.content,tools=group.tools;
      if(simple==='multiple'){
        var selector=document.createElement('select');selector.className='product-material-picker';
        selector.setAttribute('aria-label',tr('Selected product or format'));
        [['products','Products'],['formats','Formats']].forEach(function(pair){
          var options=document.createElement('optgroup');options.label=tr(pair[1]);
          draft[pair[0]].forEach(function(item){var option=document.createElement('option');
            option.value=pair[0]+':'+item.id;option.textContent=item.name||tr('(Unnamed)');
            options.append(option);
          });selector.append(options);
        });
        selector.value=current?.id?kind+':'+current.id:'';
        selector.onchange=function(){var at=selector.value.indexOf(':');if(at<0)return;
          currentTab=selector.value.slice(0,at);selection[currentTab]=selector.value.slice(at+1);
          if(currentTab==='formats')selectedFormatId=selection[currentTab];draw();
        };
        tools.append(selector);addMenu(tools);
      }

      if(simple==='multiple'){var remove=icon(tools,'trash','Delete '+singular,function(){
        function inUse(){var used=isFormat?references(current.id):draft.formats.filter(f=>f.productId===current.id).map(f=>f.name);if(!used.length)return false;showError('This '+singular+' is used by: '+used.join(', ')+'. Reassign or remove those references first.');return true;}
        if(inUse())return;return confirmAction('Delete '+singular,'Delete "'+(current.name||'Unnamed')+'" and its equipment settings?','Delete',function(){if(inUse()||!draft[kind].includes(current))return;draft[kind]=draft[kind].filter(r=>r.id!==current.id);selection[kind]=draft[kind][0]?.id;draw();});
      });remove.disabled=!current;
      var clear=icon(tools,'refresh','Clear fields',function(){return confirmAction('Clear '+singular+' fields','Clear the fields and equipment settings for "'+(current.name||'Unnamed')+'"? Its ID and references will be retained.','Clear fields',function(){if(!draft[kind].includes(current))return;Object.keys(current).forEach(key=>{if(!['id','productId'].includes(key))delete current[key];});current.name='';if(isFormat)current.case={};else current.bottle={};current.equipment={};alignCatalog(draft);draw();});});clear.disabled=!current;
      var load=icon(tools,'upload','Import configuration',function(){importMaterial(kind,current);});load.disabled=!current;
      var output=icon(tools,'download','Export configuration',function(){try{var payload=SimulatorEngine.materialConfiguration(kind,current,state.activeCase.equipment),blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=(current.name||singular).replace(/[^a-z0-9_-]+/gi,'-')+'-configuration.json';link.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);}catch(e){showError(e.message);}});output.disabled=!current;}
      if(!current){note(main,'Add a product first.');return;}
      if(simple==='single'){
        var format=draft.formats.find(f=>f.id===initial)||draft.formats[0];
        var product=draft.products.find(p=>p.id===format?.productId)||current;
        simpleMaterial(main,product,'products');
        if(format)simpleMaterial(main,format,'formats');
      }else{
        materialFields(main,current,kind);behaviorTables(current,kind);
      }
    }
    function importMaterial(kind,current){
      var modal=document.createElement('dialog');modal.className='settings-dialog products-dialog';modal.setAttribute('aria-label','Import configuration');
      var heading=document.createElement('header');heading.className='dialog-heading';var title=document.createElement('h2');title.textContent='Import '+(kind==='formats'?'format':'product')+' configuration';heading.append(title);
      var content=document.createElement('div');content.className='dialog-body';var label=document.createElement('label');label.textContent='Configuration JSON';var text=document.createElement('textarea');text.rows=12;text.spellcheck=false;label.append(text);content.append(label);
      var error=document.createElement('p');error.className='notice hidden';error.setAttribute('role','alert');content.append(error);
      var footer=document.createElement('footer');footer.className='dialog-actions';var file=action(footer,'Open JSON file',function(){var input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async function(){if(!input.files?.[0])return;var done=STDialog.beginActivity(modal);try{if(input.files[0].size>1048576)throw Error('Configuration exceeds 1 MB.');text.value=await input.files[0].text();}catch(e){error.textContent=e.message;error.classList.remove('hidden');}finally{done?.();}};input.click();});
      action(footer,'Cancel',function(){modal.close();});var apply=action(footer,'Import',async function(){if(hooks.locked()||ownerCase!==state.activeCase||ownerSimulation!==hooks.simulation())return;var done=STDialog.beginActivity(modal);apply.disabled=true;try{await new Promise(resolve=>setTimeout(resolve,0));if(!modal.open||hooks.locked()||ownerCase!==state.activeCase||ownerSimulation!==hooks.simulation())return;var record=SimulatorEngine.readMaterialConfiguration(text.value,kind,current.id,activeEquipment());if(kind==='formats'&&!draft.products.some(p=>p.id===record.productId))throw Error('This format references a product not present in this case. Import or select that product first.');var index=draft[kind].findIndex(r=>r.id===current.id);if(index<0)throw Error('The selected record no longer exists.');draft[kind][index]=record;alignCatalog(draft);draw();modal.close();}catch(e){error.textContent=e.message;error.classList.remove('hidden');}finally{apply.disabled=false;done?.();}});
      modal.append(heading,content,footer);document.body.append(modal);modal.addEventListener('close',function(){modal.remove();},{once:true});modal.showModal();text.focus();
    }
    function behaviorTables(record,kind){
      record.equipment=record.equipment||{};var all=activeEquipment();
      function localLegacy(e){return kind==='formats'&&unit(e,'output')==='BOTTLES'&&Object.keys(record.equipment[e.id]||{}).some(k=>!['inputUnit','outputUnit','enabled','applies'].includes(k));}
      var filtered=all; // Mostrar toda la línea, incluso equipos con ajustes heredados.
      function profile(e){return record.equipment[e.id]||(record.equipment[e.id]={});}
      function name(row,e){var cell=document.createElement('th');cell.scope='row';cell.textContent=e.name;row.append(cell);}
      function matches(e){return kind==='formats'||unit(e,'input')==='BOTTLES'&&unit(e,'output')==='BOTTLES';}
      function usage(e){return tr(unit(e,'output',kind==='formats'?record:null).toLowerCase());}
      function defaults(row,e){var td=document.createElement('td'),button=document.createElement('button');button.type='button';button.className='ghost';button.textContent='Use defaults';button.setAttribute('aria-label',e.name+' · Use defaults');button.onclick=function(){var p=profile(e);Object.keys(p).forEach(key=>{if(!['inputUnit','outputUnit','applies','enabled'].includes(key))delete p[key];});draw();};td.append(button);row.append(td);}
      function enabled(e){var p=profile(e);return p.enabled!==false&&p.applies!==false;}
      function applies(row,e){var td=document.createElement('td'),checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=enabled(e);checkbox.disabled=!matches(e);checkbox.setAttribute('aria-label',e.name+' · Use settings');checkbox.onchange=function(){profile(e).enabled=checkbox.checked;delete profile(e).applies;draw();};td.append(checkbox);row.append(td);if(!checkbox.checked)row.classList.add('product-row-inactive');}
